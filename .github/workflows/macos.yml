name: macOS
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Record toolchain
        run: xcodebuild -version && swift --version
      - name: Verify generated project
        run: python3 Scripts/generate_project.py --check
      - name: Verify localizations
        run: python3 Scripts/check_localizations.py
      - name: Type-check UI test sources
        run: python3 Scripts/check_ui_sources.py
      - name: Package tests
        run: swift test --package-path Packages/GuitarCoachCore
      - name: App state tests
        run: swift test
      - name: Validate bundled lessons
        run: swift run --package-path Packages/GuitarCoachCore ValidateLessonContent Resources/Lessons
      - name: Verify audio corpus
        run: python3 Scripts/check_audio_fixtures.py
      - name: Benchmark audio regression
        run: |
          swift run -c release --package-path Packages/GuitarCoachCore BenchmarkAudio Tests/Fixtures/Audio --quick --output "$RUNNER_TEMP/audio-benchmark.json"
          python3 Scripts/check_audio_benchmark.py "$RUNNER_TEMP/audio-benchmark.json"
      - name: Build Debug
        run: xcodebuild -project PersonalGuitarCoach.xcodeproj -scheme PersonalGuitarCoach -configuration Debug -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
      - name: Build Release
        run: xcodebuild -project PersonalGuitarCoach.xcodeproj -scheme PersonalGuitarCoach -configuration Release -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
