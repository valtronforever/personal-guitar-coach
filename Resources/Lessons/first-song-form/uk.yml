lessonID: first-song-form
lessonVersion: 1
locale: uk
title: 'Перша пісенна форма: куплет і приспів'
summary: З’єднайте два контрастні розділи по вісім тактів в оригінальний етюд.
goal: Зіграти повну форму куплет–приспів, зберігши межу розділів і завершення.
body: 'Пісенна форма дає слухачеві впізнавані розділи. Цей оригінальний етюд має вісім тактів куплету та вісім приспіву.
  В обох той самий маршрут акордів, але куплет дає одному удару звучати цілий такт, а приспів використовує чотири
  удари чвертями. Контраст створює ритмічна активність, а не прискорення темпу.


  Маршрут: два такти п’ятиструнного мінору, два чотириструнного мінору, два чотириструнного мажору й два повернення
  до першого мінору. Для мажору візьміть лише верхні чотири струни попередньої шестиструнної мажорної форми — 4–1.
  Назви нот транспонуються зі строєм, а форма й співвідношення акордів зберігаються.


  Вивчіть розділи окремо на 50 BPM. У повній версії приспів починається з такту 9, а завершення повертає початковий
  мінор у тактах 15–16. Рахуйте і в довгих акордах куплету: утриманий звук не є порожнім часом. Синтетичний приклад
  і метроном підтримують самостійну практику. Оцінка одночасних акордів не виставляється.'
steps:
  prepare:
    title: Розмітьте шістнадцять тактів
    body: 'Знайдіть три форми перед грою. Промовте маршрут восьми тактів: перший мінор, другий мінор, мажор, перший
      мінор — кожен по два такти. Мажор охоплює лише 4–1. За потреби перевірте кожну форму окремими нотами.'
  verse:
    title: 'Куплет: дайте такту звучати'
    body: Зіграйте удар вниз на долю 1 кожного такту й дайте йому звучати чотири рахунки. Розслабте руку, готуючи
      наступну форму. Відлічуйте два такти кожного акорду, не змінюйте після одного. Повторіть восьмитактовий куплет
      двічі.
  chorus:
    title: 'Приспів: більше руху, той самий темп'
    body: Грайте чотири удари чвертями в такті. Трохи підкреслюйте першу долю за позначкою >, зберігаючи 50 BPM.
      Акорди, як і раніше, змінюються раз на два такти. Окремо попрацюйте над входом у чотириструнний мажор і поверненням
      до першого мінору.
  complete:
    title: З’єднайте куплет і приспів
    body: Послухайте відлік, потім зіграйте куплет у тактах 1–8. Почніть удари чвертями рівно в такті 9. Дійдіть
      до 16 й завершіть останню записану тривалість. Якщо загубились, продовжуйте рахувати до наступної межі двох
      тактів, не починайте твір заново посеред такту.
  review:
    title: Назвіть одне музичне покращення
    body: 'Після повного проходу оберіть одне місце: зміну акорду, вступ такту 9 чи завершення. Повторіть потрібний
      розділ, потім усі шістнадцять тактів. Спочатку досягніть цілісного спокійного виконання, а вже потім додавайте
      5 BPM чи виразніший контраст.'
activities:
  verse:
    title: Куплет — вісім тактів
    body: Один удар на такт; кожен акорд триває два такти форми.
  chorus:
    title: Приспів — вісім тактів
    body: Чотири удари чвертями в такті з помірним акцентом першої долі.
  complete:
    title: Повний етюд — шістнадцять тактів
    body: Куплет у тактах 1–8, приспів у 9–16. Темп незмінний.
learningTasks:
  review:
    title: Перевірте цілісне виконання
    body: Це самоперевірка форми й акомпанементу, а не результат поліфонічного детектора.
    items:
      form: Я змінив малюнок ударів у такті 9, не змінюючи темпу.
      changes: Кожен акорд тривав два повні такти до наступної зміни.
      ending: Я дійшов до завершального повернення й дограв останню тривалість.
      plan: Я визначив конкретний такт або перехід для наступного повторення.
