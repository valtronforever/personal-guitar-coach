lessonID: tapping
lessonVersion: 1
locale: uk
title: Додай тепінг до фрази legato
summary: Використай руку з медіатором для додаткової ноти на ладі.
goal: Досягни вищої ноти тепінгом, чисто повернися й поєднай рух у повторювану фразу.
body: |-
  Тепінг використовує палець руки з медіатором, щоб озвучити ноту на ладі. Для праворукого гітариста це зазвичай права рука; якщо граєш ліворуко, поміняй ролі рук. Позначка t указує цільову ноту тепінгу. Урок починається на одній струні, щоб окремо відпрацювати досягнення цілі, повернення до нижньої ноти та контроль зайвих струн.

  Спочатку підготуй нижню ноту звичайною рукою на грифі. Атакуй її один раз, потім постав палець для тепінгу безпосередньо позаду вищого ладу з достатнім контрольованим контактом, щоб прозвучала нота. Великий замах чи сильний удар не потрібні. Залиш нижній палець на місці. Невеликим рухом зніми палець тепінгу так, щоб знову прозвучала підготовлена нижня нота, потім зупини звук у записаній паузі.

  Перший рисунок рухається від основного звуку до квінти й назад. Слухай три окремі стабільні ноти, а не ударний клац із слабким поверненням. Якщо повернення зникає, окремо відпрацюй лише тепінг і зняття пальця перед повним рисунком. Тримай невикористані струни тихими зручним контактом обох рук. Не приховуй додатковим дисторшном ноту, яка нечітко звучить у чистому вході.

  Додай hammer-on до малої терції перед тепінгом квінти. Повернися спочатку до проміжної ноти, потім до основного звуку. Рахуй усі п’ять нот рівно: удар, hammer-on, тепінг, pull-off, pull-off. Повторений приклад поєднує два цикли без нового удару на внутрішньому основному звуці. Ця нота все ще має повну долю; це не сигнал поспішати до наступного hammer-on. Останні три долі паузи використай, щоб зупинитися, підготуватися й обрати наступне виправлення.

  Почни з повільних четвертних і порівняй кожну ділянку висоти в результаті, особливо ноту відразу після тепінгу. Якщо сигнал стає невизначеним, досліди обмеження вимірювання; це не доказ неправильного руху руки. Додаток оцінює чутні висоти й початковий таймінг; він не визначає, якою рукою ти торкнувся ладу, чи був повторний удар і наскільки добре приглушені сусідні струни. Для цих спостережень використовуй самоперевірку. Коли обидва цикли контрольовані, трохи підвищ темп у підтримуваних межах, зберігаючи чіткі повернення.
steps:
  prepare:
    title: Підготуй чистий вхід
    body: Налаштуй гітару, почни з 60 BPM і прослухай фразу перед грою.
  tap-return:
    title: Зіграй квінту тепінгом і повернися
    body: Атакуй основний звук, зіграй квінту тепінгом на другій долі й виконай pull-off до підготовленого основного
      звуку на третій. Четверта доля — пауза. Табулатура показує кожний досягнутий лад і його тривалість. Крива
      висоти показує всі цілі; одна подія означає початковий удар і весь подальший ланцюжок без ударів медіатором.
  minor-triad:
    title: Поєднай ланцюжок мінорного тризвуку
    body: 'Центр: мінор від {{root}}. Один удар починає рух: основний звук — мала терція — квінта — мала терція
      — основний звук. Квінта виконується тепінгом; обидві ноти повернення мають звучати повну долю. Табулатура
      показує кожний досягнутий лад і його тривалість. Крива висоти показує всі цілі; одна подія означає початковий
      удар і весь подальший ланцюжок без ударів медіатором.'
  two-cycles:
    title: Поєднай два цикли одним ударом
    body: Дев’ять нот утворюють два поєднані цикли. Атакуй лише початок, утримай внутрішній основний звук повну
      долю й відрахуй завершальну паузу на три долі. Табулатура показує кожний досягнутий лад і його тривалість.
      Крива висоти показує всі цілі; одна подія означає початковий удар і весь подальший ланцюжок без ударів медіатором.
  check-tap:
    title: Перевір контакт, повернення й приглушення
    body: Доповни виміряні висоти власним слухом і прямими спостереженнями.
