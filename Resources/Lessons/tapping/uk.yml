learningTasks:
  check-tap:
    title: Перевір контакт, повернення й приглушення
    body: Доповни виміряні висоти власним слухом і прямими спостереженнями.
    items:
      contact: Я виконував контрольований тепінг без великого сильного замаху.
      return: І нота тепінгу, і наступна нижня нота лишалися чутними.
      mute: Я тримав сусідні струни тихими протягом обох циклів.
      pick: Я спостерігав один початковий удар без нового удару на внутрішньому основному звуці.
