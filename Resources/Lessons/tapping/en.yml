learningTasks:
  check-tap:
    title: Check contact, return and muting
    body: Use your hearing and direct observation in addition to the measured pitch targets.
    items:
      contact: I used a controlled tap without a large forceful swing.
      return: Both the tapped note and the following lower note remained audible.
      mute: I kept neighboring strings quiet through both cycles.
      pick: I observed one initial pick, with no new pick at the internal root.
