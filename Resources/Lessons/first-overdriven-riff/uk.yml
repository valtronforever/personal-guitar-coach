lessonID: first-overdriven-riff
lessonVersion: 1
locale: uk
title: Перший риф із перевантаженням
summary: Поєднайте приглушений бас, дзвінкі квінти й свідому тишу.
goal: Зіграти оригінальний восьмитактовий етюд із виразним контрастом і керованим завершенням.
body: 'Перевантаження робить дрібні деталі глушіння помітнішими. Встановіть зручну вихідну гучність і почніть із
  меншого gain, ніж для готового тембру. Спершу вивчіть ноти на чистій гітарі, потім додайте перевантаження без
  зміни ритму чи сильнішого стискання. Додаток не надає ефект підсилювача; за бажанням використовуйте свій підсилювач,
  педаль чи моніторинг.


  Цей оригінальний риф поєднує дві приглушені відкриті восьмі, дзвінку квінтову форму, чверть паузи й приглушену
  відкриту чверть. P.M. стосується лише позначеного баса. Приберіть контакт руки з медіатором настільки, щоб квінта
  задзвеніла, потім зупиніть обидва звуки для паузи. Останній такт замінює комірку формою з відкритим основним тоном
  на дві долі й двома тихими долями.


  Попереднє прослуховування — синтетичний орієнтир висоти й часу з коротким згасанням для P.M., а не запис перевантаженої
  гітари. Повний етюд — самостійна практика: у ньому одночасні акорди й приглушені ноти без перевіреної автоматичної
  оцінки. Для виміряної перевірки висоти й ритму спершу використайте попередню чисту вправу з педальним тоном.'
steps:
  prepare:
    title: Налаштуйте контраст на одній струні
    body: Порівняйте приглушений бас і дзвінку квінту на однаково зручній гучності. Перевірте зайві струни з перевантаженням
      і зменште gain, якщо атаки нечіткі.
  main-cell: &id001
    title: Двотактова основа
    body: Рахуйте 1 і 2 3 4. Дві восьмі P.M., дзвінка форма на 2, тиша на 3 й приглушений бас на 4. Повторіть обидва
      такти тричі на 50 BPM перед цілою формою.
  eight-bar-study: &id002
    title: Дійдіть до завершення
    body: Пройдіть сім комірок зі змінними затиснутими квінтами, потім останню форму на дві долі. Зупиніть на 3
      останнього такту й дорахуйте 4. Зробіть два безперервні виконання, продовжуючи після дрібної помилки.
  review:
    title: Оберіть одну поправку для наступної спроби
    body: 'Визначте головну проблему: нечіткий приглушений бас, шум квінти, поспішна пауза чи завершення. Поверніться
      до відповідної попередньої вправи й зіграйте весь етюд на тому самому темпі.'
activities:
  main-cell: *id001
  eight-bar-study: *id002
learningTasks:
  review:
    title: Перевірте цю спробу
    body: Позначте лише те, що перевірили слухом чи спостереженням за руками.
    items:
      contrast: Приглушений бас і дзвінкі квінти виразно відрізнялися.
      silence: Паузи третьої долі були тихими попри перевантаження.
      form: Я завершив усі вісім тактів і фінальну тишу на дві долі.
