learningTasks:
  di-check:
    title: Verify capture and monitoring separately
    body: Confirm each observation on your actual setup. Do not infer a recorded channel from a headphone impression.
    items:
      input: I selected the actual clean mono channel and checked attacks and silence.
      monitor: I can identify my direct or software monitoring path.
      file: I made an intentional recorded take and distinguished guitar from generated click reference.
      timing: I checked the delay settings and recognized any manual or uncalibrated timing label.
  recording-channels:
    title: What is the second recorded channel?
    body: In a practice take exported by Record and analyze, what does channel two represent?
    items:
      rendered: The generated click reference, not a measured headphone signal.
      stereo: A second independently captured guitar microphone.
      latency: A direct measurement of Bluetooth output delay.
    explanation: Channel one carries the selected mono guitar capture. Channel two is rendered reference timing;
      the real listening route still needs its own delay setting.
