learningTasks:
  di-check:
    title: Перевір запис і моніторинг окремо
    body: Підтверди кожне спостереження у фактичній схемі. Не визначай записаний канал за враженням у навушниках.
    items:
      input: Я обрав фактичний чистий моноканал і перевірив атаки й тишу.
      monitor: Я можу визначити прямий чи програмний шлях моніторингу.
      file: Я свідомо зробив запис і розрізнив гітару та згенерований еталон кліків.
      timing: Я перевірив затримки й розпізнав ручну або некалібровану позначку таймінгу.
  recording-channels:
    title: Що містить другий канал запису?
    body: Що представляє другий канал проходу, експортованого через «Записати й проаналізувати»?
    items:
      rendered: Згенерований еталон кліків, а не виміряний сигнал навушників.
      stereo: Другий незалежно записаний мікрофон гітари.
      latency: Пряме вимірювання затримки Bluetooth-виходу.
    explanation: Перший канал несе обраний монозапис гітари. Другий — згенерований часовий еталон; реальний шлях
      прослуховування все одно потребує власного налаштування затримки.
