lessonID: record-di-monitoring
lessonVersion: 1
locale: uk
title: Запиши чистий вхід і свідомо обери моніторинг
summary: Розділи записану гітару, ефекти моніторингу, еталон метронома й поправку часу.
goal: Перевір обраний чистий моновхід і поясни канали та межі запису практики.
body: |-
  Чистий DI тут означає сигнал гітари, записаний до навмисного дисторшну підсилювача й часових ефектів. Його не визначає чистота звуку в навушниках. Простеж гітару до фактично обраного каналу входу, потім окремо моніторинг. Процесор може давати окремі сухий і оброблений виходи; прямій гітарі потрібен сумісний інструментальний вхід. Обери режим входу за джерелом і перевір його шкалою.

  Використай вправу з атаками й паузами, щоб перевірити рух шкали на нотах і тишу в проміжках. Налаштуй gain за найсильнішою звичайною атакою із запасом; гучність навушників не виправляє кліпінг входу. Прямий моніторинг веде вхід до прослуховування з малою затримкою, а програмний проходить обробку й буферизацію. Уникай випадкового подвійного звучання обох шляхів. Жоден окремо не доводить, що записує додаток.

  Звичайна практика локально аналізує ноти без типового збереження сирого звуку. Дія «Записати й проаналізувати» також записує прохід і готує його для налаштованого агента-тренера. Використовуй її, коли потрібен файловий процес. Експортований WAV містить записану моногітару в першому каналі й згенерований еталон метронома в другому. Другий канал не є мікрофонним записом навушників і не вимірює їх реальну затримку виходу.

  Зіграй довшу чисту фразу й перевір чутні ноти окремо від таймінгу. Затримка виходу та інструменту — окремі налаштування; ручне значення інструменту дозволяє приблизний результат часу з відповідною позначкою. Перевір тракт після зміни пристроїв або програми моніторингу. Локальний запуск агента не гарантує повністю локальну обробку аудіо його провайдером; свідомо використовуй налаштованого провайдера. Якщо запис чи агент недоступні, залиш пункт відкритим і відокрем результат практики чистого входу.
steps:
  prepare:
    title: Визнач тракт і початковий звук
    body: Використовуй наявне обладнання з комфортною гучністю. Додаток дає пояснення, часові орієнтири й самоперевірку;
      він не запускає ефекти цього уроку.
  attack-rest:
    title: Перевір атаки й тихі проміжки
    body: 'Використовуй обраний чистий моноканал і зручні атаки. Результат перевіряє чутну висоту й доступний таймінг,
      а не bypass зовнішнього процесора. Ноти звучання: {{sequence}}. Показана аплікатура — орієнтир; звук не доводить
      використання струни чи пальця.'
  clean-take:
    title: Зроби задокументований чистий запис
    body: 'Спочатку зіграй звичайно. Коли потрібен файловий процес агента, використай «Записати й проаналізувати»
      для іншого проходу. Залиш ту саму фразу й запиши вхід, моніторинг та затримки. Ноти звучання: {{sequence}}.
      Показана аплікатура — орієнтир; звук не доводить використання струни чи пальця.'
  di-check:
    title: Перевір запис і моніторинг окремо
    body: Підтверди кожне спостереження у фактичній схемі. Не визначай записаний канал за враженням у навушниках.
  recording-channels:
    title: Що містить другий канал запису?
    body: Що представляє другий канал проходу, експортованого через «Записати й проаналізувати»?
