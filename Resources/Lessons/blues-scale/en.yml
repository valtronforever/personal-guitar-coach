learningTasks:
  knowledge-check:
    title: The added blues pitch
    body: Where is the extra pitch that turns minor pentatonic into this blues scale?
    items:
      between: Between degrees 4 and 5
      above: One semitone above degree 5
      below: One semitone below the tonic
    explanation: The added pitch lies between 4 and 5, creating two adjacent semitone steps. It can be named flat
      5 or sharp 4.
  review:
    title: Review the phrase
    body: Mark only observations you made yourself.
    items:
      pitch: I can hear the added note and distinguish it from the fourth and fifth.
      resolution: I compared upward and downward resolutions rather than treating every note as the same kind of
        landing.
      space: I let the complete silent bar remain silent and listened to the phrase ending.
