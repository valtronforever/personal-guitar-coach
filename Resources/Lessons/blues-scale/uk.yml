lessonID: blues-scale
lessonVersion: 1
locale: uk
title: Блюзова гама
summary: Додайте хроматичну проходящу ноту між четвертим і п’ятим ступенями мінорної пентатоніки.
goal: Зіграти шестизвучну блюзову гаму й свідомо розв’язати додану ноту.
body: |-
  Мінорна блюзова гама додає до мінорної пентатоніки висоту між 4 й 5. Її ступені: 1, понижена 3, 4, понижена 5, 5 й понижена 7; додану висоту також називають підвищеною 4. Понижена 5 й підвищена 4 — енармонічні назви того самого ладу в цій вправі. Відстані в півтонах: 0, 3, 5, 6, 7 і 10.

  Почуйте різницю між стійким завершенням і проходящою нотою. Спочатку зіграйте 4–понижена 5–5, з’єднуючи сусідів доданою нотою. Потім поверніть напрямок: 5–понижена 5–4. Напруження можна використовувати свідомо, але сама зупинка на доданій ноті не пояснює напрямку фрази. Дайте їй чітку ціль і порівняйте ефект слухом.

  Перша вправа проходить октаву вгору й вниз. Вершина звучить один раз, останні три долі тихі. Друга стискає два хроматичні кроки до восьмих і дає тоніці дві долі. Це звичайні рівні восьмі, не swing. Остання тритактова фраза додає блюзову ноту до короткої мінорної пентатонічної думки й залишає цілий тихий такт для слухання завершення.

  Працюйте чистим звуком на 50 BPM, щоб можна було виміряти кожну висоту й атаку. Виразний таймінг або перевантаження додайте пізніше, поза цією точною нотною спробою. Правильна оцінка висоти не вимірює переконливість блюзової фрази. Ваше завдання — почути напруження, обрати розв’язання й залишити свідомий простір. Інтервали гами транспонуються з налаштуваннями інструменту.
steps:
  prepare:
    title: Знайдіть три сусідні лади
    body: >-
      Знайдіть 4, додану хроматичну висоту й 5 на одній струні в TAB. Повільно зіграйте кожну й почуйте два послідовні
      півтони. Пригадайте п’ятизвучну мінорну пентатоніку перед додаванням шостої висоти.
  six-note-route:
    title: Шість класів висоти через октаву
    body: >-
      Чверті на 50 BPM: сім атак угору включно з октавою, шість униз, потім три тихі долі. В окремому проході називайте
      ступені. Повний маршрут звучання: {{sequence}}.
  passing-tone:
    title: Пройдіть угору й униз
    body: >-
      У такті 1 рахуйте 1 і 2 3 4: ступені 4 й понижена 5 — восьмі, 5 — чверть, 1 тримайте дві долі. Такт 2 змінює
      підхід: 5–понижена 5–4 й та сама тоніка. Обидві восьмі рівні, фінальна тоніка чітка.
  blues-phrase:
    title: Фраза й простір після неї
    body: >-
      У такті 1 зіграйте 1–понижена 3–4–понижена 5, у 2 — 5–4–понижена 3–1, усе чвертями. Такт 3 повністю тихий.
      Послухайте паузу перед повтором; не заповнюйте її пошуковими нотами під час оцінюваної спроби.
  review:
    title: Почуйте напрямок доданої ноти
    body: >-
      Порівняйте висхідний і низхідний приклади, потім поза оцінюваною вправою зіграйте фразу без доданої ноти.
      Поверніть її й помітьте напруження. Окремо опрацюйте одну виміряну помилку висоти/таймінгу, потім поверніться
      до цілої фрази.
  knowledge-check:
    title: Перевірте музичне співвідношення
    body: Дайте відповідь за будовою, яку практикували.
activities:
  six-note-route:
    title: Шість класів висоти через октаву
    body: >-
      Чверті на 50 BPM: сім атак угору включно з октавою, шість униз, потім три тихі долі. В окремому проході називайте
      ступені. Повний маршрут звучання: {{sequence}}.
  passing-tone:
    title: Пройдіть угору й униз
    body: >-
      У такті 1 рахуйте 1 і 2 3 4: ступені 4 й понижена 5 — восьмі, 5 — чверть, 1 тримайте дві долі. Такт 2 змінює
      підхід: 5–понижена 5–4 й та сама тоніка. Обидві восьмі рівні, фінальна тоніка чітка.
  blues-phrase:
    title: Фраза й простір після неї
    body: >-
      У такті 1 зіграйте 1–понижена 3–4–понижена 5, у 2 — 5–4–понижена 3–1, усе чвертями. Такт 3 повністю тихий.
      Послухайте паузу перед повтором; не заповнюйте її пошуковими нотами під час оцінюваної спроби.
learningTasks:
  knowledge-check:
    title: Додана блюзова висота
    body: Де розташована додана висота, яка перетворює мінорну пентатоніку на цю блюзову гаму?
    items:
      between: Між ступенями 4 й 5
      above: На півтону вище ступеня 5
      below: На півтону нижче тоніки
    explanation: Додана висота між 4 й 5 утворює два сусідні півтонові кроки. Її називають пониженою 5 або підвищеною
      4.
  review:
    title: Перевірте фразу
    body: Позначте лише власні спостереження.
    items:
      pitch: Я чую додану ноту й відрізняю її від четвертого та п’ятого ступенів.
      resolution: Я порівняв висхідне й низхідне розв’язання, а не вважав усі ноти однаковими завершеннями.
      space: Я залишив цілий тихий такт і послухав завершення фрази.
