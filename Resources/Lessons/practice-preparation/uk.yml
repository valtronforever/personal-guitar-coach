lessonID: practice-preparation
lessonVersion: 1
locale: uk
title: Підготовка до практики
summary: Виконуйте коротку повторювану перевірку перед оцінюваною практикою.
goal: Виконуйте коротку повторювану перевірку перед оцінюваною практикою.
body: >-
  Корисне заняття починається з відповідного профілю інструменту, справного входу й чутного пульсу. Налаштування
  затримки інструменту/гравця та вирівнювання виходу мають різні ролі. Підготуйте їх, перш ніж інтерпретувати оцінку
  таймінгу.
steps:
  instrument:
    title: Перевірте інструмент
    body: >-
      Перевірте профіль строю й кількість ладів у налаштуваннях, потім фізичні струни тюнером. Вибраний профіль
      — програмна ціль, а не доказ налаштованої гітари.
  route:
    title: Перевірте сьогоднішній маршрут
    body: >-
      Виберіть підключений вхідний канал і навушники, якими користуєтеся зараз. Зіграйте чотири ноти й перевірте
      робочий рівень без перевантаження. Після зміни пристрою чи Bluetooth-маршруту перевірте часові налаштування
      перед оцінкою ритму.
  timing:
    title: Розрізняйте дві затримки
    body: >-
      Вирівнювання виходу узгоджує видимий курсор зі звуком, який ви чуєте. Синхронізація інструменту компенсує
      виміряний або вручну оцінений зсув гри/входу для оцінки ритму. Ручне значення явно приблизне, а не лабораторний
      вимір.
  routine:
    title: Оберіть одну невелику ціль
    body: >-
      Оберіть один урок, повільний початковий темп і конкретну ціль — наприклад, чотири чисті вступи після пауз.
      Послухайте відлік, виконайте одну спробу й прочитайте відгук перед повтором. Невдала перевірка сигналу потребує
      налаштування, а не сильніших ударів.
activities: {}
learningTasks:
  review:
    title: Перевірте свою практику
    body: Позначайте лише те, що перевірили самостійно. Поверніться до непозначеного пункту на наступному занятті.
    items:
      criterion-1: Профіль і фізичний стрій відповідають одне одному.
      criterion-2: Вхід, вихід і часові налаштування відповідають сьогоднішньому маршруту.
      criterion-3: Я обрав конкретну ціль і посильний темп.
