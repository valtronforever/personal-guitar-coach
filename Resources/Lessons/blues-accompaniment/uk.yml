learningTasks:
  form-review:
    title: Два цикли й завершення
    body: Зіграй два повні цикли, потім завершення. Якщо межа не виходить, відокрем такти з обох боків і знову поєднай
      їх.
    items:
      form: Я зберіг 12-тактовий маршрут без доданого чи пропущеного такту.
      shuffle: Я чув послідовний довго-короткий поділ під змінами акордів.
      return: Я з’єднав такти 12 та 1 без додаткової паузи.
      ending: Я розрізнив turnaround і свідоме завершення на тоніці.
