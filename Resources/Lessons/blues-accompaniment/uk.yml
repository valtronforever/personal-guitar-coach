lessonID: blues-accompaniment
lessonVersion: 1
locale: uk
title: 'Блюзовий акомпанемент: утримай дванадцятитактову форму'
summary: Вивчи гармонічний маршрут, shuffle-комірку й свідомий turnaround.
goal: Зіграй повторні дванадцятитактові цикли без втрати акордових змін і повернення до першого такту.
body: |-
  Дванадцятитактовий блюз — це форма, яку можна рахувати й упізнавати, а не лише гама чи ритм. Тут використано один конкретний варіант: чотири такти I, два IV, два I, потім V, IV, I та V. Існують інші блюзові форми, тому узгоджуйте варіант перед спільною грою. Останній V тут веде до наступного циклу; окреме завершення повертається на I й зупиняється.

  Почни з розрідженої акордової карти. Кожна компактна форма домінантсептакорду звучить раз на такт, залишаючи час назвати наступний ступінь. Форми не містять основного звуку, а мають малу септиму, терцію й квінту; заданий тональний центр визначає їхню функцію. Рахуй чотири долі, навіть коли рука не рухається. Познач зміни в тактах 5, 7, 9, 10, 11 та 12 перед додаванням щільнішого рисунка.

  Shuffle-комірка чергує пару основний звук–квінта з парою основний звук–секста. Її довго-короткий ритм ділить кожну долю на три рівні частини й використовує першу та третю точки атаки. Почуй тріольний пульс перед копіюванням. Збережи нижній основний звук, поки верхня нота змінюється. Якщо розтяг незручний, вивчай форму на компактній акордовій карті, а комірку опрацьовуй окремо.

  Проведи комірку через усю форму в одному темпі. Називай наступний ступінь на останній долі поточного такту, не чекаючи несподіванки від зміни. Повторюй межу між тактами 12 і 1 циклічно. Правильна окрема форма ще не означає готовий акомпанемент: перехід має зайняти заплановану долю без доданої паузи.

  Насамкінець порівняй turnaround із завершенням. Turnaround залишає цикл відкритим; завершення доходить до тоніки й залишає тишу. Це оригінальні навчальні рисунки, а не транскрипція запису. Відтворення дає синтезовані висоти й час, а баланс акордів, відчуття shuffle та приглушення оцінюються самостійно. Зменш еталон і зіграй два цикли, потім свідомо познач та зіграй завершення.
steps:
  prepare:
    title: Обери невелику музичну ідею
    body: Прочитай план, обери зручний чистий звук і почни повільно.
  chord-map:
    title: 'Дванадцять тактів: I, IV та V'
    body: 'Центр: {{root}}. Стеж за I I I I | IV IV I I | V IV I V. Кожний акорд триває три долі, четверта тиха.'
  shuffle-cell:
    title: Комірка основного звуку, квінти й сексти
    body: Нижня нота лишається сталою. Верхній голос чергує квінту й сексту на довго-коротких поділах; рахуй тридольний
      поділ усередині долі.
  shuffle-form:
    title: Проведи комірку через всю форму
    body: Використай той самий дванадцятитактовий маршрут. Повторюй усю ділянку й готуй повернення V–I перед наступною
      першою долею.
  ending:
    title: Обери завершення замість нового циклу
    body: Два такти проходять V–IV–I, потім паузу, тоніку й завершальну тишу. Познач завершення перед його грою.
  form-review:
    title: Два цикли й завершення
    body: Зіграй два повні цикли, потім завершення. Якщо межа не виходить, відокрем такти з обох боків і знову поєднай
      їх.
