learningTasks:
  form-review:
    title: Two cycles and an ending
    body: Play two complete cycles, then the ending. If a boundary fails, isolate the bars on each side and reconnect
      them.
    items:
      form: I kept the 12-bar chord route without inserting or skipping a bar.
      shuffle: I heard a consistent long-short subdivision under the chord changes.
      return: I connected bar 12 to bar 1 without an extra pause.
      ending: I distinguished the turnaround from a deliberate tonic ending.
