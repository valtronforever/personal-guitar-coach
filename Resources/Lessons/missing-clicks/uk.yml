learningTasks:
  question:
    title: Що зупиняється в тихому такті метронома?
    body: У такті 2 метроном мовчить, але записані чотири чверті. Що робити?
    items:
      continue: 'Зіграти всі чотири ноти й зберегти рахунок: пропущено лише звук кліку.'
      rest: Зупинити гітару, бо відсутність кліку означає музичну паузу.
      wait: Призупинити темп до повернення метронома.
    explanation: >-
      Пропуск кліку прибирає зовнішню підказку, а не час чи записану ноту. Часова шкала й оцінювання тривають, тому
      повернення кліку перевіряє накопичене зміщення.
  review:
    title: Перевірте свій пульс
    body: Позначте лише власні спостереження.
    items:
      count: Я відрахував пропущені долі й зберіг усі записані атаки гітари.
      returning: Я порівняв пульс із першим кліком після тиші, не приховуючи зміщення раптовим стрибком.
      visual: Я перевірив, чи можу втримати малюнок, відвівши погляд від курсора.
