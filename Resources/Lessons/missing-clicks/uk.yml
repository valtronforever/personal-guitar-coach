lessonID: missing-clicks
lessonVersion: 1
locale: uk
title: Збережіть темп без частини кліків
summary: Продовжуйте пульс, коли підказки метронома рідшають або зникають на цілі такти.
goal: Грати записані ноти під час тихих долей метронома й зустріти повернення кліку без зміни темпу.
body: |-
  Метроном може перевіряти внутрішній пульс, не підказуючи кожну долю. У цих вправах час триває звичайно, але вибрані кліки навмисно тихі. Ноти гітари разом із ними не зникають: грайте всі ноти TAB, зокрема всередині тихого такту. Повний вступний відлік задає темп до початку пропусків.

  Почніть на 60 BPM з однієї зручної висоти. Перша чотиритактова вправа залишає лише кліки на долях 2 і 4. Рахуйте всі чотири числа; перша нота гітари припадає на долю 1, хоча кліку там немає. Не перейменовуйте два чутні кліки на 1 і 2 та не подвоюйте темп. У практичній табулатурі позначки перекресленого динаміка вказують, які долі метронома навмисно тихі.

  Наступна вправа триває шість тактів. У такті 1 усі чотири кліки, у 2 жодного, у 3 знову всі, у 4 жодного. Такти 5 і 6 повертають повний метроном. Продовжуйте чотири рівні атаки гітари в кожному такті. Рахуйте в тиші й слухайте, чи перший клік після повернення збігається з наступною атакою. Якщо ні, завершіть спробу зі своїм поточним пульсом, не приховуйте накопичене зміщення раптовим стрибком.

  Насамкінець грайте мотив із чотирьох нот у кожному з восьми тактів. Такти 1–2 встановлюють пульс; у 3–4 кліків немає; у 5–8 вони повертаються. Зберігайте чотири висоти й одну ноту на долю протягом усієї вправи. Два тихі такти перевіряють довший проміжок, тому поверніться до одного, якщо рахунок губиться. Простий чистий звук допомагає чути кожну атаку.

  Додаток і далі зіставляє кожну очікувану ноту з неперервною часовою шкалою. Переглядайте похибки в тихій ділянці та на поверненні кліку, а не лише загальний бал. Зростання запізнення вказує на сповільнення цієї спроби; дедалі ранні атаки — на прискорення. Одна помилка не доводить тенденції чи її фізичної причини. Для перевірки внутрішнього пульсу відведіть погляд від рухомого курсора, коли запам’ятаєте малюнок: оцінка часу не визначає, чи ви стежили за екраном. Результат прочитайте після гри й повторюйте тихий проміжок разом із поверненням кліків; цикл лише тихого такту прибирає корисне чутне порівняння.
steps:
  prepare:
    title: Рахуйте в тиші
    body: >-
      Установіть 60 BPM, прослухайте повний вступний відлік і підготуйте чистий звук гітари. Тихі долі метронома
      навмисні й не є паузами гітари. Залиште достатню гучність кліку, щоб почути повернення.
  sparse-clicks:
    title: Чуйте лише долі 2 та 4
    body: >-
      Чотири такти, у кожному чотири чвертні атаки гітари. Метроном пропускає 1 та 3. Рахуйте 1–2–3–4 без подвоєння
      темпу. Почніть грати на 1 після повного вступного відліку.
  one-silent-bar:
    title: Пройдіть один тихий такт
    body: >-
      Зіграйте всі шість тактів. Кліків немає у 2 та 4, вони є в 1, 3, 5 та 6. Відрахуйте тихі чотири долі й порівняйте
      наступну атаку з поверненням кліку. Вибираючи діапазон практики, збережіть і тишу, і повернення.
  two-silent-bars:
    title: Проведіть мотив через два тихі такти
    body: >-
      Повторюйте мотив із чотирьох нот у кожному такті. Повні кліки в 1–2, жодного у 3–4, знову повні у 5–8. Усі
      ноти гітари залишаються обов’язковими. {{sequence}}.
  review:
    title: Порівняйте тишу з поверненням
    body: >-
      Перегляньте атаки в тиші та на першому кліку після неї. Перш ніж робити висновок, знайдіть послідовну тенденцію
      ранніх чи пізніх атак. За потреби повторіть коротший проміжок; окремо перевірте залежність від рухомого курсора.
  question:
    title: Що зупиняється в тихому такті метронома?
    body: Відрахуйте поділ долі перед відповіддю.
