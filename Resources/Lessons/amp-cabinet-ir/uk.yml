lessonID: amp-cabinet-ir
lessonVersion: 1
locale: uk
title: Розділи підсилювач, кабінет та IR
summary: Зміни один етап модельованого гітарного тракту й визнач його внесок.
goal: Поясни свій сигнальний тракт і порівняй два кабінети без зміни підсилювача.
body: |-
  Корисний модельований тракт: вхід гітари, модель підсилювача, кабінет або його IR, потім наступні ефекти. Підсилювач дає посилення, перевантаження й формування тембру. Кабінет забарвлює результат подібно до динаміка та його запису. Багато пресетів об’єднують усі етапи, тому заміна цілого пресета не показує причину різниці.

  Імпульсна характеристика кабінету описує зафіксовану лінійну реакцію, часто разом з обраним мікрофоном і його положенням. Це не запис цілої гри, і сама IR не відтворює нелінійну реакцію перевантаженого підсилювача. Завантажувач IR застосовує цю характеристику до входу. Записуй назву IR разом із налаштуваннями підсилювача, щоб пізніше відтворити звук.

  У власному моделері чи програмі залиш незмінним підсилювач і порівняй два кабінети або IR за контрольною фразою. Перед обходом чи зміною кабінету зменш гучність: відкритий сигнал підсилювача може бути несподівано яскравим або гучним. Поверни схожі рівні прослуховування й опиши атаку, розбірливість низу та верхній край. Не додавай випадково другий кабінет після пресета, який уже його містить.

  Потім залиш один кабінет і порівняй два налаштування підсилювача. Це інше запитання, тому записуй спостереження окремо. Додаток дає музичну фразу, а не модель підсилювача чи завантажувач IR. Використовуй наявне обладнання; без окремого керування кабінетом намалюй етапи й залиш недоступне порівняння непозначеним. Вихід фізичного підсилювача на динамік не є лінійним чи інструментальним: використовуй лише з’єднання, прямо підтримані інструкціями обладнання.
steps:
  prepare:
    title: Визнач тракт і початковий звук
    body: Використовуй наявне обладнання з комфортною гучністю. Додаток дає пояснення, часові орієнтири й самоперевірку;
      він не запускає ефекти цього уроку.
  control:
    title: Використовуй ту саму фразу для порівняння
    body: 'Вивчи цю суху двотактову фразу, потім повтори її через власний звуковий тракт зі зміною одного параметра.
      Зберігай зіставні темп, артикуляцію й гучність прослуховування. Еталон додатка не містить симуляції підсилювача
      чи ефектів. Ноти звучання: {{sequence}}. Показана аплікатура — орієнтир; звук не доводить використання струни
      чи пальця.'
  cabinet-test:
    title: Порівняй етапи незалежно
    body: Задокументуй фактичний тракт процесора, потім зроби два контрольовані порівняння, якщо обладнання відкриває
      ці етапи.
  ir-quiz:
    title: Що дає IR?
    body: Яке твердження описує IR кабінету в цьому уроці?
activities:
  control:
    title: Використовуй ту саму фразу для порівняння
    body: 'Вивчи цю суху двотактову фразу, потім повтори її через власний звуковий тракт зі зміною одного параметра.
      Зберігай зіставні темп, артикуляцію й гучність прослуховування. Еталон додатка не містить симуляції підсилювача
      чи ефектів. Ноти звучання: {{sequence}}. Показана аплікатура — орієнтир; звук не доводить використання струни
      чи пальця.'
learningTasks:
  cabinet-test:
    title: Порівняй етапи незалежно
    body: Задокументуй фактичний тракт процесора, потім зроби два контрольовані порівняння, якщо обладнання відкриває
      ці етапи.
    items:
      map: Я визначив етапи підсилювача й кабінету в моніторингу.
      cab: Я порівняв два кабінети або IR з незмінним підсилювачем.
      amp: Я порівняв два налаштування підсилювача з незмінним кабінетом.
      save: Я записав достатньо назв етапів і налаштувань для відтворення вибору.
  ir-quiz:
    title: Що дає IR?
    body: Яке твердження описує IR кабінету в цьому уроці?
    items:
      response: Зафіксовану лінійну реакцію кабінету й запису, застосовану до нового входу.
      solo: Збережене соло, яке замінює зіграні мною ноти.
      all: Усю залежну від gain поведінку цілого підсилювача.
    explanation: IR кабінету забарвлює вхід. Розрізняй модель підсилювача й характеристику кабінету під час порівняння
      або збереження тракту.
