lessonID: palm-muting
lessonVersion: 1
locale: uk
title: 'Palm muting: контакт і відпускання'
summary: Порівняйте дзвінкі ноти з коротшою атакою, що зберігає висоту.
goal: Регулювати контакт руки з медіатором біля бриджа зі сталим пульсом.
body: 'Palm muting використовує ребро руки з медіатором біля сідел бриджа. Почніть із нижньої відкритої струни.
  Легко торкніться біля бриджа й зіграйте; трохи посуньте контакт до грифа для сильнішого приглушення або до сідел
  для більшої висоти й тривалості. Надмірний тиск чи контакт далеко від бриджа може залишити лише глухий клік. Корисне
  місце залежить від гітари й руки.


  P.M. позначає ноти з цим прийомом. Записані тривалості все одно організовують час, хоча звук згасає всередині
  інтервалу. Синтетичний приклад використовує коротше згасання для порівняння з дзвінкими нотами; це не реалістичний
  запис приглушеної гітари. Шукайте керовану атаку й чутну висоту, а не точний електронний тембр.


  Спершу порівняйте на чистому звуці, потім на помірному перевантаженні зі зручною гучністю. Дайте медіатору рухатися,
  не фіксуючи зап’ястя об гітару. Автоматичної оцінки palm muting немає: такі короткі звуки поза перевіреним режимом
  оцінювання висоти. Корисність висоти, рівності й приглушення визначає ваш слух.'
steps:
  prepare:
    title: Знайдіть легкий контакт
    body: Перевірте відкриту ціль тюнером. Зіграйте дзвінку ноту, потім із легким контактом біля сідла. Змінюйте
      лише місце контакту, зберігаючи подібну силу атаки.
  compare: &id001
    title: Такт дзвінко, такт приглушено
    body: На 50 BPM зіграйте чотири дзвінкі чверті, потім чотири з P.M. Повторіть двічі. Змініть згасання, не втрачаючи
      висоту й не затримуючи наступну атаку.
  controlled-eighths: &id002
    title: Шість восьмих і тиха доля
    body: Рахуйте 1 і 2 і 3 і 4. Перші шість відліків зіграйте з однаковим контактом; доля 4 тиха й дає розслабити
      руку. Повторіть чотири такти малими ударами вниз на цьому повільному темпі.
  review:
    title: Порівняйте три місця контакту
    body: Спробуйте трохи ближче до сідла, початкову точку й трохи далі. Оберіть найкорисніше співвідношення висоти
      та згасання й повторіть двотактове порівняння.
activities:
  compare: *id001
  controlled-eighths: *id002
learningTasks:
  review:
    title: Перевірте цю спробу
    body: Позначте лише те, що перевірили слухом чи спостереженням за руками.
    items:
      contrast: Приглушені ноти згасали швидше, але зберігали чутну висоту.
      even: Шість восьмих лишалися рівними без нарощування тиску руки.
      rest: Доля 4 була тихою, і я відпускав зайве напруження.
