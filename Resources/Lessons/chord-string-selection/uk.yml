lessonID: chord-string-selection
lessonVersion: 1
locale: uk
title: Які струни мають звучати в акорді
summary: Контролюйте початок удару й почуйте, як доданий бас змінює форму.
goal: Залишати позначені тихі струни незвучними у формах на п’ять і чотири струни.
body: 'Схема акорду показує і потрібні позиції, і струни, які мають мовчати. Відкритий кружок означає відкриту струну
  зі звуком, × — не грати її. Це різні вказівки. Найнижча потрібна нота визначає бас акомпанементу, тому удар по
  всіх шести струнах не завжди правильний.


  Поверніться до п’ятиструнної й чотириструнної мінорних форм. Починайте медіатором із потрібного баса й проходьте
  лише потрібну групу. Менший рух і контрольований контакт корисніші за великий стрибок. Підготуйте форму, але пам’ятайте:
  уникнення зайвої струни — також завдання руки з медіатором.


  У порівнянні до кожної форми навмисно додано один нижній звук акорду. Він не обов’язково чужий тональності: він
  змінює бас і потрібне розташування голосів. Додаток показує цю різницю, але оцінка одноголосних висот не доводить,
  що всі зайві струни мовчали в повному ударі. Практика окремих нот і слухова самоперевірка відповідають на різні
  питання.'
steps:
  prepare:
    title: Відкрита чи тиха
    body: Знайдіть маркери відкритих звучних струн і × у схемі. Не затискайте струну з × лише тому, що біля неї
      немає номера ладу. Спочатку проведіть рукою без звуку через потрібну групу.
  five-strings-shape:
    title: '{{root}} мінорний — почніть зі струни 5'
    body: Струна 6 мовчить; почніть удар вниз зі струни 5 і пройдіть через 4–1. Зупиніться й послухайте, чи немає
      небажаного низького дзвону. Зробіть три повільні удари з паузами. {{positions}}.
  five-strings:
    title: Перевірте п’ять потрібних висот
    body: 'Грайте струни 5–1 окремо, по ноті на клік на 50 BPM, зупиняючи попередню. Останні три долі — пауза. Якщо
      повний акорд був нечіткий, але п’ять цілей правильні, поверніться до слухової перевірки цілого: окремий успіх
      не підтверджує удар.'
  four-strings-shape:
    title: '{{root}} мінорний — почніть зі струни 4'
    body: 'Уникайте струн 5 і 6. Зменште глибину удару й почніть зі струни 4. Перевірте також верхню затиснуту ноту:
      точний бас не має коштувати випадково заглушеної високої струни. {{positions}}.'
  four-strings:
    title: Чотири струни, потім пауза
    body: Зіграйте чотири цілі від низької до високої, по ноті на клік. Другий такт — пауза. Наступне повторення
      знову почніть зі струни 4, без замаху від струни 6. {{sequence}}.
  bass-comparison:
    title: Почуйте небажаний бас
    body: Такти 1 і 3 — потрібні форми на п’ять і чотири струни. Такт 2 додає до першої струну 6, такт 4 до другої
      — струну 5. Порівняйте пари з однаковою гучністю. Додана нота може входити до акорду, але змінювати потрібний
      бас. Це порівняння, а не оцінювані цілі.
  review:
    title: Поверніться до потрібних версій
    body: Чергуйте дві правильні форми по чотири повільні удари. Слухайте діапазон нижче потрібного баса й перевіряйте
      струни × після кожного удару. Якщо зайва струна дзвенить, зменште глибину руху й повторіть до підвищення темпу.
activities:
  five-strings-shape:
    title: '{{root}} мінорний — п’ять звучних струн'
    body: Струна 6 виключена.
  five-strings:
    title: '{{root}} мінорний — п’ять окремих цілей'
    body: П’ять нот і три долі паузи. {{sequence}}.
  four-strings-shape:
    title: '{{root}} мінорний — чотири звучні струни'
    body: Струни 5–6 виключені.
  four-strings:
    title: '{{root}} мінорний — чотири окремі цілі'
    body: Чотири ноти й такт паузи. {{sequence}}.
  bass-comparison:
    title: Потрібний бас і доданий нижній звук
    body: Правильна п’ятиструнна форма, додана нижня струна, правильна чотириструнна форма, додана нижня струна.
learningTasks:
  review:
    title: Перевірте вибір струн
    body: 'Слухайте цілий удар: оцінка окремих нот не підтверджує тишу зайвих струн.'
    items:
      markers: Я відрізнив відкриті звучні струни від струн ×.
      bass: У кожній формі удар починався з потрібного баса.
      silence: Після чотирьох ударів кожної правильної форми я не почув зайвого низького дзвону.
