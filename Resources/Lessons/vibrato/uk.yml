lessonID: vibrato
lessonVersion: 1
locale: uk
title: 'Вібрато: керуйте шириною, швидкістю й поверненням'
summary: Почніть зі стабільної ноти, змінюйте ширину й швидкість окремо, потім відкладіть початок вібрато у фразі.
goal: Створювати рівномірні коливання висоти вгору й повертатися до початкової ноти без ненавмисного підтягування.
body: |-
  Вібрато надає довгій ноті навмисну повторювану зміну висоти. Ширина означає, наскільки далеко змінюється висота, а швидкість — як часто повторюється рух. Ширше вібрато не обов’язково має бути швидшим. У цьому уроці ви змінюєте ці параметри окремо, щоб почути й контролювати кожен із них до застосування у фразі.

  Вправи використовують невелике підтягування затиснутої струни вгору з поверненням. Почніть зі звичайної висоти, трохи підвищте її та поверніться саме до початкової. Один підйом і повернення становлять цикл. Зберігайте зручний контакт зі струною та невеликий контрольований рух; допоміжні пальці можуть підтримувати його на товстіших струнах. Не стискайте руку сильніше після кожного циклу й не залишайте струну поступово підтягнутою. Приглушуйте сусідні струни доступними контактами обох рук. Оберіть зручний рух і зробіть паузу, якщо накопичується напруження. Додаток не визначає положення руки за аудіо.

  Спочатку зіграйте вправу зі стабільною нотою без вібрато. Послухайте її висоту, дайте звучати чотири долі, потім приглушіть на чотири долі. Це встановлює звук, до якого ви повертатиметеся. Важливо вміти свідомо обрати стабільну ноту, а не додавати рух до кожного довгого звуку.

  Для вузького вібрато вдарте на долі 1, тримайте початкову висоту одну долю, потім виконуйте по одному підйому й поверненню на клік протягом чотирьох доль. Ширина становить 40 центів: помітно менше за півтон, який дорівнює 100 центам. На початку шостої долі поверніться до початкової висоти й тримайте її одну долю; останні дві долі залиште тихими. Рахуйте ці два такти як одну восьмидольну вправу. Хвиляста лінія позначає активний проміжок, а детальна крива показує його форму.

  Повторіть той самий ритм із шириною 80 центів. Не змінюйте швидкість циклів і послухайте більший розмах висоти. Далі збережіть цю ширину, але виконуйте два цикли за долю. Не збільшуйте силу лише заради швидкості. Починайте з 60 BPM і змінюйте темп лише тоді, коли початкова нота, коливання та повернення залишаються чіткими. Синтезований звук попереднього прослуховування пояснює висоту й час; це не модель руху пальця чи гітарного тембру.

  У фразі з відкладеним початком тримайте кожну нову висоту стабільно дві долі, потім додайте чотири долі вібрато шириною 60 центів по два цикли за долю. Поверніться на одну долю, а останню використайте для приглушення й підготовки наступної ноти. Така затримка робить вібрато виразним рішенням усередині ноти замість автоматичного продовження атаки.

  Перегляньте початкову фазу й повернення, а також виміряну ширину, медіанну швидкість та діапазон швидкостей окремих циклів. Прийнятне середнє значення може приховувати нерівний цикл. Оцінка не вимагає точного збігу з фазою намальованих коливань і не доводить, який палець рухався чи був повторний удар. Використовуйте чистий вхідний сигнал, переслуховуйте гру й самостійно перевіряйте фізичні деталі. Зміна строю транспонує звукові цілі; дозволене перенесення позиції зберігає ці висоти, змінюючи затиснуті позиції.
steps:
  prepare:
    title: Спочатку почуйте початкову висоту
    body: >-
      Використайте чистий вхід. Оберіть зручну затиснуту ноту й тримайте сусідні струни тихими. Розділяйте ширину
      та швидкість.
  question:
    title: Ширина чи швидкість?
    body: Подумайте про розмах зміни висоти.
  review:
    title: Послухайте й перевірте рух
    body: Порівняйте виміряну ширину й швидкості окремих циклів, потім самостійно підтвердьте фізичні деталі.
  steady: &id001
    title: Оберіть стабільну ноту
    body: >-
      Тримайте показану ноту без вібрато на долях 1–4, потім приглушіть на долях 5–8. Повторіть. Послухайте висоту,
      до якої повертатиметеся. Звукові цілі: {{sequence}}. Затиснуті позиції: {{positions}}.
  narrow: &id002
    title: Вузько й повільно
    body: >-
      Вдарте й тримайте долю 1. На долях 2–5 виконуйте вібрато шириною 40 центів по одному циклу за долю. На долі
      6 тримайте початкову висоту, на долях 7–8 — пауза. Звукові цілі: {{sequence}}. Затиснуті позиції: {{positions}}.
  wide: &id003
    title: Ширше з тією самою швидкістю
    body: >-
      Використайте той самий ритм, що й для вузького вібрато, але збільшіть ширину до 80 центів. Збережіть один
      цикл за долю; на долі 6 тримайте початкову висоту, на долях 7–8 — пауза. Звукові цілі: {{sequence}}. Затиснуті
      позиції: {{positions}}.
  faster: &id004
    title: Швидше з тією самою шириною
    body: >-
      Тримайте долю 1, потім на долях 2–5 виконуйте вібрато шириною 80 центів по два цикли за долю. Поверніться
      на долі 6, потім пауза. Порівнюйте швидкість окремо від ширини. Звукові цілі: {{sequence}}. Затиснуті позиції:
      {{positions}}.
  delayed-phrase: &id005
    title: Відкладіть вібрато всередині ноти
    body: >-
      У кожній восьмидольній групі тримайте долі 1–2 стабільно, на долях 3–6 додайте вібрато шириною 60 центів по
      два цикли за долю, поверніться на долі 7 й залиште долю 8 тихою. Готуйте нову висоту під час паузи. Звукові
      цілі: {{sequence}}. Затиснуті позиції: {{positions}}.
activities:
  steady: *id001
  narrow: *id002
  wide: *id003
  faster: *id004
  delayed-phrase: *id005
learningTasks:
  question:
    title: Ширина чи швидкість?
    body: Ви зберігаєте один цикл за долю, але збільшуєте розмах із 40 до 80 центів. Що змінилося?
    items:
      width: Ширина; швидкість циклів не змінилася.
      speed: Швидкість; ширина не змінилася.
      volume: Змінилася лише гучність.
    explanation: Центи описують розмах висоти, а цикли за долю — швидкість. Жодне з цих чисел не визначає гучність.
  review:
    title: Послухайте й перевірте рух
    body: Позначте лише те, що справді перевірили. Аудіо не доводить рух пальця чи відсутність повторного удару.
    items:
      motion: Я використовував зручний контрольований рух і розслаблявся між спробами.
      quiet: Я тримав сусідні струни тихими й перевіряв випадкові повторні удари.
      contrast: Я змінював ширину й швидкість окремо та чув різницю.
      listen: Я слухав стабільну початкову висоту й повне повернення.
