    items:
      subdivision: Галоп лишився восьмою та двома шістнадцятими, а не рівною тріоллю.
      pitch: Приглушена педаль зберігала визначену висоту, а зайві струни лишалися тихими.
      shapes: Я використав показані інтервально правильні форми для свого реального строю.
      contrast: Дзвінкі акорди контрастували з приглушеною педаллю без зміни темпу.
      stop: Остання доля була тихою перед наступним циклом.
