lessonID: metal-study
lessonVersion: 1
locale: uk
title: 'Метал: педаль, галоп, пауер-акорди й тиша'
summary: Поєднай низький повторний основний звук із приглушеними поділами й формами пауер-акордів для свого строю.
goal: Зіграй чотиритактовий риф із контрастом приглушеної педалі, дзвінких акордів і точної зупинки.
body: |-
  Цей етюд поєднує низьку педаль, галопні поділи, пауер-акорди й заплановану зупинку. Тональний центр слідує за реальною найнижчою відкритою струною, тому риф лишається заснованим на відкритій струні у Standard та Drop. Перевір показані ноти й форми після зміни строю. Drop знижує лише шосту струну відносно своєї Standard-родини, тому форма пауер-акорду може змінитися, хоча співвідношення основного звуку, квінти й октави зберігається.

  Почни з педалі на чистому, розбірливому рівні. Позначення palm mute вказує скоротити низьку ноту зі збереженням визначеної висоти й тиші на зайвих струнах. Порівняй приглушену педаль із моделлю дзвінкого акорду. Більший gain може подовжити шум разом із потрібним звуком, тому спочатку налагодь розділення й перевір його після зміни зовнішнього тембру. Додаток не містить дисторшну та не визначає положення долоні.

  Галоп тут складається з восьмої та двох шістнадцятих усередині кожної долі-чверті. Рахуй усі чотири шістнадцяті позиції, включно з місцем довшої першої ноти. Показані напрямки медіатора чергуються в усій послідовності, тому перший удар наступних груп може змінювати напрямок. Утримай три атаки всередині долі замість перетворення рисунка на три рівні ноти. Почни з одного такту й цілого такту відпочинку.

  Окремо опрацюй маршрут пауер-акордів. Озвучуй лише вибрані нижні струни й готуй кожний новий основний звук перед атакою. У Drop нижні форми можуть опинитися на одному ладі; у Standard збережи ступінчасту аплікатуру додатка. Не перенось завчену Drop-форму на Standard-гітару з припущенням, що інтервали лишаться правильними. Послухай еталон знову після зміни строю.

  Фінальні чотири такти чергують галоп із акордовими відповідями й завершуються повною тихою долею. Зроби контраст чутним без зміни основного темпу. Повторюй перехід, якщо palm mute переходить на дзвінкий акорд або зайва струна переживає зупинку. Тут діє самопрактика, бо короткі приглушені звуки й одночасні акорди поза поточним контрактом оцінювання. Перевір пульс, розділення й форму без очікування оцінки якості тембру.
steps:
  prepare:
    title: Обери невелику музичну ідею
    body: Прочитай план, обери зручний чистий звук і почни повільно.
  low-pedal:
    title: Прив’яжи риф до найнижчої відкритої струни
    body: 'Центр: {{root}}, поточна найнижча відкрита висота. Збережи розділення її приглушених атак перед двома
      затиснутими відповідями.'
  gallop-burst:
    title: Три атаки всередині долі з чотирьох позицій
    body: Грай восьма–шістнадцята–шістнадцята, потім залиш такт відпочинку. Це рівний поділ, а не рівна тріоль.
  tuning-shapes:
    title: Форми пауер-акордів для твого строю
    body: Читай реальні лади для основного звуку, квінти й октави. Між Standard і Drop форма змінюється, а інтервальний
      рисунок зберігається.
  four-bar-riff:
    title: 'Чотири такти: приглуши, відповідай, повернися, зупинись'
    body: Такти 1 та 3 несуть галоп. Такт 2 відкривається в акорди; такт 4 відповідає й зупиняється на останню долю.
  metal-review:
    title: Збережи контраст і зупинку
    body: Повтори чотири такти з тихим еталоном, потім за наявності порівняй чистий та обраний зовнішній звук на
      контрольованому рівні.
