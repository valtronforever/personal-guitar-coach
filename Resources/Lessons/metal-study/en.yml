    title: Keep the contrast and the stop
    body: Repeat the four bars with a quiet reference, then compare clean and your chosen external sound at a controlled
      level if available.
    items:
      subdivision: The gallop stayed eighth–sixteenth–sixteenth rather than an equal triplet.
      pitch: The muted pedal retained a definite pitch and unused strings stayed quiet.
      shapes: I used the displayed interval-correct shapes for my actual tuning.
      contrast: Ringing chords contrasted with the muted pedal without a tempo change.
      stop: The last beat was silent before the next cycle.
