lessonID: repeat-a-rhythm
lessonVersion: 1
locale: uk
title: Повтори ритм на слух
summary: Запам’ятай короткий ритмічний рисунок і відтвори його на одній висоті після відліку.
goal: Відтвори атаки й проміжки почутого рисунка без ритмічної табулатури.
body: |-
  Ритм містить і звуки, і проміжки між ними. Цей урок приховує записаний рисунок, щоб ти слухав моменти атак. Кожен приклад використовує одну висоту; знайди її перед початком, потім зосередься на часі. Видимі кола показують лише рівний пульс метронома. Вони не розкривають ритм, який потрібно відтворити.

  Спочатку прослухай еталон повністю, не граючи. Відчувай пульс невеликим зручним рухом. Під час наступного відтворення за бажанням тихо промов чи простукай ритм, потім зроби коротку паузу та пригадай його. Рахуй долі безперервно, зокрема в проміжках. Сприймай рисунок як цілу фразу, а не список окремих атак; помічай, чи звук потрапляє на клік або між кліками.

  Приклад A закріплює простий пульс, B додає проміжок, а наступні потребують дрібнішого поділу й довшого запам’ятовування. Точні рисунки залишаються прихованими. Повторюй прослуховування стільки, скільки потрібно. Почни з типового темпу; якщо зміниш темп або вибереш менше тактів, послухай знову, адже підготовлений еталон має відповідати спробі. Не прискорюйся в тиші лише тому, що руки не грають.

  Знайди висоту, порепетируй рисунок і почни відповідь. Грай лише після нового відліку. Використовуй чисту окрему атаку й свідомо приглушуй звук у почутих проміжках. Рух медіатора має бути невеликим і вільним. Додаток вимірює початки нот і доступні дані висоти; ці приклади не засвідчують точний рух приглушення та не оцінюють усю форму згасання. Прослухай запис, щоб перевірити, чи заплановані проміжки справді тихі.

  Розглядай схильність поспішати чи запізнюватися окремо від пропущеної атаки. Пропуск може зрушити в пам’яті решту фрази, тож почни з відліку замість наздоганяння курсора. Для оцінки таймінгу потрібне придатне калібрування; без нього сам результат за висотою не доводить ритмічної точності. Ручне калібрування дає приблизну оцінку часу. Використай діагностику, щоб обрати коротший рисунок, потім поверни повну фразу. Відкриття цілі корисне для порівняння й позначається як гра з підказками.
