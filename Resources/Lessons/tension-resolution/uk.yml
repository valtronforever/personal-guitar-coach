lessonID: tension-resolution
lessonVersion: 1
locale: uk
title: 'Напруження й розв’язання: обери прибуття'
summary: Почуй сусідні ноти, хроматичні підходи й затримання відносно реальної підтримки.
goal: Створи фразу зі свідомим напруженням, чітким розв’язанням і простором для слухання результату.
body: |-
  Нота не стає напруженою сама по собі лише через перебування поза завченою формою. Її дія залежить від гармонії, регістру, ритму й продовження. Спершу обери стійке прибуття, потім використай іншу ноту для його виразності. Приклади зберігають чутний нижній голос, щоб слухати зв’язок безпосередньо замість уявлення відсутнього акорду.

  Сусідня нота з’являється після терції тоніки: верхній голос рухається на крок вище й повертається. Бас утримується під усіма трьома нотами. Почуй середню висоту як відхилення, бо стійка терція встановлена до й після неї. Не атакуй бас у дужках на кожній верхній ноті: це замінить запланований тривалий контекст іншою артикуляцією.

  Хроматичні моделі підходять до терції й основного звуку з півтону нижче або вище. Дай цілі довшу записану тривалість, щоб слухач почув місце заспокоєння руху. Потім порівняй варіант із відкладеним на одну долю прибуттям і збереженою довжиною такту. Інше розташування змінює дію фрази навіть за тих самих двох висот.

  Затримання відрізняється від заново атакованої прохідної ноти. У підготовленому прикладі верхня нота вже звучить над басом домінанти. Вона утримується під час переходу басу в тоніку, утворюючи кварту над новим басом, потім розв’язується вниз у терцію. Стеж за дужками на верхній струні під час зміни басу й на басі під час розв’язання. Кожний голос має власні атаку та завершення.

  Заверши короткою фразою розв’язання та її тихим тактом. Простір дозволяє відчути прибуття перед новою ідеєю. Для власної версії обери одну ціль, один тип підходу й заплановане місце розв’язання. Порівняй раннє й відкладене розв’язання та поясни почуту відмінність. Це слухові й композиційні рішення; самопрактика не присвоює автоматичної оцінки напруженню, смаку або одночасним голосам.
steps:
  prepare:
    title: Обери невелику музичну ідею
    body: Прочитай план, обери зручний чистий звук і почни повільно.
  neighbor-return:
    title: Відійди від терції та повернися
    body: 'Центр: {{root}} major. Продовжуй бас, поки верхня терція піднімається до кварти й повертається; потім
      залиш один тихий такт.'
  chromatic-arrivals:
    title: Чітко розв’яжи хроматичний підхід
    body: Спершу підійди до терції тоніки знизу, потім до її основного звуку згори. Збережи кожний бас увесь такт
      і дай кожній цілі три долі.
  prepared-suspension:
    title: Утримай верхню ноту під час зміни басу
    body: Збережи верхню ноту з такту басу домінанти в такті тоніки без повторної атаки. Розв’яжи утворену кварту
      вниз у терцію на долі 3.
  release-and-space:
    title: Прийди в тоніку й залиш простір
    body: Спусти кварту–терцію–секунду–тоніку над одним утримуваним басом, потім припини обидва голоси на повний
      такт.
  resolution-review:
    title: Обери одне відхилення й одне повернення
    body: 'Створи дві версії короткої фрази з однією ціллю: розв’яжи одну раніше, іншу пізніше зі збереженням довжини
      такту.'
