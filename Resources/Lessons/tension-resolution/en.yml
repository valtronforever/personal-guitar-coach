learningTasks:
  resolution-review:
    title: Choose one departure and one return
    body: 'Make two versions of a short phrase with the same target: resolve one earlier and the other later while
      retaining the bar length.'
    items:
      context: I heard the target against a clear supporting bass.
      hold: The suspension continued through the bass change without another upper attack.
      arrival: I could identify the moment of resolution.
      contrast: The early and delayed versions had an audible difference.
      space: I left time to hear the arrival before starting another phrase.
