    items:
      colors: I could identify the four chord colors in their route.
      top: The top voice remained audible inside the chords.
      inversion: I heard the different lowest note in the inversion comparison.
      ornament: The one-string ornament returned on time before the next chord.
      choice: I compared one specific balance or ornament choice.
