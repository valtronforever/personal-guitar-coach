lessonID: rnb-neo-soul
lessonVersion: 1
locale: uk
title: 'R&B і neo-soul: поєднай голоси й невеликі прикраси'
summary: Використай компактні акордові барви, чіткий верхній голос і короткі мелодичні відповіді.
goal: Поєднай чотиритактовий акордовий маршрут із чутним голосоведенням та обраною мелодичною прикрасою.
body: |-
  Почни з голосів усередині акорду замість накопичення форм. Невелика аплікатура може передавати багату гармонію, коли її важливі звуки чітко переходять до наступного акорду. Тут використано барву великого септакорду, два мінорні септакорди й домінантовий нонакорд перед поверненням додому. Деякі форми не містять основного звуку чи квінти; назви описують гармонічний контекст, а не наявність кожного звуку акорду на струнах.

  Повільно зіграй чотири кольорові акорди й визнач найвищу ноту кожного. Потім зіграй лише верхню лінію на першій струні. Слухай, наскільки мелодія рухається, поки деякі нижні голоси лишаються поруч. Повернися до акордів, не втративши верхню лінію в балансі. Гучніший акорд не обов’язково розбірливіший; налаштуй атаку так, щоб потрібний голос лишався чутним.

  Порівняння обернень тимчасово повертається до простого мажорного тризвуку. Основний вид і перше обернення містять ті самі три класи висот із різними нижніми нотами. Почуй зміну регістру й балансу перед сприйняттям форм як взаємозамінних. Обирай аплікатуру через її зв’язок із наступною музичною ідеєю, а не лише через звичність для руки.

  Вправа прикраси грає акорд, відпускає його й відповідає короткими hammer-on та pull-off на одній струні. Еталон не вимагає незалежно утримувати акорд під цією лінією. Залиш невелике мелодичне повернення всередині відведених долей і дай наступному акорду прийти без розриву. Порівняй прикрасу з простою утриманою нотою, щоб вирішити, чи рух справді покращує фразу.

  Поєднай чотиритактовий етюд і залиш його записаний простір відкритим. Спочатку збережи точне розміщення нот, потім зроби один власний вибір балансу чи прикраси без зміни форми. Приклади є зосередженим вступом, а не формулою цілого жанру. Баланс акордів, відчуття й техніка руки перевіряються самостійно; синтезований еталон пояснює висоти й час. У кожному проході слухай один конкретний перехід замість нечіткої загальної оцінки «добре» чи «погано».
steps:
  prepare:
    title: Обери невелику музичну ідею
    body: Прочитай план, обери зручний чистий звук і почни повільно.
  color-chords:
    title: Чотири компактні барви
    body: 'Центр: {{root}} major. Маршрут Imaj7–vi7–ii7–V9; розділяй реальні звуки й передбачені гармонічні ролі.'
  top-line:
    title: Почуй верхній голос окремо
    body: Це найвищі ноти чотирьох акордових форм на струні 1. Збережи цю лінію, повернувшись до повних аплікатур.
  inversion-choice:
    title: Один мажорний тризвук, два нижні звуки
    body: Порівняй основний вид і перше обернення {{root}} major. Класи висот лишаються тими самими, а нижня нота
      змінюється.
  ornament-answer:
    title: Відпусти акорд, відповідай мелодією
    body: Після кожного дводольного акорду зіграй вказану однострунну відповідь hammer-on/pull-off. Умісти її в
      наступні дві долі.
  color-study:
    title: Чотири такти з двома невеликими відповідями
    body: Розділяй акордовий маршрут, дві мелодичні відповіді й останній перехід домінанта–тоніка. Залиш фінальну
      долю тихою.
  voice-review:
    title: Обери, за чим стежить слухач
    body: Зіграй етюд двічі. В одному проході стеж за найвищим акордовим голосом, у наступному порівняй прикрасу
      з варіантом простої ноти.
