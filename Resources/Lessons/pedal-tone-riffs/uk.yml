lessonID: pedal-tone-riffs
lessonVersion: 1
locale: uk
title: Рифи з педальним тоном
summary: Повертайтеся до відкритого баса між різними затиснутими нотами.
goal: Зіграти змінну фразу зі збереженням повторюваного баса й ритму.
body: 'Педальний тон — повторювана чи утримувана опорна висота, навколо якої рухаються інші ноти. Тут нижня відкрита
  струна повертається між затиснутими нотами на ній самій. Урок слідує за струною 6 при зміні строю, тому відкритий
  бас лишається опорою у Standard і Drop. Орієнтуйтеся на поточні звучні назви, а не одну завчену літеру.


  Перша двотактова фраза чергує відкриту ноту з ладами 3, 5, 7 і 5. Чуйте контур затиснутих нот, роблячи кожне повернення
  до баса свідомим. Відпускайте до відкритої ноти без випадкового відтягування струни вбік; атакуйте медіатором
  кожну записану ноту, включно з повтореним басом.


  Чотиритактова варіація стискає перші чотири ноти у восьмі, потім залишає басову чверть і цілу долю тиші. Чиста
  неприглушена версія оцінюється за окремими висотами й атаками. Прийом глушіння, напрямок медіатора й тембр — ваші
  спостереження. Спершу вивчіть ціль висоти та ритму; власна приглушена варіація згодом не є оцінюваною ціллю.'
steps:
  prepare:
    title: Почуйте опору
    body: Налаштуйте нижню відкриту струну й зіграйте її рівно чотири рази. Знайдіть лади 3, 5 і 7 без зміни налаштувань
      інструменту.
  quarter-pedal: &id001
    title: Чергуйте відкриті й затиснуті чверті
    body: На 50 BPM зіграйте вісім нот у двох тактах. Кожна друга — відкритий бас. Зробіть три оцінювані спроби
      й порівняйте помилки руху від баса та повернення. {{sequence}}.
  eighth-pedal: &id002
    title: Збережіть вчасне повернення баса
    body: 'Рахуйте 1 і 2 і 3 4: чотири восьмі, чверть і чверть паузи. Пройдіть усі чотири різні такти перед повтором.
      Не квапте бас на 3 й не пропускайте тиху четверту долю.'
  review:
    title: Відділіть помилку висоти від поспіху
    body: За результатами нот оберіть проблемний такт. Повторіть повільно й поверніть цілу фразу. Самі слухайте
      випадкову додаткову атаку pull-off між записаними нотами.
activities:
  quarter-pedal: *id001
  eighth-pedal: *id002
learningTasks:
  review:
    title: Перевірте цю спробу
    body: Позначте лише те, що перевірили слухом чи спостереженням за руками.
    items:
      anchor: Відкритий бас послідовно повертався між змінними цілями.
      rests: Я зберігав останню тиху долю кожного такту варіації.
      attacks: Кожна ціль мала свідому атаку медіатора без зайвого pull-off.
