lessonID: fretboard-note-names
lessonVersion: 1
locale: uk
title: Назви нот на грифі
summary: Читайте поточні звучні назви й знаходьте наступний півтон.
goal: Називати й грати ноти від обраних відкритих струн, включно з октавою на ладі 12.
body: 'Кожен лад підвищує струну на півтон. Цикл класів висоти повторюється: A, A♯/B♭, B, C, C♯/D♭, D, D♯/E♭, E,
  F, F♯/G♭, G, G♯/A♭, потім знову A. Між B–C та E–F уже один півтон: окремого додаткового ладу з дієзом чи бемолем
  між ними немає. У цій системі строю дієзне й бемольне написання можуть називати ту саму звучну висоту.


  Починайте з назви відкритої струни у фактичному строї, а не з припущення E. Цей урок фізичного малюнка зберігає
  струни й лади після зміни строю та переобчислює звучні назви. Номер октави — частина цілі: A2 і A3 мають одну
  літеру, але різну висоту. Лад 12 повторює клас висоти відкритої струни октавою вище.


  Перед короткою спробою назвіть показані цілі, простежуючи позиції. Зіграйте повільно, потім відведіть погляд і
  передбачте наступну назву від попередньої. Відкрийте маркери для перевірки. Автоматична практика перевіряє чутні
  ноти й атаки, але не визначає, чи згадали ви назви, чи прочитали TAB.'
steps:
  prepare:
    title: Почніть із цієї гітари
    body: Підтвердіть стрій і назвіть шість показаних відкритих струн з октавами. Знайдіть у циклі дві пари натуральних
      назв без проміжного дієза чи бемоля.
  low-chromatic: &id001
    title: П’ять сусідніх нот на струні 6
    body: Зіграйте лади 0–4 п’ятьма чвертями й дорахуйте три долі паузи. На 50 BPM назвіть цілі перед стартом; не
      додавайте зайвого ладу між B–C чи E–F. {{sequence}}.
  high-chromatic: &id002
    title: Те саме правило з іншої початкової ноти
    body: Повторіть лади 0–4 на струні 1. Порівняйте початкову октаву й назви з нижньою струною. Передбачте п’ять
      нот, відкрийте їх і зробіть дві оцінювані спроби. {{sequence}}.
  name-repeat: &id003
    title: Літера повертається на ладі 12
    body: Чергуйте відкриту струну й лад 12 на струнах 6, 5 та 1; завершіть двома долями паузи. Щоразу називайте
      нову октаву. При зміні струни глушіть попередню. {{sequence}}.
  review:
    title: Згадайте без маркерів
    body: Оберіть одну з опрацьованих струн. Відведіть погляд і назвіть лади 0–4 та 12, потім перевірте схему. Відділіть
      помилку назви від помилки гри й повторіть потрібні п’ять нот.
activities:
  low-chromatic: *id001
  high-chromatic: *id002
  name-repeat: *id003
learningTasks:
  review:
    title: Перевірте цю спробу
    body: Позначте лише те, що перевірили слухом чи спостереженням за руками.
    items:
      names: Я передбачив п’ять сусідніх назв перед відкриттям схеми.
      octave: Я відрізнив повторену літеру від її вищої октави.
      tuning: Я використовував відкриті назви цього строю, а не завчені позначення Standard.
