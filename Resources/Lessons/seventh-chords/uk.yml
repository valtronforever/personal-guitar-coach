learningTasks:
  question:
    title: Що означає суфікс 7 без додатків?
    body: Яка пара інтервалів відрізняє домінантсептакорд від maj7 та m7?
    items:
      dominant: Велика терція та мала септима від основного тону.
      major: Велика терція та велика септима від основного тону.
      minor: Мала терція та мала септима від основного тону.
    explanation: >-
      Акорд 7 містить основний тон, велику терцію, квінту та малу септиму. maj7 підвищує септиму, а m7 знижує терцію.
      Бас або кількість струн не визначають ці суфікси.
  review:
    title: Самостійно перевірте повний акорд
    body: Позначте лише те, що справді перевірили.
    items:
      roles: Я знайшов терцію на струні 2 та септиму на струні 3.
      seventh: Я змінив maj7 на 7, опустивши лише септиму.
      third: Я змінив 7 на m7, опустивши лише терцію.
      move: Я переніс повну форму домінантсептакорду, зберігши тип 7.
