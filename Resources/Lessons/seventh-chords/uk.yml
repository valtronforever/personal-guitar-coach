lessonID: seventh-chords
lessonVersion: 1
locale: uk
title: 'Септакорди: maj7, 7 та m7'
summary: Порівняйте чотириструнні форми maj7, домінантсептакорду й m7, потім перенесіть форму 7.
goal: Читати суфікс акорду та знаходити терцію й септиму, які визначають його тип.
body: |-
  Септакорд додає до тризвуку септиму від основного тону. Суфікс має значення: maj7 поєднує мажорний тризвук із великою септимою; 7 — мажорний тризвук із малою септимою; m7 — мінорний тризвук із малою септимою. Сам знак 7 не означає велику септиму. Відносно основного тону їхні інтервали за класами висот у півтонах такі: 0–4–7–11, 0–4–7–10 та 0–3–7–10.

  Три форми для порівняння мають спільний основний тон і використовують струни 5, 4, 3 та 2. Струни 6 і 1 залишаються тихими. Голоси знизу вгору розташовані так: основний тон–квінта–септима–терція. Знаходити ці ролі корисніше, ніж лише пам’ятати, який акорд відрізняється одним пальцем. Читайте адаптований основний тон кожної активності; обраний стрій може змінити звучну назву акорду зі збереженням його типу.

  Почніть із maj7. Терція розташована на струні 2, велика септима — на струні 3. Зіграйте чотири ноти окремо, потім тихо спробуйте повний акорд поза оцінюваною практикою. Порівняйте основний тон із септимою: велика септима на півтон нижча за наступну октаву основного тону, хоча ці струни не обов’язково розташовані поруч із тією октавою на грифі.

  Перетворіть maj7 на 7, опустивши лише струну 3 на один лад. Велика септима стане малою, а основний тон, квінта й велика терція залишаться. Потім перетворіть 7 на m7, опустивши лише струну 2 на один лад. Терція стане малою, а септима залишиться малою. Повільно чергуйте кожну сусідню пару й визначайте змінюваний голос на слух та на грифі.

  Остання форма переносить увесь домінантсептакорд на два лади вище. Тепер основний тон змінюється на цілий тон, а велика терція та мала септима зберігають свої ролі. Це транспонування акорду 7, а не перетворення на maj7. Оскільки шоста струна не використовується, відповідна пара Standard/Drop має ті самі позиції цих форм.

  Працюйте короткими розслабленими спробами й перевіряйте по одній струні, якщо нота глуха. Під час ритмічної практики зупиняйте попередній звук перед наступною атакою; решта записаних пауз завершує два такти. Бал перевіряє окремі висоти й час, а не розпізнавання одночасно зіграного септакорду. Повні акорди порівнюйте під час самостійної практики.
steps:
  prepare:
    title: Прочитайте суфікс до побудови акорду
    body: >-
      Використовуйте струни 5–2, залишаючи струни 6 і 1 тихими. Знайдіть основний тон на струні 5, септиму на струні
      3 та терцію на струні 2. Прочитайте maj7, 7 або m7 до натискання.
  review:
    title: Змініть один голос, потім перенесіть усі
    body: >-
      Порівняйте maj7→7 через зміну септими та 7→m7 через зміну терції. Потім порівняйте дві позиції домінантсептакорду.
      Поясніть, яка дія змінює тип акорду, а яка транспонує основний тон; повні акорди пробуйте окремо від оцінюваних
      нот.
  major-seventh-shape:
    title: 'maj7: велика терція та велика септима'
    body: >-
      Основний тон — {{root}}. Від струни 5 до струни 2 ролі такі: основний тон, квінта, велика септима та велика
      терція. {{positions}}. Послухайте септиму на струні 3 перед порівнянням із наступною формою 7.
  major-seventh-notes:
    title: '{{root}}maj7 — перевірка струн'
    body: >-
      Грайте струни 5, 4, 3 і 2 знизу вгору по одній на клік на 50 BPM. Зупиняйте попередній звук перед кожною атакою,
      потім відрахуйте чотири записані тихі долі до завершення двох тактів. Струни 6 і 1 мають мовчати. Бал перевіряє
      окремі висоти й час, а не одночасно зіграний септакорд. {{positions}}.
  dominant-seventh-shape:
    title: '7: опустіть септиму'
    body: >-
      Основний тон — {{root}}. Опустіть струну 3 на один лад порівняно з попередньою формою maj7, зберігши інші
      три висоти. Тепер акорд має велику терцію та малу септиму. {{positions}}. Цей тип позначає суфікс 7 без додатків.
  dominant-seventh-notes:
    title: '{{root}}7 — перевірка струн'
    body: >-
      Грайте струни 5, 4, 3 і 2 знизу вгору по одній на клік на 50 BPM. Зупиняйте попередній звук перед кожною атакою,
      потім відрахуйте чотири записані тихі долі до завершення двох тактів. Струни 6 і 1 мають мовчати. Бал перевіряє
      окремі висоти й час, а не одночасно зіграний септакорд. {{positions}}.
  minor-seventh-shape:
    title: 'm7: опустіть також терцію'
    body: >-
      Основний тон — {{root}}. Порівняно з попередньою формою 7 опустіть струну 2 на один лад, зберігши решту висот.
      Тепер і терція, і септима малі. {{positions}}. Перевірте, що септима на струні 3 не змістилася ще раз.
  minor-seventh-notes:
    title: '{{root}}m7 — перевірка струн'
    body: >-
      Грайте струни 5, 4, 3 і 2 знизу вгору по одній на клік на 50 BPM. Зупиняйте попередній звук перед кожною атакою,
      потім відрахуйте чотири записані тихі долі до завершення двох тактів. Струни 6 і 1 мають мовчати. Бал перевіряє
      окремі висоти й час, а не одночасно зіграний септакорд. {{positions}}.
  moved-dominant-shape:
    title: Перенесіть повну форму 7
    body: >-
      Новий основний тон — {{root}}. Кожна позиція на два лади вище, ніж у першій формі домінантсептакорду. Це досі
      акорд 7: велика терція та мала септима. {{positions}}. Перенесіть усю форму, не залишаючи внутрішній голос
      позаду.
  moved-dominant-notes:
    title: '{{root}}7 — перевірка струн'
    body: >-
      Грайте струни 5, 4, 3 і 2 знизу вгору по одній на клік на 50 BPM. Зупиняйте попередній звук перед кожною атакою,
      потім відрахуйте чотири записані тихі долі до завершення двох тактів. Струни 6 і 1 мають мовчати. Бал перевіряє
      окремі висоти й час, а не одночасно зіграний септакорд. {{positions}}.
  question:
    title: Що означає суфікс 7 без додатків?
    body: Порівняйте ролі звуків акорду перед відповіддю.
