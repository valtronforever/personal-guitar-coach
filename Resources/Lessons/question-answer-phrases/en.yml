learningTasks:
  answer-by-choice:
    title: Make the relationship audible
    body: 'Play three response cycles: exact echo, changed ending, contrast. Then create a four-bar conversation
      and explain what links its phrases.'
    items:
      echo: I placed an echo inside the response bar.
      change: I compared a changed ending with a contrasting answer.
      boundary: I stopped before the next call instead of overlapping it.
      space: I counted a deliberate silence and could explain its role.
