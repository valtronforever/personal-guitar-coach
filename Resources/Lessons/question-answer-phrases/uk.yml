lessonID: question-answer-phrases
lessonVersion: 1
locale: uk
title: Запитай, відповідай і залиш простір
summary: Створи музичну розмову з короткого запитання, пов’язаної відповіді та свідомої тиші.
goal: Побудуй пов’язану відповідь із чіткою межею замість нескінченного продовження кожної ідеї.
body: |-
  Музичному запитанню не потрібні слова. Коротка фраза може запрошувати відповідь завдяки завершенню, напрямку чи ритму. Відповідь може повторити частину ідеї, змінити закінчення або рухатися в контрастному напрямку. Це корисні композиційні рішення, а не універсальні правила, які автоматично роблять одну ноту запитанням, а іншу відповіддю.

  Послухай перше запитання. Воно займає один такт, після якого є порожній такт для відповіді. У цій вправі для прослуховування порожній такт запрошує тебе грати, а не є паузою, з якою порівнюють гітару при оцінюванні. Увімкни повторення в налаштуваннях відтворення. Слухай запитання, не перекриваючи його грою, відповідай у наступному такті й зупиняйся до повернення запитання. Відповідь має бути досить короткою, щоб межа лишалася чутною.

  Почни з відлуння з тими самими висотами й ритмом. Коли можеш вчасно його розмістити, зміни лише закінчення. Потім збережи ритм, але розверни напрямок частини мелодії. Слухай зв’язок між запитанням і відповіддю замість вибору непов’язаних швидких нот. Якщо не пам’ятаєш запитання, зупинись і послухай його ще раз перед створенням відповіді.

  Друге запитання рухається вниз і залишає короткий простір перед тактом відповіді. Не припускай, що спадна фраза обов’язково потребує висхідної відповіді. Спробуй відлуння й контраст, потім обери версію, зв’язок у якій можеш пояснити. Свідома пауза може бути найкориснішим контрастом. Продовжуй рахувати, щоб тиша мала місце у фразі, а не ставала випадковою затримкою.

  Повна чотиритактова модель показує дві пов’язані пари. Спочатку скопіюй її й визнач рису, яку зберігає кожна відповідь. Потім зменш гучність еталонного тону, залиш метроном і зіграй власну чотиритактову розмову. Нехай такти 1 і 3 ставлять пов’язані запитання, а 2 і 4 відповідають; остання відповідь має дати чіткіше завершення. Можеш використати менше нот, ніж у моделі.

  Перевір межі фраз, зв’язок між ідеями та кількість простору. Це музичні рішення для самоспостереження. Додаток дає часовий зразок і тихе місце для відповіді, але не виставляє оцінку творчості й не визначає задум із запису. Якщо відповідь накладається на наступне запитання, скороти її або раніше закінчи останню ноту. Повторюй, доки можеш починати й завершувати свідомо.
steps:
  prepare:
    title: Обери невелику музичну ідею
    body: Прочитай план, обери зручний чистий звук і почни повільно.
  call-one:
    title: Запитання й місце для твоєї відповіді
    body: 'Центр: {{root}} мажор. Повторюй два такти: слухай у першому, вигадай відповідь у тихому другому й зупинися
      до наступного запитання. Порожній такт — неоцінюваний простір для твоїх нот. Ноти звучання: {{sequence}}.
      Показана аплікатура — орієнтир; звук не доводить використання струни чи пальця.'
  call-two:
    title: Відповідай на інший напрямок
    body: 'Порівняй відлуння, змінене закінчення та контрастну відповідь. Вклади відповідь у другий такт і збережи
      впізнаваний зв’язок зі спадним запитанням. Ноти звучання: {{sequence}}. Показана аплікатура — орієнтир; звук
      не доводить використання струни чи пальця.'
  conversation:
    title: Повна чотиритактова розмова
    body: 'Такти 1 і 3 ставлять пов’язані запитання; 2 і 4 відповідають. Порівняй повторений початок, змінений ритм
      і завершальне повернення. Потім створи власну версію зі зменшеним еталонним тоном. Ноти звучання: {{sequence}}.
      Показана аплікатура — орієнтир; звук не доводить використання струни чи пальця.'
  answer-by-choice:
    title: Зроби зв’язок чутним
    body: 'Зіграй три цикли відповідей: точне відлуння, змінене закінчення, контраст. Потім створи чотиритактову
      розмову й поясни зв’язок між фразами.'
