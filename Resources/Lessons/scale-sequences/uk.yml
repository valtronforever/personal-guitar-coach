      ступені; різні відстані в ладах тут навмисні. {{sequence}}.
learningTasks:
  knowledge-check:
    title: Група з трьох чи тріоль?
    body: У 4/4 три послідовні чверті об’єднані акцентом. Скільки триває група?
    items:
      three: 'Три долі: саме групування не змінює тривалостей.'
      one: Одну долю, бо кожна група з трьох — тріоль.
      four: Чотири долі, бо розмір 4/4.
    explanation: >-
      Кожна чверть тут триває одну долю. Три чверті — три долі, які можуть перетнути тактову риску. Тріоль потребує
      іншого поділу часу, який розглядається окремо.
  review:
    title: Перевірте фразу
    body: Позначте лише власні спостереження.
    items:
      rule: Я передбачаю наступну групу за ступеневим малюнком.
      pulse: Я зберігав чотири долі в такті, коли групи по три перетинали тактові риски.
      thirds: Я дотримувався діатонічних терцій, а не копіював одну відстань у ладах.
