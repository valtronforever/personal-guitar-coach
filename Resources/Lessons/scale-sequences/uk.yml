lessonID: scale-sequences
lessonVersion: 1
locale: uk
title: 'Секвенції гами: по три, по чотири й терціями'
summary: Повторюйте короткий ступеневий малюнок від послідовних ступенів мажору.
goal: Зберігати чіткий чотиридольний пульс, пересуваючи мелодичний малюнок гамою.
body: |-
  Гамова секвенція повторює малюнок від послідовних ступенів. Замість прямого руху від тоніки до октави зіграйте 1–2–3, потім 2–3–4, потім 3–4–5 і далі. Потрібно впізнати коротке музичне правило й почати його з нового місця. Вивчайте повільно, щоб назвати наступний початковий ступінь до гри.

  Усі приклади тут — чверті в 4/4. Група з трьох чвертей не є тріоллю: тріоль ділить заданий часовий проміжок на три, а тут кожна нота займає повну долю. Початок тризвукового малюнка зміщується між долями й перетинає тактові риски. Акцент позначає першу ноту кожної мелодичної групи, тоді як метроном зберігає звичайний такт. Розрізняйте ці два рівні й не скорочуйте групу, щоб умістити її в такт.

  Перша секвенція має шість груп від 1–2–3 до 6–7–8: вісімнадцять атак і дві чверті паузи у п’яти тактах. Варіант по чотири має п’ять груп від 1–2–3–4 до 5–6–7–8. Двадцять атак заповнюють п’ять тактів, а шостий тихий такт дає час підготувати повтор. Тепер кожна група починається на тактовій рисці — порівняйте це з групуванням по три.

  Діатонічні терції пропускають один ступінь: 1–3, 2–4, 3–5, 4–6, 5–7, 6–8. Відстані в ладах різні, бо серед терцій мажорної гами є великі й малі. Дотримуйтеся висот гами, а не пересувайте кожну пару на однакову кількість ладів. Наприкінці нижня тоніка й три долі тиші завершують чотири такти.

  Практикуйте кожний малюнок на 50 BPM, потім називайте початкові ступені під час прослуховування. Якщо нова група викликає затримку, поза оцінюваною спробою повторіть дві останні ноти попередньої та дві перші наступної. Автоматична оцінка перевіряє записані висоти й атаки; силу акцентів і форму фрази перевіряйте слухом. Підвищуйте темп лише коли впевнені і в малюнку, і в рахунку тактів.
steps:
  prepare:
    title: Прочитайте правило перед нотами
    body: >-
      Пригадайте мажор і його тоніку. Простежте одну групу з трьох нот у TAB, потім знайдіть початок другої. Перед
      грою відрахуйте повний такт.
  groups-three:
    title: Три чверті через тактову риску
    body: >-
      Зіграйте шість груп із трьох чвертей. Виділіть позначену першу ноту без зміни тривалості. Безперервно рахуйте
      1–2–3–4, останні дві долі такту 5 лишіть тихими. Це не тріолі.
  groups-four:
    title: Групи по чотири на початку тактів
    body: >-
      Зіграйте п’ять груп по чотири, потім мовчки відрахуйте весь шостий такт. Кожна група починається ступенем
      вище. Порівняйте з попереднім прикладом: початки груп тепер збігаються з початками тактів.
  diatonic-thirds:
    title: Пропускайте один ступінь
    body: >-
      Зіграйте 1–3, 2–4, 3–5, 4–6, 5–7, 6–8, потім нижню тоніку. Останні три долі тихі. Під час перегляду називайте
      ступені; різні відстані в ладах тут навмисні. {{sequence}}.
  review:
    title: Відокремте пам’ять від пульсу
    body: >-
      Виберіть межу груп із найбільшою затримкою й уповільніть її. Потім зіграйте всю секвенцію, зберігаючи рахунок
      тактів. Перевірте слухом позначене групування: оцінка висоти/часу не підтверджує силу акцентів.
  knowledge-check:
    title: Перевірте музичне співвідношення
    body: Дайте відповідь за будовою, яку практикували.
