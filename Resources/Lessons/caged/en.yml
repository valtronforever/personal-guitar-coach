learningTasks:
  question:
    title: What do the CAGED letters name?
    body: All five families in this lesson use the same displayed harmonic root. Why do their names differ?
    items:
      families: The letters name reference shapes; different voicings can keep the same harmony.
      keys: Each letter requires changing to a new concert-pitch chord.
      bass: Every fragment must begin with the harmonic root as its lowest note.
    explanation: >-
      CAGED labels fingerboard families. Their root positions let you place each family in the same harmony. Octave
      placement, doubled tones and the lowest sounding chord tone may change without changing the triad.
  review:
    title: Check the full chord yourself
    body: Mark only what you actually tried.
    items:
      roots: I found the shared string-5 root in C/A and the shared string-6 root in G/E.
      fourth: I connected the string-4 octave root in E to the lowest note of D.
      fragment: I tried the upper G-family fragment without forcing the complete map into one grip.
      harmony: I distinguished the unchanged harmonic root from changing bass or top voices.
