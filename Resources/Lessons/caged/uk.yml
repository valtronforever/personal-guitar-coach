lessonID: caged
lessonVersion: 1
locale: uk
title: 'CAGED: зв’яжіть п’ять мажорних форм'
summary: Простежте одну мажорну гармонію через п’ять вихідних форм і поєднайте ділянки грифа зручними фрагментами.
goal: >-
  Знаходити повторення основного тону та звуків акорду у формах C–A–G–E–D, не плутаючи назву форми зі звучним акордом.
body: |-
  CAGED — послідовна карта п’яти знайомих мажорних форм: C, A, G, E та D. Літери називають вихідні аплікатури. Вони не вимагають п’яти різних звучних акордів. У цьому уроці гармонія залишається, а розташування голосів і ділянка грифа змінюються. Читайте поточний основний тон в активності; обраний стандартний стрій транспонує приклади разом, а Drop адаптує контакт шостої струни.

  Почніть із форми C біля верхнього поріжка. Знайдіть найнижчий основний тон на струні 5, потім вищий — на струні 2. Наступна форма A має той самий основний тон на струні 5, у вихідній аплікатурі на ладу 3. Верхні ноти розташовані інакше. Виконайте обидві перевірки по струнах і почуйте спільний мажорний характер, хоча верхня нота змінюється. Це різні розташування голосів однієї гармонії, а не точні копії висот, перенесені на інші струни.

  Карта форми G охоплює наступну ділянку. Знайдіть повторення основного тону на струнах 6, 3 і 1. Розгляньте повну карту, але не намагайтеся будь-що затиснути її всю: оцінюваний приклад використовує лише струни 4–1. Його найнижчий звук — квінта, хоча основний тон акорду залишається. Це корисний фрагмент карти, а не інша родина акордів. У Drop бас повної карти може бути далі від внутрішніх нот; фрагмент дозволяє уникнути такого розтягнення.

  Форма E має спільний із картою G основний тон на струні 6, у вихідній формі на ладу 8. Порівняйте внутрішні терції та квінти, потім знайдіть октавний основний тон на струні 4. Ця нота на ладу 10 стає найнижчою у формі D. Форма D використовує лише чотири струни й лежить у вищому регістрі, але класи висот залишаються тими самими: основний тон, велика терція та чиста квінта. Обирайте показане часткове розташування замість обов’язкової гри всіх шести струн.

  Після п’яти форм послідовність повторюється на октаву вище, якщо вистачає грифа. Не потрібно одразу опановувати всі повні аплікатури. Спочатку впізнавайте основні тони та невеликі групи звуків акорду, потім поєднуйте сусідні ділянки. Повільно пройдіть C→A, фрагмент G→E та E→D; обирайте кроки, порівнюйте позначки й називайте незмінний основний тон.

  У ритмічних перевірках грайте по одній струні на клік і зупиняйте попередній звук. Поза оцінюваною практикою спробуйте зручні повні або часткові форми й порівняйте їхнє забарвлення. Бал за окремі ноти не доводить утримання повної аплікатури. Мета — зв’язана карта гармонії, а не витривалість у найширшій формі.
steps:
  prepare:
    title: Одна гармонія, п’ять вихідних форм
    body: >-
      Виберіть чистий звук і знайдіть показаний основний тон. У кожній формі відокремлюйте її літеру від акорду,
      який чуєте. Дотримуйтеся адаптованих позначок, особливо на струні 6 у Drop.
  review:
    title: Поєднайте сусідні ділянки
    body: >-
      Без таймера порівняйте C→A, фрагмент G→E та E→D. До гри знайдіть спільний основний тон або його октаву. Використовуйте
      лише зручні фрагменти й визначте зміну верхнього голосу при незмінній гармонії.
  c-family-shape:
    title: 'Форма C: основні тони біля поріжка'
    body: >-
      Основний тон акорду — {{root}}. Знайдіть його на струні 5 та октаву на струні 2. У вихідній формі струни 3
      і 1 відкриті, а струна 6 мовчить. Перевірте {{positions}} і запам’ятайте верхній звук для порівняння з формою
      A.
  c-family-notes:
    title: '{{root}} мажорний — форма C (перевірка струн)'
    body: >-
      Грайте показані струни знизу вгору по одній на клік на 50 BPM. Зупиняйте попередній звук перед наступною атакою,
      потім відрахуйте записані паузи до завершення двох тактів. Використовуйте показану повну або часткову форму;
      бал перевіряє окремі висоти й час, а не утримання акордової аплікатури. {{positions}}.
  a-family-shape:
    title: 'Форма A: збережіть основний тон на струні 5'
    body: >-
      Основний тон акорду — {{root}}. Він залишається на тому самому ладу струни 5, що й у попередній формі C; верхні
      голоси змінюються. Залиште струну 6 тихою й порівняйте нову верхню ноту. {{positions}}.
  a-family-notes:
    title: '{{root}} мажорний — форма A (перевірка струн)'
    body: >-
      Грайте показані струни знизу вгору по одній на клік на 50 BPM. Зупиняйте попередній звук перед наступною атакою,
      потім відрахуйте записані паузи до завершення двох тактів. Використовуйте показану повну або часткову форму;
      бал перевіряє окремі висоти й час, а не утримання акордової аплікатури. {{positions}}.
  g-family-map-shape:
    title: 'Форма G: розгляньте повну карту'
    body: >-
      Основний тон акорду — {{root}}. Знайдіть його повторення на струнах 6, 3 і 1. {{positions}}. Повна карта потрібна
      для орієнтації; не затискайте широку форму через силу. Наступна активність використовує для практики її верхні
      чотири струни. Карта показує послідовні цільові ноти, а не обов’язкову одночасну аплікатуру; попереднє прослуховування
      озвучує їх окремо.
  g-family-fragment-shape:
    title: Використайте верхній фрагмент форми G
    body: >-
      Основний тон акорду залишається {{root}}, хоча найнижчий звучний звук — його квінта. Грайте лише струни 4–1,
      залишаючи струни 6 і 5 тихими. Основні тони лежать усередині та вгорі фрагмента: {{positions}}. Це зручна
      частина попередньої карти.
  g-family-fragment-notes:
    title: '{{root}} мажорний — фрагмент форми G (перевірка струн)'
    body: >-
      Грайте показані струни знизу вгору по одній на клік на 50 BPM. Зупиняйте попередній звук перед наступною атакою,
      потім відрахуйте записані паузи до завершення двох тактів. Використовуйте показану повну або часткову форму;
      бал перевіряє окремі висоти й час, а не утримання акордової аплікатури. {{positions}}.
  e-family-shape:
    title: 'Форма E: спільний основний тон на струні 6'
    body: >-
      Основний тон акорду — {{root}}. Порівняйте ноту струни 6 з картою G, потім знайдіть її октаву на струні 4.
      Внутрішнє розташування змінюється на форму E. Дотримуйтеся {{positions}}; Drop може змінити басову позицію
      й прибрати вихідні підказки пальців.
  e-family-notes:
    title: '{{root}} мажорний — форма E (перевірка струн)'
    body: >-
      Грайте показані струни знизу вгору по одній на клік на 50 BPM. Зупиняйте попередній звук перед наступною атакою,
      потім відрахуйте записані паузи до завершення двох тактів. Використовуйте показану повну або часткову форму;
      бал перевіряє окремі висоти й час, а не утримання акордової аплікатури. {{positions}}.
  d-family-shape:
    title: 'Форма D: основний тон на струні 4'
    body: >-
      Основний тон акорду — {{root}}. Нота струни 4 збігається з відповідною октавою у формі E. Грайте лише струни
      4–1, залишаючи басові струни тихими. {{positions}}. Почуйте вищий регістр зі збереженням тієї самої мажорної
      гармонії.
  d-family-notes:
    title: '{{root}} мажорний — форма D (перевірка струн)'
    body: >-
      Грайте показані струни знизу вгору по одній на клік на 50 BPM. Зупиняйте попередній звук перед наступною атакою,
      потім відрахуйте записані паузи до завершення двох тактів. Використовуйте показану повну або часткову форму;
      бал перевіряє окремі висоти й час, а не утримання акордової аплікатури. {{positions}}.
  question:
    title: Що називають літери CAGED?
    body: Порівняйте ролі звуків акорду перед відповіддю.
