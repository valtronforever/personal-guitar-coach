learningTasks:
  question:
    title: Що називають літери CAGED?
    body: Усі п’ять форм цього уроку мають той самий показаний основний тон. Чому їхні назви різняться?
    items:
      families: Літери називають вихідні форми; різні розташування голосів можуть зберігати гармонію.
      keys: Кожна літера вимагає переходу до нового звучного акорду.
      bass: Кожний фрагмент обов’язково має починатися основним тоном у найнижчому голосі.
    explanation: >-
      CAGED позначає родини аплікатур на грифі. Позиції основного тону дозволяють розмістити їх у межах однієї гармонії.
      Октави, подвоєння та найнижчий звук можуть змінюватися без зміни тризвуку.
  review:
    title: Самостійно перевірте повний акорд
    body: Позначте лише те, що справді перевірили.
    items:
      roots: Я знайшов спільний основний тон на струні 5 у C/A та на струні 6 у G/E.
      fourth: Я пов’язав октавний основний тон на струні 4 у E з найнижчою нотою D.
      fragment: Я спробував верхній фрагмент G, не затискаючи повну карту через силу.
      harmony: Я відокремив незмінний основний тон від змін басового й верхнього голосів.
