lessonID: pull-offs
lessonVersion: 1
locale: uk
title: 'Pull-off: дайте нижчій ноті зазвучати'
summary: Підготуйте нижчу затиснуту ноту, чисто перейдіть до неї, потім спробуйте відкриті завершення й низхідну
  фразу.
goal: Отримувати нижчу ціль у записаний час, зберігаючи тишу сусідніх струн.
body: |-
  Pull-off поєднує вищу ноту, що звучить, із нижчою на тій самій струні. Нижчу ноту може вже тримати інший палець або нею може бути відкрита струна. У TAB літера p поєднує два номери ладів. Один раз вдарте по вищій ноті, потім рукою на грифі озвучте нижчу, коли вищий палець залишає струну.

  Почніть із двох затиснутих нот. Підготуйте нижчий палець до удару по вищій ноті. Для відстані у два лади вказівний і безіменний — корисний початковий варіант, але положення має бути зручним. Озвучте вищу ноту на долі 1. На долі 2 зніміть вищий палець невеликим контрольованим рухом, який надає струні достатньо енергії для продовження звуку на нижчому ладу. Стабільно тримайте нижчий палець на долях 2 і 3 та приглушіть на долі 4.

  Просте підняття прямо від грифа може залишити слабку нижчу ноту; надмірний рух убік може підтягнути струну або зачепити сусідню. Дослідіть невеликий рух із легким тиском замість великого бокового ривка. Знімайте палець компактно й зупиніться, якщо рука напружується. Слухайте потрібну нижчу висоту, а не лише гучний клац пальця. Окремо вдарте по нижчій ноті, щоб встановити її чистий звук до порівняння зі з’єднаним варіантом.

  Вправа на відкритій струні прибирає нижчий палець. Коли вищий залишив струну, не торкайтеся її знову, випадково зупиняючи відкриту ноту. Водночас тримайте сусідні струни приглушеними. Ця вправа залишається у вихідній відкритій позиції: перенесення в затиснуту пару змінило б підготовку, якої вона навчає.

  Завершальна чотиритактова фраза спускається парами на тон і однією парою на півтон. Знайдіть обидва лади до кожної першої атаки. Читайте наперед на долі 4, підготуйте наступний нижчий палець і починайте новий такт новим ударом медіатора. Затиснуті вправи також можна переносити до дозволених ділянок, зберігаючи обидві звукові цілі. Зміна строю може перейменувати ноти, не змінюючи інтервал pull-off.

  Окремо перегляньте покриття початкової й цільової висоти. Якщо початкова нота правильна, а ціль ні, перевірте нижчий лад і послухайте знову. За самою висотою додаток не визначає, чи підняли ви конкретний палець, не підготували його або зачепили сусідню струну. Він вимірює час першої атаки та чутні фази навколо зміни, але не звітує про точний час другої атаки. Рух руки й відсутність повторного удару перевірте самостійно. Зберігайте чистий тембр і повільний темп, поки нижча нота не стане чіткою без зайвого напруження.
steps:
  prepare:
    title: Підготуйте нижчу ноту до удару
    body: >-
      Спочатку поставте нижчий палець, потім вищий на тій самій струні. Один раз вдарте по вищій ноті й невеликим
      контрольованим зняттям озвучте нижчу. Спершу окремо почуйте обидві цілі.
  review:
    title: Послухайте нижчу ноту після зняття
    body: >-
      Перегляньте початкову й цільову фази. Перевірте, чи залишилася нижча висота чіткою, а сусідні струни — тихими.
      Підготовку пальців і відсутність повторного удару підтвердьте самостійно.
  question:
    title: Що слід підготувати спочатку?
    body: Врахуйте заданий рух, а не лише кінцеву висоту.
  fretted-pair:
    title: Pull-off до підготовленого нижчого ладу
    body: >-
      Вдарте на долі 1. Отримайте ціль рукою на грифі на долі 2, тримайте її до кінця долі 3 й залиште долю 4 тихою.
      Повторюйте з новим початковим ударом у кожному такті. Почніть із 60 BPM. Цілі у вашому строї: {{sequence}}.
      Позиції: {{positions}}.
  open-string:
    title: Pull-off до відкритої струни
    body: >-
      Вдарте на долі 1. Отримайте ціль рукою на грифі на долі 2, тримайте її до кінця долі 3 й залиште долю 4 тихою.
      Повторюйте з новим початковим ударом у кожному такті. Почніть із 60 BPM. Цілі у вашому строї: {{sequence}}.
      Позиції: {{positions}}. Збережіть підготовку на відкритій струні у вихідній позиції.
  legato-phrase:
    title: Низхідна фраза легато
    body: >-
      Вдарте на долі 1. Отримайте ціль рукою на грифі на долі 2, тримайте її до кінця долі 3 й залиште долю 4 тихою.
      Повторюйте з новим початковим ударом у кожному такті. Почніть із 60 BPM. Цілі у вашому строї: {{sequence}}.
      Позиції: {{positions}}.
