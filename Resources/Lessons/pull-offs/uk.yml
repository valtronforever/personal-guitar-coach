learningTasks:
  question:
    title: Що слід підготувати спочатку?
    body: Що потрібно підготувати до pull-off на іншу затиснуту ноту?
    items:
      lower: Нижчий палець на цільовому ладу тієї самої струни.
      lift: Обидва підняті пальці, щоб струна завжди була відкритою.
      pick: Сильний другий удар медіатором по цільовій ноті.
    explanation: >-
      Підготовлений нижчий палець дозволяє цільовому ладу звучати після зняття вищого. Завершення на відкритій струні
      — інший випадок. Аудіовимірювання не доводить підготовку пальців.
  review:
    title: Самостійно перевірте фізичну техніку
    body: 'Позначте лише те, що справді попрактикували: оцінка висоти не підтверджує цих рухів.'
    items:
      prepare: Я готував нижчий палець до кожного затиснутого pull-off.
      release: Я використовував компактне зняття й слухав потрібну нижчу висоту.
      open: Я давав відкритим завершенням звучати без повторного дотику.
      quiet: Я тримав інші струни тихими й використовував долю 4 для розслаблення та читання наперед.
