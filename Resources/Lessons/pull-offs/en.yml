learningTasks:
  question:
    title: What must be ready first?
    body: Before a pull-off to another fretted note, what should be prepared?
    items:
      lower: The lower finger at the destination fret on the same string.
      lift: Both fingers lifted so the string is always open.
      pick: A strong second pick stroke on the destination note.
    explanation: >-
      Preparing the lower finger allows the target fret to sound when the higher finger leaves. An open-string ending
      is a different case. The audio measurement cannot prove finger preparation.
  review:
    title: Observe the physical technique yourself
    body: Mark only what you actually practiced; the pitch score does not confirm these gestures.
    items:
      prepare: I prepared the lower finger before each fretted pull-off.
      release: I used a compact release and listened for the intended lower pitch.
      open: I let open-string endings ring without touching the string again.
      quiet: I kept other strings quiet and used beat 4 to relax and read ahead.
