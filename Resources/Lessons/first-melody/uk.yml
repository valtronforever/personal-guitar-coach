lessonID: first-melody
lessonVersion: 1
locale: uk
title: Перша мелодія
summary: Вивчіть чотиритактову мелодію на двох струнах двома фразами.
goal: Вивчіть чотиритактову мелодію на двох струнах двома фразами.
body: >-
  Цей авторський етюд містить висхідне запитання й відповідь із поверненням. Інтервали та тональні зв’язки зберігаються,
  коли вибраний стрій транспонує його. Почніть із 60 BPM або використайте 40–50 BPM, щоб мати більше часу на переходи
  між струнами.
steps:
  listen:
    title: Почуйте форму мелодії
    body: >-
      Один раз послухайте без гри. Помітьте тишу наприкінці кожного з перших двох тактів і довшу відповідь в останніх
      двох тактах. За потреби наспівайте напрямок фрази; точність співу тут не перевіряється.
  question:
    title: Зберіть першу фразу
    body: >-
      Зіграйте лише такти 1–2. Почніть на струні 2, підніміться на струну 1 й поверніться. Четверту долю кожного
      такту залишайте тихою. Називайте наступну позицію перед перенесенням медіатора. {{positions}}
  answer:
    title: Зберіть відповідь
    body: >-
      Зіграйте такти 3–4 як одну зв’язну фразу. Найвища нота з’являється на початку, потім мелодія спускається й
      завершується кроком угору до останньої ноти. Зберігайте пульс на переходах між струнами. {{positions}}
  perform:
    title: Поєднайте чотири такти
    body: >-
      Після відліку зіграйте весь етюд. Якщо один перехід постійно не вдається, повільно відпрацюйте дві ноти навколо
      нього, а потім поверніть їх у фразу. Зробіть одну повну спробу без перезапуску посеред такту. {{positions}}
  review:
    title: Оберіть наступний повтор
    body: >-
      Порівняйте дві фрази: який вступ, пауза чи перехід потребує уваги? Використовуйте відгук подій для чутних
      помилок висоти й часу, а власний слух — для зупинок і форми мелодії. Повторіть визначений такт замість негайного
      прискорення.
activities:
  example:
    title: Приклад для вашого інструменту
    body: >-
      Очікувана послідовність: {{sequence}}. Виберіть крок, щоб побачити його позиції. У прикладі звучать синтезовані
      еталонні ноти.
learningTasks:
  review:
    title: Перевірте свою практику
    body: Позначайте лише те, що перевірили самостійно. Поверніться до непозначеного пункту на наступному занятті.
    items:
      criterion-1: Я можу окремо зіграти кожну двотактову фразу.
      criterion-2: Я залишав тишу наприкінці перших двох тактів.
      criterion-3: Я завершив повну спробу й обрав конкретне місце для покращення.
