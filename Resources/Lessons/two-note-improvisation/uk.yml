lessonID: two-note-improvisation
lessonVersion: 1
locale: uk
title: Створи мотив із двох-трьох нот
summary: Використай повторення, ритм і тишу перед додаванням нових висот.
goal: Створи впізнавану коротку ідею та зміни одну рису, зберігши її характер.
body: |-
  Імпровізація не потребує великої кількості нот. Мотив — це невелика ідея, яку слухач упізнає при поверненні. Уже дві висоти дають вибір порядку, ритму, тривалості й тиші. Обмеження набору звуків допомагає почути ці рішення та не дозволяє формі гами визначати кожну фразу замість тебе.

  Спочатку послухай початковий мотив. Він використовує основний звук і малу терцію, а потім залишає цілий такт порожнім. Скопіюй його, доки можеш пригадати ритм без стеження за кожною нотою. У власній версії збережи дві висоти, але обери інше розташування атак. Залиш достатньо простору, щоб почути результат. Це зразок для порівняння, а не обов’язкова відповідь у тесті з автоматичною оцінкою імпровізації.

  Модель зі зміною ритму зберігає набір висот, але інакше повторює першу ноту. Порівняй обидва приклади в однаковому темпі. Поміть, що залишилося впізнаваним, а що змінилося. Тепер вигадай варіант, змінивши лише ритм, і повернися до початкового мотиву. Не змінюй одночасно порядок нот, ритм, регістр і гучність: так зникне зрозуміле порівняння.

  Для самостійної практики залиш метроном і зменш гучність еталонного тону в налаштуваннях відтворення. Увімкни повторення двох тактів. Зіграй ідею в першому такті, а другий залиш тихим. У наступному циклі повтори ідею точно, а ще через цикл зміни одну деталь. Рахуй у тихому такті й починай свідомо замість заповнення кожного проміжку зайвими нотами.

  Третя модель додає четвертий ступінь до того самого мінорного набору. Нехай нова висота створить один помітний момент, після якого повернися до основного звуку. Додаткові ноти мають служити фразі, а не замінювати її. Створи дві версії власного мотиву: з двома та з трьома висотами. Порівняй, чи додатковий звук підсилив ідею. Зупинися, коли фраза має зрозуміле завершення, навіть якщо можеш далі рухатися гамою.

  У самоперевірці відзначай рішення, які справді почув: повторений ритм, обрану зміну й повну тишу. Числової оцінки творчості тут немає. Синтезовані приклади пояснюють висоти й музичний час, а не гітарну виразність. Стрій транспонує набір звуків; дозволене перенесення позиції зберігає висоти звучання. В обох випадках послухай модель ще раз перед оцінкою власного контрасту.
steps:
  prepare:
    title: Обери невелику музичну ідею
    body: Прочитай план, обери зручний чистий звук і почни повільно.
  seed:
    title: Дві висоти, потім тиша
    body: 'Центр: {{root}} мінор. Скопіюй перший такт, потім рахуй у тихому другому такті. Використай цей простір,
      щоб пригадати мотив. Ноти звучання: {{sequence}}. Показана аплікатура — орієнтир; звук не доводить використання
      струни чи пальця.'
  rhythm-change:
    title: Зміни ритм, збережи набір звуків
    body: 'Порівняй повторення першої ноти й ранішу тишу з початковим мотивом. Вигадай інший ритм лише з цими двома
      висотами. Ноти звучання: {{sequence}}. Показана аплікатура — орієнтир; звук не доводить використання струни
      чи пальця.'
  third-pitch:
    title: Додай одну нову висоту з метою
    body: 'Четвертий ступінь розширює ідею перед поверненням. Порівняй власні версії мотиву з двома й трьома висотами.
      Ноти звучання: {{sequence}}. Показана аплікатура — орієнтир; звук не доводить використання струни чи пальця.'
  make-your-motif:
    title: Вигадай, повтори, зміни
    body: 'Зіграй чотири двотактові цикли: ідея, точне повторення, один варіант, повернення. У циклі початкового
      мотиву зберігай цілий тихий такт. Перевір кожне рішення на слух.'
