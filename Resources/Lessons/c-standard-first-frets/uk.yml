lessonID: c-standard-first-frets
lessonVersion: 1
locale: uk
title: Твої перші лади · C Standard
summary: Рухайся по низькій струні C на один лад і повертайся назад.
goal: Зіграй C2–D♭2–D2–E♭2 і повернися назад на одній струні з новою атакою на кожну долю.
body: |-
  Цей урок належить до курсу C Standard. Для підготовки вибирай уроки з позначкою C Standard.

  Перед початком: пройди урок відкритих струн і налаштуй усі шість струн у стрій C Standard, A4 = 440 Гц.

  Кожен наступний лад підвищує ноту на півтон. На струні 6 лади 0, 1, 2, 3 дають C2, D♭2, D2, E♭2. Знак ♭ означає бемоль: на півтон нижче за названу натуральну ноту. Хроматична послідовність рухається по півтону.

  Став кінчик пальця близько до потрібного металевого ладу з боку головки грифа й натискай лише настільки, щоб нота звучала чітко. Орієнтир: вказівний палець для ладу 1, середній для 2, безіменний для 3. Це підказки, а не розпізнані додатком пальці. Зупиняй попередню ноту перед наступною атакою.

  Почни на 60 BPM: одна нота на кожен клік. Якщо зміна ладів квапить, обери 40–50 BPM. Після кількох зручних повторів у тому самому темпі спробуй 70 BPM як нові умови практики. У результаті переглянь висоту або пропуски атак і підготуй рекомендований фрагмент.
steps:
  open-start:
    title: 1. Почни з відкритої C2
    body: Зіграй струну 6 без затискання ладу. Цифра 0 у табулатурі означає відкриту струну.
  first-fret:
    title: 2. Знайди D♭2 на ладі 1
    body: >-
      Затисни струну 6 близько до ладу 1 та зіграй її. Між C2 і D♭2 вже один півтон; додаткового ладу між ними немає.
  climb:
    title: 3. Піднімися до D2 та E♭2
    body: Зіграй лади 1, 2, 3 на долі 2, 3, 4. Кожна записана нота потребує нового щипка.
  return:
    title: 4. Повернися до відкритої струни
    body: >-
      У такті 2 зіграй лади 3, 2, 1, 0. Знову зіграй лад 3 на долю 1: це нова атака, хоча попередній такт завершився
      тією самою висотою.
  two-bars:
    title: 5. Об’єднай два такти
    body: 'Двічі відлічи чотири долі: 0–1–2–3, потім 3–2–1–0. Вибери практику й підтвердь фізичний стрій перед початком.'
