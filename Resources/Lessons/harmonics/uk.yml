learningTasks:
  harmonic-check:
    title: Відокрем чутний результат від техніки дотику
    body: Повтори повільно й познач лише власні фізичні спостереження. Правильна висота сама по собі не підтверджує
      ці дії.
    items:
      light: Я легко торкався вузла замість затискання ладу натурального флажолета.
      release: Я прибирав дотик після початку, не зупиняючи потрібну струну.
      base: Я залишав основу затиснутою під час штучної октави.
      quiet: Я слухав інші струни, що дзвеніли, й контролював їх.
  node-quiz:
    title: Що означає лад у дужках?
    body: Яке співвідношення висоти потрібне для натуральної третьої гармоніки біля сьомого ладу?
    items:
      partial: 'Приблизно потрійна частота відкритої струни: октава й квінта.'
      fret: Звичайна затиснута нота на сім півтонів вище відкритої струни.
      octave: Завжди рівно одна октава незалежно від вузла.
    explanation: Вузол виділяє третю гармоніку; ціль — частота відкритої струни ×3. Лад є фізичним орієнтиром, а
      не розрахунком затиснутої ноти.
