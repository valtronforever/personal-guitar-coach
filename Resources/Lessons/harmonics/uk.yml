lessonID: harmonics
lessonVersion: 1
locale: uk
title: Знайди натуральні й штучні флажолети
summary: Відокрем вузол легкого дотику від затиснутого ладу й слухай потрібну вищу висоту.
goal: Зіграй обрані натуральні гармоніки й штучну октаву з дотиком, пояснивши висоту звучання та ролі рук.
body: |-
  Флажолет із легким дотиком виділяє коливання, вузол яких розташований у місці контакту. Ти не вкорочуєш струну притисканням до цього ладу. Тому число в кутових дужках — орієнтир дотику, а не звичайна висота затиснутої ноти. Почни з чистого звуку, зручного щипка й однієї струни, що звучить. Приглуши інші настільки, щоб почути висоту після дотику.

  Для натуральної октави легко торкнися біля дванадцятого ладу, щипни подалі від вузла й підніми палець дотику після початку ноти. Зайвий тиск дає затиснуту ноту; надмірне глушіння може майже прибрати звук. За потреби трохи змісти дотик замість сильнішого натискання. Ладовий поріжок — корисний орієнтир, але налаштування реальної струни може трохи змістити найкраще місце. Повтори на вказаних середніх струнах перед нижнім набором.

  Три натуральні орієнтири дають різні висоти. Біля дванадцятого ладу друга гармоніка звучить на октаву вище відкритої струни. Біля сьомого третя гармоніка — приблизно на октаву й квінту вище. Біля п’ятого четверта гармоніка — на дві октави вище. Третя приблизно на два центи вища за найближчу рівномірно темперовану назву; додаток бере ціллю ідеальну частоту гармоніки. Не прибирай цю малу різницю переналаштуванням, сприймаючи вузол як звичайну затиснуту ноту.

  Для штучної октави з дотиком звичайно затисни опорний лад без дужок і легко торкнися на дванадцять ладів вище рукою звуковидобування. Щипни іншим доступним пальцем або зручним поєднанням медіатора й пальця, потім прибери дотик, залишивши затиснуту основу. Порівняй звичайну опорну ноту зі штучною октавою. Урок навчає свідомого октавного дотику; він не стверджує навчання чи розпізнавання кожного pinch-контакту біля бриджу.

  Натуральні вузли лишаються на фізичних орієнтирах після зміни строю, тому висоти слідують кожній відкритій струні, включно зі зниженою шостою. Штучним прикладам потрібне місце для основи й дотику; необов’язкова активність перенесення пропонує лише ділянки, які вміщуються в налаштований гриф. Читай N.H. і A.H. у TAB та ромбові ноти звучання на нотному стані. Висота, доступний таймінг і спеціально ввімкнена перевірка утримання описують чутний результат. Вони не доводять, який палець торкнувся струни й чи звук отримано флажолетним прийомом. Для цього використовуй окрему самоперевірку.
steps:
  prepare:
    title: Підготуй чітку окрему струну
    body: Налаштуй інструмент і почни чисто та повільно. Читай кутові дужки як легкі дотики; показані назви нот
      є цілями звучання.
  natural-octaves:
    title: Торкнися натуральної октави
    body: 'Легко торкнися біля дванадцятого ладу на кожній вказаній струні. Утримуй ноту дві долі; ця активність
      явно перевіряє чутне утримання висоти разом із початковою нотою. Послідовність звучання: {{sequence}}. Фізичні
      вказівки: {{positions}}.'
  natural-partials:
    title: Порівняй три гармоніки однієї струни
    body: 'Залишайся на четвертій струні й порівняй октаву, третю гармоніку та подвійну октаву. Сьомий лад — місце
      дотику, а не звичайна затиснута висота. Послідовність звучання: {{sequence}}. Фізичні вказівки: {{positions}}.'
  natural-bass:
    title: Стеж за фактичним строєм відкритих струн
    body: 'Збережи октавний вузол на кожній нижній струні. У Drop ціль шостої струни слідує її зниженій відкритій
      висоті; дотик лишається біля дванадцятого ладу. Послідовність звучання: {{sequence}}. Фізичні вказівки: {{positions}}.'
  artificial-octave:
    title: Порівняй основу з октавою через дотик
    body: 'Чергуй звичайну затиснуту основу та її штучну октаву. Для A.H. залиш основу затиснутою, торкаючись вузла
      в дужках на дванадцять ладів вище. Послідовність звучання: {{sequence}}. Фізичні вказівки: {{positions}}.'
  artificial-line:
    title: Рухай основу й дотик разом
    body: 'Переміщуй цілі обох рук на однакову кількість ладів. Дотик лишається на дванадцять ладів вище основи;
      всі початкові цілі вміщуються в дев’ятнадцятиладовий гриф. Послідовність звучання: {{sequence}}. Фізичні вказівки:
      {{positions}}.'
  artificial-region:
    title: Збережи октаву в іншій доступній ділянці
    body: 'Спробуй доступну ділянку зі збереженням висоти. Основа на нижчій струні може вимагати дотику далі дев’ятнадцятого
      ладу, тому деякі ділянки зникають на коротших грифах. Вікно пошуку охоплює обидві руки, а не розтяжку пальців
      руки на грифі. Послідовність звучання: {{sequence}}. Фізичні вказівки: {{positions}}.'
  harmonic-check:
    title: Відокрем чутний результат від техніки дотику
    body: Повтори повільно й познач лише власні фізичні спостереження. Правильна висота сама по собі не підтверджує
      ці дії.
  node-quiz:
    title: Що означає лад у дужках?
    body: Яке співвідношення висоти потрібне для натуральної третьої гармоніки біля сьомого ладу?
