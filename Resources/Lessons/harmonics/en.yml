learningTasks:
  harmonic-check:
    title: Separate audible results from touch technique
    body: Repeat slowly and mark only the physical observations you made yourself. A correct pitch alone cannot
      confirm these actions.
    items:
      light: I used a light node touch rather than pressing the natural harmonic fret down.
      release: I released the touch after onset without stopping the intended string.
      base: I retained the stopped base while producing the artificial octave.
      quiet: I listened for other ringing strings and controlled them.
  node-quiz:
    title: What does the bracketed fret mean?
    body: For a natural third partial near fret seven, which pitch relationship is intended?
    items:
      partial: 'Approximately three times the open-string frequency: octave plus fifth.'
      fret: The ordinary stopped note seven semitones above the open string.
      octave: Always exactly one octave, regardless of the node.
    explanation: The node selects the third partial; the target is open frequency ×3. The fret is a physical landmark,
      not the stopped-note calculation.
