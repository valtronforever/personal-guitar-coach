lessonID: down-up-strumming
lessonVersion: 1
locale: uk
title: Базовий бій вниз–вгору
summary: Зберігайте рух руки, змінюючи лише ті проходи, які торкаються струн.
goal: Зіграти рівний двотактовий акомпанемент і не втратити пульс на пропущеному ударі.
body: 'Удар вниз іде від нижчих за звучанням струн до тонших; удар вгору повертається до басових. Позначки ↓ та
  ↑ описують руку з медіатором, а не порядок струн по вертикалі TAB. У звуковому прикладі струни вступають послідовно
  з коротким рознесенням у часі, тому напрям можна почути. Це синтетичний приклад таймінгу, а не запис гітари чи
  зразок вашого тембру.


  Почніть із розслабленого й неглибокого контакту медіатора. Удари вниз тут охоплюють струни 5–1 мінорного акорду,
  а вгору — лише 3–1. Струна 6 мовчить. Менший зворотний удар навмисний: в акомпанементі не обов’язково зачіпати
  всі струни щоразу. Назва акорду змінюється зі строєм; використовуйте поточні позиції.


  Спочатку рахуйте вголос без акорду. Зіграйте з прикладом і метрономом на 50 BPM: повторіть два такти чотири рази,
  потім лишіть тільки метроном. Ці акордові патерни — приклади для самостійної практики. Одноголосний детектор додатка
  не може засвідчити напрям руху чи чистоту цілого акорду.'
steps:
  prepare:
    title: Спочатку налагодьте рух
    body: Підготуйте п’ятиструнну мінорну форму з попереднього уроку акордів. Перевірте кожну потрібну струну, потім
      розслабте руку з медіатором. Слухайте на комфортній гучності; > позначає акцент на першій долі такту.
  down-pulse:
    title: '{{root}} мінорний — рівні удари вниз'
    body: 'Грайте один ↓ на кожен клік: 1, 2, 3, 4. Між кліками повертайте руку вгору, не торкаючись струн. Рух
      невеликий, пульс безперервний. Повторіть обидва такти чотири рази перед наступним кроком. {{positions}}.'
  alternate:
    title: '{{root}} мінорний — додайте зворотний удар'
    body: Рахуйте 1 і 2 і 3 і 4 і. На числа грайте ↓ по струнах 5–1, на кожне «і» — ↑ по струнах 3–1. Тепер звучать
      обидві половини безперервного руху. Тримайте «і» рівно між кліками, не поспішайте вгору. Прослухайте повільно,
      потім зіграйте чотири повторення.
  air-stroke:
    title: Рухайтесь і під час тихого проходу
    body: 'Дотики до струн у такті: ↓, пропуск, ↓, ↑, пропуск, ↑, ↓, ↑. Пройдіть повз струни на «і» після 1 та на долю 3,
      але продовжуйте цикл вниз–вгору. Попередній акорд звучить протягом пропущеного дотику: довша записана нота означає дати йому звучати без нової атаки. Спочатку вимовте
      всі числа та «і», потім зіграйте обидва такти чотири рази.'
  review:
    title: Послухайте рівність акомпанементу
    body: Залиште тільки метроном і чергуйте два такти безперервного бою з двома тактами патерна з пропусками. Якщо
      пульс збивається, поверніться до тихого руху й рахунку. Якщо звучить зайвий бас, зменште глибину удару. Додайте
      5 BPM лише після чотирьох спокійних повторень.
activities:
  down-pulse:
    title: '{{root}} мінорний — четверті вниз'
    body: ↓ означає рух від нижчих до вищих за звучанням струн. Рахуйте чотири долі в такті.
  alternate:
    title: '{{root}} мінорний — восьмі вниз–вгору'
    body: ↓ охоплює п’ять струн, ↑ — три верхні. Рахуйте кожну половину долі.
  air-stroke:
    title: '{{root}} мінорний — сталий рух, вибрані дотики'
    body: Продовжуйте рахунок у довших нотах без додаткової атаки. У двотактовому прикладі патерн повторюється.
learningTasks:
  review:
    title: Самоперевірка акомпанементу
    body: Це ваші спостереження; автоматична оцінка акордів чи руху руки не формується.
    items:
      motion: Я продовжував рух руки на пропущених ударах.
      pulse: Я виконав чотири двотактові повторення без зупинки пульсу.
      strings: Нижня струна мовчала, а удари вгору зачіпали лише потрібні верхні струни.
      gap: «І» лишалось посередині між кліками, коли я залишив тільки метроном.
