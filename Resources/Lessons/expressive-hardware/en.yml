learningTasks:
  expressive-test:
    title: Record only actions you performed
    body: Use compatible available equipment. An unchecked hardware item is an honest future task, not a failed
      pitch score.
    items:
      swell: I made a smooth swell and ended it before the rest.
      arm: With a compatible arm I made a small movement and checked the return pitch.
      feedback: I controlled the start and stop of available feedback at a comfortable level.
      restore: I restored the normal clean route and checked tuning.
