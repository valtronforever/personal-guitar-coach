learningTasks:
  expressive-test:
    title: Познач лише виконані дії
    body: Використовуй сумісне доступне обладнання. Непозначений апаратний пункт — чесне майбутнє завдання, а не
      невдала оцінка висоти.
    items:
      swell: Я зробив плавний swell і закінчив перед паузою.
      arm: Із сумісним важелем я зробив малий рух і перевірив повернуту висоту.
      feedback: Я контролював початок і кінець доступного feedback на комфортному рівні.
      restore: Я повернув звичайний чистий тракт і перевірив стрій.
