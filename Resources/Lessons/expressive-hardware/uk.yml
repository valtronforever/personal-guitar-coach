lessonID: expressive-hardware
lessonVersion: 1
locale: uk
title: Формуй ноту після атаки медіатора
summary: Досліди volume swells, сумісний важіль і керований feedback без примусу інструменту.
goal: Свідомо виконай доступні виразні дії й розрізни гучність, рух висоти та feedback.
body: |-
  Volume swell прибирає або пом’якшує початкову атаку підвищенням рівня після збудження струни. Важіль гітарного вібрато змінює натяг і висоту. Акустичний feedback виникає, коли підсилений звук знову збуджує інструмент, підтримуючи петлю. Ці дії не взаємозамінні, а доступність визначає обладнання. Урок дає часові орієнтири й самоспостереження, а не оцінку цих механізмів.

  Почни з орієнтира довгої ноти й чистого моніторингу. Зменш гучність гітари, зіграй ноту, потім плавно підніми гучність протягом перших двох долей і опусти перед паузою. За наявності спробуй педаль гучності. Спочатку освоюй малий діапазон; не губи наступну ноту через потягування до ручки. Гучність перед перевантаженням може змінювати дисторшн, а пізніша — рівень уже обробленого звуку.

  Якщо гітара має сумісний важіль вібрато, прочитай його інструкцію й використовуй невеликий зручний рух. Зіграй опорну висоту, м’яко зміни її та поверни, потім порівняй повернуту висоту з тюнером. Не встановлюй і не тисни важіль на фіксований бридж та не припускай можливість руху вгору для кожного бриджа. Без обладнання вивчи різницю й залиш критерій важеля непозначеним; бенд рукою на грифі — інша дія.

  Feedback — необов’язковий експеримент з обладнанням, а не причина підвищувати гучність до появи петлі. Якщо керований feedback уже доступний на комфортному рівні, перевір початок однієї ноти, коротке утримання й свідому зупинку приглушенням та зменшенням рівня. Спеціальний feedback-ефект дає інший експеримент, але не доводить акустичну петлю. Якщо обидва варіанти недоступні, залиш критерій відкритим. Завершуй кожен експеримент поверненням звичайного чистого входу та перевіркою строю.
steps:
  prepare:
    title: Визнач тракт і початковий звук
    body: Використовуй наявне обладнання з комфортною гучністю. Додаток дає пояснення, часові орієнтири й самоперевірку;
      він не запускає ефекти цього уроку.
  long-note:
    title: Розмісти swell однієї ноти в часі
    body: 'Записана нота — лише орієнтир часу й висоти. Підніми рівень після атаки й заверши перед паузою. Еталон
      не синтезує swell чи рух важеля. Ноти звучання: {{sequence}}. Показана аплікатура — орієнтир; звук не доводить
      використання струни чи пальця.'
  chord-swell:
    title: Спробуй тихий swell акорду
    body: 'Підготуй показаний тризвук, збуди його зі зменшеною гучністю й плавно введи. Акордова фактура та змінна
      гучність — самостійна практика, а не одноголосне оцінювання. Ноти звучання: {{sequence}}. Показана аплікатура
      — орієнтир; звук не доводить використання струни чи пальця.'
  expressive-test:
    title: Познач лише виконані дії
    body: Використовуй сумісне доступне обладнання. Непозначений апаратний пункт — чесне майбутнє завдання, а не
      невдала оцінка висоти.
