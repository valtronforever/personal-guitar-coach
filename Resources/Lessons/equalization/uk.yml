lessonID: equalization
lessonVersion: 1
locale: uk
title: Використовуй EQ з визначеною метою
summary: Порівняй невелику зміну тембру в контексті й залиш її лише для розв’язання проблеми.
goal: Зроби й поясни одну корисну зміну низьких, середніх або високих частот із чесним порівнянням bypass.
body: |-
  Еквалайзер змінює баланс частотних ділянок. Frequency обирає ділянку, gain піднімає чи знижує її, а Q або bandwidth задає ширину дзвоноподібної зміни. Bass, middle і treble — простіший інтерфейс споріднених тембрових змін. Це не незалежні вказівки максимізувати три числа; взаємодія залежить від пристрою. Почни з відомого нейтрального або збереженого налаштування.

  Задай мету до торкання ручки: наприклад, прибрати гул нижнього рисунка, виділити мелодію або пом’якшити різкий край медіатора. Зіграй контрольну фразу через той самий звукознімач, підсилювач і кабінет. Трохи зміни одну широку ділянку, потім поверни початкове налаштування. Запиши, що стало яснішим і яка корисна частина звуку загубилася.

  Для низу слухай початок і завершення нижніх нот, а не лише їх масивність. Для середини порівняй, чи можеш стежити за лінією без підвищення всього сигналу. Для верху відокрем корисну деталь атаки від краю, який відволікає від ноти. Опис залежить від регістру й аранжування; немає однієї правильної частоти або фіксованої EQ-кривої для кожного строю.

  Приблизно вирівняй гучність обробленого й обхідного сигналів, потім порівняй у потрібному музичному контексті. Звук, ефектний окремо, може перекривати іншу партію. EQ перед перевантаженим підсилювачем змінює сигнал, який викликає дисторшн, а після нього формує результат; записуй місце поряд зі значеннями. Залиш найменшу корисну зміну й шлях повернення. EQ не виправляє пропущену ноту й не доводить правильне глушіння струни.
steps:
  prepare:
    title: Визнач тракт і початковий звук
    body: Використовуй наявне обладнання з комфортною гучністю. Додаток дає пояснення, часові орієнтири й самоперевірку;
      він не запускає ефекти цього уроку.
  control:
    title: Використовуй ту саму фразу для порівняння
    body: 'Вивчи цю суху двотактову фразу, потім повтори її через власний звуковий тракт зі зміною одного параметра.
      Зберігай зіставні темп, артикуляцію й гучність прослуховування. Еталон додатка не містить симуляції підсилювача
      чи ефектів. Ноти звучання: {{sequence}}. Показана аплікатура — орієнтир; звук не доводить використання струни
      чи пальця.'
  eq-test:
    title: Обери й обґрунтуй одну зміну
    body: Порівняй невелике зрізання й підсилення в обраній широкій ділянці, повертаючись до нейтрального стану,
      і залиш лише зміну для визначеної мети.
activities:
  control:
    title: Використовуй ту саму фразу для порівняння
    body: 'Вивчи цю суху двотактову фразу, потім повтори її через власний звуковий тракт зі зміною одного параметра.
      Зберігай зіставні темп, артикуляцію й гучність прослуховування. Еталон додатка не містить симуляції підсилювача
      чи ефектів. Ноти звучання: {{sequence}}. Показана аплікатура — орієнтир; звук не доводить використання струни
      чи пальця.'
learningTasks:
  eq-test:
    title: Обери й обґрунтуй одну зміну
    body: Порівняй невелике зрізання й підсилення в обраній широкій ділянці, повертаючись до нейтрального стану,
      і залиш лише зміну для визначеної мети.
    items:
      goal: Я назвав чутну проблему до зміни EQ.
      region: Я порівняв зрізання й підсилення без зміни інших етапів.
      bypass: Я порівняв bypass зі схожою гучністю та в контексті.
      save: Я записав місце EQ, зміну й причину залишити її.
