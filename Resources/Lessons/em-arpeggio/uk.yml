lessonID: em-arpeggio
lessonVersion: 3
locale: uk
title: Мінорний акорд та арпеджіо
summary: Поєднай форму мінорного акорду з окремими нотами вгору й вниз.
goal: Поєднай форму мінорного акорду з арпеджіо вгору та вниз.
body: 'Арпеджіо подає звуки акорду по черзі замість одночасного звучання. Це більше, ніж порядок щипків: ви чуєте,
  як основний тон, мала терція й квінта повторюються в різних регістрах. Спочатку порівняйте приклад цілого акорду
  з початком окремих нот. Музичний матеріал той самий, змінюється спосіб подачі.


  Підготуйте форму акорду й переводьте медіатор між струнами невеликими рухами. Вправа піднімається від баса до
  найвищої цілі один раз, потім спускається без повторення верхньої ноти. Одинадцять атак чвертями займають перші
  одинадцять долей трьох тактів; остання доля — справжня пауза. Продовжуйте рахунок на розвороті, не починайте новий
  пульс із найвищої ноти.


  В оцінюваній практиці зупиняйте попередню струну перед кожним новим щипком. Так одноголосний детектор отримує
  одну висоту за раз. Після вдалої розділеної спроби можна зіграти ту саму форму з накладанням нот як слухову вправу
  без оцінки. Бал за розділену версію не підтверджує чистоту одночасного акорду.


  Почніть із 40–50 BPM, якщо переходи між струнами складні, потім використайте 60. Поточні лади й назви нот залежать
  від строю та вибраної ділянки; огляньте їх перед грою. Оберіть зручний доступний варіант. Додаток не визначає,
  який палець чи фізична струна дали висоту.'
steps:
  shape:
    title: 1. Розглянь форму акорду
    body: 'Ці позиції звучать разом лише в прикладі: {{positions}}. Перевір зручність перед грою; додаток не вимірює
      положення руки.'
  low-notes:
    title: 2. Зіграй перші чотири ноти
    body: Грайте перші чотири цілі по одній на клік. Підготуйте всю форму й знаходьте наступні струни медіатором
      без великих стрибків. Зупиняйте попередню ноту на початку наступної. Якщо ціль неправильна, повторіть цей
      такт перед приєднанням розвороту. {{positions}}.
  top-and-turn:
    title: 3. Дійди до вершини й розвернися
    body: Найвища нота звучить один раз, потім порядок змінюється. Вимовляйте всі чотири долі такту 2; не додавайте
      атаку під час зміни напряму медіатора. Якщо розворот поспішний, уповільніть весь фрагмент. {{positions}}.
  return-and-rest:
    title: 4. Повернися та зроби паузу
    body: 'Поверніться до низької цілі в такті 3, потім зупиніть звук на долю 4. Продовжуйте рахунок у паузі, щоб
      вчасно почати наступне повторення. Порівняйте першу й останню низькі ноти: потрібна висота однакова. {{positions}}.'
  whole-arpeggio:
    title: 5. Попрактикуй повне арпеджіо
    body: 'З’єднайте три такти: одинадцять розділених атак і одна пауза. Зробіть три повні спроби в одному темпі.
      Знайдіть у результаті повторювані помилки висоти чи ранні/пізні атаки й потренуйте найменший цілий такт із
      проблемою. Додайте 5 BPM лише тоді, коли розворот і завершальна пауза залишаються рівними. {{positions}}.'
