learningTasks:
  modal-review:
    title: Порівняй дві барви на одному центрі
    body: Вигадай дві короткі фрази з одним ритмом і тонікою; у другій заміни велику сексту малою.
    items:
      center: Я чув тоніку до та після фрази.
      sixth: Характерна секста з’явилася свідомо.
      compare: Я почув відмінність без зміни ритму чи регістру.
      return: Обидві версії чітко повернулися до одного центру.
