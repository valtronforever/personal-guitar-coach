lessonID: modal-improvisation
lessonVersion: 1
locale: uk
title: 'Лади: почуй центр, потім барву'
summary: Порівняй дорійський лад і натуральний мінор над одним центром.
goal: Створи коротку модальну фразу з чутним характерним шостим ступенем і збереженою тонікою.
body: |-
  Лад сприймається через зв’язок із тональним центром, а не лише через початок знайомої мажорної форми з іншого ладу грифа. Установи центр, повертайся до нього й слухай решту ступенів відносно нього. Тут порівнюються дорійський лад і натуральний мінор з однією тонікою. Обидва мають малу терцію та малу септиму; дорійський має велику сексту там, де натуральний мінор — малу.

  Повільно зіграй обидві гами й порівняй шостий ступінь у тому самому місці підйому. Не проскакуй відмінну ноту лише через знайому аплікатуру. Проспівай або пригадай тоніку перед новим початком, потім почуй сексту як відстань від неї. Конкретні назви звучання змінюються зі строєм, а співвідношення ступенів зберігається.

  Двотактовий педальний приклад дає лише низьку тоніку й пульс. Послухай раз, потім зіграй коротку верхню фразу над повторюваним еталоном. Зроби педаль достатньо чутною для збереження центру, не перекриваючи гітару. Це еталонна самопрактика, а не вимірювана гра з входу: низький еталон тут присутній свідомо. Поєднана модель показує безперервний бас під змінними верхніми нотами; дужки позначають утримувану струну.

  Використай малий дорійський набір перед повним рухом гамою: тоніка, мала терція, квінта й велика секста вже створюють корисний контраст. Розмісти сексту свідомо та повернися до тоніки. Потім заміни її малою секстою й порівняй результат над тією самою педаллю. Збережи ритм і регістр для яснішого сприйняття відмінності.

  Точні одноголосні гама й фраза можуть отримати перевірку висоти й часу. Власна модальна фраза — слухове рішення: правильна гама сама не доводить установлений центр або виразне використання характерної ноти. Заверши двома короткими версіями, дорійською й натурально-мінорною, та опиши місце зміни барви. Не додавай сторонніх акордових змін, доки спільний центр не лишається чітким.
steps:
  prepare:
    title: Обери невелику музичну ідею
    body: Прочитай план, обери зручний чистий звук і почни повільно.
  dorian-scale:
    title: Мала терція, велика секста
    body: 'Центр: {{root}} Dorian. Почуй велику сексту на шостій ноті підйому.'
  natural-minor-comparison:
    title: Зміни лише шостий ступінь
    body: Збережи ту саму тоніку й ритм; шостий ступінь тепер нижчий на півтон.
  tonic-pedal:
    title: Двотактова тонічна педаль
    body: Повторюй низьку тоніку {{root}} як еталон і грай над нею короткі верхні ідеї. Збережи пульс і слухай контраст
      шостого ступеня; автоматичної оцінки немає.
  dorian-phrase:
    title: Зроби сексту частиною фрази
    body: Підіймайся від тоніки через малу терцію й квінту до великої сексти, поверни над нею та прийди додому.
  phrase-over-pedal:
    title: Почуй фразу над одним безперервним центром
    body: Атакуй низьку тоніку раз і збережи її під усіма вісьмома верхніми нотами. Дужки на струні 5 означають
      продовження також через тактову риску.
  modal-review:
    title: Порівняй дві барви на одному центрі
    body: Вигадай дві короткі фрази з одним ритмом і тонікою; у другій заміни велику сексту малою.
