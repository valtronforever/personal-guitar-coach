learningTasks:
  modal-review:
    title: Compare two colors on one center
    body: Invent two short phrases with the same rhythm and tonic; change the major sixth to minor sixth in the
      second.
    items:
      center: I could hear the tonic before and after the phrase.
      sixth: The characteristic sixth appeared deliberately.
      compare: I heard the difference without changing rhythm or register.
      return: Both versions returned clearly to the same center.
