lessonID: fretting-hand-muting
lessonVersion: 1
locale: uk
title: Глушіння рукою на грифі
summary: Відпустіть тиск на ладі, зберігаючи тихий контакт зі струною.
goal: Зупиняти затиснуті павер-акорди на паузах, не відкриваючи струни.
body: 'Затиснута нота потребує достатнього тиску, щоб струна торкалася ладу. Відпускання тиску зі збереженням легкого
  контакту може зупинити ноту. Повне піднімання пальця — інша дія: воно може відкрити струну чи створити pull-off.
  Використовуйте руку на грифі незалежно від боку у вашій орієнтації гри.


  Спробуйте показану квінтову форму на дві струни. Озвучте її, розслабте тиск і залиште достатній контакт для глушіння
  обох струн. Якщо лишається високий флажолет, розширте легкий контакт чи додайте ще один розслаблений палець: одиночний
  дотик біля вузла може не заглушити звук. Не розв’язуйте проблему сильнішим натиском. Відкриті струни потребують
  іншого контакту, часто руки з медіатором.


  Паузи у прикладах означають тишу, а не лише відсутність нового удару. Синтетичний зразок зупиняється на межі ноти.
  Слухайте хвіст справжнього акорду, відкриті струни й шум відпускання. Одночасні акорди та фізичний прийом зупинки
  — самостійна практика без автоматичної оцінки руху руки.'
steps:
  prepare:
    title: Розділіть тиск і контакт
    body: Без метронома чотири рази чергуйте звучну форму й легкий тихий контакт. Перевірте зупинку обох струн.
  release-pressure: &id001
    title: Звук на 1 і 3
    body: Атакуйте на 1 і 3; відпускайте тиск точно на 2 і 4. Рахуйте в тиші. Повторіть два такти тричі на 50 BPM,
      зберігаючи тихий контакт до нової атаки.
  short-changes: &id002
    title: Коротка зупинка перед довшою нотою
    body: У такті восьма на 1, восьма пауза на і, чверть на 2 і дві тихі долі. Зупиніть двічі, а 3–4 використайте
      для зміни форми. Перше відпускання не має перетворюватися на pull-off.
  review:
    title: Слухайте всередині пауз
    body: Якщо струна дзвенить, зупиніть малюнок і знайдіть її окремо. Додайте легкий контакт, потім перевірте один
      такт перед усім маршрутом.
activities:
  release-pressure: *id001
  short-changes: *id002
learningTasks:
  review:
    title: Перевірте цю спробу
    body: Позначте лише те, що перевірили слухом чи спостереженням за руками.
    items:
      rests: Обидва затиснуті звуки зупинялися на позначених паузах.
      open: Відпускання тиску не відкривало ноту чи pull-off.
      count: Я рахував тихі долі й вчасно приходив до наступної форми.
