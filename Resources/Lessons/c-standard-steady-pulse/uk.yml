lessonID: c-standard-steady-pulse
lessonVersion: 1
locale: uk
title: Тримай рівний пульс · C Standard
summary: Повторюй відкриту C2 четвертями, восьмими та з паузами.
goal: Розмісти окремі атаки на записаних долях і півдолях, не втрачаючи рахунку під час пауз.
body: |-
  Цей урок належить до курсу C Standard. Для підготовки вибирай уроки з позначкою C Standard.

  Перед початком: зручно зіграй вправу відкритих струн і налаштуй стрій C Standard, A4 = 440 Гц. Тут граємо лише відкриту струну 6, щоб зосередитися на часі.

  У розмірі 4/4 відлічуй чотири основні долі в такті. Чверть триває одну долю. Дві восьмі ділять долю навпіл: рахуй «1 і 2 і 3 і 4 і». Метроном позначає числа; «і» звучить посередині між кліками. Пауза теж займає записаний час.

  У такті 1 граємо чверті. У такті 2 — восьмі з проміжками. Повторні C2 потребують окремих щипків: нота, що тягнеться, не замінює нову атаку. Не зачіпай інші струни та зупиняй звук під час пауз. Додаток оцінює атаки; повну тишу на паузі також перевіряй слухом.

  Почни на 60 BPM. Спершу проговори ритм, потім зіграй. Для порівняння повторюй у тому самому темпі; коли буде зручно, спробуй 70 BPM. Якщо оцінка ритму недоступна, перевір калібрування в аудіоналаштуваннях: відсутній бал ритму не означає помилку гри.
steps:
  quarter-pulse:
    title: 1. Відлічи такт четвертей
    body: 'Такт 1: грай на 1, пауза на 2, грай на 3 та 4. Усі три ноти — відкрита C2, струна 6.'
  quarter-space:
    title: 2. Рахуй і під час паузи
    body: Доля 2 триває весь проміжок між кліками. Обережно зупини попередній звук і залиш цю долю без нової атаки.
  eighth-pairs:
    title: 3. Поділи перші дві долі
    body: 'Початок такту 2: грай на «1», грай на «і», пауза на «2», грай на «і». Кожна восьма займає половину долі.'
  eighth-spaces:
    title: 4. Залиш проміжки між останніми атаками
    body: >-
      Заверши такт 2: грай на «3», пауза на «і», грай на «4», пауза на «і». Числа в рахунку мають збігатися з кліками.
  whole-pattern:
    title: 5. Зіграй обидва такти
    body: >-
      У повному ритмі очікуються вісім атак. Вибери практику для відліку, а після гри переглянь ранні/пізні атаки,
      пропуски або атаки під час пауз, якщо вхід і вимір часу надійні.
activities:
