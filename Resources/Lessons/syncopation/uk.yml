lessonID: syncopation
lessonVersion: 1
locale: uk
title: Атаки між долями та синкопи
summary: Надайте слабкій частині метра вагу, зберігаючи основний пульс.
goal: Грати атаки між кліками й утримувати ноту через сильнішу долю без повторного удару.
body: |-
  Синкопа робить слабку частину метра помітною. Поширений випадок — атака між кліками, яка продовжується через наступну долю. Очікувана атака на сильнішій долі зміщується або зникає, а основний пульс триває. Щоб почути синкопу, потрібно знати, де доля: випадково запізнена нота не є тією самою музичною вказівкою.

  Почніть із рахунку 1-і-2-і-3-і-4-і. Простукуйте ногою числа, а медіатором грайте кожне і. У першій вправі на кожній долі восьма пауза й восьма нота. Записані акценти виділяють слабкі частини, але їхню силу перевіряйте слухом. Не пересувайте рух ноги чи метроном під ці атаки.

  Приклад утримання починається восьмою паузою, потім чвертю з крапкою на 1-і. Нехай та сама нота звучить через долю 2; зупиніть її на долі 3. Повторіть на 3-і через долю 4. У такті лише два удари медіатором. Нотний стан може поділити тривалість на зв’язані лігою фрагменти для читабельного пульсу. Ліга продовжує один звук, а не просить нової атаки на клік.

  Фінальна двотактова фраза поєднує входи між долями, зміни струн та утримання через тактову риску. Відрахуйте порожню першу половину долі й завчасно прочитайте останнє і такту 1. Ця нота продовжується через першу долю такту 2 та завершується на його другій долі. Далі дві восьмі, чвертна тоніка й фінальна чверть паузи. Рахуйте початок такту 2, навіть коли медіатор там не рухається.

  Використовуйте чистий звук на 60 BPM або повільніше. Автоматична практика зіставляє висоти й час атак; позначені довгі ноти також мають вимірювання утримання. Повторний удар під час записаного утримання може з’явитися як зайва атака. Якщо звук згас завчасно, перегляньте покриття та послухайте перед зміною техніки. Силу акцентів, фактичну аплікатуру й зручність перевіряєте ви, а не оцінка висоти.
steps:
  prepare:
    title: Відокремте пульс від атак
    body: >-
      Рахуйте вісім рівних складів у 4/4, простукуючи лише числа. Потім плескайте або грайте лише на і. Залишайте
      клік опорою, не переозначайте долю під власні атаки.
  offbeat-attacks:
    title: Чотири входи між кліками
    body: >-
      Кожний клік починає восьму паузу; грайте ноту посередині до наступного кліку. Відрахуйте всі чотири долі.
      Знак > позначає бажаний акцент між долями, його силу перевірте слухом.
  hold-over-the-beat:
    title: Дві атаки через сильніші долі
    body: >-
      Грайте на 1-і та 3-і. Першу ноту утримуйте через долю 2, другу — через 4. Не атакуйте повторно зв’язані фрагменти
      нотного стану. На повторі наступний такт знову починається восьмою паузою.
  cross-bar-phrase:
    title: Перенесіть останнє і в наступний такт
    body: >-
      Нота на 4-і такту 1 триває через долю 1 такту 2. Збережіть рахунок тактів і почніть наступні дві восьмі на
      долі 2. Завершіть тонікою на 3 та тишею на 4. {{sequence}}.
  review:
    title: Окремо перевірте місце й продовження
    body: >-
      Перегляньте ранні/пізні атаки між долями, потім покриття позначених утримань. Повільно повторіть перехід через
      тактову риску без нової атаки на сильну долю. Окремо послухайте, чи акцент був свідомим, а не наслідком поспіху.
  question:
    title: Що робити на зв’язаній сильній долі?
    body: Відрахуйте поділ долі перед відповіддю.
activities:
  offbeat-attacks:
    title: Чотири входи між кліками
    body: >-
      Кожний клік починає восьму паузу; грайте ноту посередині до наступного кліку. Відрахуйте всі чотири долі.
      Знак > позначає бажаний акцент між долями, його силу перевірте слухом.
  hold-over-the-beat:
    title: Дві атаки через сильніші долі
    body: >-
      Грайте на 1-і та 3-і. Першу ноту утримуйте через долю 2, другу — через 4. Не атакуйте повторно зв’язані фрагменти
      нотного стану. На повторі наступний такт знову починається восьмою паузою.
  cross-bar-phrase:
    title: Перенесіть останнє і в наступний такт
    body: >-
      Нота на 4-і такту 1 триває через долю 1 такту 2. Збережіть рахунок тактів і почніть наступні дві восьмі на
      долі 2. Завершіть тонікою на 3 та тишею на 4. {{sequence}}.
learningTasks:
  question:
    title: Що робити на зв’язаній сильній долі?
    body: Нота починається на 4-і й лігою продовжується через долю 1 наступного такту. Що робити на цій долі?
    items:
      hold: Продовжувати рахунок і утримувати ноту без нового удару.
      pick: Знову атакувати ноту, бо кожний такт має починатися ударом.
      pause: Перестати рахувати до наступної записаної атаки.
    explanation: >-
      Ліга зберігає одну безперервну ноту, тоді як долі й такти продовжують рахуватися. Відсутність нової атаки
      на сильній долі є частиною записаної синкопи.
  review:
    title: Перевірте свій пульс
    body: Позначте лише власні спостереження.
    items:
      pulse: Я зберіг числову долю незалежно від гри між кліками.
      hold: Я утримував ноту через сильнішу долю без навмисного нового удару.
      accent: Я слухав позначене зміщення акценту окремо від автоматичної оцінки.
