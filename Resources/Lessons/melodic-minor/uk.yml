    body: Порівняй два спуски в одному темпі та вигадай коротку фразу з джазовою формою.
    items:
      third: Я зберіг малу терцію в кожній версії.
      direction: Я міг пояснити зміну шостого й сьомого під час спуску.
      color: Я почув велику септиму в тонічному мінорно-великому арпеджіо.
      phrase: Моя фраза використала характерні ступені та повернулася до тоніки.
