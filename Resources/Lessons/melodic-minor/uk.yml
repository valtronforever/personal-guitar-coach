lessonID: melodic-minor
lessonVersion: 1
locale: uk
title: 'Мелодичний мінор: обери підхід і почуй барву'
summary: Порівняй підвищені шостий і сьомий ступені з натурально-мінорним спуском.
goal: Зіграй два поширені напрямкові підходи й використай барву мінорного акорду з великою септимою у фразі.
body: |-
  Мелодичний мінор зберігає малу терцію, підвищуючи шостий і сьомий ступені відносно натурального мінору. Назви ці зміни перед вивченням нової форми. Порівняно з гармонічним мінором підвищений шостий прибирає трипівтоновий проміжок на шляху до тоніки. Послухай плавнішу верхню частину підйому, не плутаючи гаму з мажором: терція лишається малою.

  Два поширені навчальні підходи потребують чітких назв. Класична напрямкова вправа використовує підвищені шостий і сьомий угору, потім натуральний мінор униз. Джазовий мелодичний мінор зазвичай зберігає підвищені ступені в обох напрямках. Жодна вправа не вимагає від кожної реальної мелодії правила напряму. Читай запитану версію та зберігай її реальні ноти замість автоматичної зміни при повороті вниз.

  Зіграй джазові підйом і спуск окремо, потім порівняй класичне повернення. Верхні два ступені створюють чутну відмінність униз. Збережи один темп і регістр, щоб порівнювати висоти, а не швидкість чи октаву. У вимірюваній практиці припиняй одну ноту перед атакою наступної: довге випадкове накладання перетворює одноголосну підготовку на іншу задачу.

  Тонічне арпеджіо мінорного акорду з великою септимою поєднує основний звук, малу терцію, квінту й велику септиму. Почуй близьке тяжіння септими до верхньої тоніки, потім повернися акордовими звуками. Це корисна тонічна барва в цьому уроці, а не дозвіл застосовувати одну гаму до кожного мінорного акорду. Мінорний септакорд має іншу септиму; гармонічний контекст визначає доречність підвищеної висоти.

  Заверши короткою прикладною фразою та створи варіант зі збереженими малою терцією, великою секстою й прибуттям через ввідний тон. Залиш простір після завершення, щоб почути тоніку як дім. Точні вправи отримують перевірку висоти й часу; вибір підходу, гармонічної барви й форми фрази лишається музичним рішенням. Поясни зіграну версію перед тим, як вважати іншу сексту чи септиму помилкою.
steps:
  prepare:
    title: Обери невелику музичну ідею
    body: Прочитай план, обери зручний чистий звук і почни повільно.
  jazz-ascent:
    title: Підвищ шостий і сьомий, збережи малу терцію
    body: 'Центр: {{root}} melodic minor. Порівняй останні чотири ступені з гармонічним мінором.'
  jazz-descent:
    title: Збережи підвищені ступені униз
    body: Використай той самий джазовий мелодично-мінорний набір у зворотному порядку; не знижуй шостий або сьомий
      лише через зміну напряму.
  classical-return:
    title: Порівняй класичну напрямкову вправу
    body: Підіймайся з підвищеними шостим і сьомим, спускайся натурально-мінорними ступенями й залиш останню долю
      тихою. Це названий напрямковий підхід.
  minor-major-arpeggio:
    title: Почуй тонічну барву мінорного акорду з великою септимою
    body: Зіграй основний звук, малу терцію, квінту й велику септиму вгору та назад, потім утримай тоніку цілий
      такт.
  application-phrase:
    title: Перетвори характерні ступені на фразу
    body: Нехай мала терція встановить характер, дай великій сексті час прозвучати, потім розв’яжи ввідний тон у
      тоніку.
  convention-review:
    title: Назви версію перед порівнянням нот
    body: Порівняй два спуски в одному темпі та вигадай коротку фразу з джазовою формою.
