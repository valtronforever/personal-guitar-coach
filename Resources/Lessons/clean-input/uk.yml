lessonID: clean-input
lessonVersion: 1
locale: uk
title: Чистий вхід і рівень сигналу
summary: Налаштуйте вхідний gain за піками реальної гри та тихими паузами.
goal: Налаштуйте вхідний gain за піками реальної гри та тихими паузами.
body: >-
  Gain визначає сигнал на вході перетворювача, а гучність навушників — рівень прослуховування. Збільшення гучності
  навушників не виправить слабкий записуваний сигнал. Для оцінювання нот використовуйте чистий вхід, а улюблені
  ефекти — у шляху прослуховування.
steps:
  baseline:
    title: Послухайте паузу
    body: >-
      Увімкніть моніторинг входу в налаштуваннях аудіо й на мить залиште гітару тихою. Помітьте рівень шкали, потім
      легко торкніться струн. Це допомагає відрізнити зіграну ноту від фонового шуму, але не є калібруванням шумового
      порога.
  peaks:
    title: Грайте із силою майбутньої практики
    body: >-
      Зіграйте кілька нот із найсильнішою атакою, яку плануєте використовувати. Дивіться на пікове значення під
      час удару, а не лише на затухання. Робочий орієнтир додатка — від −30 до −6 dBFS; залишайте запас до перевантаження.
  adjust:
    title: Змінюйте один регулятор
    body: >-
      Якщо атаки перевантажують вхід, зменште gain інтерфейсу й повторіть ту саму фразу. Якщо атаки слабкі, перед
      підвищенням gain перевірте вхід, інструментальний режим і Volume гітари. Гучність навушників регулюється окремо.
  check:
    title: Повторіть і залиште тишу
    body: >-
      Зіграйте чотири ноти, залиште чотири тихі долі й повторіть. Перевірте, що найсильніша нота не перевантажує
      вхід, а паузу можна відрізнити. Робочий рівень шкали корисний для підготовки, але не гарантує розпізнавання
      кожної ноти.
activities: {}
learningTasks:
  review:
    title: Перевірте свою практику
    body: Позначайте лише те, що перевірили самостійно. Поверніться до непозначеного пункту на наступному занятті.
    items:
      criterion-1: Я перевірив піки під час запланованих найсильніших атак.
      criterion-2: Під час гри немає попередження про перевантаження.
      criterion-3: Я розрізняю вхідний gain і гучність навушників.
  knowledge:
    title: Який регулятор змінює рівень сигналу, що надходить у запис?
    body: Виберіть одну відповідь і порівняйте її з поясненням.
    items:
      answer-1: Гучність навушників
      answer-2: Вхідний gain інтерфейсу
      answer-3: Темп метронома
    explanation: >-
      Вхідний gain впливає на рівень сигналу, що захоплюється. Гучність навушників змінює прослуховування, а темп
      — часовий пульс.
