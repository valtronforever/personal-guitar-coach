learningTasks:
  question:
    title: A common tone with a changing function
    body: The lowest voice remains on the same pitch between the initial I and connected IV. What does that mean?
    items:
      common: One pitch belongs to both chords; the other voices change the harmony.
      same: The entire chord must still be I.
      root: That note must be the root of both chords.
    explanation: >-
      The common note is the root of I but the fifth of IV. A held or repeated pitch can change its chord-tone role
      while other voices establish the next harmony.
  review:
    title: Check the full chord yourself
    body: Mark only what you actually tried.
    items:
      wide: I heard the broad register shifts in the root-position reference.
      common: I located the shared low tone in I→IV and the shared high tone in V→I.
      lines: I practiced all three voices with three sounded beats and a silent fourth beat.
      compare: I compared full triads separately from the graded lines and arpeggio.
