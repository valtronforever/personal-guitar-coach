      такту. Бал перевіряє висоту, час атаки й чутну тривалість, а не збереження контакту пальця. {{sequence}}.
  high-line:
    title: Верхній голос на струні 1
    body: >-
      Тональний центр — {{root}}, мажор. Зіграйте один голос у чотирьох тактах I–IV–V–I на 60 BPM. Атакуйте на першій
      долі, тримайте звук три долі, а четверту залишайте тихою. Повторно атакуйте однакові висоти на початку наступного
      такту. Бал перевіряє висоту, час атаки й чутну тривалість, а не збереження контакту пальця. {{sequence}}.
  connected-arpeggio:
    title: Поєднайте голоси в арпеджіо
    body: >-
      Тональний центр — {{root}}, мажор. У I–IV–V–I грайте нижній, середній і верхній голоси на долях 1–3; долю
      4 залишайте тихою для підготовки наступної форми. Зупиняйте попередні ноти, щоб практика залишалася одноголосною.
      {{sequence}}.
