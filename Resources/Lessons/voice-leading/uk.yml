learningTasks:
  question:
    title: Спільний звук зі зміною функції
    body: Нижній голос залишається на тій самій висоті між початковим I та зв’язаним IV. Що це означає?
    items:
      common: Одна висота належить обом акордам; інші голоси змінюють гармонію.
      same: Увесь акорд обов’язково залишається I.
      root: Ця нота обов’язково є основним тоном обох акордів.
    explanation: >-
      Спільна нота є основним тоном I, але квінтою IV. Утримувана або повторена висота може змінити роль у складі
      акорду, поки інші голоси встановлюють наступну гармонію.
  review:
    title: Самостійно перевірте повний акорд
    body: Позначте лише те, що справді перевірили.
    items:
      wide: Я почув широкі зміни регістру в зразку основних видів.
      common: Я знайшов спільний нижній звук у I→IV і спільний верхній у V→I.
      lines: Я попрактикував усі три голоси з трьома звучними долями й тихою четвертою.
      compare: Я порівняв повні тризвуки окремо від оцінюваних ліній та арпеджіо.
