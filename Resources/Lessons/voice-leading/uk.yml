lessonID: voice-leading
lessonVersion: 1
locale: uk
title: 'Голосоведення: стежте за лініями крізь акорди'
summary: >-
  Порівняйте широкі стрибки основних видів зі зв’язаними оберненнями, потім окремо попрактикуйте нижній, середній
  і верхній голоси.
goal: >-
  Простежувати спільні звуки та невеликі рухи в I–IV–V–I, відокремлюючи музичну лінію від тверджень про ефективність
  аплікатури.
body: |-
  Голосоведення простежує окремі музичні лінії крізь зміни акордів. Акордова послідовність визначає гармонії, а розташування голосів — їхні регістри та порядок. Різні розташування тієї самої послідовності можуть змусити кожну лінію пройти зовсім різну відстань. Невеликі рухи та спільні звуки — корисний вибір, а не правило мінімального руху для кожного аранжування.

  Спочатку розгляньте й послухайте широкий зразок I–IV–V–I. Усі три тризвуки на верхніх струнах мають основний вид. Кожен голос піднімається на п’ять півтонів від I до IV, потім на два до V, а далі опускається на сім до I. Це допустиме звучання, але воно потребує великих змін ділянки грифа. Не плутайте відстань із неправильним акордом.

  Зв’язаний зразок залишає I в основному виді, використовує IV із квінтою в басу та V з терцією в басу. На струні 3 лінія йде так: тоніка–тоніка–ввідний тон–тоніка. На струні 2: третій–четвертий–другий–третій ступінь. На струні 1: п’ятий–шостий–п’ятий–п’ятий. Основні тони акордів і далі відповідають I–IV–V–I. Знайдіть спільну ноту на струні 3 між I та IV і на струні 1 між V та I; інші голоси утворюють гармонічну зміну.

  Попрактикуйте кожен голос окремо протягом чотирьох тактів. На 60 BPM атакуйте на першій долі, тримайте звук три долі, а четверту залишайте тихою для підготовки наступної ноти. Повторно атакуйте спільний звук на початку наступного такту, навіть якщо контакт може залишитися на тому самому ладу. Перевірка тривалості вимірює чутне звучання ноти, а не утримання пальця. Записана струна — очікувана аплікатура; сам звук не доводить, на якій струні ви грали.

  Потім зіграйте зв’язані акорди як арпеджіо з окремих нот: нижній, середній і верхній голоси на долях 1–3, пауза на долі 4. Це поєднує три лінії зі збереженням одноголосного оцінювання. Поза оцінюваною практикою спробуйте одночасні зв’язані тризвуки й порівняйте їх із широким варіантом. Слухайте один голос за раз замість сприйняття акорду лише як цілого блока.

  Називайте функцію та звук у басу окремо, користуйтеся адаптованими нотами свого строю. Усі приклади лежать на струнах 3–1, тому відповідні пари Standard/Drop мають однакові позиції. Якщо рух незручний, відпустіть руку й повільно перебудуйте форму; аудіобал не підтверджує економності руху руки.
steps:
  prepare:
    title: Оберіть голос для спостереження
    body: >-
      Використовуйте чистий звук і приглушіть струни 6–4. Визначте основний тон кожного акорду, потім простежте
      лише нижній, середній або верхній голос через чотири такти. Розгляньте обидва набори форм до гри.
  review:
    title: Порівняйте одну гармонію з двома маршрутами
    body: >-
      Послухайте широкий і зв’язаний зразки. Спробуйте зручні одночасні тризвуки поза оцінюванням, потім порівняйте
      результати трьох окремих голосів. Визначте спільний звук і рухомий голос, не вважаючи звук доказом конкретної
      аплікатури.
  tonic-shape:
    title: 'I: спільна початкова й завершальна форма'
    body: >-
      Основний тон акорду — {{root}}. Цей основний вид починає та завершує обидва приклади. {{positions}}. Пам’ятайте
      його три голоси під час порівняння двох форм IV.
  wide-four-shape:
    title: 'IV: пересуньте форму основного виду'
    body: >-
      Основний тон акорду — {{root}}. У цьому зразку кожен голос на п’ять півтонів вище від початкового I. {{positions}}.
      Це широкий маршрут, а не неправильна гармонія.
  wide-five-shape:
    title: 'V: продовжуйте вгору в основному виді'
    body: >-
      Основний тон акорду — {{root}}. Кожен голос на два півтони вище від попереднього широкого IV; повернення до
      початкового I опускає кожен на сім. {{positions}}. Порівняйте зміну ділянки з подальшим зв’язаним V.
  close-four-shape:
    title: 'IV: збережіть спільний нижній голос'
    body: >-
      Основний тон акорду — {{root}}. Найнижчий голос — квінта цього акорду, вона залишається на тому самому ладу
      струни 3, що й у початковому I. Середній голос піднімається на півтон, верхній — на два. {{positions}}.
  close-five-shape:
    title: 'V: поставте терцію в бас'
    body: >-
      Основний тон акорду — {{root}}. Найнижчий голос — терція. Від зв’язаного IV голоси опускаються на один, три
      та два півтони. {{positions}}. Повернення до I піднімає нижній і середній голоси, залишаючи верхній на місці.
  question:
    title: Спільний звук зі зміною функції
    body: Порівняйте ролі звуків акорду перед відповіддю.
  wide-reference:
    title: 'Послухайте: широкі основні види'
    body: >-
      Тональний центр — {{root}}, мажор. Послухайте чотири такти I–IV–V–I на 60 BPM, по одному повному акорду на
      такт. Простежте кожний із трьох голосів і порівняйте інший зразок. Приклад не має автоматичного бала за акорди.
      {{sequence}}.
  connected-reference:
    title: 'Послухайте: зв’язані обернення'
    body: >-
      Тональний центр — {{root}}, мажор. Послухайте чотири такти I–IV–V–I на 60 BPM, по одному повному акорду на
      такт. Простежте кожний із трьох голосів і порівняйте інший зразок. Приклад не має автоматичного бала за акорди.
      {{sequence}}.
  low-line:
    title: Нижній голос на струні 3
    body: >-
      Тональний центр — {{root}}, мажор. Зіграйте один голос у чотирьох тактах I–IV–V–I на 60 BPM. Атакуйте на першій
      долі, тримайте звук три долі, а четверту залишайте тихою. Повторно атакуйте однакові висоти на початку наступного
      такту. Бал перевіряє висоту, час атаки й чутну тривалість, а не збереження контакту пальця. {{sequence}}.
  middle-line:
    title: Середній голос на струні 2
    body: >-
      Тональний центр — {{root}}, мажор. Зіграйте один голос у чотирьох тактах I–IV–V–I на 60 BPM. Атакуйте на першій
