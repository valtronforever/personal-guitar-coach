lessonID: tonic-and-degrees
lessonVersion: 1
locale: uk
title: Тоніка та ступені
summary: Почуйте роль ноти відносно тонального центру.
goal: Пов’язати ступені з тонікою й порівняти незавершене закінчення з поверненням додому.
body: 'Тоніка — опора, яку фраза встановлює як дім. У мажорній гамі ступені нумерують 1–7, а 8 повторює тоніку октавою
  вище. Ці числа описують ролі відносно тоніки; та сама звучна нота може мати іншу роль в іншій тональності. Назви
  нот уроку транспонуються з інструментом, а малюнки ступенів зберігаються.


  Спершу підніміться мажорною гамою, називаючи 1 2 3 4 5 6 7 8. Відстані від тоніки у півтонах: 0, 2, 4, 5, 7, 9,
  11 і 12. Далі використайте короткі фрази з відходом і поверненням. Повторена тоніка й завершення фрази допомагають
  установити центр; одна окрема висота сама не доводить тональність.


  Останнє порівняння завершується спочатку ступенем 2, потім 1 у тому самому регістрі. Почуйте, як другий може відчуватися
  стійкішим у встановленому контексті. Це слуховий зв’язок, а не автоматичне емоційне судження. Оцінювана практика
  перевіряє записані ноти й атаки; відчуття приходу описуєте ви.'
steps:
  prepare:
    title: Установіть першу ціль як дім
    body: Прослухайте першу ноту, за бажанням тихо наспівайте й знайдіть на інструменті. Тримайте її в пам’яті під
      час слухання інших ступенів.
  degree-map: &id001
    title: Вісім нот і позначень ступенів
    body: Зіграйте два такти чвертей на 50 BPM, назвавши ступені перед спробою. Остання нота — 8, вища тоніка, а
      не новий клас висоти. {{sequence}}.
  return-home: &id002
    title: Три невеликі відходи
    body: 'Такти: 1–3–5–1, 1–4–2–1 і 1–6–7–8. Останнє повернення використовує верхню тоніку. Тримайте пульс і слухайте,
      які ноти тяжіють до повернення.'
  two-endings: &id003
    title: Змініть лише закінчення
    body: Порівняйте 1–2–3–2 з 1–2–3–1. Грайте на однаковому темпі й силі. Повторіть двічі й опишіть стійкіше закінчення
      в цьому контексті; окремої автоматичної оцінки враження немає.
  review:
    title: Відділіть ступінь від поточної назви
    body: Назвіть поточну тоніку за маркерами й поясніть, чому ступінь 5 лишається п’ятим після транспонування.
      Повторіть фразу без читання списку ступенів.
activities:
  degree-map: *id001
  return-home: *id002
  two-endings: *id003
learningTasks:
  review:
    title: Перевірте цю спробу
    body: Позначте лише те, що перевірили слухом чи спостереженням за руками.
    items:
      home: Я тримав установлену тоніку в пам’яті серед інших ступенів.
      numbers: Я описував одну фразу ступенями й поточними назвами нот.
      ending: Я порівняв закінчення в однаковому темпі й тональному контексті.
