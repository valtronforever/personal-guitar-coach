learningTasks:
  review:
    title: Document one corrected uncertainty
    body: Write a bar-specific correction before checking the criteria.
    items:
      map: I identified phrase boundaries and counted the complete form.
      rhythm: I reproduced the attacks and rests separately from the pitch search.
      uncertainty: I compared one uncertain interval or attack with a fresh listen.
      whole: I played a complete pass and noted its specific remaining error.
      help: I recorded whether I revealed targets or solved the phrase by ear.
