lessonID: transcribe-riff-solo
lessonVersion: 1
locale: uk
title: Підбери завершену фразу на слух
summary: Спершу почуй структуру, віднови малі фрази, потім поєднай увесь риф.
goal: Відтвори оригінальний чотиритактовий приклад на слух і поясни підставу кожного виправлення.
body: |-
  Підбір починається з карти звучання, а не з пошуку першого ладу. Двічі послухай цілий приклад без гри. Відстукай пульс, порахуй такти та поміть повторення й відповіді між ідеями. Наспівай загальний напрямок перед назвами нот. Риф часто містить малу ідею зі зміненим завершенням; соло може потребувати кількох таких фраз. Метод однаковий, але обери короткий фрагмент із межами, які можеш запам’ятати.

  Відокрем ритм від висоти. Відрахуй або промов атаки одним складом, включно з усіма паузами, перед пошуком на гітарі. Проміжок є частиною фрази, а не часом забути пульс. Далі знайди стійку початкову висоту й порівняй наступну: та сама, вище чи нижче, близько чи далеко. Перевіряй припущення чергуванням слухання та гри; повторне пересування того самого здогаду по ладах не додає доказів.

  Опрацюй чотири короткі еталони окремо, потім повернися до цілого прикладу. Практика слухання й відтворення приховує цільовий запис до твого явного відкриття. Дослухай еталон перед початком відповіді; новий відлік стосується твоєї спроби. Приклад і відповідь використовують обраний темп. Складну межу відрепетируй, наспівуючи останню ноту однієї фрази в першу наступної.

  Зроби попередній запис на папері: номери тактів, місця атак, назви висот або інтервали й сумнівні місця. Не приховуй невпевненість складною аплікатурою відразу. Перевіряй лише одну сумнівну деталь за раз. Відкрий цілі після чесної спроби на слух і порівняй конкретну різницю; спроба з підказкою корисна для навчання, але дає інший доказ, ніж прихована відповідь. Сам звук не встановлює струну або палець оригінального виконавця.

  Заверши одним повним проходом без зупинок на помилці. Познач її місце, виправ короткий уривок і знову спробуй всю форму. Чиста одноголосна оцінка перевіряє чутні ноти та, за наявності умов, таймінг; вона не оцінює метод підбору й не визначає виразні прийоми. Для обраного поза уроком запису повтори ту саму карту фраз у власному програвачі. Імпорт, уповільнення або розділення довільної музики не є функцією цього уроку.
steps:
  prepare:
    title: Обери невелику музичну ідею
    body: Прочитай план, обери зручний чистий звук і почни повільно.
  phrase-a:
    title: Послухай і віднови фразу A
    body: Відкрий практику й дослухай еталон в обраному темпі. Відтвори ритм, паузи й напрямок висот після нового
      відліку; відкрий запис лише для свідомого порівняння з підказкою.
