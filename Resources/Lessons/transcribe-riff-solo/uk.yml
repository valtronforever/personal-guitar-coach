learningTasks:
  review:
    title: Запиши одне виправлене припущення
    body: Запиши конкретне виправлення з номером такту перед позначенням критеріїв.
    items:
      map: Я визначив межі фраз і відрахував повну форму.
      rhythm: Я відтворив атаки й паузи окремо від пошуку висот.
      uncertainty: Я порівняв один сумнівний інтервал або атаку з повторним слуханням.
      whole: Я зіграв повний прохід і записав конкретну залишкову помилку.
      help: Я зазначив, чи відкривав цілі, чи підібрав фразу на слух.
