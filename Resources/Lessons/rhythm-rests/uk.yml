lessonID: rhythm-rests
lessonVersion: 1
locale: uk
title: Паузи та повернення до гри
summary: Продовжуйте рахувати, коли гітара мовчить.
goal: Вчасно повертатися після паузи на долю або пів долі.
body: |-
  Пауза займає час так само, як нота. Зупиніть струну, але збережіть рахунок і вільний рух руки з медіатором. Пауза не означає «чекати, поки будеш готовий». Тут додаток перевіряє наступну атаку; залишковий звук під час тиші слухайте самостійно.

  Відрізняйте пропущену ноту від запланованої паузи. Знак паузи в TAB показує, де атаки не очікується. Не компенсуйте пізнє повернення прискоренням наступних нот.
steps:
  quarter:
    title: Зупиніть звук, а не рахунок
    body: >-
      Грайте на 1, глушіть на 2, грайте на 3, глушіть на 4. Рахуйте «і» між кожними кліками. Торкайтеся струни м’яко,
      щоб заглушення не створило нової атаки.
  entry:
    title: Почніть через пів долі
    body: >-
      На початку наступного такту промовте 1 без гри. Зіграйте на «і», потім знову на 2. Прослухайте такт, щоб знайти
      момент вступу, а потім зіграйте без прикладу. {{positions}}.
  late-rest:
    title: Залиште долю 3 порожньою
    body: >-
      Зупиніться на 3, відлічіть «3 і», потім поверніться точно на 4. Підготуйте медіатор під час паузи, не зачіпаючи
      струну завчасно.
  whole:
    title: З’єднайте обидва такти
    body: >-
      Повторюйте на 60 BPM. Якщо повернення не вдається, виберіть другий такт і двічі промовте його рахунок перед
      грою. Після двох контрольованих вступів поверніться до обох тактів.
  review:
    title: Перевірте перед прискоренням
    body: Перевірте і час атак, і справжню тишу. Відсутність зайвих атак не доводить, що попередня нота припинилася.
activities:
  gaps:
    title: Чвертні та восьмі паузи на {{first}}
    body: 'Такт 1: звук на 1 та 3. Такт 2 починається восьмою паузою; вступіть на «і» після 1. {{sequence}}.'
learningTasks:
  review:
    title: Перевірте свою практику
    body: Позначайте лише перевірене; самооцінка не змінює аудіооцінку.
    items:
      count: Я рахую протягом кожної паузи.
      sound: Під час пауз струна справді мовчить.
      repeat: Я вступаю на «і» після 1, не чекаючи кліку 2.
