learningTasks:
  phrase-review:
    title: Keep a motif and choose one change
    body: Play the twelve-bar study, then replace one answer while keeping its bar boundary. Compare that decision
      with the model.
    items:
      motif: The returning call remained recognizable.
      bend: I compared the bend with its target instead of guessing from hand motion.
      vibrato: I let the chosen note settle before adding vibrato.
      space: I counted the empty bars and reached the final root deliberately.
      answer: I changed one answer without extending the form.
