lessonID: blues-solo
lessonVersion: 1
locale: uk
title: 'Блюзове соло: фраза перед гамою'
summary: Використай пентатонічні ідеї, точні bend, відкладене vibrato й простір у відрахованій формі.
goal: Побудуй дванадцятитактове соло, де bend, vibrato, паузи та завершення служать впізнаваній фразі.
body: |-
  Почни з короткої фрази, яку можеш наспівати чи пригадати, потім обери, де bend або vibrato допомагає їй. Мета не в тому, щоб зіграти всі ноти пентатонічної форми. Етюд використовує мінорно-пентатонічний набір у відрахованому дванадцятитактовому маршруті акомпанементу. Синтезована сольна партія не містить ритм-секції; рахуй гармонічну форму самостійно або грай із сумісним партнером чи зовнішнім акомпанементом, якщо він доступний.

  Спочатку вивчи запитання без прикрас. Воно підіймається від основного звуку через малу терцію до четвертого ступеня й залишає долю порожньою. Варіант із bend починається з четвертого ступеня та підіймається на тон до п’ятого. Почуй ціль перед підтягуванням. Збережи час початку й кінця фрази: запізніле досягнення висоти змінює музичний жест, навіть якщо кінцева висота правильна.

  Відповідь спускається й зупиняється на основному звуці. Утримай її початок рівно перед додаванням невеликого vibrato. Слухай контраст між сталою опорою й пізнішим рухом. У цих прикладах bend і vibrato відбуваються на різних нотах, тому кожний має чітку роль. Не прикрашай кожну ноту й не дозволяй руху висоти заповнювати записану паузу. Порівнюй просту та виразну версії в одному темпі.

  У повному етюді мисли трьома чотиритактовими частинами: представ запитання, розвинь відповідь і повернися до обраного завершення. Деякі такти навмисно розріджені. Рахуй крізь них замість сприйняття тиші як втраченого часу. Остання фраза приходить на основний звук до наступного циклу. Коли модель знайома, збережи її початковий ритм і заміни лише одну відповідь власною невеликою ідеєю.

  Перевір конкретне музичне рішення: чи bend досяг цілі, чи vibrato почалося після сталої ноти та чи повторений мотив лишився впізнаваним. Тут використовується самопрактика без оцінки творчості чи блюзового відчуття. Для окремого вимірювання руху висоти повернися до уроків bend і vibrato. Тут ці техніки служать фразуванню, а свідомо залишений проміжок може бути найсильнішим рішенням.
steps:
  prepare:
    title: Обери невелику музичну ідею
    body: Прочитай план, обери зручний чистий звук і почни повільно.
  plain-call:
    title: Почуй запитання перед прикрашанням
    body: 'Центр: мінорний набір від {{root}}. Запам’ятай висхідний ритм і останню порожню долю.'
  bent-call:
    title: Підтягни четвертий ступінь до п’ятого
    body: Довга третя нота підіймається на тон після сталого початку. Слухай ціль, зберігаючи останню паузу.
  vibrato-answer:
    title: Відповідай і відклади vibrato
    body: Спочатку дай прозвучати основному звуку, потім додай чотири невеликі цикли висоти. Рух не створює нових
      медіаторних нот.
  twelve-bar-solo:
    title: Дванадцять тактів із повторюваною ідеєю
    body: Використай завершальний варіант I I I I | IV IV I I | V IV I I. Запитання повертаються в тактах 1 та 5;
      такт 12 завершується на тоніці й залишає простір.
  phrase-review:
    title: Збережи мотив і обери одну зміну
    body: Зіграй дванадцятитактовий етюд, потім заміни одну відповідь, зберігши межу такту. Порівняй це рішення
      з моделлю.
