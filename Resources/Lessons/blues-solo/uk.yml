learningTasks:
  phrase-review:
    title: Збережи мотив і обери одну зміну
    body: Зіграй дванадцятитактовий етюд, потім заміни одну відповідь, зберігши межу такту. Порівняй це рішення
      з моделлю.
    items:
      motif: Повторене запитання лишилося впізнаваним.
      bend: Я порівняв bend із цільовою висотою замість здогаду за рухом руки.
      vibrato: Я дав обраній ноті стати сталою перед vibrato.
      space: Я відрахував порожні такти й свідомо прийшов на останній основний звук.
      answer: Я змінив одну відповідь без подовження форми.
