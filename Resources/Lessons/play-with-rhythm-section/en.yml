learningTasks:
  review:
    title: Listen beyond the guitar part
    body: Use a partner rehearsal when possible; otherwise label this as metronome preparation, not an ensemble
      test.
    items:
      route: I followed all four harmonic bars without moving a change early.
      release: I stopped each short chord and left the written gaps audible.
      break: I counted the final-bar break and knew the next entrance.
      listen: I identified whether the guitar supported or crowded the other roles.
      context: I distinguished solo click practice from playing with real partners.
