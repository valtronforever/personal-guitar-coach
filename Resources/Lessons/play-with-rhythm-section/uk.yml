lessonID: play-with-rhythm-section
lessonVersion: 1
locale: uk
title: Залиш місце басу й барабанам
summary: Узгодь гітарну партію з пульсом, бекбітом і низькочастотною основою.
goal: Утримай чотиритактову гітарну роль, слухаючи узгоджені атаки, паузи та вступ наступної частини.
body: |-
  Гра з ритм-секцією потребує спільного плану, а не просто одночасного звучання. Узгодь форму, пульс і відлік, потім визнач низьку основу та атаки, які мають збігатися. Для вправи уяви стійкий чотиридольний рисунок із бекбітом на другій і четвертій долях. Це одна репетиційна модель, а не правило для кожного стилю. Послухай реальних партнерів, перш ніж нав’язувати такий рисунок їхній музиці.

  Вивчи приклад низької основи, щоб зрозуміти рух гармонічних коренів. Це подання басової ролі в гітарному регістрі, а не запис бас-гітари. Потім зіграй рідшу верхню гітарну партію. Дві короткі атаки залишають простір біля низького вступу й припиняються до наступного такту. Рахуй під час пауз. Акорд, що заповнює всі порожні долі, може приховати рисунок, навіть якщо його початкова атака була точною.

  Порівняй зміщений варіант без зміни чотиритактового гармонічного маршруту. Промов поділ долі перед грою, щоб слабкий вступ лишався прив’язаним до відомого пульсу. Не перенось наступну гармонічну зміну раніше через зміщення поточної атаки. З басистом і барабанщиком спершу репетируй тихо й малою кількістю нот. Запитай, чи підсилюють твої атаки їхні рішення, чи конкурують із ними; відповідь корисніша за автоматичне ущільнення партії.

  Відпрацюй узгоджену паузу в останньому такті. Гітара зупиняється після початкової атаки, поки гурт продовжує рахувати порожній простір. Повертайся лише на наступному узгодженому початку. Стеж за обраним жестом або звуковим сигналом, але збережи внутрішній рахунок на випадок непомітного жесту. Збивка не дозволяє забути форму. Повторюй перехід із попереднього такту, щоб пауза стала частиною рисунка, а не окремим трюком.

  Тут додаток надає метроном і синтезовані гітарні еталони; барабанних доріжок або мікшера фонограми він не надає. За можливості відрепетируй план із реальними партнерами або окремо відтвореним акомпанементом. Запис самопрактики захоплює обраний гітарний вхід, тому перевір його атаки й завершення відносно еталонних кліків без твердження, що чуєш увесь гурт. Музичну доречність визначай спільним слуханням; автоматичної оцінки груву чи акордів тут немає.
steps:
  prepare:
    title: Обери невелику музичну ідею
    body: Прочитай план, обери зручний чистий звук і почни повільно.
  foundation:
    title: Зрозумій низьку основу
    body: 'Центр: {{root}} major. Пройди I–V–I–I з низькими атаками на долях 1 і 3. Це модель ролі, зіграна на гітарі.'
  sparse-guitar:
    title: Короткі гітарні атаки на два й чотири
    body: Атакуй на долях 2 й 4, заверши кожну восьму й почуй проміжки. Грай той самий чотиритактовий маршрут, що
      й основа.
  offbeat-guitar:
    title: Пересунь атаки зі збереженням маршруту
    body: Атакуй на слабких позиціях після долей 1 і 3. Гармонічна зміна все одно належить початку свого такту.
  ensemble-break:
    title: Узгодь паузу в останньому такті
    body: Три такти грай рідший рисунок. У такті 4 атакуй лише на долі 1, заверши на долі 2 й відрахуй решту перед
      наступним вступом.
  review:
    title: Слухай ширше за гітарну партію
    body: За можливості попрацюй із партнерами; інакше назви це підготовкою з метрономом, а не перевіркою ансамблю.
