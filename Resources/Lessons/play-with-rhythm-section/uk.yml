learningTasks:
  review:
    title: Слухай ширше за гітарну партію
    body: За можливості попрацюй із партнерами; інакше назви це підготовкою з метрономом, а не перевіркою ансамблю.
    items:
      route: Я пройшов чотири гармонічні такти без раннього пересування зміни.
      release: Я припинив кожний короткий акорд і залишив чутні проміжки.
      break: Я відрахував паузу останнього такту й знав наступний вступ.
      listen: Я визначив, чи підтримує гітара інші ролі, чи заважає їм.
      context: Я відрізнив сольну практику під клік від гри з реальними партнерами.
