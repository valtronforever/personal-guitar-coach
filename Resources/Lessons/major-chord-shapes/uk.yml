learningTasks:
  review:
    title: Перевірте звучання акорду
    body: Це ваша перевірка на слух, окрема від оцінки одиночних нот.
    items:
      strings: Звучать лише потрібні струни; струни × мовчать.
      clear: Я чую кожен звук акорду без дзижчання чи заглушення сусідньої струни.
      compare: Я порівняв приклади з подібною гучністю й можу описати відмінність.
