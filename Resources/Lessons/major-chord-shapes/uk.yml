lessonID: major-chord-shapes
lessonVersion: 1
locale: uk
title: Прості мажорні акорди
summary: Почуйте, як зміна одного звуку перетворює мінорну форму на мажорну.
goal: Зібрати три мажорні форми й порівняти кожну з мінорною від того самого основного тону.
body: |-
  Мажорний тризвук містить основний тон, велику терцію й квінту: 0, 4 та 7 півтонів від основного тону. Мінорний використовує 0, 3 та 7. Підняття малої терції на півтон дає велику, тоді як основний тон і квінта лишаються незмінними. Це точний спосіб порівняти звучання без ярликів «веселий» чи «сумний».

  Кожна пара починається зі знайомої мінорної форми, за якою йде її мажорний варіант. Послухайте повні акорди, огляньте змінену ноту, потім перевірте струни окремо. Назви варіантів залежать від строю; інтервальне співвідношення незмінне. У прикладі звуки акорду звучать разом, але автоматична оцінка практики стосується лише розділених одиночних нот.

  Не стискайте гриф сильніше лише через доданий палець. Перевірте контакт біля ладу, залиште місце сусіднім струнам і не зачіпайте басові струни, які мають мовчати.
steps:
  prepare:
    title: Підготуйте чисте порівняння
    body: >-
      Використовуйте чистий вхід і спочатку налаштуйте гітару. Номери пальців — підказки, а не розпізнані пальці:
      1 вказівний, 2 середній, 3 безіменний, 4 мізинець. × означає, що струна має мовчати. Зміна строю може змінити
      форму й прибрати непридатну підказку пальців; орієнтуйтеся на фактичні маркери ладів.
  em-shape:
    title: '{{root}} мінорний: зберіть і послухайте'
    body: >-
      Ця шестиструнна форма містить основний тон, малу терцію та квінту в кількох октавах. Затисніть потрібні ноти
      й перевірте, чи сусідні відкриті струни звучать. У Drop позиція нижньої струни може змінитися; не припускайте,
      що вона лишається відкритою. Якщо адаптована форма незручна, почніть із п’яти- чи чотириструнного прикладу
      й поверніться сюди. {{positions}}.
  em-notes:
    title: '{{root}} мінорний: перевірте кожну струну'
    body: >-
      Підготуйте форму й грайте її струни від низької до високої по одній ноті на клік на 50 BPM. Легко зупиняйте
      попередню струну рукою з медіатором, щоб оцінюваний вхід лишався одноголосним. Відлічіть решту долей у тиші.
      Оцінка перевіряє ці окремі ноти, а не весь акорд. {{positions}}.
  e-shape:
    title: '{{root}} мажорний: зберіть і послухайте'
    body: >-
      Порівняйте із шестиструнною мінорною формою. Терція на струні 3 у початковій формі на півтон вище; інші голоси
      лишаються сталими. Послухайте мінор, потім мажор із подібною гучністю. У Drop також стежте за адаптованим
      ладом нижньої струни. {{positions}}.
  e-notes:
    title: '{{root}} мажорний: перевірте кожну струну'
    body: >-
      Підготуйте форму й грайте її струни від низької до високої по одній ноті на клік на 50 BPM. Легко зупиняйте
      попередню струну рукою з медіатором, щоб оцінюваний вхід лишався одноголосним. Відлічіть решту долей у тиші.
      Оцінка перевіряє ці окремі ноти, а не весь акорд. {{positions}}.
  am-shape:
    title: '{{root}} мінорний: зберіть і послухайте'
    body: >-
      Використовуйте лише струни 5–1; струна 6 мовчить. Зігніть пальці настільки, щоб не зачіпати наступну тоншу
      струну. Останньою перевірте верхню відкриту струну: її легко заглушити пальцем на струні 2. Прослухайте цілу
      форму, потім м’яко проведіть по ній один раз. {{positions}}.
  am-notes:
    title: '{{root}} мінорний: перевірте кожну струну'
    body: >-
      Підготуйте форму й грайте її струни від низької до високої по одній ноті на клік на 50 BPM. Легко зупиняйте
      попередню струну рукою з медіатором, щоб оцінюваний вхід лишався одноголосним. Відлічіть решту долей у тиші.
      Оцінка перевіряє ці окремі ноти, а не весь акорд. {{positions}}.
  a-shape:
    title: '{{root}} мажорний: зберіть і послухайте'
    body: >-
      Використовуйте струни 5–1. Порівняйте з п’ятиструнною мінорною формою: нота на струні 2 піднімається на півтон.
      Розташуйте три пальці, не блокуючи верхню відкриту струну. Показана аплікатура — один із варіантів; чистота
      й вільна рука важливіші за копіювання тісного хвату. {{positions}}.
  a-notes:
    title: '{{root}} мажорний: перевірте кожну струну'
    body: >-
      Підготуйте форму й грайте її струни від низької до високої по одній ноті на клік на 50 BPM. Легко зупиняйте
      попередню струну рукою з медіатором, щоб оцінюваний вхід лишався одноголосним. Відлічіть решту долей у тиші.
      Оцінка перевіряє ці окремі ноти, а не весь акорд. {{positions}}.
  dm-shape:
    title: '{{root}} мінорний: зберіть і послухайте'
    body: >-
      Використовуйте струни 4–1, уникайте 5–6. Обережно поставте кінчик пальця на найтоншу струну, не відтягуючи
      її вбік. Перевірте три верхні затиснуті ноти окремо, потім додайте відкритий бас. Менша форма потребує точного
      попадання медіатором, а не більшої сили. {{positions}}.
  dm-notes:
    title: '{{root}} мінорний: перевірте кожну струну'
    body: >-
      Підготуйте форму й грайте її струни від низької до високої по одній ноті на клік на 50 BPM. Легко зупиняйте
      попередню струну рукою з медіатором, щоб оцінюваний вхід лишався одноголосним. Відлічіть решту долей у тиші.
      Оцінка перевіряє ці окремі ноти, а не весь акорд. {{positions}}.
  d-shape:
    title: '{{root}} мажорний: зберіть і послухайте'
    body: >-
      Використовуйте струни 4–1, залишивши 5–6 тихими. Порівняно з чотириструнним мінором нота на струні 1 піднімається
      на півтон. Основний тон і квінта незмінні. Послухайте форми одна за одною, потім перевірте мажорний акорд
      по струнах. {{positions}}.
  d-notes:
    title: '{{root}} мажорний: перевірте кожну струну'
    body: >-
      Підготуйте форму й грайте її струни від низької до високої по одній ноті на клік на 50 BPM. Легко зупиняйте
      попередню струну рукою з медіатором, щоб оцінюваний вхід лишався одноголосним. Відлічіть решту долей у тиші.
      Оцінка перевіряє ці окремі ноти, а не весь акорд. {{positions}}.
  review:
    title: Порівняйте й повторіть
    body: >-
      Оберіть одну мінорно-мажорну пару й поясніть, яка терція змінилася. Зіграйте обидва акорди тихо, з подібною
      силою атаки. Якщо мажорна форма нечітка, знайдіть проблемну висоту у вправі окремими нотами, потім поверніться
      до повного акорду й послухайте. Надійно вивчіть одну пару, перш ніж швидко перемикати всі три.
