lessonID: major-chord-shapes
lessonVersion: 1
locale: en
title: Simple major chords
summary: Hear how one changed chord tone turns a minor form into major.
goal: Build three major shapes and compare each with its parallel minor.
body: |-
  A major triad contains root, major third and fifth: 0, 4 and 7 semitones from the root. A minor triad uses 0, 3 and 7. Raising the minor third by one semitone produces the major third while root and fifth stay unchanged. This gives a precise way to compare the sound without relying on “happy” or “sad” labels.

  Each pair in this lesson begins with a familiar minor shape followed by its major version. Listen to the full chords, inspect the changed note, then check the strings individually. The variant titles follow the chosen tuning; the interval relationship stays the same. Preview sounds chord tones together, but the automatic practice score is only for separated single notes.

  Do not squeeze harder just because a new finger is added. Check contact near the fret, leave room for neighboring strings and keep the intended silent bass strings out of the strum.
steps:
  prepare:
    title: Set up a clear comparison
    body: >-
      Use a clean input and tune first. Fingering numbers are suggestions, not detected fingers: 1 index, 2 middle,
      3 ring, 4 little. × means a string must stay silent. Changed tuning can change a shape and remove an unsuitable
      finger suggestion; follow the actual fret markers.
  em-shape:
    title: '{{root}} minor: build and hear'
    body: >-
      This six-string shape contains a root, minor third and fifth across several octaves. Place the fretted notes,
      then check that the adjacent open strings still ring. In a Drop tuning the lowest-string position may move;
      do not assume it stays open. If the adapted shape is awkward, begin with the five- or four-string example
      and return here. {{positions}}.
  em-notes:
    title: '{{root}} minor: check each string'
    body: >-
      Keep the shape ready and play its sounding strings from low to high, one note per click at 50 BPM. Lightly
      stop each previous string with the picking hand so the scored input remains monophonic. Rest through the remaining
      beats. The score checks these individual notes; it does not certify the full chord. {{positions}}.
  e-shape:
    title: '{{root}} major: build and hear'
    body: >-
      Compare with the six-string minor form. The third on string 3 is one semitone higher in the source shape;
      keep the other voices steady. Listen to minor, then major at a similar volume. In Drop, also follow the adapted
      lowest-string fret. {{positions}}.
  e-notes:
    title: '{{root}} major: check each string'
    body: >-
      Keep the shape ready and play its sounding strings from low to high, one note per click at 50 BPM. Lightly
      stop each previous string with the picking hand so the scored input remains monophonic. Rest through the remaining
      beats. The score checks these individual notes; it does not certify the full chord. {{positions}}.
  am-shape:
    title: '{{root}} minor: build and hear'
    body: >-
      Use only strings 5 through 1; keep string 6 quiet. Curve the fretting fingers enough to avoid touching the
      next thinner string. Check the top open string last: it is easy to block with the finger on string 2. Preview
      the complete shape, then strum it gently once. {{positions}}.
  am-notes:
    title: '{{root}} minor: check each string'
    body: >-
      Keep the shape ready and play its sounding strings from low to high, one note per click at 50 BPM. Lightly
      stop each previous string with the picking hand so the scored input remains monophonic. Rest through the remaining
      beats. The score checks these individual notes; it does not certify the full chord. {{positions}}.
  a-shape:
    title: '{{root}} major: build and hear'
    body: >-
      Use strings 5–1. Compare with the five-string minor form: the note on string 2 moves up one semitone. Fit
      the three fretted fingers without blocking the top open string. The suggested fingering is one option; clarity
      and a relaxed hand matter more than copying a cramped grip. {{positions}}.
  a-notes:
    title: '{{root}} major: check each string'
    body: >-
      Keep the shape ready and play its sounding strings from low to high, one note per click at 50 BPM. Lightly
      stop each previous string with the picking hand so the scored input remains monophonic. Rest through the remaining
      beats. The score checks these individual notes; it does not certify the full chord. {{positions}}.
  dm-shape:
    title: '{{root}} minor: build and hear'
    body: >-
      Use strings 4 through 1 and avoid strings 5–6. Place the fingertip on the thinnest string carefully, without
      pulling the string sideways. Check the three fretted upper notes one at a time before adding the open bass.
      The smaller shape needs accurate picking, not more force. {{positions}}.
  dm-notes:
    title: '{{root}} minor: check each string'
    body: >-
      Keep the shape ready and play its sounding strings from low to high, one note per click at 50 BPM. Lightly
      stop each previous string with the picking hand so the scored input remains monophonic. Rest through the remaining
      beats. The score checks these individual notes; it does not certify the full chord. {{positions}}.
  d-shape:
    title: '{{root}} major: build and hear'
    body: >-
      Use strings 4–1 and leave 5–6 silent. Compared with the four-string minor form, the note on string 1 rises
      one semitone. The root and fifth stay unchanged. Listen to the two shapes back to back before checking the
      major chord string by string. {{positions}}.
  d-notes:
    title: '{{root}} major: check each string'
    body: >-
      Keep the shape ready and play its sounding strings from low to high, one note per click at 50 BPM. Lightly
      stop each previous string with the picking hand so the scored input remains monophonic. Rest through the remaining
      beats. The score checks these individual notes; it does not certify the full chord. {{positions}}.
  review:
    title: Compare and repeat
    body: >-
      Choose one minor/major pair and explain which third changed. Play both quietly, with similar attack strength.
      If a major shape is unclear, use its separate-note practice to locate the problematic pitch, then return to
      the full chord and listen. Learn one pair reliably before trying to switch all three quickly.
activities:
  em-shape:
    title: '{{root}} minor shape'
    body: 'The harmonic root is {{root}} even if the highest shown note is different. Sounding targets: {{notes}}.'
  em-notes:
    title: '{{root}} minor — separate-note check'
    body: >-
      Play each string separately, stopping the previous note before the next attack. {{sequence}}. The silent remainder
