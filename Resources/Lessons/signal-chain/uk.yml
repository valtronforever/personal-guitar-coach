lessonID: signal-chain
lessonVersion: 1
locale: uk
title: Гітара, інтерфейс, підсилювач і навушники
summary: Розрізняйте шлях чистого входу та шлях звуку, який ви слухаєте.
goal: Розрізняйте шлях чистого входу та шлях звуку, який ви слухаєте.
body: >-
  Додаток аналізує вибраний моно-вхід. Ви можете чути гітару через прямий моніторинг, окремий підсилювач або програмну
  обробку. Те, що ви чуєте гітару, саме по собі не доводить правильності входу додатка.
steps:
  map:
    title: Накресліть свій шлях сигналу
    body: >-
      Для прямого підключення електрогітари запишіть: гітара → кабель → інструментальний вхід → вибраний канал додатка.
      Окремо: метроном додатка → вибраний вихід → навушники. Позначте, де до прослуховування додається моніторинг
      гітари.
  input:
    title: Оберіть відповідний вхід
    body: >-
      Для пасивної гітари, підключеної напряму, використовуйте вхід із підтримкою instrument/Hi-Z. Процесор може
      видавати лінійний рівень: звірте характеристики його виходу та інтерфейсу. Виберіть саме підключений канал,
      а не суму всіх входів.
  output:
    title: Перевірте, що саме ви чуєте
    body: >-
      Почніть тихо. Переконайтеся, що клік метронома потрапляє в обрані навушники. Зіграйте на гітарі й визначте,
      чи чуєте прямий, чи програмний моніторинг. Два одночасні шляхи можуть створювати подвоєний або запізнений
      звук.
  verify:
    title: Перевірте вхід і вихід окремо
    body: >-
      Поспостерігайте за вхідною шкалою під час гри, потім припиніть гру й перевірте вихід. Якщо гітару чути, а
      шкала нерухома, перевірте вибраний канал. Якщо шкала рухається, а кліків не чути, перевірте вихід і гучність
      навушників.
activities: {}
learningTasks:
  review:
    title: Перевірте свою практику
    body: Позначайте лише те, що перевірили самостійно. Поверніться до непозначеного пункту на наступному занятті.
    items:
      criterion-1: Я знаю, який моно-канал передає мою гітару.
      criterion-2: Я чую вихід додатка на комфортній гучності.
      criterion-3: Я можу описати шлях моніторингу гітари.
