lessonID: hear-pitch-direction
lessonVersion: 2
locale: en
title: Hear and reproduce intervals
summary: Compare direction and distance, then reproduce short note pairs without TAB.
goal: Distinguish repeated, rising and falling notes and reproduce the heard interval in the same register.
body: |-
  An interval is the distance between two pitches. Direction and size are different questions: first decide whether the second note rises, falls or stays the same, then compare how far it moves. A repeated note is a unison. A small step and a large leap can both rise. Naming the interval is useful, but reproducing the two sounds is the practical goal here.

  Listen to the recognition example and choose the direction before reading its explanation. Then work through the interval questions. Hear the first note as an anchor and retain it while the second sounds. You may sing or hum the pair privately. Do not judge distance from loudness or from which tone seems brighter: the reference uses the same synthesized sound for each pitch.

  For the response examples, listen without looking for a fret number. Find the first pitch on your guitar, then search for the second while preserving that anchor. Move on one string initially if it makes the distance easier to hear. Replay the reference after a few comparisons rather than accumulating guesses. A different string can produce the same pitch; the app evaluates the sound and cannot verify your chosen fingering.

  When the pair is comfortable, start the scored response after its new count-in. Preserve both the heard order and octave. Let each note be clear, then leave the heard gap before the next attack. A correct interval shifted to a different starting pitch is a useful musical exercise, but it is not the exact reference required in this response. The displayed result compares absolute sounding pitches as well as available timing evidence.

  Use the questions to check interval labels, and the response attempts to check reproduction; one does not replace the other. Review repeated notes, small movements and wider movements across several examples. If you reveal a target, compare and understand the mismatch rather than treating the guided score as an unseen listening test. All examples transpose together with the instrument tuning. The interval relationship survives that change, while the sounding note names change.
