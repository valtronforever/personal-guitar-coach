learningTasks:
  direction:
    title: Where does the second note move?
    body: Choose by sound. No guitar input is required.
    items:
      higher: Higher
      lower: Lower
      same: The same pitch
    explanation: The second note is higher by two semitones (a whole tone). The interval remains the same when this
      example is transposed to another tuning.
  pair-one:
    title: Listen to this pair
    body: Which interval do you hear?
    items:
      unison: Unison
      minor-third: Minor third
      fifth: Perfect fifth
    explanation: 'The pitches repeat: the distance is zero semitones.'
  pair-two:
    title: Listen to this pair
    body: Which interval do you hear?
    items:
      unison: Unison
      minor-third: Minor third
      fifth: Perfect fifth
    explanation: 'The second pitch is three semitones above the first: a minor third.'
  pair-three:
    title: Listen to this pair
    body: Which interval do you hear?
    items:
      unison: Unison
      minor-third: Minor third
      fifth: Perfect fifth
    explanation: 'The second pitch is seven semitones above the first: a perfect fifth.'
  review:
    title: Review the comparison
    body: Confirm only what you actually did, separately from the measured score.
    items:
      compare: I compared sounds before looking for a visual answer.
      replay: I replayed the reference when memory became uncertain.
      diagnose: I identified a specific pitch, order or timing mismatch to practice.
      honesty: I distinguished guided attempts and familiar examples from a new listening challenge.
