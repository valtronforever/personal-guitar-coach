lessonID: hear-pitch-direction
lessonVersion: 2
locale: uk
title: Почуй і відтвори інтервали
summary: Порівняй напрямок і відстань, потім відтвори короткі пари нот без табулатури.
goal: Розрізняй повторення, рух угору й униз та відтворюй почутий інтервал у тому самому регістрі.
body: |-
  Інтервал — це відстань між двома висотами. Напрямок і розмір відповідають на різні запитання: спочатку визнач, чи друга нота вища, нижча або така сама, потім порівняй відстань. Повторення висоти — це унісон. І невеликий крок, і широкий стрибок можуть іти вгору. Називати інтервал корисно, але практична мета тут — відтворити обидва звуки.

  Прослухай приклад на розпізнавання й обери напрямок перед читанням пояснення. Потім перейди до запитань про інтервали. Сприймай першу ноту як опору та тримай її в пам’яті, коли звучить друга. Можеш наспівати пару для себе. Не визначай відстань за гучністю чи яскравістю тембру: еталон використовує однаковий синтезований звук для кожної висоти.

  У прикладах для відповіді слухай, не шукаючи номера ладу. Знайди першу висоту на гітарі, потім підбери другу, зберігаючи першу як опору. Спочатку рухайся однією струною, якщо так легше почути відстань. Після кількох порівнянь повторно прослухай еталон замість накопичення здогадок. Ту саму висоту можна зіграти на іншій струні; додаток оцінює звук і не перевіряє обрану аплікатуру.

  Коли пара виходить упевнено, почни оцінювану відповідь після нового відліку. Збережи почутий порядок і октаву. Дай кожній ноті прозвучати чітко й залиш почутий проміжок перед наступною атакою. Правильний інтервал від іншої початкової висоти — корисна музична вправа, але не точний еталон, якого вимагає ця відповідь. Результат порівнює абсолютні висоти звучання та доступні вимірювання таймінгу.

  Запитання перевіряють назви інтервалів, а практичні спроби — відтворення; одне не замінює іншого. Порівняй повторені ноти, малий рух і ширші переміщення в кількох прикладах. Якщо відкриєш ціль, порівняй і зрозумій розбіжність, а не сприймай оцінку гри з підказками як тест незнайомого матеріалу на слух. Усі приклади транспонуються разом зі строєм інструмента. Інтервальні відношення зберігаються, а назви нот звучання змінюються.
steps:
  prepare:
    title: Спочатку слухай, потім шукай
    body: Прочитай спосіб роботи, обери чистий вхідний сигнал і підготуйся порівнювати звуки.
  listen:
    title: Послухайте дві ноти
    body: Натисніть «Прослухати приклад» унизу. Повторюйте скільки потрібно, а потім порівняйте висоту другої ноти
      з першою.
  pair-one:
    title: Прослухай цю пару
    body: Прослухай перед вибором інтервалу.
  pair-two:
    title: Прослухай цю пару
    body: Прослухай перед вибором інтервалу.
