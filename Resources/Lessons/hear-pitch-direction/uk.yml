learningTasks:
  direction:
    title: Куди рухається друга нота?
    body: Виберіть відповідь на слух. Гітарний вхід не потрібен.
    items:
      higher: Вище
      lower: Нижче
      same: Висота не змінюється
    explanation: Друга нота вища на два півтони (цілий тон). Інтервал зберігається після транспонування цього прикладу
      в інший стрій.
  pair-one:
    title: Прослухай цю пару
    body: Який інтервал ти чуєш?
    items:
      unison: Унісон
      minor-third: Мала терція
      fifth: Чиста квінта
    explanation: 'Висота повторюється: відстань становить нуль півтонів.'
  pair-two:
    title: Прослухай цю пару
    body: Який інтервал ти чуєш?
    items:
      unison: Унісон
      minor-third: Мала терція
      fifth: Чиста квінта
    explanation: 'Другий звук на три півтони вище першого: мала терція.'
  pair-three:
    title: Прослухай цю пару
    body: Який інтервал ти чуєш?
    items:
      unison: Унісон
      minor-third: Мала терція
      fifth: Чиста квінта
    explanation: 'Другий звук на сім півтонів вище першого: чиста квінта.'
  review:
    title: Перевір спосіб порівняння
    body: Підтвердь лише те, що справді зробив, окремо від виміряної оцінки.
    items:
      compare: Я порівняв звуки перед пошуком візуальної відповіді.
      replay: Я повторив прослуховування, коли пам’ять стала непевною.
      diagnose: Я визначив конкретну розбіжність висоти, порядку чи часу для тренування.
      honesty: Я відрізнив гру з підказками й знайомі приклади від нового слухового завдання.
