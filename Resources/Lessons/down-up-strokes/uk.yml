lessonID: down-up-strokes
lessonVersion: 1
locale: uk
title: Удари медіатором вниз і вгору
summary: Зіграйте окремі групи ударів униз і вгору з рівним пульсом.
goal: Зіграйте окремі групи ударів униз і вгору з рівним пульсом.
body: >-
  У звичному праворукому положенні удар униз спрямований до підлоги, а удар угору — у зворотний бік. На дзеркальному
  інструменті орієнтуйтеся на рух відносно площини струн, а не екрана. Тут удари спочатку відпрацьовуються окремо,
  перед їх чергуванням.
steps:
  down:
    title: Чотири удари вниз
    body: >-
      Зіграйте відкриту струну 2 чотирма ударами вниз, по одному на клік. Між звуками тихо повертайте медіатор над
      струною. Рух має бути достатньо коротким, щоб знову знайти струну без погляду. {{positions}}
  up:
    title: Чотири удари вгору
    body: >-
      Тепер підійдіть до тієї самої струни знизу й зіграйте чотири удари вгору. Повертайтеся під струну без другої
      ноти. Слухайте, чи немає випадкових подвійних атак під час повернення руки. {{positions}}
  join:
    title: По одному такту в кожен бік
    body: >-
      Зіграйте такт 1 ударами вниз, а такт 2 — угору при 60 BPM. Тихо промовляйте «вниз» або «вгору» на кожен клік.
      Не втрачайте пульс під час зміни напрямку на межі тактів. {{positions}}
  review:
    title: Окремо перевірте рух і звук
    body: >-
      За відгуком про висоту й час знайдіть нерівні вступи, а під час повільного повтору поспостерігайте за рукою
      з медіатором. Аудіовхід не доводить напрямок удару. Якщо повернення створює зайві звуки, зменште амплітуду
      перед підвищенням темпу.
activities:
  example:
    title: Приклад для вашого інструменту
    body: >-
      Очікувана послідовність: {{sequence}}. Виберіть крок, щоб побачити його позиції. У прикладі звучать синтезовані
      еталонні ноти.
learningTasks:
  review:
    title: Перевірте свою практику
    body: Позначайте лише те, що перевірили самостійно. Поверніться до непозначеного пункту на наступному занятті.
    items:
      criterion-1: Я зіграв повний такт лише ударами вниз.
      criterion-2: Я зіграв повний такт лише ударами вгору.
      criterion-3: Рух повернення не створював зайвих атак.
