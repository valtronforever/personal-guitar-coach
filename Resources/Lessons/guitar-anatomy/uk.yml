lessonID: guitar-anatomy
lessonVersion: 1
locale: uk
title: Будова електрогітари
summary: Знайдіть частини гітари, потрібні для вибору, затискання й керування нотою.
goal: Знайдіть частини гітари, потрібні для вибору, затискання й керування нотою.
body: >-
  Для огляду від’єднайте кабель гітари. Простежте одну струну від кілка через верхній поріжок і лади до сідла бриджа.
  Різні електрогітари мають різні бриджі й органи керування, але їхні музичні ролі можна впізнати. Регулювальні
  гвинти крутити не потрібно.
steps:
  string-path:
    title: Простежте струну
    body: >-
      Покажіть головку грифа, кілок, верхній поріжок, накладку грифа й бридж. Поріжок і сідло задають вібруючу довжину
      відкритої струни. Затиснута нота скорочує її на металевому ладі.
  numbering:
    title: Струни й лади
    body: >-
      Струна 1 — найтонша, а 6 — найтовща. Лад 0 означає відкриту струну. Торкніться місця перед першим металевим
      ладом, а потім перед третім. Номер ладу позначає місце гри, а не гвинт чи інкрустацію.
  electronics:
    title: Знайдіть органи керування звуком
    body: >-
      Знайдіть звукознімачі під струнами, їхній перемикач, Volume, Tone та вихідне гніздо, якщо вони є. Звукознімач
      перетворює коливання струни на електричний сигнал, який далі передає кабель. Частина органів керування може
      бути відсутня або поєднана.
  tour:
    title: Хвилинний огляд інструменту
    body: >-
      Не дивлячись у текст, покажіть частину для налаштування струни, місце біля ладу для пальця й вихідне гніздо.
      Назвіть один орган керування, призначення якого ще треба уточнити в інструкції гітари.
activities: {}
learningTasks:
  review:
    title: Перевірте свою практику
    body: Позначайте лише те, що перевірили самостійно. Поверніться до непозначеного пункту на наступному занятті.
    items:
      criterion-1: Я можу простежити струну від кілка до бриджа.
      criterion-2: Я можу визначити струну 1 і лад 0.
      criterion-3: Я знаю, де розташовані вихід і регулятор гучності моєї гітари.
  knowledge:
    title: Яка частина змінює натяг струни під час налаштування?
    body: Виберіть одну відповідь і порівняйте її з поясненням.
    items:
      answer-1: Кілок
      answer-2: Перемикач звукознімачів
      answer-3: Регулятор Tone
    explanation: >-
      Кілок намотує або послаблює струну. Перемикач звукознімачів і Tone змінюють електричний звук, а не стрій струни.
