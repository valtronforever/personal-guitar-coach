lessonID: sweep-picking
lessonVersion: 1
locale: uk
title: Проведи sweep через невелике арпеджіо
summary: Поєднай сусідні струни одним напрямком, озвучуючи кожну ноту окремо.
goal: Скоординуй контрольований sweep на двох-трьох струнах із чітким припиненням нот і рівним пульсом.
body: |-
  Sweep picking проводить медіатор через сусідні струни одним напрямком, а рука на грифі робить кожну ноту окремою. Хоча шлях руки може нагадувати повільний бій, результатом має бути арпеджіо, а не одночасний акорд. Почни з двох струн і свідомих пауз. Швидкість не корисна, доки ти не контролюєш початок кожної ноти й припинення попередньої.

  У прикладі на дві струни підготуй нижню ноту й зіграй ударом униз. Дозволь медіатору наблизитися до наступної тоншої струни без відведення для нового великого удару. Озвуч другу ноту на її записаній долі, потім припини звук під час паузи. Безперервний напрямок не означає поспішно зібрати дві ноти в одну мить. У цьому повільному навчальному темпі ти вивчаєш шлях і таймінг перед плавнішим рухом.

  Додай третю струну, щоб завершити мажорний тризвук. Послаблюй попереднє притискання з початком наступної ноти, зберігаючи достатній контакт для запобігання зайвому дзвону. Якщо сусідні струни мають спільний лад, спробуй невелике контрольоване перекочування пальця, замість утримувати обидві ноти баре. Обери зручні пальці; додаток недосконало чує накладання чи неправильні висоти й не спостерігає саме перекочування.

  Окремо відпрацюй зворотний напрямок: sweep угору від найтоншої струни до товстіших. Зберігай ті самі ритмічні проміжки, що й при русі медіатора вниз через струни. У проході туди й назад заверши рух униз, відрахуй записану паузу, потім почни зворотний sweep. Це розділяє напрямки перед спробою безперервного розвороту. Мінорна форма змінює терцію на один лад, зберігаючи порядок струн і план напрямків руки.

  Використовуй чистий вхід і зберігай вимірювану практику одноголосною. Переглянь результат нот і таймінгу, потім окремо послухай накладання нот, зайвий шум струн і раптовий поспіх на переході. Стрілки описують потрібний рух; оцінка не доводить sweep, перекочування пальця чи відсутність окремих ударів. Повторюй найменшу групу, яка потребує роботи, зберігаючи паузу й пульс. Підвищуй темп лише невеликими кроками, коли окремі ноти лишаються чіткими в обох напрямках.
steps:
  prepare:
    title: Підготуй чіткі окремі ноти
    body: Налаштуй гітару, використовуй чистий вхід і переглянь порядок струн перед грою.
  two-strings:
    title: Проведи медіатор через дві струни
    body: 'Два удари вниз розділені однією долею. Зупинися на дві долі перед повторенням пари. Ноти звучання: {{sequence}}.
      Фіксований рисунок струн є частиною прийому; ця активність не пропонує перенесення. Практика перевіряє висоту
      й таймінг, а фізичну вказівку перевіряй самостійно.'
  major-down:
    title: Проведи мажорний тризвук униз
    body: 'Зіграй основний звук, терцію й квінту мажору від {{root}} на трьох сусідніх струнах, потім витримай долю
      паузи. Ноти звучання: {{sequence}}. Фіксований рисунок струн є частиною прийому; ця активність не пропонує
      перенесення. Практика перевіряє висоту й таймінг, а фізичну вказівку перевіряй самостійно.'
  major-up:
    title: Зміни напрямок sweep
    body: 'Зіграй квінту, терцію й основний звук трьома ударами вгору; збережи нижні ноти такими ж окремими, як
      верхні. Ноти звучання: {{sequence}}. Фіксований рисунок струн є частиною прийому; ця активність не пропонує
      перенесення. Практика перевіряє висоту й таймінг, а фізичну вказівку перевіряй самостійно.'
  round-trip:
    title: Підготуйся й зіграй зворотний sweep
    body: 'Кожна група на три ноти використовує восьмі, потім записану паузу для підготовки до наступного напрямку.
      Відрахуй усю паузу. Ноти звучання: {{sequence}}. Фіксований рисунок струн є частиною прийому; ця активність
      не пропонує перенесення. Практика перевіряє висоту й таймінг, а фізичну вказівку перевіряй самостійно.'
  minor-shape:
    title: Збережи рух у мінорній формі
    body: 'Знизь терцію на один лад, залишивши основний звук і квінту. Порівняй новий звук із мажорною формою в
      одному темпі. Ноти звучання: {{sequence}}. Фіксований рисунок струн є частиною прийому; ця активність не пропонує
      перенесення. Практика перевіряє висоту й таймінг, а фізичну вказівку перевіряй самостійно.'
  check-sweep:
    title: Перевір окремість нот і рух
    body: Поєднай виміряні ноти з прямим спостереженням за медіатором і рукою на грифі.
