learningTasks:
  check-sweep:
    title: Review separation and motion
    body: Use the measured notes with direct observation of the pick and fretting hand.
    items:
      path: The pick continued through neighboring strings in the marked direction.
      notes: I heard distinct notes instead of a chord ringing together.
      release: I controlled the release or roll between adjacent fretted notes.
      time: Each crossing and reset rest kept its intended timing.
