lessonID: cm-arpeggio-c-standard
lessonVersion: 1
locale: uk
title: Від форми Cm до окремих нот · C Standard
summary: Подивися акорд до мінор, а потім зіграй його ноти по черзі.
goal: Вивчи відкриту форму Cm і зіграй її арпеджіо вгору та вниз окремими чистими нотами.
body: |-
  Цей урок належить до курсу C Standard. Для підготовки вибирай уроки з позначкою C Standard.

  Перед початком: пройди уроки відкритих струн і перших ладів та попрактикуй рівні чверті. Налаштуй стрій C Standard, A4 = 440 Гц.

  Cm означає до мінор. Назви його нот — C, E♭, G. Відкрита форма, струни 6 → 1, має лади 0–2–2–0–0–0 і звучить як C2, G2, C3, E♭3, G3, C4. Орієнтир: середній палець на струні 5, ладі 2 і безіменний на струні 4, ладі 2. Решта струн відкриті.

  В акорді кілька нот можуть звучати разом; арпеджіо грає його ноти послідовно. Вибери форму, щоб побачити всі позиції, або послухай приклад. Акордовий приклад призначений лише для слухання й візуалізації. Ця практика не оцінює одночасне звучання акорду.

  В оцінюваному арпеджіо зупиняй кожну попередню струну перед наступним щипком. Можна тримати аплікатуру й легко приглушувати струни рукою, якою граєш, але уникай накладання нот. Почни на 60 BPM; 40–50 BPM дають більше часу для приглушення та переходів. Після зручного повтору спробуй 70 BPM. Якщо результат повідомляє про невизначений сигнал, перевір накладання струн і якість входу, перш ніж робити висновки про ноти.

  У C Standard знайома аплікатура Em звучить як Cm (до мінор). Позиції пальців ті самі, але кожна струна звучить на чотири півтони нижче, ніж у Standard.
steps:
  shape:
    title: 1. Розглянь форму Cm
    body: >-
      Затискаються лише струни 5 і 4, обидві на ладі 2. До форми входять усі шість струн. Номери пальців — підказка
      аплікатури, а не вимір із аудіо.
  low-notes:
    title: 2. Зіграй чотири низькі ноти
    body: 'Такт 1: струни 6, 5, 4, 3 дають C2, G2, C3, E♭3. По одній ноті на клік; зупиняй попередню.'
  top-and-turn:
    title: 3. Дійди до C4 та розвернися
    body: 'Такт 2: струни 2, 1, 2, 3 дають G3, C4, G3, E♭3. Верхня C4 звучить один раз.'
  return-and-rest:
    title: 4. Повернися до C2 та зроби паузу
    body: 'Такт 3: струни 4, 5, 6 дають C3, G2, C2. Доля 4 — пауза. Зупини останню ноту й продовжуй рахувати.'
  whole-arpeggio:
    title: 5. Попрактикуй повне арпеджіо
    body: >-
      Вибери практику цих трьох тактів. Очікуються одинадцять окремих атак, потім одна пауза. Результат оцінює чутну
      висоту й час атак за придатних умов, а не те, чи кожен палець тримає форму Cm.
