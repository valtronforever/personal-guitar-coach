lessonID: triad-inversions
lessonVersion: 1
locale: uk
title: 'Обернення тризвуків: змініть бас, збережіть акорд'
summary: >-
  Зіграйте один мажорний тризвук в основному виді та двох оберненнях на верхніх трьох струнах, потім поєднайте їх
  у короткі фрази.
goal: >-
  Розпізнавати основний тон, терцію або квінту в найнижчому голосі, зберігаючи основний тон акорду та його мажорний
  характер.
body: |-
  Основний тон акорду визначає його гармонію. Бас — найнижча нота, яка фактично звучить. В основному виді вони збігаються, але в оберненні це не обов’язково. Мажорний тризвук завжди містить основний тон, велику терцію та чисту квінту; перенесення іншого звуку вниз змінює обернення, а не мажорний характер.

  Урок використовує лише струни 3, 2 і 1. Три нижні струни мають мовчати. У першій формі голоси піднімаються як основний тон–терція–квінта. Найнижча нота тому є одночасно басом і основним тоном акорду. Повільно переберіть три звуки, потім тихо спробуйте акорд на трьох струнах поза оцінюваною практикою. Читайте адаптований основний тон і назви нот для обраного строю замість запам’ятовування однієї звучної назви.

  У першому оберненні ролі знизу вгору такі: терція–квінта–основний тон. Основний тон перейшов у найвищий голос, а терція стала басом. У другому оберненні це квінта–основний тон–терція, з квінтою в басу. Це тісне розташування голосів: сусідні звуки акорду вміщуються в межах однієї октави. Аплікатура переходить у різні ділянки тих самих трьох струн, а деякі звуки змінюють октаву. Це відрізняється від вибору позиції уроку, який шукає ті самі точні висоти в іншому місці.

  Порівняйте три показані форми до запуску перевірок окремих нот. Назвіть роль найнижчого звуку, потім знайдіть усередині форми основний тон. Не перейменовуйте акорд за басом. Усі три форми зберігають той самий основний тон акорду. У цих прикладах на верхніх струнах понижена струна Drop не використовується, тому відповідна пара Standard/Drop має однакові цільові позиції верхніх струн.

  Далі поєднайте основний вид→перше обернення→друге обернення→перше обернення. Кожен такт містить три висхідні чвертні ноти й одну чвертну паузу; під час паузи відпускайте руку та готуйте наступну позицію. На 50 BPM важливіше вчасно підготувати першу ноту, ніж поспішати під час переходу. Остання фраза змінює порядок: перше обернення→основний вид→друге обернення→основний вид. Тепер потрібно читати роль баса, а не лише пам’ятати висхідний маршрут.

  Слухайте зміну нижнього голосу при незмінній гармонії. Ритмічні вправи перевіряють окремо зіграні висоти та їхні атаки. Вони не доводять утримання акорду на трьох струнах, використання конкретного пальця чи економність переходу. Порівнюйте повні тризвуки та зручність рухів окремо, короткими спробами.
steps:
  prepare:
    title: Назвіть роль баса, потім основний тон
    body: >-
      Використовуйте струни 3–1, залишаючи струни 6–4 тихими. До гри кожної форми визначте найнижчий звук як основний
      тон, терцію або квінту, потім знайдіть основний тон акорду. Почніть без таймера.
  review:
    title: Відокремте гармонію від регістру
    body: >-
      Тихо порівняйте повні форми на трьох струнах поза оцінюваною практикою. Опишіть зміну ролі баса та незмінний
      основний тон акорду. Потім спробуйте обидва чотиритактові порядки й готуйте наступну ділянку під час паузи.
  root-position-shape:
    title: 'Основний вид: основний тон–терція–квінта'
    body: >-
      Основний тон акорду — {{root}}. Нота на струні 3 є одночасно басом і основним тоном. Струни 2 і 1 дають терцію
      та квінту. {{positions}}. Послухайте три голоси знизу вгору.
  root-position-notes:
    title: '{{root}} мажорний — основний вид (перевірка струн)'
    body: >-
      Грайте струни 3, 2 і 1 знизу вгору по одній на клік на 50 BPM. Щоразу зупиняйте попередній звук, потім відрахуйте
      решту записаних пауз до завершення двох тактів. Визначте роль баса до першої ноти. Бал перевіряє окремі висоти
      й час. {{positions}}.
  first-inversion-shape:
    title: 'Перше обернення: терція–квінта–основний тон'
    body: >-
      Основний тон акорду залишається {{root}}; тепер він на струні 1. Струна 3 дає терцію в басу, а струна 2 —
      квінту. {{positions}}. Інший бас не перетворює це на новий тризвук.
  first-inversion-notes:
    title: '{{root}} мажорний — перше обернення (перевірка струн)'
    body: >-
      Грайте струни 3, 2 і 1 знизу вгору по одній на клік на 50 BPM. Щоразу зупиняйте попередній звук, потім відрахуйте
      решту записаних пауз до завершення двох тактів. Визначте роль баса до першої ноти. Бал перевіряє окремі висоти
      й час. {{positions}}.
  second-inversion-shape:
    title: 'Друге обернення: квінта–основний тон–терція'
    body: >-
      Основний тон акорду залишається {{root}}, тепер на струні 2. Бас на струні 3 — квінта, а струна 1 дає терцію.
      {{positions}}. Порівняйте роль баса з попередніми двома формами.
  second-inversion-notes:
    title: '{{root}} мажорний — друге обернення (перевірка струн)'
    body: >-
      Грайте струни 3, 2 і 1 знизу вгору по одній на клік на 50 BPM. Щоразу зупиняйте попередній звук, потім відрахуйте
      решту записаних пауз до завершення двох тактів. Визначте роль баса до першої ноти. Бал перевіряє окремі висоти
      й час. {{positions}}.
  question:
    title: Обернення чи новий акорд?
    body: Порівняйте ролі звуків акорду перед відповіддю.
  ascending-regions:
    title: Поєднайте три ділянки
    body: >-
      Основний тон акорду — {{root}}. Грайте в порядку: основний вид → перше → друге → перше. У кожному такті три
      чвертні атаки на струнах 3–1, потім чвертна пауза для підготовки наступної позиції. Почніть із 50 BPM і зупиняйте
      попередні ноти, щоб вони не накладалися. {{sequence}}.
  read-the-bass:
    title: Читайте зміну ролі баса
    body: >-
      Основний тон акорду — {{root}}. Грайте в порядку: перше → основний вид → друге → основний вид. У кожному такті
      три чвертні атаки на струнах 3–1, потім чвертна пауза для підготовки наступної позиції. Почніть із 50 BPM
      і зупиняйте попередні ноти, щоб вони не накладалися. {{sequence}}.
