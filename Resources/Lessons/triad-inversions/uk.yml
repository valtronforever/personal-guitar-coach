learningTasks:
  question:
    title: Обернення чи новий акорд?
    body: У мажорного тризвуку найнижчий звучний звук — терція. Який опис правильний?
    items:
      first: Це перше обернення; початковий основний тон продовжує називати акорд.
      minor: Акорд стає мінорним, бо терція нижча за основний тон.
      new: Бас автоматично стає новим основним тоном акорду.
    explanation: >-
      Обернення визначає, який звук акорду знаходиться в басу. Терція в басу — перше обернення, квінта — друге.
      Інтервали тризвуку відносно його основного тону зберігають мажорний характер.
  review:
    title: Самостійно перевірте повний акорд
    body: Позначте лише те, що справді перевірили.
    items:
      roles: 'Я назвав ролі баса: основний тон, терція та квінта у трьох формах.'
      root: Я знайшов незмінний основний тон акорду на різних струнах у кожній формі.
      phrases: Я спробував обидва чотиритактові порядки й готував наступну позицію під час паузи.
      chords: Я порівняв повні тризвуки окремо від вимірюваної практики поодиноких нот.
