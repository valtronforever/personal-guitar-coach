learningTasks:
  question:
    title: An inversion or a new chord?
    body: A major triad has its third as the lowest sounding note. Which description is correct?
    items:
      first: It is first inversion; the original harmonic root still names the chord.
      minor: It becomes minor because its third is below the root.
      new: The bass becomes a new harmonic root automatically.
    explanation: >-
      Inversion identifies which chord member is in the bass. Third in the bass is first inversion, fifth in the
      bass is second inversion. The intervals defining the triad relative to its harmonic root retain its major
      quality.
  review:
    title: Check the full chord yourself
    body: Mark only what you actually tried.
    items:
      roles: I named the bass roles root, third and fifth in the three shapes.
      root: I found the unchanged harmonic root on a different string in each shape.
      phrases: I tried both four-bar orders and prepared the next position during the rest.
      chords: I compared complete triads separately from the measured single-note practice.
