    title: '{{root}} major — root position (shape)'
    body: 'Root: {{root}}. Sounding chord tones: {{notes}}.'
  root-position-notes:
    title: '{{root}} major — root position (string check)'
    body: Play every target separately, then release. {{sequence}}.
  first-inversion-shape:
    title: '{{root}} major — first inversion (shape)'
    body: 'Root: {{root}}. Sounding chord tones: {{notes}}.'
  first-inversion-notes:
    title: '{{root}} major — first inversion (string check)'
