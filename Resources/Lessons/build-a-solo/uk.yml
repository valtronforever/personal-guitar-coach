    items:
      form: Я міг визначити вступ, розвиток і завершення на слух.
      motif: Упізнавана ідея повернулася після першої появи.
      contrast: Я використав свідомий контраст і щонайменше одну паузу.
      end: Я обрав останню ноту й завершив свідомо.
      compare: Я порівняв одне конкретне рішення у двох версіях.
