lessonID: build-a-solo
lessonVersion: 1
locale: uk
title: Побудуй коротке соло з формою
summary: Заплануй початок, розвиток і чітке завершення з невеликого набору звуків.
goal: Створи восьмитактове соло з чутними повторенням ідеї, контрастом і завершенням.
body: |-
  Короткому соло корисна форма, за якою слухач може стежити. Більша швидкість чи кількість позицій гами не створюють розвиток автоматично. Почни з невеликої ідеї, дай їй стати впізнаваною, зміни одну-дві риси й заверши свідомо. Тут восьмитактова мінорно-пентатонічна модель показує, що повна структура вміщується в невеликий діапазон висот.

  Сприймай такти 1–2 як вступ. Початковий мотив використовує основний звук, малу терцію й четвертий ступінь, після чого залишає простір. Скопіюй фрагмент і слухай характер ідеї, а не лише читай лади. Коротко запиши словами план власного початку: наприклад, невелика висхідна ідея з паузою. Обери план, який можеш зіграти в зручному темпі.

  Такти 3–6 розвивають матеріал. Модель спочатку повторює знайомий початок з іншим ритмом, потім доходить до вищих звуків і щільнішого руху. Найвища точка підготовлена, а не з’являється як непов’язана вправа. У власній версії обери один спосіб розвитку: повторити мотив зі зміненим ритмом, подовжити закінчення або рухатися до вищого регістру. Не потрібно використовувати все одночасно.

  Такти 7–8 зменшують щільність і повертаються до чіткого завершення на основному звуці з простором після нього. Остання нота переконливіша, коли ти обираєш її початок і кінець фрази. Не додавай ноти лише тому, що метроном далі звучить. Скопіюй завершення окремо, потім з’єднай із ним останній такт розвитку без додаткової паузи на межі.

  Тепер зіграй повну модель і визнач на слух її три частини. Зменш гучність еталонного тону, залиш метроном і створи власні вісім тактів. Плануй до гри: два такти для вступу, чотири для розвитку, два для завершення. Використай кілька зручних висот і залиш щонайменше одну свідому паузу. Можеш записати власну табулатуру поза додатком, але не потрібно повторювати модель нота в ноту.

  Зіграй дві версії та порівняй конкретне рішення замість загальної оцінки «добре» чи «погано». Чи лишилася повторена ідея впізнаваною? Чи щільніша частина дала контраст? Чи завершення звучало свідомо? Якщо перехід незручний, спрости його замість компенсації швидкістю. Тут використовується самоперевірка; жодна числова оцінка не вимірює виразність, оригінальність чи якість соло. Додаток дає часовий зразок, читабельні ноти й метроном, а музичні рішення лишаються твоїми.
steps:
  prepare:
    title: Обери невелику музичну ідею
    body: Прочитай план, обери зручний чистий звук і почни повільно.
  opening:
    title: Представ ідею
    body: 'Центр: {{root}} мінор. Два такти представляють невеликий мотив і простір навколо нього. Опиши початок
      перед копіюванням, потім вигадай пов’язаний власний початок. Ноти звучання: {{sequence}}. Показана аплікатура
      — орієнтир; звук не доводить використання струни чи пальця.'
  development:
    title: Розвинь і дійди до вершини
    body: 'Чотири такти змінюють початковий ритм, рухаються вище й повертаються до менш щільної лінії. Обери один
      подібний спосіб розвитку власної ідеї. Ноти звучання: {{sequence}}. Показана аплікатура — орієнтир; звук не
      доводить використання струни чи пальця.'
  ending:
    title: Заверши й залиш простір
    body: 'Два такти спускаються до основного звуку, утримують його дві долі й залишають останні дві тихими. З’єднай
      це завершення з розвитком без вставленої паузи. Ноти звучання: {{sequence}}. Показана аплікатура — орієнтир;
      звук не доводить використання струни чи пальця.'
  complete-solo:
    title: Почуй повну восьмитактову форму
    body: 'Такти 1–2 представляють ідею, 3–6 розвивають, 7–8 завершують. Прослухай повну форму, потім зменш еталонний
      тон і зіграй власні вісім тактів під метроном. Ноти звучання: {{sequence}}. Показана аплікатура — орієнтир;
      звук не доводить використання струни чи пальця.'
  plan-and-compare:
    title: Створи й порівняй дві версії
    body: Заплануй два вступні такти, чотири такти розвитку й два завершальні. Зіграй план двічі, змінивши одне
      музичне рішення в другій версії.
