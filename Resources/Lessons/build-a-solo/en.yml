    items:
      form: I could identify the introduction, development and ending by ear.
      motif: A recognizable idea returned after its first appearance.
      contrast: I used a deliberate contrast and at least one silence.
      end: I chose the final note and stopped deliberately.
      compare: I compared one specific decision across two versions.
