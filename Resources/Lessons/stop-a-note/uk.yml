lessonID: stop-a-note
lessonVersion: 1
locale: uk
title: Як зупинити звучання ноти
summary: Навмисно зупиняйте ноту, продовжуючи рахунок.
goal: Навмисно зупиняйте ноту, продовжуючи рахунок.
body: >-
  Тиша на гітарі потребує дії. Відкриті струни продовжують коливатися, коли рука на грифі піднята, тому для зупинки
  потрібен навмисний контакт. Це слухова вправа із самооцінкою: поточний детектор атак не підтверджує точного кінця
  кожної ноти.
steps:
  open:
    title: Зупиніть відкриту струну
    body: >-
      Зіграйте відкриту струну 3 й дайте їй звучати. Легко торкніться струни вільним пальцем або краєм руки з медіатором,
      щоб зупинити її. Мета — тихий контакт, а не новий удар.
  fretted:
    title: Послабте тиск без відриву
    body: >-
      Затисніть струну 3 на ладу 2, зіграйте й послабте тиск, залишивши кінчик пальця на струні. Повний відрив може
      дати зазвучати відкритій струні. Повільно порівняйте ці два способи відпускання.
  rests:
    title: Звук, тиша, звук, тиша
    body: >-
      Рахуйте чотири долі. Зіграйте на 1, зупиніть на 2, зіграйте на 3 і зупиніть на 4. Повторіть спочатку на відкритій
      струні, потім на ладу 2. Рахуйте й під час тиші. Синтезований приклад — орієнтир висоти й пульсу, а не демонстрація
      контакту руки. {{positions}}
  review:
    title: Послухайте проміжки
    body: >-
      На долях 2 та 4 спеціально слухайте, чи не проривається відкрита струна або друга атака від руху глушіння.
      Повторюйте один такт, доки різниця між звуком і тишею стане навмисною. Самостійно оцініть зупинку звуку.
activities:
  example:
    title: Приклад для вашого інструменту
    body: >-
      Очікувана послідовність: {{sequence}}. Виберіть крок, щоб побачити його позиції. У прикладі звучать синтезовані
      еталонні ноти.
learningTasks:
  review:
    title: Перевірте свою практику
    body: Позначайте лише те, що перевірили самостійно. Поверніться до непозначеного пункту на наступному занятті.
    items:
      criterion-1: Я можу зупинити відкриту ноту без нової чутної атаки.
      criterion-2: Відпускаючи затиснуту ноту, я зберігаю контакт.
      criterion-3: Я можу продовжувати рахунок, коли струна мовчить.
