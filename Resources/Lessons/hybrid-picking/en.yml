learningTasks:
  check-hybrid:
    title: Review the hand roles and sound
    body: Confirm what you actually observed; the note score cannot certify these physical choices.
    items:
      roles: I used the pick, middle and ring fingers at their marked notes.
      grip: I retained a comfortable pick grip while the other fingers moved.
      balance: I listened for unwanted changes in volume between pick and fingers.
      single: I kept the measured line monophonic and counted its subdivisions.
