lessonID: hybrid-picking
lessonVersion: 1
locale: uk
title: Поєднай медіатор із вільними пальцями
summary: Чергуй нижні ноти медіатором із верхніми нотами пальцями.
goal: Читай позначки медіатора й пальців та координуй одноголосний hybrid-рисунок із рівним пульсом.
body: |-
  Hybrid picking залишає медіатор у роботі, а вільні пальці тієї самої руки грають інші струни. У цих прикладах медіатор бере нижні ноти, середній палець — другу струну, безіменний — першу. Ролі стосуються руки звуковидобування незалежно від праворукої чи ліворукої гри. Почни з одного пальця перед чергуванням двох.

  Тримай медіатор зручно великим і вказівним пальцями, залишаючи середній і безіменний доступними, а не жорстко витягнутими. Щипок пальцем може бути невеликим і близьким до струни. Не зачіпляй її глибоко знизу й не відтягуй із зайвою силою. Можна використовувати зручний контакт подушечки чи нігтя; мета тут — контрольована нота, а не визначена форма нігтя чи обов’язковий гучний клац.

  Вивчи позначення до початку: стрілки — удари медіатором, m — середній палець руки звуковидобування, a — безіменний. Це вказівки, а не виявлені результати. Перший рисунок чергує удар униз на нижній струні з m на верхній, по одній ноті на долю. Зберігай зручні тривалості й рівні атак. Слухай, чи не запізнюється нота пальцем після впевненої ноти медіатором, і за потреби ізолюй цю пару.

  Додай безіменний палець, зберігши за кожним пальцем його верхню струну. Приклад зі зміною порядку вимагає обирати палець за наступною записаною струною, а не за завченим чергуванням m–a. Легко підготуй ціль, виконай щипок і припини попередню ноту з початком наступної для вимірюваної одноголосної практики. Одна нота, що звучить одночасно, дозволяє додатку надійно порівняти лінію.

  Остання фраза поєднує довші ноти медіатором із парами коротших нот пальцями. Рахуй поділи долі навіть під час довших нижніх нот. Оцінка перевіряє чутні висоти й початкові атаки, а не вибір пальця, хват медіатора, приглушення чи баланс між медіатором і пальцями. Використовуй самоперевірку для цих фізичних і слухових спостережень. Після виміряної версії можеш самостійно дослідити спільне звучання окремих нот; така фактура виходить за межі одноголосної оцінки. Підвищуй темп лише тоді, коли перехід між медіатором і пальцями повторюваний.
steps:
  prepare:
    title: Підготуй план струн і ударів
    body: Налаштуй інструмент, почни повільно з чистим входом і прочитай фізичні вказівки перед практикою.
  pick-and-middle:
    title: Чергуй медіатор і середній палець
    body: 'Використовуй удар униз на четвертій струні та m на другій. Тримай невикористану проміжну струну тихою.
      Ноти звучання: {{sequence}}. Фіксований рисунок струн є частиною прийому; ця активність не пропонує перенесення.
      Практика перевіряє висоту й таймінг, а фізичну вказівку перевіряй самостійно.'
  two-fingers:
    title: Признач палець кожній верхній струні
    body: 'm грає другу струну; a — першу. Залиш медіатор готовим до наступної нижньої ноти. Ноти звучання: {{sequence}}.
      Фіксований рисунок струн є частиною прийому; ця активність не пропонує перенесення. Практика перевіряє висоту
      й таймінг, а фізичну вказівку перевіряй самостійно.'
  inside-outside:
    title: Стеж за змінним порядком верхніх струн
    body: 'Читай позначку пальця для кожної восьмої; послідовність не є постійним чергуванням m–a. Ноти звучання:
      {{sequence}}. Фіксований рисунок струн є частиною прийому; ця активність не пропонує перенесення. Практика
      перевіряє висоту й таймінг, а фізичну вказівку перевіряй самостійно.'
  hybrid-phrase:
    title: Зберігай поділи долі під час нижніх нот
    body: 'Після четвертної медіатором ідуть дві восьмі пальцями. Рахуй однакові поділи долі протягом обох тривалостей.
      Ноти звучання: {{sequence}}. Фіксований рисунок струн є частиною прийому; ця активність не пропонує перенесення.
      Практика перевіряє висоту й таймінг, а фізичну вказівку перевіряй самостійно.'
  check-hybrid:
    title: Перевір ролі руки й звук
    body: Підтверди те, що справді спостерігав; оцінка нот не засвідчує ці фізичні рішення.
