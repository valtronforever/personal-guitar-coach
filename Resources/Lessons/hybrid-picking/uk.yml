    title: Перевір ролі руки й звук
    body: Підтверди те, що справді спостерігав; оцінка нот не засвідчує ці фізичні рішення.
    items:
      roles: Я використовував медіатор, середній і безіменний пальці на позначених нотах.
      grip: Я зберігав зручний хват медіатора під час руху інших пальців.
      balance: Я слухав небажані зміни гучності між медіатором і пальцями.
      single: Я зберігав вимірювану лінію одноголосною й рахував поділи долі.
