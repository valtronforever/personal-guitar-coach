lessonID: gallop-patterns
lessonVersion: 1
locale: uk
title: Галоп і зворотний галоп
summary: Розмістіть восьму й дві шістнадцяті у двох порядках як основу металевого ритму.
goal: Зберігати пульс чвертей, перемикаючись між довго-коротко-коротко та коротко-коротко-довго.
body: |-
  Галоп поєднує восьму й дві шістнадцяті в одній чвертній долі: довго-коротко-коротко. На рахунок 1-е-і-а атаки припадають на 1, і та а. Зворотний галоп має дві шістнадцяті й восьму: коротко-коротко-довго, з атаками на 1, е та і. В обох три атаки, але доля поділена на чотири рівні шістнадцяті місця, тому це не рівні тріолі.

  Почніть із 50 BPM. Промовте чотиричастинний рахунок перед грою й збережіть невеликий рух змінного штриха. TAB дає підказку вниз/угору для кожної ноти. Через три атаки на долю строгий змінний штрих починає сусідні долі в протилежних напрямках. Продовжуйте малюнок, не скидайте його до удару вниз на кожному кліку. Це запропоновані навчальні рухи; оцінка звуку не підтверджує їх.

  Зіграйте два такти повторюваного галопу, потім окремо зворотний варіант у тому самому темпі. У першому залиште простір після початкової атаки й розмістіть дві короткі ноти наприкінці долі. У зворотному спершу зіграйте коротку пару, потім дайте останній ноті повну половину долі. Поширена помилка — зрівняти всі три проміжки або поспішити кінцевою парою до наступного кліку. Виправте малюнок на одній долі, потім з’єднайте два такти.

  Чотиритактовий риф використовує відкриту басову струну й змінні верхні відповіді. Такт 1 — галопи, такт 2 — зворотні, такт 3 чергує два малюнки по долях. У такті 4 чвертний бас і три тихі долі для відпускання руки. Урок адаптує тоніку від найнижчої струни: Standard і Drop зберігають потрібні інтервали відносно баса та показують актуальні ноти й позиції.

  Для оцінюваних вправ використовуйте чистий неприглушений звук. Після опанування ритму окремо спробуйте palm muting за попереднім уроком приглушення; його тембр і напрямок медіатора не перевіряє ця оцінка висоти/атак. Найкоротші ноти задають тут межу оцінюваного темпу 40–70 BPM. Спершу рівність і розслаблена рука, потім швидкість чи дисторшн. Переглядайте час короткої пари, а не сприймайте загальний бал як доказ техніки.
steps:
  prepare:
    title: Чотири місця, три атаки
    body: >-
      Установіть 50 BPM. Промовте 1-е-і-а й спочатку простукайте всі чотири частини. Для галопу приберіть атаку
      на е, зберігши її час; для зворотного — на а, продовжуючи останню ноту.
  gallop-pulse:
    title: Довго-коротко-коротко
    body: >-
      Зіграйте вісім груп у двох тактах. Атаки на число, і та а. Продовжуйте показаний змінний штрих через межі
      долей; наступна група може починатися рухом угору. Розрізняйте дві короткі ноти.
  reverse-pulse:
    title: Коротко-коротко-довго
    body: >-
      Збережіть той самий пульс і бас. Атаки на число, е та і; остання восьма триває через а. Порівняйте змінений
      проміжок із першою вправою без зміни темпу.
  gallop-riff:
    title: Перенесіть ритм на басовий риф
    body: >-
      Такт 1 — галопи, 2 — зворотні, 3 — галоп/зворотний/галоп/зворотний. Верхня відповідь змінюється, бас повертається.
      У такті 4 лише чвертний бас на початку й три тихі долі. {{sequence}}.
  review:
    title: Перевірте коротку пару й відновлення руки
    body: >-
      Порівняйте час двох шістнадцятих із долею навколо. Повторіть слабший малюнок на одній висоті, потім поверніть
      верхню відповідь. Напрямок медіатора, напруження й відпускання руки перевірте самі; додаток вимірює висоти
      й час атак.
  question:
    title: Який рахунок описує галоп?
    body: Відрахуйте поділ долі перед відповіддю.
activities:
  gallop-pulse:
    title: Довго-коротко-коротко
    body: >-
      Зіграйте вісім груп у двох тактах. Атаки на число, і та а. Продовжуйте показаний змінний штрих через межі
      долей; наступна група може починатися рухом угору. Розрізняйте дві короткі ноти.
  reverse-pulse:
    title: Коротко-коротко-довго
    body: >-
      Збережіть той самий пульс і бас. Атаки на число, е та і; остання восьма триває через а. Порівняйте змінений
      проміжок із першою вправою без зміни темпу.
  gallop-riff:
    title: Перенесіть ритм на басовий риф
