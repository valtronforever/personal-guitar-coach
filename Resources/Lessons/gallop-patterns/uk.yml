      У такті 4 лише чвертний бас на початку й три тихі долі. {{sequence}}.
learningTasks:
  question:
    title: Який рахунок описує галоп?
    body: Для восьмої–шістнадцятої–шістнадцятої в одній долі де атаки на 1-е-і-а?
    items:
      gallop: '1, і, а: перша нота займає 1 та е.'
      reverse: '1, е, і: остання нота займає і та а.'
      triplet: Три рівні проміжки незалежно від чотиричастинного рахунку.
    explanation: >-
      Звичайний галоп — довго-коротко-коротко (2+1+1 шістнадцятих місць), зворотний — 1+1+2. Рівні тріолі натомість
      ділять долю на три.
  review:
    title: Перевірте свій пульс
    body: Позначте лише власні спостереження.
    items:
      shape: Я розрізнив 2+1+1 та 1+1+2 без зміни темпу.
      strokes: Я перевірив безперервний змінний штрих, не вважаючи бал його доказом.
      release: Я зберіг пульс рифу й відпустив руку протягом трьох останніх тихих долей.
