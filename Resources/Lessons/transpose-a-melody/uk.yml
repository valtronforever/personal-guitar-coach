lessonID: transpose-a-melody
lessonVersion: 1
locale: uk
title: Перенесення мелодії в іншу тональність
summary: Перенесіть кожну висоту на однаковий інтервал зі збереженням ритму.
goal: Зіграти коротку мелодію у двох тональностях і відрізнити транспонування від іншої аплікатури тих самих нот.
body: 'Транспонування змінює кожну висоту на однаковий музичний інтервал. Ритм і відстані між послідовними нотами
  зберігаються, тому мелодія лишається впізнаваною в новій тональності. Друга версія тут на тон, тобто два півтони,
  вища за першу. Літерні назви залежать від строю інструменту, але між версіями завжди два півтони.


  Усі вихідні ноти тут затиснуті. Переміщення позицій на два лади вище на тих самих струнах підвищує їх на два півтони
  без зміни форми. Фраза з відкритими струнами при русі вниз потребувала б іншої аплікатури, а не уявного ладу нижче
  нуля. Загальне транспонування може також упертися в межу грифа; придатна ціль — частина аранжування.


  Не плутайте це з вибором іншої ділянки для тих самих звучних нот. Тоді позиції змінюються, а тональність та октава
  лишаються. Тут ви маєте чути й читати нові висоти. Грайте обидві версії на однаковому темпі й силі, порівнюючи
  спільний контур: інша фізична позиція не завжди означає іншу тональність.'
steps:
  prepare:
    title: Передбачте зміну
    body: Огляньте першу ціль обох версій. Передбачте першу ноту другої на два півтони вище й підтвердіть повну
      назву. Для порівняння не змінюйте налаштування інструменту.
  original-key: &id001
    title: Вивчіть початковий контур
    body: 'Зіграйте сім чвертей і долю паузи на 50 BPM: підніміться першими трьома нотами, досягніть квінти й поверніться
      тим самим шляхом. Зробіть дві рівні спроби. {{sequence}}.'
  whole-tone-up: &id002
    title: Підніміть кожну ціль на два півтони
    body: Грайте за маркерами другої версії на тому самому темпі. Ритм і порядок струн збережені. Слухайте підвищення
      всієї фрази, а не лише першої ноти. {{sequence}}.
  phrase-pairs: &id003
    title: Порівняйте по такту в кожній тональності
    body: Зіграйте перші чотири ноти початкової тональності, потім відповідні чотири вищої. Збережіть рівність восьми
      атак і підготуйте рух на два лади перед другим тактом.
  review:
    title: Поясніть змінне й незмінне
    body: Назвіть одну змінену висоту й один збережений інтервал між сусідніми нотами. Поясніть, чому перенесення
      тих самих висот на іншу струну — інша операція.
activities:
  original-key: *id001
  whole-tone-up: *id002
  phrase-pairs: *id003
learningTasks:
  review:
    title: Перевірте цю спробу
    body: Позначте лише те, що перевірили слухом чи спостереженням за руками.
    items:
      all: Кожна ціль змістилася на два півтони, включно з поверненням.
      rhythm: Обидві версії зберігали ритм і контур.
      distinction: Я розрізняв нову тональність і нову позицію тих самих висот.
