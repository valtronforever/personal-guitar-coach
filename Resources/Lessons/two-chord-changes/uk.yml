lessonID: two-chord-changes
lessonVersion: 1
locale: uk
title: Зміна двох акордів
summary: Готуйте наступну форму, не зупиняючи рух такту.
goal: Чергувати п’ятиструнну й чотириструнну мінорні форми зі сталим пульсом.
body: 'Зміна акорду поєднує три рішення: куди рухається рука на грифі, які струни зачіпає медіатор і коли починається
  новий звук. Спочатку потренуйте їх окремо. Використовуйте п’ятиструнну й чотириструнну мінорні форми з попереднього
  уроку; їхні літерні назви адаптуються до строю.


  Спершу зберіть кожну форму без бою й перевірте струни окремо. Піднімайте пальці лише настільки, щоб відпустити
  попередній контакт, і спрямовуйте їх до нових позицій разом. У форм різні басові струни: починайте п’ятиструнний
  удар зі струни 5, чотириструнний — зі струни 4. Палець на верхній струні теж змінюється; не тягніть її вбік із
  сильним стисканням.


  У першому прикладі четверта доля справді тиха й дає час на підготовку. У другому звучать усі чотири долі, а нова
  форма має бути готова до наступного такту. Синтетична послідовність акордів — часовий орієнтир. Одноголосний детектор
  не оцінює ці одночасні акорди; пульс і чистоту струн перевіряйте слухом.'
steps:
  prepare:
    title: Знайте обидві цілі
    body: Поверніться до уроку мінорних акордів, якщо якась форма нечітка. Чергуйте збирання форм без бою, потім
      торкніться кожної потрібної струни один раз. Не ставте мету швидкості, доки обидві форми не зручні.
  prepare-change:
    title: Скористайтесь долею підготовки
    body: Проведіть по показаній формі на долю 1, дайте їй звучати на 2–3, потім зупиніть звук на 4 й підготуйте
      наступну. Вимовляйте всі чотири долі. Чотири такти чергують п’ятиструнну й чотириструнну форми. Повторіть
      приклад двічі на 50 BPM.
  steady-change:
    title: Змініть форму на наступну першу долю
    body: Тепер грайте удар на кожну чверть. Форма змінюється на тактовій рисці, а не після першого кліку нового
      такту. Якщо не встигли, рахуйте до наступного такту, не стискайте гриф і не наздоганяйте темп. Повторіть чотири
      такти тричі; якщо пульс зупиняється, поверніться до долі підготовки.
  review:
    title: Знайдіть конкретну затримку
    body: Назвіть складний напрям переходу й одну струну, яка запізнюється або глушиться. Зробіть чотири повільні
      переходи, потім поверніться до чотирьох тактів. Додавайте лише 5 BPM після трьох безперервних повторень.
activities:
  prepare-change:
    title: Чотири такти з долею підготовки
    body: Акорд на три долі й одна тиха доля в такті; чергуються форми на п’ять і чотири струни.
  steady-change:
    title: Чотири такти безперервних чвертей
    body: Чотири удари вниз у такті; наступний акорд починається на новій тактовій рисці.
learningTasks:
  review:
    title: Перевірте обидва напрями переходу
    body: Ваші слухові спостереження відокремлені від автоматичних оцінок нот.
    items:
      ready: Обидві форми були готові на першу долю у трьох повних повтореннях.
      pulse: Я продовжував рахунок навіть після неточної зміни.
      bass: Перша зачеплена струна відповідала басу потрібної форми.
