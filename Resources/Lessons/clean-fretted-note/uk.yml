lessonID: clean-fretted-note
lessonVersion: 1
locale: uk
title: Чиста затиснута нота
summary: Знайдіть достатній тиск для стабільної ноти без зайвого стискання.
goal: Знайдіть достатній тиск для стабільної ноти без зайвого стискання.
body: >-
  Використайте струну 3, лад 2 для невеликого досліду. Висоту ноти можна виміряти, але оцінка висоти сама по собі
  не підтверджує зручності руки чи відсутності брязкоту. Слухайте справжню гітару, а не лише дивіться на відгук.
steps:
  placement:
    title: Поставте кінчик пальця біля ладу
    body: >-
      Знайдіть лад 2 на струні 3. Поставте кінчик пальця близько до металевого ладу з боку головки грифа, а не на
      сам метал. Залишайте сусідні струни вільними, якщо навмисно не глушите їх пальцем. {{positions}}
  pressure:
    title: Дослідіть достатній тиск
    body: >-
      Зіграйте ноту, трохи послабте тиск зі збереженням контакту, а потім додайте стільки, щоб повернути затиснуту
      ноту. Повторіть повільно тричі. Помітьте перехід від стабільної ноти до приглушеного звуку чи брязкоту, не
      збільшуючи удар медіатора.
  repeat:
    title: Послаблюйте руку між нотами
    body: >-
      При 60 BPM грайте на долі 1 і 3; долі 2 та 4 — паузи. На паузі послаблюйте зайвий тиск і знову готуйте ту
      саму позицію. TAB щоразу показує ту саму висоту. {{positions}}
  review:
    title: Порівняйте чотири вступи
    body: >-
      Зіграйте два такти двічі. На кожному вступі спочатку слухайте стабільність ноти, а не намагайтеся зробити
      її гучнішою. Якщо є брязкіт, спершу підсуньте кінчик пальця ближче до ладу. Аудіооцінка перевіряє висоту й
      час атаки; тиск і характер звуку оцінюйте самостійно.
activities:
  example:
    title: Приклад для вашого інструменту
    body: >-
      Очікувана послідовність: {{sequence}}. Виберіть крок, щоб побачити його позиції. У прикладі звучать синтезовані
      еталонні ноти.
learningTasks:
  review:
    title: Перевірте свою практику
    body: Позначайте лише те, що перевірили самостійно. Поверніться до непозначеного пункту на наступному занятті.
    items:
      criterion-1: Я знайшов позицію близько до ладу з чистим звучанням.
      criterion-2: Я можу послаблювати тиск на паузах.
      criterion-3: Я перевіряв брязкіт на слух, а не лише за оцінкою висоти.
