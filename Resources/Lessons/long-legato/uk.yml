learningTasks:
  check-chain:
    title: Перевір ланцюжок і перехід
    body: Порівняй одну повільну спробу із записаними цілями та власними спостереженнями.
    items:
      middle: Я чув кожну проміжну ноту протягом потрібної тривалості.
      pick: Я використовував один удар на початку ланцюжка та рухи h/p далі.
      crossing: Я приглушував попередню струну й рахував паузи переходів.
      ease: Я зберігав розслабленість руки й зменшував темп, коли ланцюжок поспішав.
