lessonID: long-legato
lessonVersion: 1
locale: uk
title: Поєднуй довші фрази legato
summary: Поєднай кілька hammer-on і pull-off, потім перенеси рисунок між струнами.
goal: Збережи чутність і тривалість кожної проміжної ноти в ланцюжку з одним початковим ударом.
body: |-
  Довша фраза legato поєднує кілька нот після одного початкового удару. Головна відмінність від вправи на дві ноти: проміжні ноти мають лишатися повноцінними музичними звуками. У них є висота й тривалість, хоча рука з медіатором їх не атакує. Гучний початок і чіткий кінець не компенсують нечутну чи поспішну середину.

  Почни з ланцюжка на три ноти на одній струні. Підготуй нижній палець перед pull-off, один раз атакуй початковий лад, виконай hammer-on на наступний клік і pull-off до початкової висоти на наступний. Утримуй кожну ноту повну долю. Завершальна пауза — свідоме припинення звуку й підготовка. Повтори короткий ланцюжок перед довшим.

  Приклад на п’ять нот піднімається через три лади й повертається через середній. Тримай нижні пальці напоготові, замість піднімати всю руку після кожної зміни. Для pull-off використовуй невеликий контрольований рух, що залишає нижню ноту звучати; не відтягуй струну настільки вбік, щоб змінювати висоту. Урок показує очікувані лади, але зручні пальці обирай відповідно до руки й інструмента.

  Далі переходь між трьома тонкими струнами. Кожна нова струна починається новим ударом; позначки h і p всередині її ланцюжка все ще означають гру без наступних ударів. Так перехід між струнами явний: нота на іншій струні не виникає автоматично. Приглуши попередню струну під час записаної паузи, постав наступний початковий палець і продовжуй рахувати. Відстані між ладами різні, бо приклади використовують ноти одного мажорного звукоряду.

  Почни з 60 BPM і чистого сигналу. Порівняй виміряні ділянки висоти з цільовою кривою: неправильна проміжна висота потребує виправлення ноти, коротка ділянка — повільнішої координації, тиха — чутного звуку перед прискоренням. Невизначену ділянку не вважай неправильною нотою. Вимірювання перевіряє повільні утримані цілі й початковий таймінг; воно не доводить пальці, приглушення, рівну гучність чи відсутність повторних ударів. Перевір ці речі окремо на одному ланцюжку, потім поєднай переходи, зберігши пульс.
steps:
  prepare:
    title: Підготуй чистий вхід
    body: Налаштуй гітару, почни з 60 BPM і прослухай фразу перед грою.
  three-notes:
    title: Повернися через три ноти
    body: Один удар, hammer-on на тон угору, потім pull-off до початку. По одній долі на ноту й одна доля паузи.
      Табулатура показує кожний досягнутий лад і його тривалість. Крива висоти показує всі цілі; одна подія означає
      початковий удар і весь подальший ланцюжок без ударів медіатором.
  five-notes:
    title: Збережи обидві проміжні ноти
    body: Проміжна висота з’являється на підйомі й на спуску. Утримуй обидві появи по долі; після п’яти нот відрахуй
      три долі паузи. Табулатура показує кожний досягнутий лад і його тривалість. Крива висоти показує всі цілі;
      одна подія означає початковий удар і весь подальший ланцюжок без ударів медіатором.
  string-crossings:
    title: Перенеси ланцюжок між трьома струнами
    body: Три ланцюжки на п’ять нот починаються з основного звуку, терції та квінти мажорного звукоряду від {{root}}.
      Атакуй лише першу ноту кожного ланцюжка; використовуй паузи на три долі для контрольованого переходу. Ця активність
      зберігає початкову аплікатуру, щоб лишити переходи між трьома різними струнами. Табулатура показує кожний
      досягнутий лад і його тривалість. Крива висоти показує всі цілі; одна подія означає початковий удар і весь
      подальший ланцюжок без ударів медіатором.
  check-chain:
    title: Перевір ланцюжок і перехід
    body: Порівняй одну повільну спробу із записаними цілями та власними спостереженнями.
