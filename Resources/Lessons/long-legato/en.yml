      chain.
learningTasks:
  check-chain:
    title: Check the chain and crossing
    body: Compare one slow attempt with the written targets and your own observation.
    items:
      middle: I could hear every intermediate note for its intended duration.
      pick: I used one pick at each chain start and h/p movements afterward.
      crossing: I silenced the previous string and counted through the crossing rests.
      ease: I kept the hand relaxed and reduced tempo when the chain became rushed.
