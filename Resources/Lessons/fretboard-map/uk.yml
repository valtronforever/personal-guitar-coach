lessonID: fretboard-map
lessonVersion: 1
locale: uk
title: Ваша карта грифа
summary: Знайдіть ті самі звучні цілі на кількох ділянках грифа.
goal: Зіграти двонотову фразу різними аплікатурами зі збереженням точних висот і тональності.
body: 'Корисна карта грифа поєднує однакові звучні ноти, а не лише повторені літери. Нота з тією самою літерою в
  іншій октаві — інша ціль. Тут коротка фраза чергує дві точні висоти. Знайдіть її біля відкритої позиції, біля
  ладу 7 та біля ладу 12, потім оберіть іншу дозволену ділянку.


  Вибір ділянки просить аплікатуру у вказаному вікні; перша нота не мусить потрапляти точно на його перший лад.
  Додаток добирає придатні струни й лади зі збереженням звучної висоти. Маршрут може змінюватися зі строєм, особливо
  на нижній струні у Drop. Якщо власний стрій чи гриф робить вибір недоступним, скористайтеся запропонованою придатною
  ділянкою замість непомітної зміни ноти чи октави.


  Перед кожним переміщенням прослухайте ту саму фразу й порівняйте повні назви висот. Інша струна може змінити тембр
  зі збереженням ноти. Оцінювана практика перевіряє висоти й атаки; однакові ноти звучать подібно, тому обрана ділянка
  — вказівка, яку ви перевіряєте самі. Оцінка не доводить місце руки.'
steps:
  prepare:
    title: Збережіть октаву в цілі
    body: Прочитайте обидві повні назви початкової активності й прослухайте. Зберігайте точні цілі під час дослідження;
      не замінюйте октаву лише через спільну літеру.
  original: &id001
    title: Почніть із початкового маршруту
    body: Зіграйте чотири черговані чверті на 50 BPM. Назвіть їх перед стартом, потім підтвердіть показані струни
      й лади. {{sequence}}.
  near-seven: &id002
    title: Знайдіть їх біля ладу 7
    body: 'Використайте фіксовану ділянку від ладу 7. Порівняйте звучні назви з початковим маршрутом: вони мають збігатися.
      Знайдіть позиції без звуку перед спробою на чотири ноти. {{positions}}.'
  near-twelve: &id003
    title: Перейдіть далі без підвищення тональності
    body: 'Вікно починається з ладу 12. Дотримуйтеся фактичних струн: нижня струна може дати ту саму висоту на вищому
      ладі. Порівняйте спробу тут і біля ладу 7. {{positions}}.'
  explore: &id004
    title: Оберіть і перевірте іншу ділянку
    body: Оберіть початковий маршрут або доступне вікно від 0, 5, 7 чи 12. Перед показом обчисленого маршруту передбачте можливу
      позицію й зіграйте дві спроби. Недоступний варіант не дозволяє змінювати цільову октаву.
  review:
    title: Поєднайте маршрути в пам’яті
    body: Назвіть дві позиції першої точної висоти, включно зі струною й ладом. Вільно перевірте одну, потім поверніться
      до фрази в темпі. Відділяйте спостереження позиції від автоматичного результату висоти.
activities:
  original: *id001
  near-seven: *id002
  near-twelve: *id003
  explore: *id004
learningTasks:
  review:
    title: Перевірте цю спробу
    body: Позначте лише те, що перевірили слухом чи спостереженням за руками.
    items:
      pitch: Усі ділянки зберігали повні назви висот та октави.
      routes: Я перевірив два маршрути струн і ладів на справжній гітарі.
      meaning: Я розумів початок ділянки як межу вікна, а не обов’язковий лад першої ноти.
