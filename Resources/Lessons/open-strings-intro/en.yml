lessonID: open-strings-intro
lessonVersion: 3
locale: en
title: Meet your open strings
summary: Explore open strings and leave space between attacks.
goal: Play the two outer open strings with a rest between attacks.
body: >-
  No fretting experience is needed. Start at 60 BPM, or 40 BPM for more time. The outer strings do not necessarily
  share a pitch name or an octave relationship in a custom tuning. Listen for quiet rests: the assessment checks
  attacks and pitch, not how long every note rings.
steps:
  hear-low-e:
    title: 1. Hear string 6
    body: On beat 1, pluck the thickest open string once. {{positions}}.
  leave-space:
    title: 2. Leave a beat of silence
    body: Beat 2 is a rest. Gently stop the low string and keep counting without a new attack.
  hear-high-e:
    title: 3. Hear string 1
    body: On beat 3, pluck the thinnest open string. {{positions}}.
  play-the-bar:
    title: 4. Play the four beats
    body: 'Count 1, 2, 3, 4: string 6, rest, string 1, rest. Notes: {{positions}}.'
historicalTitle: Meet your open strings
activities:
  lesson:
    title: Open strings 6 and 1
    body: |-
      Learn the open strings in your selected tuning.

      Sequence: {{sequence}}.
