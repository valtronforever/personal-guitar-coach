    items:
      tune: Мелодія лишилася впізнаваною в повній фактурі.
      holds: Я продовжував нижні голоси в дужках без повторної атаки.
      changes: Кожна нова гармонія почалася на межі свого такту.
      release: Попередні голоси завершувалися при зникненні або зміні їхніх струн.
      ending: Я утримав фінальну тоніку дві долі й свідомо завершив фразу.
