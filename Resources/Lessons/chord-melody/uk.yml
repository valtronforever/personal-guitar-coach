lessonID: chord-melody
lessonVersion: 1
locale: uk
title: 'Chord melody: збережи гармонію під рухом мелодії'
summary: Продовжуй вибрані акордові голоси під змінами верхньої лінії.
goal: Зіграй чотиритактовий chord-melody етюд із виразною верхньою лінією та свідомими змінами гармонії.
body: |-
  Chord melody поєднує мелодію та гармонічну підтримку в одній гітарній партії. Нової атаки повного акорду на кожну ноту мелодії не потрібно. Почни з мелодії окремо, потім вивчи підтримувальні форми. У поєднаному прикладі два нижні голоси іноді утримуються, а змінюється лише перша струна. Почуй рухому партію перед запам’ятовуванням усієї послідовності захватів.

  Чотиритактовий маршрут рухається від тоніки до субдомінанти, домінанти й тоніки. Верхня лінія містить прохідні або сусідні барви, що не завжди входять до основного мажорного тризвуку. Не замінюй кожну таку ноту новою гармонією. Наприклад, верхня секунда може прикрашати тоніку, поки нижні основний звук і терція незмінні. Послухай повернення до стійкого акордового звуку.

  Дужки точно вказують, які нижні струни продовжуються без нової атаки. Збережи їхні фізичні контакти під час зміни пальця мелодії. На новому такті звичайні числа починають свіжу підтримувальну форму. Повторений лад без дужок також означає нову атаку. Еталон зберігає утримувані голоси безперервними, тому порівнюй із грою і тривалу гармонію, а не лише ритм мелодії.

  Баланс — музичне рішення. Спершу зіграй усі голоси м’яко й простеж верхню лінію. Потім зроби мелодію трохи виразнішою без повторних ударів нижнього акорду. Не намагайся вирішити нечітку мелодію однаковим посиленням кожної атаки. Деякі форми подвоюють висоту на двох струнах; показані позиції лишаються фізичними інструкціями навіть для однакових висот. Додаток не перевіряє реальну струну лише за аудіо.

  Спочатку опрацюй одну підтримувальну форму з її мелодією, потім з’єднай межу такту. Заверши голоси, яких більше немає, і підготуй наступний акорд під час попередньої тривалості без її скорочення. Дотримай фінальну високу тоніку повні дві долі. У другому проході слухай лише нижні голоси, перевіряючи випадкові переривання. Баланс, завершення й аплікатуру перевіряй самостійно; точність одночасних голосів тут не оцінюється автоматично.
steps:
  prepare:
    title: Обери невелику музичну ідею
    body: Прочитай план, обери зручний чистий звук і почни повільно.
  top-line:
    title: Вивчи мелодію та її завершення
    body: 'Центр: {{root}} major. Збережи впізнавану лінію першої струни в усіх чотирьох тактах, включно з фінальною
      високою тонікою.'
  supporting-chords:
    title: Чотири підтримувальні форми
    body: Зіграй I–IV–V–I формами на цілий такт. Вони задають гармонічний маршрут; поєднана мелодія додасть барви.
  retain-the-chord:
    title: Рухай мелодію над двома утримуваними голосами
    body: Усередині кожного такту продовжуй звучання струн 2 та 3. На другому такті атакуй нову підтримувальну форму;
      не перенось стару гармонію через зміну.
  chord-melody-study:
    title: Повна чотиритактова chord-melody фраза
    body: Стеж за верхньою мелодією, поки знизу чутно I–IV–V–I. Фінальна верхня тоніка триває дві долі над утримуваними
      нижніми голосами.
  arrangement-review:
    title: Перевір мелодію, підтримку й завершення окремо
    body: 'Зіграй повну фразу двічі: спершу стеж за мелодією, потім слухай безперервність нижніх акордових голосів.'
