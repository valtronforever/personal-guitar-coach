learningTasks:
  arrangement-review:
    title: Review melody, support and releases separately
    body: 'Play the complete phrase twice: follow the melody first, then listen to continuity in the lower chord
      voices.'
    items:
      tune: The melody remained recognizable inside the full texture.
      holds: I kept parenthesized lower voices sounding without reattacking.
      changes: Each new harmony began at its bar boundary.
      release: Old voices ended when their strings disappeared or changed.
      ending: I held the final tonic for both beats and ended the phrase deliberately.
