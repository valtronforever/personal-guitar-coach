lessonID: fingerstyle-bass-melody
lessonVersion: 1
locale: uk
title: 'Fingerstyle: утримуй бас, веди мелодію'
summary: Координуй дві чутні лінії з різними атаками й тривалістю.
goal: Зіграй чотиритактовий етюд басу й мелодії без повторної атаки утримуваного голосу на кожній ноті мелодії.
body: |-
  Дві музичні лінії не зобов’язані починатися й завершуватися разом. У цьому уроці низька басова нота може продовжуватися під кількома верхніми нотами. Спершу послухай бас і мелодію окремо, потім поєднай їх без зміни партій. Мета — зберегти обидві лінії, а не просто зіграти послідовність малих акордів. Почни з розбірливого звуку, щоб почути випадкове припинення басу або зайву атаку.

  Лад у дужках означає продовження: утримуй струну й дозволь їй звучати без нового щипка. Звичайне число ладу вказує на нову атаку, навіть якщо число повторюється. Коли струна зникає з наступної події, заверши її голос на цій межі. Еталон дотримується цих незалежних початків і завершень; тихіша середина утримуваного басу не означає новий удар великого пальця.

  Грай низьку лінію великим пальцем, а для верхніх струн обери зручні пальці. Зберігай контакт басу, рухаючи лише пальцями, потрібними для мелодії. Дуже повільно перевір один такт: озвуч обидві початкові ноти, продовжуй бас і змінюй верхню ноту на долях. Якщо бас зникає, виділи саме той перехід мелодії, який його відпустив. Звук не визначає використаний палець, тому перевір цей фізичний контакт самостійно.

  Вправа зі змінним басом міняє ролі. Тут дві послідовні низькі ноти супроводжують одну утримувану верхню. Дужки тепер стоять на верхній струні. Збережи мелодію під час переходу великого пальця й припини попередній бас замість накопичення всіх низьких нот. Порівняй це з утримуваним басом: незалежність означає вибір голосу, що продовжується, а не безумовне звучання всього.

  Поєднуй чотиритактовий етюд, коли обидві партії вже знайомі. Зроби мелодію чутною, залишаючи бас підтримкою. Повністю відрахуй фінальну мелодичну ноту на дві долі. Повтори один складний перехід, потім поверни його в повну форму. Перевір безперервність, баланс і свідомі завершення за списком. Цей багатоголосний урок має еталон і самопрактику, а не автоматичну оцінку двох одночасних голосів або вибору пальця.
steps:
  prepare:
    title: Обери невелику музичну ідею
    body: Прочитай план, обери зручний чистий звук і почни повільно.
  bass-line:
    title: Вивчи чотиритактовий маршрут басу
    body: 'Центр: {{root}} major. Грай одну басову атаку на такт: тоніка, домінанта, тоніка, тоніка. Кожна заповнює
      свій такт.'
  melody-line:
    title: Почуй верхню лінію окремо
    body: Вивчи чотири такти й фінальну ноту на дві долі перед додаванням басу. Тут кожне число — нова атака.
  hold-the-bass:
    title: Одна басова атака, чотири ноти мелодії
    body: Атакуй обидва голоси на долі 1. Продовжуй звучання ладу п’ятої струни в дужках під трьома наступними атаками
      мелодії.
  hold-the-melody:
    title: Збережи верхню ноту під час зміни басу
    body: Бас змінюється щодолі, кожна верхня нота триває дві долі. Відпусти попередню низьку струну, зберігши верхню
      в дужках.
  two-line-study:
    title: Чотири такти з незалежним басом
    body: Атакуй новий бас лише на початку кожного такту, включно з повтореною тонікою. Змінюй мелодію над ним і
      відрахуй завершення повністю.
  independence-review:
    title: Послухай обидві лінії
    body: Зіграй кожну лінію окремо, потім поєднай їх двічі й порівняй один складний перехід.
