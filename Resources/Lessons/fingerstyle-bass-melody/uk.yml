learningTasks:
  independence-review:
    title: Послухай обидві лінії
    body: Зіграй кожну лінію окремо, потім поєднай їх двічі й порівняй один складний перехід.
    items:
      bass: Бас продовжувався під атаками мелодії без зайвих щипків.
      upper: Верхній голос продовжувався у вправі зі змінним басом.
      release: Я свідомо завершував пропущені струни замість накопичення нот.
      balance: Я міг простежити мелодію й чути басову підтримку.
      form: Я зберіг усі чотири такти й повну фінальну тривалість.
