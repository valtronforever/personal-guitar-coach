learningTasks:
  independence-review:
    title: Listen to both lines
    body: Play each line alone, then combine them twice and compare one difficult change.
    items:
      bass: The bass continued across melody attacks without extra plucks.
      upper: The upper voice continued through the alternating-bass exercise.
      release: I ended omitted strings deliberately instead of accumulating notes.
      balance: I could follow the melody while still hearing bass support.
      form: I retained all four bars and the complete final duration.
