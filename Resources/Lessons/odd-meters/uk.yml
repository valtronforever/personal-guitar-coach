lessonID: odd-meters
lessonVersion: 1
locale: uk
title: Групуйте 5/4 та 7/8
summary: Складіть нерівний такт зі знайомих коротких груп, не змінюючи проміжків усередині них.
goal: Зіграти такти з п’яти чвертей і семи восьмих із двома варіантами акцентного групування кожного.
body: |-
  Непарний розмір має довжину такту, що не вкладається у звичні рівні групи 4/4. Його можна вивчати через коротші групи замість довгого списку чисел. У 5/4 п’ять чвертних долей можуть утворювати 3+2 або 2+3. У 7/8 сім восьмих часто групують як 2+2+3, 3+2+2 чи 2+3+2. Останній варіант теж корисний; цей урок практикує перші два малюнки із семи одиниць.

  Спочатку перевірте підпис одиниці темпу. Вправи 5/4 починаються на 80 BPM чвертей: кожна чверть займає проміжок між кліками, у відліку п’ять кліків. Вправи 7/8 починаються на 120 BPM восьмих: кожна восьма займає проміжок між кліками, у відліку сім. За такого налаштування такт 7/8 триває три з половиною секунди. Знаменник і назва пульсу важливі: однакові числа BPM із різними одиницями не означають однакової швидкості нот.

  Почніть із тритактової фрази 5/4. Для 3+2 рахуйте РАЗ-два-три, РАЗ-два, зберігаючи рівність усіх п’яти чвертних проміжків. Клік прикладу виділяє початок кожної групи; такт починається лише один раз, із першої групи. У кожному такті грайте ті самі п’ять висот і не додавайте шосту долю під час повернення до першої ноти. Для 2+3 збережіть висоти, тривалості й темп, але пересуньте другий акцент на долю раніше: РАЗ-два, РАЗ-два-три.

  Далі зіграйте чотири такти 7/8 на вказаному BPM восьмих. Для 2+2+3 рахуйте РАЗ-два, РАЗ-два, РАЗ-два-три. На 120 BPM ці групи тривають секунду, секунду й півтори, а кожна записана восьма — пів секунди. У 3+2+2 довга група перша. Читайте в’язки та підпис груп і зберігайте той самий мотив із семи нот, перемикаючи варіанти. Не скорочуйте групу з трьох, щоб зробити всі групи однаково довгими.

  Практикуйте повний такт разом із наступною сильною долею, потім з’єднайте всю фразу. Діапазон, що закінчується перед поверненням, може приховати зайву або пропущену долю. Автоматична оцінка перевіряє висоти й атаки на записаній шкалі; вона не оцінює силу акценту й не визначає ваш спосіб рахунку. Власні початки груп слухайте окремо. Якщо губите місце, поверніться до промовляння коротких груп під повний метроном і лише потім додавайте гітару. Мета — стала основна одиниця в навмисно нерівному такті, а не періодичне прискорення чи сповільнення.
steps:
  prepare:
    title: Назвіть одиницю й групи
    body: >-
      Прочитайте BPM чвертей для 5/4 та восьмих для 7/8. Промовте вибрані довжини груп до гри. Рахуйте кожну одиницю
      повного відліку; акцентований середній клік починає групу, а не новий такт.
  five-three-two:
    title: П’ять чвертей як 3+2
    body: >-
      На 80 BPM чвертей повторіть мотив із п’яти нот у трьох тактах. Рахуйте РАЗ-два-три, РАЗ-два. Зберігайте рівні
      чвертні проміжки й починайте наступний такт рівно після п’яти.
  five-two-three:
    title: Пересуньте внутрішній акцент у 2+3
    body: >-
      Той самий мотив і темп, тепер РАЗ-два, РАЗ-два-три. Друга група починається на долі 3 замість 4. Висоти й
      часові цілі ті самі; новий акцент перевірте слухом.
  seven-two-two-three:
    title: Сім восьмих як 2+2+3
    body: >-
      На 120 BPM восьмих зіграйте чотири такти по сім нот. Рахуйте дві короткі групи й одну довшу. Кожна нота має
      один рівний проміжок між кліками; після семи поверніться до початку. {{sequence}}.
  seven-three-two-two:
    title: Поставте довгу групу першою
    body: >-
      Збережіть ноти й темп восьмих, тепер у 3+2+2. Початки груп — одиниці 1, 4 та 6. Читайте змінені в’язки, не
      додаючи й не прибираючи нот.
  review:
    title: Збережіть одиницю через тактову риску
    body: >-
      Перевірте ранні/пізні атаки й повернення рівно після п’яти або семи одиниць. Окремо послухайте групові акценти.
      Перед з’єднанням усієї фрази повторіть варіант, де з’являлася зайва доля.
  question:
    title: Що змінюється між групуваннями 7/8?
    body: Відрахуйте поділ долі перед відповіддю.
