      додаючи й не прибираючи нот.
learningTasks:
  question:
    title: Що змінюється між групуваннями 7/8?
    body: Ті самі сім восьмих переходять із 2+2+3 у 3+2+2 на тому самому BPM восьмих. Що змінюється?
    items:
      accent: Групові акценти й в’язки; усі сім тривалостей і довжина такту ті самі.
      duration: Такт подовжується, бо його перша група довша.
      count: На тактовій рисці додається ще одна восьма.
    explanation: >-
      Обидва групування дають сім рівних восьмих одиниць. Вони по-різному розташовують довгу групу: внутрішні акценти
      змінюються, час і послідовність нот зберігаються.
  review:
    title: Перевірте свій пульс
    body: Позначте лише власні спостереження.
    items:
      unit: Я перевірив одиницю пульсу, а не порівнював лише числа BPM.
      bar: Я повернувся рівно після п’яти або семи рівних одиниць без зайвої долі.
      groups: Я почув різницю групових акцентів окремо від оцінки висоти й часу.
