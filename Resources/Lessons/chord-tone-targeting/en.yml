learningTasks:
  choose-the-landing:
    title: Choose by the current chord
    body: The key remains major but the harmony moves from I to IV. Which rule identifies a chord-tone landing?
    items:
      current: Choose a root, third or fifth of the current IV chord.
      previous: Keep any tone of the previous I chord.
      scale: Every scale tone is equally a chord tone.
    explanation: The current triad determines chord membership. A scale note can be a brief approach without being
      a triad tone.
  make-an-approach:
    title: Invent a landing phrase
    body: Loop the backdrop and create four bars. Choose each landing before its approach, then compare a root version
      and a third version.
    items:
      plan: I named the current chord and prepared its landing.
      space: I left space after a landing and heard the next change.
      compare: I compared root and third targets over the backdrop.
      limits: I separated the fixed-note score from my own phrase review.
