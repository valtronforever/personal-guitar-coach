lessonID: chord-tone-targeting
lessonVersion: 1
locale: uk
title: Заверши фразу на акордовому звуці
summary: Почуй зміну гармонії, підготуй опорний звук і вчасно прийди до нього.
goal: Обери й зіграй звук поточного акорду, розрізняючи задані цілі та вільне фразування.
body: |-
  Фраза може використовувати багато звуків гами, але точки зупинки визначають її зв’язок із гармонією. Акордовий звук належить акорду, який звучить зараз. У мажорному тризвуку основний звук, терція та квінта можуть бути опорами. Нота може належати тональності, але не поточному тризвуку. Тут тренуємо рішення про завершення, а не вважаємо всі звуки гами однаково стійкими.

  Чотиритактовий фон іде за I–IV–V–I в мажорному центрі. Послухай його й визнач момент кожної зміни акорду. Кожен акорд триває один такт. Повторюй еталон, щоб почути повернення, потім обери основний звук для кожного такту. Фон синтезований і призначений для прослуховування; можеш грати поверх нього для самопрактики, але додаток не розпізнає повну гру акордів і мелодії як оцінювану монофонічну відповідь.

  У вправі з основними звуками грай потрібний звук на першій долі, тримай дві долі й залиш дві для підготовки наступного акорду. У вправі з терціями збережи ритм, але обирай терцію. Порівняй, як терція підкреслює якість акорду, а основний звук дає пряму опору. Оцінка перевіряє ці задані ноти й атаки. Вона не визначає виразність імпровізаційного вибору або те, чи ти подумки назвав акорд.

  Вправа з підходом проходить через дві чверті й завершується половинною нотою на третій долі кожного такту. Деякі короткі звуки підходу не належать поточному тризвуку. Почуй їхній рух до довшої цілі замість утримання всіх трьох як однаково важливих. Останній такт повертається до основного звуку тоніки й вимагає чутного утримання дві долі. Приглушуй попередні струни, щоб вхід лишався монофонічним.

  Після заданих цілей повернися до циклічного фону й вигадай власний короткий підхід. Заплануй завершення перед першою нотою підходу. Почни з основних звуків, потім спробуй терції. Залишай простір після кожної опори й помічай, чи акорд змінюється, поки ти тримаєш звук попереднього такту. У такому разі свідомо виріши, чи перейти разом із новим акордом, замість підпорядкування фрази старій аплікатурі.

  Розділяй два види зворотного зв’язку. Спроба із заданими цілями дає дані висоти й каліброваного таймінгу без акордової підкладки. Власна фраза поверх фону потребує слухання та самоспостереження. Ту саму висоту можна зіграти на кількох струнах; додаток не засвідчує певну аплікатуру. Стрій транспонує центр і цілі разом, а дозволена зміна позиції зберігає фразу звучання.
steps:
  prepare:
    title: Обери невелику музичну ідею
    body: Прочитай план, обери зручний чистий звук і почни повільно.
  backdrop:
    title: Почуй I–IV–V–I
    body: 'Центр: {{root}} мажор. Кожен акорд триває один такт. Повторюй цей еталон і грай поверх власний підхід
      та завершення; це самопрактика, а не розпізнавання акордів. Ноти звучання: {{sequence}}. Показана аплікатура
      — орієнтир; звук не доводить використання струни чи пальця.'
  roots:
    title: Завершуй на основних звуках
    body: 'Чотири такти I–IV–V–I: грай основний звук на першій долі дві долі, потім пауза дві долі. Оцінювана відповідь
      звучить без акордової підкладки. Ноти звучання: {{sequence}}. Показана аплікатура — орієнтир; звук не доводить
      використання струни чи пальця.'
  thirds:
    title: Завершуй на терціях
    body: 'Збережи чотиритактову послідовність і дві долі звуку/дві долі паузи, але обирай терцію поточного акорду.
      Ноти звучання: {{sequence}}. Показана аплікатура — орієнтир; звук не доводить використання струни чи пальця.'
  approach:
    title: Підійди й зупинися
    body: 'I–IV–V–I: дві чверті підходу ведуть до опори тривалістю дві долі на третій долі. У тактах 1–3 заверши
      на терціях, у четвертому — на основному звуці тоніки. Утримуй останню ноту повні дві долі. Ноти звучання:
      {{sequence}}. Показана аплікатура — орієнтир; звук не доводить використання струни чи пальця.'
  choose-the-landing:
    title: Обирай за поточним акордом
    body: Тональність лишається мажорною, але гармонія переходить із I на IV. Яке правило визначає акордову опору?
  make-an-approach:
    title: Вигадай фразу з опорою
    body: Повторюй фон і створи чотири такти. Обирай кожну опору перед підходом, потім порівняй версію з основними
      звуками й терціями.
