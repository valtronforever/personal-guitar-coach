learningTasks:
  choose-the-landing:
    title: Обирай за поточним акордом
    body: Тональність лишається мажорною, але гармонія переходить із I на IV. Яке правило визначає акордову опору?
    items:
      current: Обери основний звук, терцію чи квінту поточного IV акорду.
      previous: Залиш будь-який звук попереднього I акорду.
      scale: Кожен звук гами однаково є акордовим.
    explanation: Належність до акорду визначає поточний тризвук. Звук гами може бути коротким підходом, не входячи
      до тризвуку.
  make-an-approach:
    title: Вигадай фразу з опорою
    body: Повторюй фон і створи чотири такти. Обирай кожну опору перед підходом, потім порівняй версію з основними
      звуками й терціями.
    items:
      plan: Я назвав поточний акорд і підготував його опору.
      space: Я залишив простір після опори й почув наступну зміну.
      compare: Я порівняв основні звуки й терції поверх фону.
      limits: Я відокремив оцінку заданих нот від перевірки власної фрази.
