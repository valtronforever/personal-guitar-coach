lessonID: building-triads
lessonVersion: 1
locale: uk
title: Побудова мажорного й мінорного тризвуків
summary: Додайте терцію до основного тону й квінти та почуйте цілий акорд.
goal: Побудувати й порівняти 1–3–5 та 1–♭3–5 від спільного основного тону.
body: 'Павер-акорд не містить терції. Додавання цього звуку утворює основний мажорний чи мінорний тризвук. Від основного
  тону мажор має півтонові відстані 0–4–7, мінор — 0–3–7. Основний тон і квінта лишаються, а терція опускається
  на півтон. Тут ♭3 означає понижений третій ступінь мажору від основного тону; літерна назва показаної ноти не
  обов’язково містить бемоль.


  Спочатку зберіть звуки окремо. Почуйте відстань основний тон–терція, потім квінту й повернення. Ці одноголосні
  версії можна оцінювати, якщо кожна нота має власну атаку, а попередня струна зупинена. Далі прослухайте три звуки
  разом у зручному розташуванні. Терція може опинитися на іншій струні, ніж в одиночній вправі, зі збереженням потрібних
  висот.


  Одночасні приклади — для слухання й самостійної практики, а не поліфонічного розпізнавання. Порівняйте якості
  на подібній гучності, не вважаючи мажор завжди веселим, а мінор завжди сумним. Ефект залежить від фрази й гармонії;
  тут терція виділена як конкретна відмінність.'
steps:
  prepare:
    title: Збережіть основний тон і квінту
    body: 'Згадайте квінту з уроку павер-акордів. Знайдіть основний тон і передбачте, яка терція буде вищою: велика
      чи мала.'
  major-stack: &id001
    title: 'Мажор: 0–4–7 півтонів'
    body: Зіграйте основний тон, велику терцію, квінту й основний тон чотирма чвертями на 50 BPM. Перед грою назвіть
      1–3–5–1. Для оцінювання зупиняйте попередню ноту. {{sequence}}.
  minor-stack: &id002
    title: 'Мінор: понизьте лише терцію'
    body: Збережіть попередні цілі основного тону й квінти та понизьте терцію на півтон. Порівняйте такти тричі
      перед двома оцінюваними спробами. {{sequence}}.
  chord-contrast: &id003
    title: Почуйте три звуки разом
    body: Озвучте мажорне розташування на три долі, зупиніть на 4, потім повторіть мінорне. Перед цілим акордом
      перевірте кожну потрібну струну. Одночасний приклад не оцінюється.
  review:
    title: Укажіть змінний голос
    body: Укажіть голос, який зміщується на півтон у порівнянні акордів. Якщо відмінність нечітка, повторіть окремі
      терції й поверніться до цілих розташувань.
activities:
  major-stack: *id001
  minor-stack: *id002
  chord-contrast: *id003
learningTasks:
  review:
    title: Перевірте цю спробу
    body: Позначте лише те, що перевірили слухом чи спостереженням за руками.
    items:
      structure: Я пояснював обидві півтонові формули від основного тону.
      third: Я визначив терцію як єдиний змінений звук акорду.
      clarity: Я перевіряв цілі розташування слухом окремо від оцінок нот.
