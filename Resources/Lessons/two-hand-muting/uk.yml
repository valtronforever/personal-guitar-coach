lessonID: two-hand-muting
lessonVersion: 1
locale: uk
title: Глушіння обома руками
summary: Передавайте звучну ноту між струнами й глушіть решту.
goal: Зберігати тишу сусідніх струн у фразі на три струни.
body: 'Глушіння обома руками призначає тишу так само свідомо, як ноти. Ребро руки з медіатором може глушити нижні
  невикористані струни; вільні пальці на грифі чи бік робочого пальця — легко торкатися сусідніх. Це варіанти, а
  не єдиний обов’язковий хват: потрібна струна має бути вільною, а рука — зручною.


  Почніть з однієї ноти й послухайте після проходу медіатора. Сусідня струна може резонувати навіть без удару. Далі
  змініть струну: зупиніть попередню в момент переходу замість накладання двох висот. Повертаючись на нижню струну,
  завчасно приберіть із неї контакт руки з медіатором.


  Приклади використовують звичайні ноти як орієнтир. Мета — контроль небажаних струн, тому практика залишається
  самоперевіркою навіть за правильних цільових висот. Одноголосна оцінка не довела б тишу решти струн. Спочатку
  працюйте чисто; потім помірне перевантаження допоможе почути зайвий шум без зміни малюнка.'
steps:
  prepare:
    title: Перевірте одну ціль
    body: Зіграйте першу позначену ноту й легко торкніться кожної зайвої струни, шукаючи резонанс. Заплануйте легкий
      контакт для шумної струни перед додаванням руху.
  handover: &id001
    title: Змініть струни в обидва боки
    body: Дві чверті й дві долі паузи. Зупиніть першу струну на початку другої, потім усе на долі 3. Другий такт
      змінює напрямок. Повторіть тричі на 50 BPM.
  adjacent-strings: &id002
    title: Три цілі й повна зупинка
    body: Зіграйте три чверті й залиште долю 4 тихою. Одночасно звучить лише одна ціль. За чотири повтори особливо
      слухайте повернення від третьої до першої.
  review:
    title: Назвіть залишковий шум
    body: Розрізніть заблоковану ціль, попередню ноту, що триває, і дзвін зайвої струни. Змініть один контакт для
      конкретної проблеми й повторіть два такти на тому самому темпі.
activities:
  handover: *id001
  adjacent-strings: *id002
learningTasks:
  review:
    title: Перевірте цю спробу
    body: Позначте лише те, що перевірили слухом чи спостереженням за руками.
    items:
      free: Контакти глушіння не заважали поточній цілі.
      handover: Попередня струна зупинялася на початку наступної цілі.
      quiet: Я перевірив зайві струни слухом, включно з останньою паузою.
