lessonID: pickup-volume-tone
lessonVersion: 1
locale: uk
title: Формуй звук органами керування гітари
summary: Порівняй вибір звукознімача, гучність і тембр гітари, зберігаючи ту саму фразу.
goal: Знайди два корисні звуки на власній гітарі й поясни, який регулятор змінив кожен із них.
body: |-
  Почни з гітари замість пошуку серед багатьох пресетів підсилювача. Вибір звукознімача змінює ділянку струни, коливання якої знімаються; гучність гітари змінює сигнал далі в тракті; звичайний пасивний регулятор тембру при зменшенні прибирає високі частоти. Активні схеми й перемикачі різняться, тому визнач свої органи керування за інструкцією інструменту, а не припускай однакову дію кожної ручки.

  Обери чистий звук моніторингу без ефектів і вивчи двотактову контрольну фразу. Повторені ноти, довше закінчення й пауза дозволяють порівняти початок атаки, тембр утриманої ноти та фоновий шум. Зіграй її з кожним доступним положенням звукознімача, не змінюючи місце удару. Бриджевий звук часто гостріший, а нековий округліший, але запиши власне спостереження замість сприйняття цих описів як цілі.

  Далі залиш один звукознімач і поступово зменшуй гучність гітари. За наявності порівняй чистий і трохи перевантажений звук моніторингу. Менший вхід може зменшити перевантаження разом із гучністю; наступне підвищення навушників не повертає той самий дисторшн. Залиш незмінним gain входу інтерфейсу та запас рівня для найбільшої гучності гітари в порівнянні.

  Поверни початкову гучність, потім порівняй три положення регулятора тембру. Слухай край атаки медіатора й розбірливість верхніх нот. Приблизно вирівнюй гучність прослуховування після кожного налаштування, щоб гучніший звук не перемагав автоматично. Не змінюй одночасно звукознімач, тембр і EQ підсилювача. Заверши двома відтворюваними налаштуваннями: чіткішою атакою й м’якшим краєм, описавши положення регуляторів та музичне застосування.
steps:
  prepare:
    title: Визнач тракт і початковий звук
    body: Використовуй наявне обладнання з комфортною гучністю. Додаток дає пояснення, часові орієнтири й самоперевірку;
      він не запускає ефекти цього уроку.
  control:
    title: Використовуй ту саму фразу для порівняння
    body: 'Вивчи цю суху двотактову фразу, потім повтори її через власний звуковий тракт зі зміною одного параметра.
      Зберігай зіставні темп, артикуляцію й гучність прослуховування. Еталон додатка не містить симуляції підсилювача
      чи ефектів. Ноти звучання: {{sequence}}. Показана аплікатура — орієнтир; звук не доводить використання струни
      чи пальця.'
  controls-test:
    title: Порівнюй один регулятор за раз
    body: Використовуй органи керування власної гітари й повторюй ту саму фразу. Якщо певного регулятора немає,
      визнач доступну альтернативу, не стверджуючи перевірку відсутнього обладнання.
activities:
  control:
    title: Використовуй ту саму фразу для порівняння
    body: 'Вивчи цю суху двотактову фразу, потім повтори її через власний звуковий тракт зі зміною одного параметра.
      Зберігай зіставні темп, артикуляцію й гучність прослуховування. Еталон додатка не містить симуляції підсилювача
      чи ефектів. Ноти звучання: {{sequence}}. Показана аплікатура — орієнтир; звук не доводить використання струни
      чи пальця.'
learningTasks:
  controls-test:
    title: Порівнюй один регулятор за раз
    body: Використовуй органи керування власної гітари й повторюй ту саму фразу. Якщо певного регулятора немає,
      визнач доступну альтернативу, не стверджуючи перевірку відсутнього обладнання.
    items:
      pickup: Я порівняв доступні положення звукознімачів з однаковим місцем удару.
      volume: Я відокремив зміну перевантаження на вході від гучності прослуховування.
      tone: Я описав дію доступного регулятора тембру або EQ.
      recall: Я записав два відтворювані налаштування та пояснив їх застосування.
