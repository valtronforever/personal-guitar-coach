learningTasks:
  controls-test:
    title: Compare one control at a time
    body: Use your own guitar controls and repeat the same phrase. If the guitar lacks a control, identify the available
      alternative without claiming you tested missing hardware.
    items:
      pickup: I compared the available pickup settings with the same picking position.
      volume: I separated the change in input drive from listening loudness.
      tone: I described the effect of an available tone/EQ control.
      recall: I wrote two settings that I can reproduce and explained their uses.
