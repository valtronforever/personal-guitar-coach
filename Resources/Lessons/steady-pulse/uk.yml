lessonID: steady-pulse
lessonVersion: 2
locale: uk
title: Тримай рівний пульс
summary: Тренуй чверті, восьмі та паузи на одній відкритій струні.
goal: Розмісти окремі атаки на записаних долях і півдолях та рахуй під час пауз.
body: |-
  Пульс — послідовність долей із рівними проміжками. Клік дає зовнішній орієнтир; ваш рахунок триває, навіть коли гітара мовчить. Почніть із чвертей: одна атака займає одну долю. Використовуйте відкриту струну 6 і чистий сигнал.

  Перед грою прослухайте чотири кліки, потім рахуйте «1 і 2 і 3 і 4 і». Числа збігаються з кліками; кожне «і» розташоване посередині. Такт 1 знайомить із чвертними атаками й паузою. Такт 2 дає перший контраст із восьмими; наступний урок докладніше розвиває цей поділ. Почніть на 60 BPM і тримайте темп, доки не відчуєте контроль над обома тактами.

  Додаток вимірює чутну висоту й час атак. Самостійно прислухайтеся, чи струна справді зупиняється на паузі: відсутність зайвої атаки не доводить тиші. Рухайте медіатором невеликою амплітудою й зупиніться, якщо рука напружується.
steps:
  quarter-pulse:
    title: 1. Відлічи такт четвертей
    body: >-
      Відлічіть чотири долі. Грайте на 1, пауза на 2, потім грайте на 3 та 4. Тиха друга доля має тривати стільки
      ж, скільки інші. {{positions}}.
  quarter-space:
    title: 2. Рахуй під час паузи
    body: Доля 2 триває весь проміжок між кліками. Зупини звук і не грай нову ноту.
  eighth-pairs:
    title: 3. Поділи перші дві долі
    body: 'Такт 2: грай на «1» та «і», пауза на «2», грай на «і». {{positions}}.'
  eighth-spaces:
    title: 4. Залиш проміжки між атаками
    body: 'Заверши такт 2: грай на «3», пауза на «і», грай на «4», пауза на «і». {{positions}}.'
  whole-pattern:
    title: 5. Зіграй обидва такти
    body: >-
      Зіграйте обидва такти: усього вісім атак, кожна записана нота потребує нового удару. Не прискорюйтеся, коли
      атаки стають ближчими. Після спроби виберіть для повтору одну ранню чи пізню групу. Зробіть три контрольовані
      спроби на 60 BPM перед переходом до 65 BPM. {{positions}}.
