lessonID: steady-pulse
lessonVersion: 2
locale: en
title: Keep a steady pulse
summary: Practice quarters, eighths and rests on one open string.
goal: Place separate attacks on written beats and half-beats while counting through rests.
body: >-
  First practice open strings. Use open string 6 throughout. Count “1 and 2 and 3 and 4 and”; the metronome marks
  the numbers. A quarter takes one beat and an eighth half a beat. A rest still takes time. Start at 60 BPM, count
  aloud, then play. Repeat at the same tempo before trying 70 BPM.
steps:
  quarter-pulse:
    title: 1. Count the quarter-note bar
    body: 'Bar 1: play on 1, rest on 2, play on 3 and 4. {{positions}}.'
  quarter-space:
    title: 2. Count through the rest
    body: Beat 2 lasts one complete click interval. Stop the sound and do not pluck.
  eighth-pairs:
    title: 3. Divide the first two beats
    body: 'Bar 2: play on “1” and “and”, rest on “2”, play on “and”. {{positions}}.'
  eighth-spaces:
    title: 4. Leave space between attacks
    body: 'Finish bar 2: play on “3”, rest on “and”, play on “4”, rest on “and”. {{positions}}.'
  whole-pattern:
    title: 5. Play both bars
    body: Eight attacks, including repeated notes; every written note needs a fresh pluck. {{positions}}.
historicalTitle: Keep a steady pulse
activities:
  lesson:
    title: Pulse on {{first}}
    body: |-
      Repeat {{first}} with quarters, eighths and rests.

      Sequence: {{sequence}}.
