lessonID: compound-meters
lessonVersion: 1
locale: uk
title: Відчуйте 6/8 та 12/8
summary: Об’єднайте записані восьмі в пульс чвертей із крапкою та розрізняйте долю й довжину такту.
goal: 'Грати групи з трьох восьмих: дві основні долі в 6/8 та чотири в 12/8.'
body: |-
  У складному розмірі основна доля природно ділиться на три рівні частини. Шість восьмих у 6/8 утворюють дві чверті з крапкою: РАЗ-і-та, ДВА-і-та. У 12/8 таких основних долей чотири: РАЗ, ДВА, ТРИ й ЧОТИРИ, кожна зі своїми трьома частинами. Чисельник рахує записані восьмі одиниці, а не обов’язково основні кліки метронома.

  Додаток підписує одиницю пульсу поруч із BPM. У цих вправах 60 BPM означає шістдесят чвертей із крапкою за хвилину. Доля триває секунду, восьма — третину секунди, такт 6/8 — дві секунди, а 12/8 — чотири. Повний вступний відлік використовує ту саму одиницю: два кліки перед 6/8 та чотири перед 12/8. Це не 60 окремих восьмих за хвилину.

  Почніть із чотирьох тактів повторюваних восьмих у 6/8. Промовляйте три рівні склади на клік і м’яко виділяйте початок кожної основної долі. Зберігайте дві основні долі на такт. Хоча 3/4 теж може містити шість восьмих, його звичайне групування — три пари, а не дві групи по три. Стежте за в’язками й відчувайте пульс; знаменник не наказує грати лише одну ноту на клік.

  Далі зіграйте чотиритактову мелодичну фразу. У кожному з перших трьох тактів шість окремих атак восьмих; в останньому — три восьмі й тоніка чвертю з крапкою. Ця фінальна нота заповнює всю другу основну долю: атакуйте один раз і дайте їй звучати. Позначене покриття утримання перевіряє продовження цільової висоти, а не палець чи спосіб її утримання.

  Приклад 12/8 має ті самі висоти й тривалості, що й мелодичний 6/8, але об’єднує музику у два довші такти. Одиниця темпу залишається чвертю з крапкою. Метроном і далі клацає раз на основну долю, а найсильніший тактовий акцент з’являється через чотири долі замість двох. Читайте через колишні короткі тактові межі, не додаючи атаки. Порівняйте обидва приклади на однаковому BPM, щоб почути зміну організації, а не швидкості. Перегляньте час нот і фінальне утримання; відчуття групування оцініть окремо від автоматичного бала.
steps:
  prepare:
    title: Спершу прочитайте одиницю темпу
    body: >-
      Установіть 60 BPM і перевірте підпис пульсу чвертей із крапкою. Промовляйте три рівні частини на клік. Перед
      6/8 очікуйте два повні кліки відліку, перед 12/8 — чотири.
  six-eight-pulse:
    title: Дві долі, шість восьмих
    body: >-
      Зіграйте чотири такти 6/8 на одній висоті. Рахуйте РАЗ-і-та, ДВА-і-та. Кожна група з трьох звичайних восьмих
      без тріольної дужки займає чверть із крапкою; це не записані восьмі тріолі.
  six-eight-phrase:
    title: Сформуйте чотиритактову фразу
    body: >-
      У кожному з перших трьох тактів зіграйте шість восьмих. У такті 4 — три восьмі, потім утримайте тоніку всю
      другу основну долю, чверть із крапкою. Не атакуйте її повторно. {{sequence}}.
  twelve-eight-flow:
    title: Збережіть ноти, подовжте такт
    body: >-
      Зіграйте ті самі мелодичні події у двох тактах 12/8 на тому самому BPM чвертей із крапкою. Рахуйте чотири
      основні долі на такт. Тактова риска й найсильніший акцент прикладу зміщуються; висоти, тривалості та фінальне
      утримання ті самі.
  review:
    title: Розділіть поділ долі й рахунок тактів
    body: >-
      Перегляньте нерівні проміжки всередині долі та фінальне утримання. Потім послухайте організацію по дві й по
      чотири основні долі. Якщо рахунок тактів відволікає від трьох рівних частин, повторіть на одній висоті.
  question:
    title: Що тут означає 60 BPM?
    body: Відрахуйте поділ долі перед відповіддю.
activities:
  six-eight-pulse:
    title: Дві долі, шість восьмих
    body: >-
      Зіграйте чотири такти 6/8 на одній висоті. Рахуйте РАЗ-і-та, ДВА-і-та. Кожна група з трьох звичайних восьмих
      без тріольної дужки займає чверть із крапкою; це не записані восьмі тріолі.
  six-eight-phrase:
    title: Сформуйте чотиритактову фразу
    body: >-
      У кожному з перших трьох тактів зіграйте шість восьмих. У такті 4 — три восьмі, потім утримайте тоніку всю
      другу основну долю, чверть із крапкою. Не атакуйте її повторно. {{sequence}}.
  twelve-eight-flow:
    title: Збережіть ноти, подовжте такт
    body: >-
      Зіграйте ті самі мелодичні події у двох тактах 12/8 на тому самому BPM чвертей із крапкою. Рахуйте чотири
      основні долі на такт. Тактова риска й найсильніший акцент прикладу зміщуються; висоти, тривалості та фінальне
      утримання ті самі.
learningTasks:
  question:
    title: Що тут означає 60 BPM?
    body: У вправі 6/8 з пульсом чвертей із крапкою на 60 BPM скільки основних кліків і секунд у такті?
    items:
      two: Два основні кліки; такт триває дві секунди.
      six: Шість основних кліків; такт триває шість секунд.
      three: Три кліки чвертей; такт триває три секунди.
    explanation: >-
      Шість записаних восьмих утворюють дві чверті з крапкою. Кожна така основна доля триває секунду в цьому темпі.
      Підпис одиниці пульсу визначає, що рахує BPM.
  review:
    title: Перевірте свій пульс
    body: Позначте лише власні спостереження.
    items:
      unit: Я прочитав одиницю BPM і відрахував правильні дві або чотири основні долі на такт.
      subdivision: Я зберіг три рівні восьмі всередині кожної основної долі без прискорення.
      hold: Я дав фінальній тоніці чвертю з крапкою прозвучати одну основну долю після однієї атаки.
