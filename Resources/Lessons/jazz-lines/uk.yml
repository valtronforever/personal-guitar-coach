lessonID: jazz-lines
lessonVersion: 1
locale: uk
title: 'Джазові лінії: наближайся до акордових звуків'
summary: Спрямуй хроматичні ноти до запланованих цілей у ii–V–I.
goal: Зіграй чотиритактову лінію з чіткими акордовими прибуттями, хроматичними підходами й свідомим завершенням.
body: |-
  Хроматична нота стає корисною, коли зрозуміло, куди вона прямує. Обери ціль із поточного акорду, чітко почуй її та підійди із сусідньої висоти. Прибуття важливіше за накопичення сторонніх нот. Урок проходить один такт ii, один V і два I в мажорному центрі. Приклади — оригінальна підготовка рівними восьмими; вони не потребують прихованої фонограми й не відтворюють усі джазові артикуляції.

  Карта цілей спершу розміщує терцію ii, терцію V, терцію I та тоніку в окремих тактах. Грай ноти досить довго, щоб запам’ятати роль, потім відрахуй тиху останню долю. Додавай підхід лише після того, як можеш заздалегідь почути прибуття. Півтон знизу або згори може створити рух, не стаючи новим тональним центром.

  Порівняй однонотні підходи з двонотними оточеннями. В оточенні висоти з протилежних боків обрамляють ціль перед її появою. Одна може належати тональності, а інша бути хроматичною; відстані не зобов’язані збігатися. Утримуй короткі підхідні ноти в записаних позиціях і дай цілі повну тривалість. Поспіх у підході змінює ритм, навіть якщо фінальна висота правильна.

  Повна лінія поєднує акордові ділянки восьмими. Читай по одному такту, назви стійке прибуття й визнач сусідній хроматичний рух. Другий такт завершується терцією домінанти, наступний починається тонікою. У третьому такті нота над високою тонікою спускається до неї хроматично. Слухай ці цілі замість однакової уваги до кожного ладу.

  Зіграй точну лінію чисто для перевірки висоти й часу, потім вигадай коротшу відповідь з одним її підходом. Збережи чотиритактовий маршрут і залиш свідомий проміжок. Точна вправа та імпровізована відповідь мають різні цілі: додаток перевіряє записані одноголосні цілі, а гармонічний намір, артикуляція й якість фрази лишаються слуховими рішеннями. Змінюй один підхід за раз, щоб пояснити дію нової версії.
steps:
  prepare:
    title: Обери невелику музичну ідею
    body: Прочитай план, обери зручний чистий звук і почни повільно.
  target-map:
    title: Почуй заплановані прибуття
    body: 'Центр: {{root}} major. Почуй терцію ii, терцію V, терцію I та тоніку: одна ціль на такт.'
  half-step-approaches:
    title: Підійди з відстані півтону
    body: Використай першу восьму як підхід, наступну чверть із крапкою — як ціль. Залиш дві тихі долі після кожної
      комірки.
  enclosures:
    title: Оточи ціль із двох боків
    body: Перше оточення прибуває на терцію тонічного акорду, друге — на терцію домінанти. Короткі ноти ведуть до
      цілей, а не замінюють їх.
  four-bar-line:
    title: Поєднай чотири такти ii–V–I
    body: Відведи один такт ii, один V і два I. Почуй перехід терції домінанти в тоніку на такті 3 та завершення
      фрази фінальним підходом.
  line-review:
    title: Збережи ціль під час зміни лінії
    body: Створи коротшу чотиритактову відповідь з одним підходом і свідомим проміжком. Порівняй прибуття та ритм
      із записаною моделлю.
