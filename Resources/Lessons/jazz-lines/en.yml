learningTasks:
  line-review:
    title: Keep a target when changing the line
    body: Create a shorter four-bar answer with one approach and one intentional gap. Compare the destination and
      rhythm with the written model.
    items:
      target: I could name and hear the target before its approach.
      time: The target arrived in its planned rhythmic slot.
      route: My answer retained the ii–V–I four-bar route.
      space: I included a deliberate gap rather than continuous scale motion.
      change: I could explain which approach I changed and why.
