lessonID: same-notes-new-position
lessonVersion: 2
locale: uk
title: Ті самі ноти в різних ділянках
summary: Дослідіть одну ноту, а потім зіграйте ту саму гаму у двох ділянках.
goal: Зберігайте висоту нот та їхні октави, змінюючи аплікатуру.
body: |-
  Та сама висота часто існує в кількох парах струна/лад. Перенесення фрази до іншої ділянки може змінити відчуття й тембр без зміни жодної ноти. Цей урок зберігає і клас висоти, і октаву: нота октавою вище тут не є рівноцінною відповіддю. Спочатку пройдіть мажорну гаму й поєднання сусідніх позицій, щоб відокремити музичну будову від маршруту руки.

  Почніть з однієї ноти. Прослухайте її, зіграйте початкове місце, потім виберіть іншу доступну ділянку й порівняйте звучання. Читайте номер струни разом із ладом: сам номер ладу не визначає ноту. Додаток пропонує місце, що відповідає ділянці й налаштуванням інструменту. Він не підтверджує фактичне місце гри, бо унісони мають однакову висоту.

  Далі порівняйте повні аплікатури мажорної гами. Вона піднімається до октави й спускається без повтору вершини: п’ятнадцять атак чвертями й одна чверть паузи у чотирьох тактах. Після вибору іншої ділянки тоніка, порядок висот та октави не змінюються. Перемикач пропонує ділянку лише якщо весь матеріал уміщується; не потрібно силоміць ставити першу ноту саме на названий лад. Ділянка біля сьомого ладу може починатися нотою на пізнішому ладі.

  Прочитайте кожний маршрут до практики. Знайдіть тоніку, подумки позначте зміни струн і вирішіть, де трохи перемістити руку. Грайте на 50 BPM або повільніше за потреби. Порівняйте початковий маршрут із заданим біля сьомого ладу за однакового темпу й входу. Задана ділянка має ширину шість ладів, щоб умістити адаптацію найнижчої струни в Drop; це не означає тримати розтяжку на шість ладів. За потреби послаблюйте притискання й пересувайте руку.

  Зміна ділянки грифа зберігає звучання. Зміна строю інструменту натомість може транспонувати весь урок до іншої тональності. Це різні дії. Після зміни Settings знову перевірте поточні назви нот і доступні варіанти. Історія зберігає висоти й налаштування кожної минулої спроби; порівнюйте результати з урахуванням показаних умов.
steps:
  hear-note:
    title: Знайдіть ту саму ноту деінде
    body: >-
      Послухайте {{first}}, потім оберіть іншу доступну ділянку. Зіграйте {{positions}}. Порівняйте висоту з початковою
      нотою; зберігайте октаву.
  explore-scale:
    title: Дослідіть гаму
    body: >-
      Спробуйте доступні варіанти й порівняйте шляхи: {{positions}}. У ділянці має вміщуватися вся гама. Перед початком
      прочитайте табулатуру.
  play-original:
    title: Зіграйте початкову аплікатуру
    body: 'Використайте {{positionLabel}}: {{positions}}. Завершіть цю спробу перед переходом до наступного кроку.'
  play-seven:
    title: Зіграйте біля сьомого ладу
    body: >-
      Використайте {{positionLabel}}: {{positions}}. Ширина ділянки — шість ладів, щоб у Drop-строях умістити змінену
      аплікатуру найтовщої струни. Якщо дія недоступна для вашого інструменту, поверніться до дослідження або змініть
      налаштування інструменту.
  reflect:
    title: Порівняйте спроби
    body: >-
      Порівняйте дві спроби в одному темпі: знайдіть помилкову висоту або пізню зміну струни й повільно повторіть
      це з’єднання. Потім самостійно оцініть зручність і тембр. Висока оцінка висоти/часу не доводить використання
      заданої струни, ладу чи пальця. Позначайте спостереження нижче після виконання обох маршрутів.
  position-question:
    title: Що зберігає вибір ділянки?
    body: Дайте відповідь перед повтором маршруту.
