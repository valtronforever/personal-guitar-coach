learningTasks:
  position-question:
    title: Що зберігає вибір ділянки?
    body: Ви не змінюєте налаштування інструменту й обираєте іншу доступну ділянку. Що має лишитися однаковим?
    items:
      same: Кожна висота звучання та її октава в послідовності.
      transpose: 'Лише форма: вся мелодія обов’язково транспонується.'
      first: Перша нота обов’язково стане на точний початковий лад ділянки.
    explanation: >-
      Ця вправа зберігає висоти звучання й підбирає іншу аплікатуру в дозволеному вікні. Названий лад описує ділянку,
      а не обов’язкову першу ноту.
  reflect:
    title: Порівняйте обидві позиції
    body: >-
      Порівняйте дві спроби в одному темпі: знайдіть помилкову висоту або пізню зміну струни й повільно повторіть
      це з’єднання. Потім самостійно оцініть зручність і тембр. Висока оцінка висоти/часу не доводить використання
      заданої струни, ладу чи пальця. Позначайте спостереження нижче після виконання обох маршрутів.
    items:
      octave: Я порівняв унісон у тій самій октаві у двох показаних місцях.
      route: Я прочитав і зіграв обидва повні маршрути без вимушеної сталої розтяжки.
      comparison: Я порівняв спроби в однаковому темпі й вибрав одне з’єднання для повтору.
