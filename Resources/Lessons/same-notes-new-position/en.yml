lessonID: same-notes-new-position
lessonVersion: 2
locale: en
title: Same notes, different positions
summary: Explore one note, then play the same scale in two regions.
goal: Keep the sounding notes and their octaves while changing the fingering.
body: |-
  The same sounding note often exists at several string/fret pairs. Moving a phrase to another region can change its feel and timbre without changing any pitch. This lesson preserves both pitch class and octave: an octave higher is not an equivalent answer here. First complete the major-scale and neighboring-position lessons so you can separate musical structure from the hand’s route.

  Begin with one note. Listen, play the original location, then select another available region and compare the two sounds. Read the string number and fret together; the fret number alone does not name the note. The app proposes a playable location for the selected region and your instrument settings. It cannot confirm which location you physically used, because unisons have the same pitch.

  Next compare whole major-scale fingerings. The scale ascends to the octave and descends without repeating the top note: fifteen quarter-note attacks, followed by one quarter rest, in four bars. Its tonic, ordered pitches and octaves remain unchanged when you choose another region. The selector only offers a region if the full material fits; it is not an instruction to force the first note onto the named fret. A region near fret seven may begin with a note on a later fret.

  Study each route before starting practice. Locate the tonic, mark string crossings mentally and decide where a small hand adjustment will occur. Play at 50 BPM or slower if needed. Compare the original route with the guided seven-fret route at the same tempo and input settings. The guided window is six frets wide so that Drop adaptations of the lowest string can fit; a six-fret window does not mean holding a six-fret stretch. Release pressure and shift the hand when necessary.

  Changing a fret region preserves the sounding music. Changing the instrument tuning may instead transpose the entire lesson to the new key. These are different operations. After any Settings change, check the current note labels and available choices again. History retains the pitches and settings of each past attempt; use the displayed conditions to compare like with like.
steps:
  hear-note:
    title: Find the same note elsewhere
    body: >-
      Listen to {{first}}, then choose another available region. Play {{positions}}. Compare its pitch with the
      original; keep the same octave.
  explore-scale:
    title: Explore the scale
    body: >-
      Try the available choices and compare the paths: {{positions}}. The complete scale must fit the region. Read
      the tab before starting.
  play-original:
    title: Perform the original fingering
    body: 'Use {{positionLabel}}: {{positions}}. Complete this attempt before moving to the next step.'
  play-seven:
    title: Perform near fret seven
    body: >-
      Use {{positionLabel}}: {{positions}}. This window is six frets wide to include the adjusted low-string fingering
      in Drop tunings. If the activity is unavailable on your instrument, return to exploration or change the instrument
      settings.
  reflect:
    title: Compare your attempts
    body: >-
      Compare two attempts at the same tempo: locate a missed pitch or late string crossing and repeat that junction
      slowly. Then consider comfort and timbre yourself. A high pitch/timing score cannot establish that you used
      the requested string, fret or finger. Mark the observations below only after performing both routes.
  position-question:
    title: What does the region selector preserve?
    body: Answer before repeating the route.
activities:
  note:
    title: 'One note: {{first}}'
    body: '{{positionLabel}}. Expected note and fingering: {{positions}}.'
  explore:
    title: Explore {{root}} major
    body: '{{positionLabel}}. Sounding sequence: {{sequence}}.'
  original:
    title: Original {{root}} major
    body: '{{positionLabel}}. Sounding sequence: {{sequence}}.'
  seven:
    title: 'Near seven: {{root}} major'
    body: '{{positionLabel}}. Sounding sequence: {{sequence}}.'
learningTasks:
  position-question:
    title: What does the region selector preserve?
    body: >-
      You keep the instrument settings unchanged and select another available fret region. What should stay the
      same?
    items:
      same: Every sounding pitch and octave in the sequence.
      transpose: Only the shape; the whole melody must transpose.
      first: The first note must move to the region’s exact first fret.
    explanation: >-
      This activity preserves sounding pitches and chooses another fingering that fits the allowed window. The named
      fret describes a region, not a mandatory starting note.
  reflect:
    title: Compare both positions
    body: >-
      Compare two attempts at the same tempo: locate a missed pitch or late string crossing and repeat that junction
      slowly. Then consider comfort and timbre yourself. A high pitch/timing score cannot establish that you used
      the requested string, fret or finger. Mark the observations below only after performing both routes.
    items:
      octave: I compared a unison in the same octave at two displayed locations.
      route: I read and played both complete routes without forcing a fixed hand stretch.
      comparison: I compared the attempts at the same tempo and chose one junction to repeat.
