lessonID: intervals
lessonVersion: 1
locale: uk
title: Інтервали на одній і кількох струнах
summary: Почуйте музичні відстані від спільної опори.
goal: Грати секунди, терції, кварти, квінти й октави зі збереженням звучних відстаней.
body: 'Інтервал описує відстань між двома висотами. Тут опора однакова, а верхня нота змінюється. Приклади містять
  велику секунду (2 півтони), малу терцію (3), велику терцію (4), чисту кварту (5), чисту квінту (7) й октаву (12).
  Самого слова терція недостатньо для точної цілі: велика й мала відрізняються півтоном.


  На одній струні кількість півтонів дорівнює різниці ладів. Між струнами потрібно враховувати інтервал відкритих
  струн. Тому невеликий геометричний рух може створити більшу зміну висоти. Читайте адаптовані ноти замість підрахунку
  зсуву ладів на різних струнах як на одній.


  Прослухайте пару перед оцінюваною вправою на чотири ноти. Зупиняйте попередню струну на початку наступної. Обраний
  стрій транспонує спільну опору зі збереженням інтервалів; оцінюються чутні висоти й атаки, а не здатність назвати
  інтервал напам’ять. Для цього після слухання відведіть погляд і поясніть відстань перед перевіркою написів.'
steps:
  second: &id001
    title: Велика секунда
    body: На 50 BPM чергуйте опору й ноту на 2 півтонів вище. Назвіть інтервал перед грою, потім послухайте відстань
      без погляду на гриф. Чотири чверті утворюють такт. {{sequence}}.
  minor-third: &id002
    title: Мала терція
    body: На 50 BPM чергуйте опору й ноту на 3 півтонів вище. Назвіть інтервал перед грою, потім послухайте відстань
      без погляду на гриф. Чотири чверті утворюють такт. {{sequence}}.
  major-third: &id003
    title: Велика терція
    body: На 50 BPM чергуйте опору й ноту на 4 півтонів вище. Назвіть інтервал перед грою, потім послухайте відстань
      без погляду на гриф. Чотири чверті утворюють такт. {{sequence}}.
  fourth: &id004
    title: Чиста кварта
    body: На 50 BPM чергуйте опору й ноту на 5 півтонів вище. Назвіть інтервал перед грою, потім послухайте відстань
      без погляду на гриф. Чотири чверті утворюють такт. {{sequence}}.
  fifth: &id005
    title: Чиста квінта
    body: На 50 BPM чергуйте опору й ноту на 7 півтонів вище. Назвіть інтервал перед грою, потім послухайте відстань
      без погляду на гриф. Чотири чверті утворюють такт. {{sequence}}.
  octave: &id006
    title: Октава
    body: На 50 BPM чергуйте опору й ноту на 12 півтонів вище. Назвіть інтервал перед грою, потім послухайте відстань
      без погляду на гриф. Чотири чверті утворюють такт. {{sequence}}.
  prepare:
    title: Порівнюйте відстані, а не кількість пальців
    body: Знайдіть повторювану першу ціль. Для однієї струни рахуйте різницю ладів; між струнами використовуйте
      звучні назви й вказану кількість півтонів.
  review:
    title: Порівняйте дві терції
    body: Порівняйте малу й велику терції, потім кварту й квінту. Поясніть, яка пара відрізняється півтоном, а яка
      — тоном. Оберіть непевний інтервал для трьох повільних спроб.
activities:
  second: *id001
  minor-third: *id002
  major-third: *id003
  fourth: *id004
  fifth: *id005
  octave: *id006
learningTasks:
  review:
    title: Перевірте цю спробу
    body: Позначте лише те, що перевірили слухом чи спостереженням за руками.
    items:
      thirds: Я розрізняв терції у три й чотири півтони.
      strings: Я враховував інтервал строю при порівнянні різних струн.
      hearing: Я порівнював пари слухом перед поверненням до назв.
