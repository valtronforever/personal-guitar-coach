lessonID: write-a-riff
lessonVersion: 1
locale: uk
title: Створи риф із впізнаваним поверненням
summary: Розвинь одну ідею через ритм, регістр і свідоме завершення.
goal: Створи й запиши чотиритактовий риф, у якому на слух впізнаються повторена ідея та змінене завершення.
body: |-
  Почни з обмеження, яке робить вибір чутним. Обери три-чотири сусідні ноти, зручний пульс і один такт ритму. Зіграй початкову модель, потім зупинись і пригадай її ритм без інструмента. Якщо ідея зникає одразу після гри, спростити її корисніше. Рифу не потрібно багато висот для впізнаваності: повторене розміщення атак, паузи й характерне завершення надають малому осередку власний образ.

  Повтори початкову ідею точно перед зміною. Точне повторення створює слухачеві опору для впізнавання. Далі пересунь одну атаку або заміни останню ноту, зберігаючи решту. Порівняй версії в одному темпі. Одночасна зміна висот, ритму, регістру й артикуляції ускладнює розуміння, яке рішення допомогло. Збережи варіант із чітким запитанням, відповіддю або поверненням, а не просто більшою кількістю подій.

  Чотиритактова модель має послідовність: початкова ідея, її точне повторення, варіація й завершення. Рахуй кожний цілий такт, включно з проміжком після першої ідеї. Варіація змінює густоту атак, а останній такт повертається до центру й лишає долю простору. Вивчи весь приклад перед заміною власним матеріалом, щоб забута тривалість такту не здавалася навмисною композиційною зміною.

  Для власного рифу збережи чотиритактову рамку й запиши рахунок атак або малу TAB-схему на папері. Обери одну впізнавану ознаку, яку зберігатимеш, та одну змінну. Кілька разів зіграй нову ідею з метрономом, перевіряючи перехід завершення назад у початок. Потім порівняй остаточний прохід і повтор у циклі: переконливе повернення та переконлива фінальна зупинка пов’язані, але є різними рішеннями.

  Використай запис самопрактики на чотиритактовій моделі, щоб зафіксувати власний варіант у тій самій тривалості. Показані ноти залишаються наданим еталоном; додаток не є редактором композиції й не переписує їх із твоєї гри. Свідомо збережи WAV і послухай ознаку, яку хотів зберегти. Впізнаваність, баланс і чітке завершення перевіряй самостійно. Автоматична оцінка цієї активності не вирішує художню якість твору.
steps:
  prepare:
    title: Обери невелику музичну ідею
    body: Прочитай план, обери зручний чистий звук і почни повільно.
  seed:
    title: Збережи малу впізнавану ідею
    body: 'Центр: {{root}} minor. Повтори початкову висоту, піднімись і залиш четверту долю порожньою. Вивчи ритм
      до зміни набору нот.'
  variation:
    title: Зміни густоту атак
    body: Збережи той самий набір висот і кінцеву паузу, перерозподіливши перші дві долі на чотири атаки восьмими.
  ending:
    title: Заверши фразу
    body: Спустись до центру й залиш повну долю тиші. Відрахуй проміжок перед зупинкою або поверненням.
  four-bar-riff:
    title: Ідея, повторення, варіація, завершення
    body: Зіграй модель один раз, потім створи власний варіант у тій самій чотиритактовій рамці. Запис зберігає
      еталон як контекст, але не транскрибує твої нові ноти.
  review:
    title: Поясни композиційний вибір
    body: Назви збережену ознаку та одну навмисну відмінність у чотирьох тактах.
