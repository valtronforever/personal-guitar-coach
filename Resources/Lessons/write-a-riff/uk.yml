learningTasks:
  review:
    title: Поясни композиційний вибір
    body: Назви збережену ознаку та одну навмисну відмінність у чотирьох тактах.
    items:
      identity: Я можу наспівати або відстукати початкову ідею без підглядання.
      change: Я змінив одну ознаку й порівняв її в одному темпі.
      form: Мої чотири такти містять свідоме повернення або фінальну зупинку.
      listen: Я послухав збережений запис і назвав одне корисне виправлення.
