learningTasks:
  review:
    title: Explain the compositional choice
    body: Name the unchanged feature and one deliberate difference in your four bars.
    items:
      identity: I can sing or tap the seed without looking.
      change: I changed one feature and compared it at the same tempo.
      form: My four bars include a deliberate return or final stop.
      listen: I listened to my saved take and named one useful revision.
