learningTasks:
  review:
    title: Check the relationship between parts
    body: Listen to entrances and empty spaces before changing tone.
    items:
      roles: I can state each guitar’s distinct musical job.
      entrances: I kept the upper entrance after the lower attack.
      holds: The lower note continued while the upper voice changed.
      space: I compared a sparser version without changing the harmony.
      release: Both roles have an agreed final release.
