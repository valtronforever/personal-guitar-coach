lessonID: arrange-two-guitars
lessonVersion: 1
locale: uk
title: Дай двом гітарам різні завдання
summary: Розділи регістр, місця атак і тривалості замість дублювання кожної ноти.
goal: Побудуй чотиритактове аранжування зі стійкою нижньою партією та доповнювальною верхньою відповіддю.
body: |-
  Аранжування визначає, хто виконує кожну музичну функцію. Дві гітари можуть грати акорди, але для ясності їм усе одно потрібні різні регістри, ритми або густота. Спершу доручи одній партії основу, іншій — коротку відповідь. Нижня партія прикладу утримує основний звук упродовж такту; верхня вступає після першої долі. Відмінність створює простір без вимоги складної гри від будь-кого.

  Вивчи нижню й верхню партії окремо, рахуючи ту саму чотиритактову форму. Початкова пауза верхнього голосу навмисна. Не заповнюй її лише тому, що руки готові. Почуй, як утримана нижня висота підтримує пізніший вступ. З іншим гітаристом узгодь темп, відлік, гармонічні зміни й точне фінальне завершення до обговорення тембру або ефектів. Нечіткий кінець лишиться нечітким і через більший підсилювач.

  Спільний еталон показує обидві ролі разом. Утримані лади в дужках продовжують звучати без нової атаки, поки інший голос рухається. Це синтезована ілюстрація часових і висотних зв’язків, а не дві незалежно записані гітарні доріжки. Можна зіграти спільний етюд одному зі зручною аплікатурою або розділити ролі між виконавцями. Окремі приклади чітко показують поділ замість копіювання всієї фактури обома.

  Зміни одне рішення й послухай наслідок. Спробуй коротшу основу, вищу відповідь або на одну верхню атаку менше. Під час порівняння збережи гармонічний маршрут. Якщо партіям тісно, спершу зменш перетин або дублювання регістрів замість негайного зменшення гучності. Баланс рівнів важливий, але структурний конфлікт може лишитися на будь-якому рівні. Нехай кожний назве головний вступ іншої партії, слухаючи ширше за власну аплікатуру.

  Запиши спільний етюд або свою доручену партію для самоперевірки. Додаток захоплює один обраний моновхід; він не записує два інтерфейси окремими доріжками й не мікшує імпортований акомпанемент. Для спільного звучання двох реальних виконавців використай відповідний зовнішній запис або слухай у кімнаті. Розділення ролей, час вступів і завершень оціни самостійно. Поліфонія не отримує автоматичної оцінки, а ясний еталон не доводить балансу живих партій.
steps:
  prepare:
    title: Обери невелику музичну ідею
    body: Прочитай план, обери зручний чистий звук і почни повільно.
  lower-role:
    title: 'Нижня гітара: стійка основа'
    body: 'Центр: {{root}} major. Утримуй одну нижню ноту весь такт. Завершуй і повторно атакуй лише на записаній
      зміні.'
  upper-role:
    title: 'Верхня гітара: вступи після основи'
    body: Залиш паузу на долі 1, зіграй на долі 2 й дай другій верхній ноті долі 3–4. Рахуй, поки починає інша роль.
  combined-roles:
    title: Почуй обидва завдання разом
    body: Збережи звучання нижнього ладу в дужках під час вступу та зміни верхніх нот. Еталон ілюструє обидві ролі;
      запис захоплює лише обраний вхід.
  more-space:
    title: Спробуй рідшу верхню відповідь
    body: Порівняй одну верхню атаку на долі 3 з початковими двома. Залиш долю 4 чистою замість продовження в наступну
      основу.
  review:
    title: Перевір взаємодію партій
    body: Послухай вступи й порожні місця перед зміною тембру.
