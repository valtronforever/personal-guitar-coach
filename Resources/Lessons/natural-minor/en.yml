    title: One octave in both directions
    body: >-
      At 50 BPM play one quarter per click. Bars 1–2 ascend and bars 3–4 descend, with the last beat silent. Listen
      for the small 2–flat 3 and 5–flat 6 steps. Resolved sequence: {{sequence}}.
  parallel-comparison:
    title: Major and minor share this tonic
    body: >-
      Bars 1–2 are major; bar 3 is silent. Bars 4–5 are natural minor on the same tonic; bar 6 is silent. Listen
      particularly to the third, sixth and seventh. The starting pitch does not move between the two examples. {{sequence}}.
  tonic-phrase:
    title: Make two connected thoughts
    body: >-
      Play 1–flat 3–5–1 in bar 1 and flat 6–flat 7–2–1 in bar 2. Do not speed up the descending finish. Repeat three
