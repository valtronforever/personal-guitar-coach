learningTasks:
  knowledge-check:
    title: Parallel major and minor
    body: Which degrees are lowered when major becomes natural minor on the same tonic?
    items:
      three: 3, 6 and 7
      two: 2, 4 and 5
      all: Every degree
    explanation: Natural minor retains 1, 2, 4 and 5, and lowers 3, 6 and 7 by one semitone.
  review:
    title: Review the phrase
    body: Mark only observations you made yourself.
    items:
      steps: I can locate both natural-minor semitone steps.
      contrast: I compared major and minor without changing the tonic.
      phrase: I ended both short phrases deliberately on the tonic.
