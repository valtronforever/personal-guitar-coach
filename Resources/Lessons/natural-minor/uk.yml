      Повторіть тричі, чуючи обидві фінальні тоніки як цілі.
learningTasks:
  knowledge-check:
    title: Однойменні мажор і мінор
    body: Які ступені понижуються при переході від мажору до натурального мінору з тією самою тонікою?
    items:
      three: 3, 6 й 7
      two: 2, 4 й 5
      all: Кожний ступінь
    explanation: Натуральний мінор зберігає 1, 2, 4 й 5 та понижує 3, 6 й 7 на півтону.
  review:
    title: Перевірте фразу
    body: Позначте лише власні спостереження.
    items:
      steps: Я знаходжу обидва півтонові кроки натурального мінору.
      contrast: Я порівняв мажор і мінор без зміни тоніки.
      phrase: Я свідомо закінчував обидві короткі фрази на тоніці.
