lessonID: natural-minor
lessonVersion: 1
locale: uk
title: Натуральний мінор
summary: Почуйте, як понижені третій, шостий і сьомий ступені змінюють знайому тоніку.
goal: Зіграти натуральний мінор і відрізнити його від мажору з тією самою тонікою.
body: |-
  Натуральний мінор має ступені 1, 2, понижену 3, 4, 5, понижену 6 й понижену 7. Сусідні кроки: 2–1–2–2–1–2–2 півтони. Порівняно з мажором від тієї самої тоніки ступені 3, 6 й 7 нижчі на півтону; тоніка, 2, 4 й 5 не змінюються. «Понижений» тут описує інтервал відносно мажору, а не обов’язковий знак бемоля в поточній назві ноти.

  Почніть з однієї октави й повернення без повтору вершини. Почуйте півтони між 2–пониженою 3 й 5–пониженою 6. Називайте ступені в окремому проході, не вважаючи кожний номер ладу ступенем. Зупиняйте попередню струну на початку наступної, зберігаючи чистий одноголосний вхід.

  Порівняння зберігає тоніку: два такти мажору, такт тиші, два такти натурального мінору й ще такт тиші. Почуйте зміну замість припущення, що мінор — це мажор, перенесений усім малюнком на інший лад. Це однойменні тональності з тією самою тонікою, а не паралельні тональності з різними тоніками.

  Коротка остання фраза починається мінорним тризвуком 1–понижена 3–5–1 і відповідає понижена 6–понижена 7–2–1. Грайте чверті на 50 BPM і свідомо повертайтеся до 1. Інтервали транспонуються з налаштуваннями інструменту; програма оцінює записані ноти й атаки, а впізнавання тональності та вибір рук залишаються вашими спостереженнями.
steps:
  prepare:
    title: Знайдіть тоніку й октаву
    body: >-
      Знайдіть першу й найвищу ноти в TAB гами. Озвучте окремо, потім тихо проспівайте тоніку перед стартом. Використовуйте
      чистий вхід і узгодьте вибраний стрій з інструментом.
  up-and-down:
    title: Октава в обидва боки
    body: >-
      На 50 BPM грайте по чверті на клік. Такти 1–2 вгору, 3–4 вниз, остання доля тиха. Слухайте малі кроки 2–понижена
      3 й 5–понижена 6. Актуальна послідовність: {{sequence}}.
  parallel-comparison:
    title: Мажор і мінор мають спільну тоніку
    body: >-
      Такти 1–2 — мажор; 3 — тиша. Такти 4–5 — натуральний мінор від тієї самої тоніки; 6 — тиша. Особливо слухайте
      3, 6 й 7 ступені. Початкова висота між прикладами не змінюється. {{sequence}}.
  tonic-phrase:
    title: Створіть дві пов’язані думки
    body: >-
      У такті 1 зіграйте 1–понижена 3–5–1, у такті 2 — понижена 6–понижена 7–2–1. Не прискорюйте низхідне завершення.
      Повторіть тричі, чуючи обидві фінальні тоніки як цілі.
  review:
    title: Розділіть інтервальну зміну й малюнок руки
    body: >-
      Поверніться до порівняння й назвіть три змінені ступені. Якщо перехід нечіткий, повільно зіграйте лише сусідню
      пару, потім цілу гаму. Підвищуйте темп після трьох рівних спроб.
  knowledge-check:
    title: Перевірте музичне співвідношення
    body: Дайте відповідь за будовою, яку практикували.
