lessonID: eighth-notes
lessonVersion: 1
locale: uk
title: Восьмі ноти
summary: Діліть кожну долю на дві рівні атаки.
goal: Грати рівні восьмі без прискорення між кліками.
body: |-
  Клік чвертями позначає цілу долю. Усередині неї вміщуються дві восьмі: перша на кліку, друга точно посередині до наступного кліку. Рахуйте «1 і 2 і 3 і 4 і» з однаковими відстанями між складами. Рівні восьмі однакові; довга-коротка пара у свінгу — тема наступних уроків.

  Використовуйте чисту відкриту струну й невеликий вільний рух медіатора. Чергування вниз–вгору допомагає ділити долю, але аудіооцінка перевіряє висоту й час атак, а не напрямок медіатора.
steps:
  count:
    title: Спочатку промовте
    body: >-
      Прослухайте чотири кліки, потім промовте рахунок ще два такти без гітари. Кожне «і» має бути між кліками,
      а не на кліку.
  quarters:
    title: Встановіть пульс
    body: >-
      Зіграйте чотири окремі атаки чвертями на відкритій струні 3. Між ними продовжуйте рахувати незвучне «і». {{positions}}.
  eighths:
    title: Заповніть проміжки рівномірно
    body: >-
      У такті 2 зіграйте також кожне «і». Вісім атак тривають стільки ж, скільки чотири чверті такту 1. Прислухайтеся,
      чи кожна друга атака не зсувається до наступного кліку.
  connect:
    title: Змініть щільність, збережіть темп
    body: >-
      Практикуйте обидва такти на 60 BPM. Дограйте останнє «і», потім почніть знову після відліку додатка. Перед
      додаванням 5 BPM зробіть три рівні повтори.
  review:
    title: Перевірте перед прискоренням
    body: >-
      Якщо такт восьмими поспішає, промовляйте рахунок, граючи лише чверті, а потім поверніть пропущені атаки. Порівнюйте
      другу половину долі з метрономом.
activities:
  divide:
    title: Від чвертей до восьмих на {{first}}
    body: У такті 1 чотири атаки, у такті 2 — вісім. Темп кліків незмінний. {{sequence}}.
learningTasks:
  review:
    title: Перевірте свою практику
    body: Позначайте лише перевірене; самооцінка не змінює аудіооцінку.
    items:
      count: Я рівномірно відлічую всі вісім поділів.
      sound: Такт восьмими триває ті самі чотири кліки, що й такт чвертями.
      repeat: У трьох повторах слабка восьма лишається посередині між кліками.
