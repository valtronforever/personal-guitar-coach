lessonID: fingering-key-tuning
lessonVersion: 1
locale: uk
title: Аплікатура, тональність і стрій
summary: Відділіть геометрію струн і ладів від отриманих висот.
goal: Пояснити рівномірне транспонування форм між Standard-строями й поправку нижньої струни у Drop.
body: 'Аплікатура — набір фізичних контактів. Звучні висоти залежать від строю відкритих струн. Перехід з E Standard
  у D Standard понижує всі шість струн на два півтони, тому ті самі позиції створюють рівномірно транспоновану фразу.
  Інтервали всередині неї зберігаються. C і B Standard працюють так само зі своїм зсувом.


  Drop відрізняється: відносно відповідного Standard лише струна 6 понижується на два півтони. Форма з цією струною
  може змінити внутрішні інтервали. Конкретний приклад E Standard: струна 6 лад 3 та струна 5 лад 5 звучать G2 і
  D3, квінта. Ті самі контакти у Drop D дають F2 і D3, велику сексту. Переміщення нижнього контакту на лад 5 відновлює
  G2–D3. Для розуміння цього розбору фізичне переналаштування не потрібне.


  Практика нижче зберігає потрібні інтервали у вашому поточному строї. Огляньте фактичні маркери: квінта з нижньою
  струною може потребувати іншого зсуву, а кварта середніх струн зберігає співвідношення. Кварта між струнами 3
  і 2 теж має іншу форму, бо їхні відкриті струни у наданих пресетах розділяє велика терція. Звук перевіряє отримані
  ноти, а не використані контакти.'
steps:
  prepare:
    title: Підтвердіть один фізичний стрій
    body: У всіх оцінюваних спробах Settings мають відповідати справжній гітарі. Письмове порівняння E Standard/Drop
      D — пояснення; зміна налаштування не переналаштовує гітару.
  low-fifth: &id001
    title: Збережіть квінту нижньої пари
    body: Чергуйте дві цілі чвертями на 50 BPM. Визначте, маркери мають зсув у два лади чи вирівняні в обраному
      пресеті. Звучна відстань в обох випадках сім півтонів. {{sequence}}.
  middle-fourth: &id002
    title: Один лад у пари, налаштованої квартою
    body: Зіграйте чотири цілі на струнах 5 і 4. Контакти одного ладу дають кварту в п’ять півтонів у наданих пресетах.
      Порівняйте звук і геометрію з попередньою квінтою. {{sequence}}.
  upper-fourth: &id003
    title: Верхня пара потребує зсуву
    body: Тепер зіграйте кварту між струнами 3 і 2. Помітьте зсув в один лад, який компенсує інший інтервал відкритих
      струн. Для оцінювання зупиняйте попередню ноту. {{sequence}}.
  review:
    title: Поясніть зміну форми без зміни музики
    body: На прикладі нижньої квінти поясніть різницю між пониженням однієї струни й усіх разом. Потім поясніть
      різні форми двох кварт навіть у Standard.
activities:
  low-fifth: *id001
  middle-fourth: *id002
  upper-fourth: *id003
learningTasks:
  review:
    title: Перевірте цю спробу
    body: Позначте лише те, що перевірили слухом чи спостереженням за руками.
    items:
      uniform: Я відрізняв рівномірне транспонування Standard від пониження лише струни 6.
      geometry: Я дотримувався фактичних позицій зі збереженням інтервалів цього строю.
      upper: Я пояснював зсув між струнами 3 і 2.
