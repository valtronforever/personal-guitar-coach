lessonID: triplets
lessonVersion: 1
locale: uk
title: Восьмі тріолі
summary: Умістіть три рівні ноти в одну долю, зберігаючи пульс чвертей.
goal: Перемикатися між однією, двома й трьома нотами на долю та зіграти коротку тріольну мелодію.
body: |-
  Чвертну долю можна поділити на дві рівні восьмі або три рівні восьмі тріолі. Темп і далі описує пульс чвертей: на 60 BPM доля триває секунду, звичайна восьма — пів секунди, а місце тріолі — третину секунди. Не прискорюйте метроном після зміни поділу.

  Дужка з цифрою 3 об’єднує три записані восьмі місця в часі, який зазвичай займають дві восьмі. Рахуйте раз-і-та, два-і-та, три-і-та, чотири-і-та з однаковими проміжками між трьома складами. Група з трьох звичайних чвертей відрізняється: вона займає три долі. Перед грою промовте тріольний рахунок і простукайте лише пронумеровані долі.

  Порівняння має чотири такти: чверті, звичайні восьмі, тріолі, потім одна чверть і три тихі долі. Висота та сама, щоб змінювати лише час. Спершу прослухайте, на другому проході рахуйте вголос, потім грайте на 60 BPM або повільніше. Друга звичайна восьма лежить посередині між кліками; друге й третє місця тріолі — на одній і двох третинах цього проміжку.

  Далі зіграйте два такти повторюваних тріолей. Потрібні рівні проміжки, а не довго-коротко. Використовуйте невеликі зручні рухи медіатора й зупиняйтеся, якщо рука напружується. Мелодичний приклад додає зміни струн із тим самим поділом. Його остання нота займає перше тріольне місце, а чверть паузи всередині дужки — решту два. Рахуйте під час цієї паузи, не завершуйте завчасно.

  Автоматична практика зіставляє кожну висоту й атаку з тією самою часовою шкалою, що й звуковий приклад. Вона не перевіряє напрямок медіатора чи розслаблення руки. Якщо запізнюється лише третє місце, окремо повторіть одну долю й залиште простір усім трьом нотам, потім з’єднайте такти. Підвищуйте темп невеликими кроками після трьох чистих рівних спроб.
steps:
  prepare:
    title: Відрахуйте три рівні місця
    body: >-
      Установіть 60 BPM і простукуйте чверті, промовляючи по три рівномірні склади на клік. Послухайте перед грою.
      Чистий звук, у прикладах із повтором — лише вибрана струна.
  duple-and-triple: &id001
    title: Одна, дві, потім три на долю
    body: >-
      Такт 1 має чотири чверті, такт 2 — вісім звичайних восьмих, такт 3 — дванадцять тріольних нот. У такті 4 одна
      чверть й три тихі долі. Частота кліків не змінюється. Помітьте нові поділи між тими самими кліками.
  triplet-pulse: &id002
    title: Збережіть рівність трьох проміжків
    body: >-
      Зіграйте двадцять чотири ноти у двох тактах. Рахуйте всі три місця кожної долі, наступне число зіставляйте
      з кліком. Якщо доля перетворюється на поспіх, зупиніться й повільно повторіть одну групу.
  triplet-melody: &id003
    title: Перенесіть поділ між струнами
    body: >-
      Зіграйте висхідні й зворотні тризвукові групи. Прочитайте наступну струну до переходу. На останній долі зіграйте
      одну восьму тріоль і лишіть решту два місця тихими. {{sequence}}.
  review:
    title: Знайдіть нерівне місце
    body: >-
      Перегляньте, чи помилки зосереджені на місці 2, 3 або наступній долі. Повторіть одну долю з рівними проміжками,
      потім повні два такти. Зручність медіатора перевірте окремо від оцінки часу.
  question:
    title: Скільки часу займають три тріолі?
    body: Відрахуйте поділ долі перед відповіддю.
activities:
  duple-and-triple: *id001
  triplet-pulse: *id002
  triplet-melody: *id003
learningTasks:
  question:
    title: Скільки часу займають три тріолі?
    body: На 60 BPM скільки разом тривають три восьмі тріолі?
    items:
      one: 'Одну секунду: одну чвертну долю.'
      three: 'Три секунди: три чвертні долі.'
      half: 'Пів секунди: половину долі.'
    explanation: Три рівні місця ділять одну долю. За 60 чвертних долей на хвилину вона триває секунду; поділ не
      змінює темпу.
  review:
    title: Перевірте свій пульс
    body: Позначте лише власні спостереження.
    items:
      count: Я рахував три рівні місця, зіставляючи число долі з кліком.
      switching: Я перейшов від звичайних восьмих до тріолей без зміни пульсу.
      rest: Я відрахував обидва тихі тріольні місця наприкінці мелодії.
