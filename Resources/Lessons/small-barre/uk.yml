lessonID: small-barre
lessonVersion: 1
locale: uk
title: Перше мале баре
summary: Один палець на двох сусідніх струнах, потім спроба на трьох.
goal: Отримати потрібні ноти малим баре, залишивши решту струн тихими.
body: 'Баре означає, що один палець затискає кілька струн на тому самому ладі. Почніть із двох тонких струн на ладі
  5: такий невеликий дослід легше відокремити від шестиструнного акорду. Повторений номер пальця 1 у схемі навмисний
  — один вказівний торкається обох позицій. Після зміни строю цей урок зберігає фізичний малюнок ладів, а назви
  нот і звукові цілі відповідають вашому інструменту.


  Покладіть вказівний близько перед поріжком ладу й легко зіграйте кожну струну. Трохи змініть кут контакту, щоб
  струна не опинилася у складці пальця. Тисніть лише настільки, щоб звук став чистим. Зручно підтримуйте гриф; не
  викручуйте зап’ястя й не продовжуйте стискати через дискомфорт. Відпускайте між короткими спробами.


  Повна форма на дві або три струни — приклад для слухання. Оцінювана практика перевіряє ноти окремо, із зупинкою
  попередньої перед новою атакою. Додаток не визначає, використали ви один палець чи кілька, тому саме баре залишається
  самоперевіркою.'
steps:
  prepare:
    title: Почніть із короткого контакту
    body: Підтримуйте інструмент так, щоб рука на грифі не тримала його вагу. Знайдіть лад 5 на струнах 1–2, ще
      не натискаючи. Коротко відпочивайте після кількох спроб; зупиніться, якщо виникає біль.
  two-strings-shape:
    title: Один палець, дві струни
    body: Покладіть вказівний поперек струн 1–2 на ладі 5. Зіграйте струну 2, потім 1. Якщо одна глуха, спочатку
      трохи змініть кут контакту. Решта чотири струни мовчать. {{positions}}.
  two-strings:
    title: Чергуйте дві потрібні ноти
    body: 'Зберігайте баре й грайте шість чвертей на 50 BPM. Зупиняйте попередню струну рукою з медіатором, щоб
      детектор чув одну ноту. Останні дві долі — пауза: відпустіть баре, потім повторіть. {{sequence}}.'
  three-strings-shape:
    title: Розширюйте лише після чистих двох струн
    body: Тим самим вказівним охопіть струни 1–3 на ладі 5. Перевірте окремо, потім м’яко проведіть по трьох разом.
      Не розпластуйте палець далі, ніж потрібно, і не додавайте басову струну. Якщо незручно, поверніться до двох.
      {{positions}}.
  three-strings:
    title: Перевірте три контакти по черзі
    body: Зіграйте три цілі двічі, по ноті на клік, приглушуючи попередню струну. Останні дві долі — відпочинок
      і відпускання. Правильна оцінка висоти підтверджує чутні ноти, а баре одним пальцем підтверджуєте ви самі.
  review:
    title: Збережіть корисну поправку
    body: Порівняйте дві короткі спроби з трохи різним кутом контакту. Оберіть чистіший звук із меншим зусиллям,
      потім завершіть двома чистими повтореннями на двох струнах. Сильніший тиск чи довше утримання не є метою.
activities:
  two-strings-shape:
    title: Баре на дві струни
    body: Палець 1 спільний для обох позначених струн; решта мовчить.
  two-strings:
    title: Дві ноти, окремі атаки
    body: Шість атак і пауза на дві долі. {{sequence}}.
  three-strings-shape:
    title: Баре на три струни
    body: Один палець охоплює три сусідні струни на тому самому ладі.
  three-strings:
    title: Три ноти, окремі атаки
    body: Три контакти повторюються двічі; у паузі відпустіть. {{sequence}}.
learningTasks:
  review:
    title: Перевірте контакт і зусилля
    body: Лише ваше спостереження підтверджує фізичне баре; оцінка перевіряє чутні ноти.
    items:
      finger: Я використав один вказівний поперек потрібних струн.
      clear: Кожна потрібна струна прозвучала чисто під час окремої перевірки.
      release: Я відпускав між спробами й уникав зайвого тиску.
