lessonID: power-chord-self-practice
lessonVersion: 2
locale: uk
title: 'Power chords: основний тон і квінта'
summary: Зберіть двозвучні квінтові форми, пересуньте їх і додайте октаву.
goal: Чисто поєднати основний тон і чисту квінту, контролюючи зайві струни.
body: 'Базовий двозвучний power chord містить основний тон і чисту квінту на сім півтонів вище. Терції немає, тому
  сама форма не визначає мажор чи мінор. Октава підсилює основний тон, не додаючи терції. Таке компактне звучання
  корисне в рокові й металі, але спершу вивчіть його з чистим входом, щоб чути кожен потрібний звук.


  Перший приклад використовує дві нижні струни. У Standard їхні затиснуті позиції мають зсув; Drop змінює позицію
  нижньої струни, зберігаючи потрібні ноти. Орієнтуйтеся на маркери. Другий приклад пересуває основний тон на два
  лади вище зі збереженням квінти. Під час зміни не відтягуйте струни вбік.


  Повні акордові приклади призначені для слухання й контрольованої зупинки. Оцінювана вправа чергує їхні основні
  тони та квінти окремими чвертями: зупиняйте попередню струну перед новою атакою. Оцінка вимірює окремі висоти
  й таймінг, а чистота повного акорду та тиша зайвих струн залишаються вашими спостереженнями.'
steps:
  play:
    title: '{{root}} — почуйте два звуки разом'
    body: Використовуйте дві позначені позиції. Зачепіть лише ці струни, дайте їм звучати дві долі, потім зупиніть
      на дві долі. Повторіть чотири рази на 60 BPM. Якщо нота дзижчить, перевірте струни окремо й виправте контакт
      до посилення натиску. {{positions}}.
  understand:
    title: Знайте потрібний інтервал
    body: Порівняйте дві звучні цілі першого прикладу. Між ними чиста квінта, а не велика чи мала терція. Дайте
      відповідь на запитання перед перенесенням форми.
  move:
    title: '{{root}} — пересуньте, зберігши квінту'
    body: Початкова форма зміщується на два лади вище. Перевірте обидві цілі до гри й збережіть дві долі звуку та
      дві паузи. Рухайтесь у паузі, не втрачаючи рахунок. У Drop вирівнювання маркерів змінюється; використовуйте
      поточні позиції. {{positions}}.
  octave:
    title: '{{root}} — додайте основний тон ще раз'
    body: Додайте третю нижню струну зі схеми. Вона подвоює основний тон на октаву вище, тож терції й далі немає.
      Порівняйте форми на дві й три струни з подібною гучністю. Решта верхніх струн мовчить. {{positions}}.
  separate:
    title: Оцініть основні тони й квінти окремо
    body: 'Зіграйте вісім атак чвертями за два такти: основний тон–квінта двічі, потім так само від пересунутої
      форми. Зупиняйте попередню струну перед новою нотою. Почніть на 60 BPM або зменште до 40–50 для чистіших переходів.
      Розберіть повторювані помилки висоти перед прискоренням. {{sequence}}.'
  review:
    title: Поєднайте знання висот і контроль звуку
    body: Поверніться до першого повного акорду й повторіть чотири цикли звук–пауза. Порівняйте пересунуту форму
      та октаву. Якщо окремі висоти правильні, а цілий акорд шумний, зменште глибину удару й перевірте контакт зайвих
      струн; оцінка нот не підтверджує чистоту цілого.
activities:
  example:
    title: '{{root}} — квінтова форма'
    body: Два звуки разом, потім пауза. {{positions}}.
  move:
    title: '{{root}} — пересунута квінтова форма'
    body: Той самий інтервал від іншого основного тону. {{positions}}.
  octave:
    title: '{{root}} — квінтова форма з октавою'
    body: Основний тон, квінта й октава, без терції. {{notes}}.
  separate:
    title: Основні тони й квінти по черзі
    body: Вісім розділених чвертей. {{sequence}}.
learningTasks:
  clean-chord:
    title: Оцініть свою спробу
    body: Послухайте власну гру, перш ніж позначати ці критерії.
    items:
      both-notes: Я чітко чую обидві потрібні ноти.
      unused-strings: Невикористані струни не дзвенять випадково.
      release: Я можу зупинити звук на паузі.
  fifth-check:
    title: Визначте інтервал
    body: Який інтервал над основним тоном утворює базовий двозвучний power chord?
    items:
      fifth: Чиста квінта
      major-third: Велика терція
      minor-third: Мала терція
    explanation: Чиста квінта — сім півтонів. Терція додала б мажорне чи мінорне забарвлення; у цій базовій формі
      її немає.
