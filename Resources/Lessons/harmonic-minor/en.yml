    title: Hear the two characteristic distances
    body: Repeat the characteristic cell, then make one short phrase that resolves its raised seventh to the tonic.
    items:
      sixth: I retained the minor sixth instead of changing to melodic minor.
      gap: The augmented second covered three semitones.
      leading: I heard the leading tone resolve by a semitone.
      harmony: I connected that motion with the dominant-to-minor chord reference.
