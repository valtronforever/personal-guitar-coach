learningTasks:
  interval-review:
    title: Почуй дві характерні відстані
    body: Повтори характерну комірку, потім створи коротку фразу з розв’язанням підвищеного сьомого в тоніку.
    items:
      sixth: Я зберіг малу сексту замість переходу до мелодичного мінору.
      gap: Збільшена секунда охопила три півтони.
      leading: Я почув півтонове розв’язання ввідного тону.
      harmony: Я пов’язав цей рух з еталоном домінанти й мінорної тоніки.
