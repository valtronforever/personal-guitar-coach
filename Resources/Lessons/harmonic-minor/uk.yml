lessonID: harmonic-minor
lessonVersion: 1
locale: uk
title: 'Гармонічний мінор: повернися до тоніки'
summary: Почуй підвищений сьомий ступінь, збільшену секунду й мажорну домінанту в мінорі.
goal: Зіграй гармонічно-мінорні фрази з ввідним тоном і порівняй домінантово-тонічне розв’язання.
body: |-
  Гармонічний мінор перетворює сьомий ступінь натурального мінору на ввідний тон за півтон нижче тоніки. Тоніка, мала терція й мала секста не змінюються. Почуй підвищений сьомий як спрямований підхід додому, а не окремий незвичний лад. Ця зміна також дає мажорну терцію в домінантовому акорді, створюючи виразний контраст із мінорною тонікою.

  Порівняй два повні підйоми перед роботою над швидкістю. Змінюється лише один ступінь, тому збережи всі інші висоти й рівний ритм чвертей. У гармонічно-мінорному проході спрямуй передостанню ноту до фінальної тоніки. Перевір конкретні назви у своєму строї: та сама інтервальна будова тепер може мати іншу назву тональності.

  Проміжок між малою секстою й підвищеним сьомим — збільшена секунда: три півтони попри сусідні назви ступенів. Відрахуй її уважно замість згладжування до цілого тону. Характерна фраза підходить до проміжку від квінти, перетинає його до тоніки й повертається. Почуй і широкий крок, і фінальний півтон: їхній контраст є частиною звучання гами.

  Акордовий еталон порівнює домінантсептакорд без основного звуку з мінорним тонічним тризвуком. Простеж ввідний тон угору на півтон до тоніки; інші голоси теж переходять в акордові звуки. Пропущений основний звук домінанти — свідомий вибір компактного розташування. Послухай акордовий еталон, потім зіграй окрему вправу ввідного тону для ясного розв’язання без одночасних нот.

  Для оцінюваної практики грай чисті розділені ноти й порівнюй спроби в одному темпі. Опрацюй комірку збільшеної секунди, якщо пропускаєш цей інтервал, або фінальний півтон, якщо завершення неточне. Гама — словник, а не вимога заповнювати кожну фразу всіма ступенями. Заверши короткою мінорною фразою з одним підвищеним сьомим, спрямованим додому; не затримуй його без рішення про продовження.
steps:
  prepare:
    title: Обери невелику музичну ідею
    body: Прочитай план, обери зручний чистий звук і почни повільно.
  natural-minor-reference:
    title: Пригадай незмінні мінорні ступені
    body: 'Центр: {{root}} minor. Почуй натуральний сьомий перед порівнянням із підвищеним.'
  harmonic-minor-scale:
    title: Підвищ сьомий на півтон
    body: Збережи малу терцію й сексту. Сьомий тепер веде вгору на півтон до тоніки.
  characteristic-cell:
    title: Свідомо перетни збільшену секунду
    body: Почуй квінта–мала секста–ввідний тон–тоніка, потім повернися. Між шостим і сьомим — три півтони.
  leading-tone-resolution:
    title: Дай тоніці чітке прибуття
    body: Зіграй ввідний тон і тоніку у двох ритмічних співвідношеннях зі збереженням того самого півтонового розв’язання.
  dominant-to-minor:
    title: Мажорна домінанта веде до мінорної тоніки
    body: Перша форма містить терцію, квінту й малу септиму домінанти; основний звук пропущено. Друга — повний мінорний
      тонічний тризвук. Простеж нижній голос угору на півтон.
  interval-review:
    title: Почуй дві характерні відстані
    body: Повтори характерну комірку, потім створи коротку фразу з розв’язанням підвищеного сьомого в тоніку.
