learningTasks:
  question:
    title: Чи змінює інший бас назву функції?
    body: Акорд від ступеня IV має терцію в басу. Як його позначити в цьому уроці?
    items:
      iv: IV у першому оберненні; ступінь досі визначає основний тон акорду.
      vi: vi, бо терція в басу робить акорд мінорним.
      i: I, бо кожний найнижчий голос стає тональним центром.
    explanation: >-
      Римська цифра визначається основним тоном акорду відносно тональності. Обернення змінює звук у басу, не змінюючи
      основного тону чи типу тризвуку. Приклад IV залишається мажорним і зберігає функцію IV.
  review:
    title: Самостійно перевірте повний акорд
    body: Позначте лише те, що справді перевірили.
    items:
      numerals: Я визначив мажорні I/IV/V та мінорний vi за римськими позначеннями.
      bass: Я знайшов основні тони IV і V, хоча їхні баси — терції.
      count: Я рахував чотири долі на такт і називав функцію на першій долі.
      endings: Я порівняв завершення на I з завершенням на V та повторенням від I.
