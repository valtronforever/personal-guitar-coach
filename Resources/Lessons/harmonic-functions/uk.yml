lessonID: harmonic-functions
lessonVersion: 1
locale: uk
title: 'Гармонічні функції: почуйте відхід і повернення'
summary: Пов’яжіть I, IV, V та vi з мажорним тональним центром і порівняйте дві короткі акордові послідовності.
goal: Стежити за функціями акордів у чотиритактовій послідовності, не плутаючи обернення з новим основним тоном.
body: |-
  Акорд має власний тип і роль у навколишній тональності. Римські цифри позначають ступінь його основного тону відносно тонального центру. У мажорній тональності I, IV та V — мажорні тризвуки, а vi — мінорний. Великі й малі літери мають значення. Ці позначення залишаються корисними, коли обраний стрій транспонує весь урок в іншу тональність.

  I — тоніка: опорна гармонія цієї вправи. IV — субдомінанта, V — домінанта. У першій послідовності I→IV віддаляє від початкової гармонії, V готує повернення, а завершальний I відновлює початковий центр. Це корисні зв’язки в цьому музичному контексті, а не правило про обов’язкову емоцію кожного слухача чи однаковий порядок у кожній пісні.

  Спочатку розгляньте форми на трьох струнах. У форми I основний тон лежить у найнижчому голосі. Форми IV і V використовують перше обернення, тому їхні найнижчі ноти — терції, а не основні тони. Римські позначення й далі визначаються основними тонами акордів. Читайте показаний основний тон кожної форми й знаходьте його серед голосів. Усі форми використовують струни 3–1; інші струни мають мовчати.

  Послухайте повний чотиритактовий приклад I–IV–V–I до гри разом із ним. У зразку кожен акорд починається на першій долі й триває такт. Рахуйте чотири долі на акорд і називайте римську цифру на початку такту. Потім самостійно виконайте переходи зручними акордами на трьох струнах. Якщо перехід не готовий, сповільніть попереднє прослуховування замість силового стискання. Акордовий зразок синтетичний; додаток тут не оцінює ваші одночасні акорди.

  Друга послідовність — I–vi–IV–V. Мінорний vi має два спільні звуки з I у цій тональності, але відрізняється основним тоном і типом. Його поява змінює маршрут гармонії. Приклад завершується на V замість I; повторне відтворення поєднує цей V із початковим I. Порівняйте зупинку після V з додаванням або поверненням до I та опишіть почуте, не вважаючи одне завершення універсально правильним.

  На завершення відкладіть назви звучних акордів і під час гри стежте лише за римською послідовністю. За потреби знову відкривайте форми, щоб перевірити основний тон і роль баса. Інший стандартний стрій змінює назви разом, а відповідні варіанти Drop не змінюють ці форми на верхніх струнах. Урок використовує слухання, запитання та власні спостереження; оцінювання часу окремих нот буде в подальшому уроці арпеджіо через зміни акордів.
steps:
  prepare:
    title: Встановіть центр до послідовності
    body: >-
      Виберіть чистий звук, три верхні струни й зручний темп. Сприймайте I як опорний мажорний акорд. Знайдіть основний
      тон кожної форми, навіть якщо він не в басу.
  review:
    title: Порівняйте повернення з відкритим завершенням
    body: >-
      Послухайте й зіграйте I–IV–V–I, потім I–vi–IV–V. Порівняйте останній акорд та ефект повторення від початкового
      I. Називайте цифру на першій долі; якість повних акордових переходів перевіряйте самостійно.
  tonic-shape:
    title: 'I: опорна тоніка'
    body: >-
      Основний тон цього акорду — {{root}}. Це опорний тональний центр послідовностей. Бас також є основним тоном.
      {{positions}}. Послухайте повну форму до переходу від неї.
  subdominant-shape:
    title: 'IV: інший основний тон і бас першого обернення'
    body: >-
      Основний тон цього акорду — {{root}}. Він відповідає ступеню IV тональності уроку. Найнижчий голос — терція,
      а основний тон лежить вище. {{positions}}. Не перейменовуйте IV за басовою нотою.
  dominant-shape:
    title: 'V: підготуйте повернення до I'
    body: >-
      Основний тон цього акорду — {{root}}. Він відповідає ступеню V. Найнижчий голос також є терцією, оскільки
      це перше обернення. {{positions}}. Послухайте V із наступним початковим I у повному прикладі.
  relative-minor-shape:
    title: 'vi: мінорний акорд іншого маршруту'
    body: >-
      Основний тон цього акорду — {{root}}. Малі літери vi позначають мінорний тризвук на шостому ступені. Його
      звуки частково спільні з I, але основний тон і мінорний характер інші. {{positions}}. Порівняйте звучання
      з тонікою до другої послідовності.
  question:
    title: Чи змінює інший бас назву функції?
    body: Порівняйте ролі звуків акорду перед відповіддю.
  return-to-tonic:
    title: I–IV–V–I — послухайте, потім зіграйте
    body: >-
      Тональний центр — {{root}}, мажор. Такти 1–4 відповідають I–IV–V–I. Кожний акорд починається на першій долі
      й триває чотири чвертні долі на 60 BPM. Спочатку послухайте, потім зіграйте зручні акорди на трьох струнах
      із рахунком. Цей зразок і самостійна практика не мають автоматичного бала за акорди. Звучні цілі: {{sequence}}.
  minor-detour:
    title: I–vi–IV–V — послухайте, потім зіграйте
    body: >-
      Тональний центр — {{root}}, мажор. Такти 1–4 відповідають I–vi–IV–V. Кожний акорд починається на першій долі
      й триває чотири чвертні долі на 60 BPM. Спочатку послухайте, потім зіграйте зручні акорди на трьох струнах
      із рахунком. Цей зразок і самостійна практика не мають автоматичного бала за акорди. Звучні цілі: {{sequence}}.
