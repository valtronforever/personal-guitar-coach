lessonID: standard-and-drop
lessonVersion: 2
locale: uk
title: 'Standard і Drop: у чому різниця'
summary: Поясніть, чому drop змінює форми на нижній струні інакше, ніж транспонування стандартного строю.
goal: Поясніть, чому drop змінює форми на нижній струні інакше, ніж транспонування стандартного строю.
body: >-
  У сімействі стандартних строїв усі шість струн зміщуються на однакову кількість півтонів. У відповідному drop
  струна 6 додатково опускається на цілий тон, а цілі струн 1–5 зберігаються. Тому інтервал між відкритими струнами
  6 і 5 змінюється з кварти на квінту.
steps:
  family:
    title: Прочитайте сімейства строїв
    body: >-
      У додатку E Standard відповідає Drop D, D Standard — Drop C, C Standard — Drop B♭, а B Standard — Drop A.
      Читайте висоти в налаштуваннях, а не вгадуйте назву нижньої струни з пам’яті.
  compare:
    title: Порівняйте інтервал відкритих струн
    body: >-
      Зіграйте відкриту струну 6, потім відкриту струну 5, залишаючи між ними простір. Приклад зберігає фізичні
      позиції. У власному строї перевіряйте показані ноти: порівняння кварти й квінти стосується саме сімейств standard/drop.
      {{positions}}
  compensate:
    title: Компенсуйте нижню струну
    body: >-
      У drop лад 2 на струні 6 звучить як відкрита шоста струна відповідного стандартного строю. Порівняйте відкриту
      позицію й другий лад у прикладі; не змінюйте налаштування без відповідного переналаштування фізичної гітари.
      {{positions}} Запустіть аудіопрактику з цього кроку, щоб порівняти свої ноти з обраним строєм. Оцінюються
      висота й час атаки; додаток не визначає, на якій струні ви насправді грали.
  review:
    title: Поясніть зміну форми
    body: >-
      Поясніть уголос, які п’ять струн не змінюються в межах однієї пари standard/drop і чому аплікатуру нижньої
      струни може знадобитися змінити. Якщо ви фізично змінили стрій, знову перевірте тюнер перед практикою.
activities:
  example:
    title: Приклад для вашого інструменту
    body: >-
      Очікувана послідовність: {{sequence}}. Виберіть крок, щоб побачити його позиції. У прикладі звучать синтезовані
      еталонні ноти.
learningTasks:
  review:
    title: Перевірте свою практику
    body: Позначайте лише те, що перевірили самостійно. Поверніться до непозначеного пункту на наступному занятті.
    items:
      criterion-1: Я можу назвати drop-пару свого стандартного строю.
      criterion-2: Я розумію, що струна 6 змінюється відносно струн 1–5.
      criterion-3: Профіль додатка досі відповідає моїй фізичній гітарі.
  knowledge:
    title: Яка струна змінюється в межах пари standard/drop?
    body: Виберіть одну відповідь і порівняйте її з поясненням.
    items:
      answer-1: Усі шість на різні величини
      answer-2: Лише струна 1
      answer-3: Струна 6 опускається на цілий тон
    explanation: >-
      Відповідний drop опускає струну 6 на два півтони. Перехід між стандартними строями натомість транспонує всі
      шість струн разом.
