lessonID: dotted-tied-notes
lessonVersion: 1
locale: uk
title: Ноти з крапкою та ліги
summary: Подовжуйте ноту, зберігаючи пульс і не додаючи зайвої атаки.
goal: Відлічити чверть із крапкою та утримати одну ноту через тактову риску.
body: |-
  Крапка додає половину початкової тривалості: чверть із крапкою триває півтори долі. Ліга з’єднує записані ноти однакової висоти в один безперервний звук. Зіграйте лише першу ноту ліги й додайте записані тривалості. Тактова риска не зупиняє звук.

  Виберіть «Нотний стан (прототип)», щоб побачити крапки й ліги; TAB показує ті самі точні тривалості дробами. Обидва вигляди використовують одну звукову подію. Почніть із 60 BPM, чистого входу та приглушених зайвих струн. Оцінка утримання вимірює частку стабільного звучання потрібної висоти, а не точний момент заглушення чи техніку рук.
steps:
  concept:
    title: Додати половину або з’єднати тривалості
    body: >-
      Чверть — одна доля; крапка додає пів долі. Половинна нота, з’єднана лігою з чвертю, — три долі з однією атакою.
      Ця ліга з’єднує однакові висоти; не плутайте її з лігою, що позначає легато між різними нотами.
  dot:
    title: Довга, потім коротка
    body: >-
      Відкрита струна 3: {{positions}}. Рахуйте «1 і 2 і»: зіграйте довгу ноту на 1, утримуйте через 2, а коротку
      зіграйте на «і» після 2. Друга атака розташована посередині між кліками 2 та 3.
  dot-count:
    title: Не втрачайте порожні долі
    body: >-
      Зіграйте дві атаки, зупиніть звук на 3 й мовчки відлічіть «3 і 4 і». Прослухайте весь такт, потім повторіть
      його чотири рази на 60 BPM. Друга атака має лишатися між кліками; не скорочуйте довгу ноту, щоб її вмістити.
  tie:
    title: Одна атака через тактову риску
    body: >-
      Відлічіть долі 1 та 2 без гри, зіграйте на 3 й утримуйте звук через 4 та 1 наступного такту. На тактовій рисці
      не бийте по струні повторно. Два символи під лігою — одна цільова нота: {{positions}}.
  tie-release:
    title: Зупиніть і почніть знову
    body: >-
      Заглушіть струну на 2 другого такту. Зіграйте знову на 3 й утримуйте дві долі. Нова нота після паузи потребує
      нової атаки. Якщо обраний діапазон практики розрізає лігу, він розшириться до цілої ноти.
  review:
    title: Порівняйте таймінг та утримання
    body: >-
      Спочатку практикуйте такт із крапкою, потім два такти з лігою. Перевіряйте таймінг атак окремо від утримання.
      Низьке утримання — привід прислухатися до раннього заглушення чи зміни висоти; невизначений сигнал — перевірити
      чистий вхід і повторити в тому самому темпі. Після трьох контрольованих повторів додайте 5 BPM. Не прискорюйтеся
      заради оцінки.
activities:
  dots:
    title: Ритм із крапкою на {{first}}
    body: Одна відкрита струна, адаптована до вашого строю. {{sequence}}. Приглушіть зайві струни.
  ties:
    title: Ліга через такт на {{first}}
    body: Одна відкрита струна, адаптована до вашого строю. {{sequence}}. Приглушіть зайві струни.
learningTasks:
  duration:
    title: Скільки триває чверть із крапкою?
    body: У 4/4 клік чвертями позначає одну долю.
    items:
      one: Одну долю
      one-half: Півтори долі
      two: Дві долі
    explanation: 'Чверть дає одну долю, крапка додає її половину: 1 + ½ = 1½. Дві долі — це половинна нота.'
  review:
    title: Перевірте відмінність
    body: Позначайте лише те, що почули й відлічили.
    items:
      count: Коротка нота звучить на «і» після 2.
      one-attack: Я пройшов тактову риску без повторної атаки.
      release: Я заглушив звук на паузі й почав нову ноту свідомою атакою.
