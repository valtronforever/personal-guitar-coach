lessonID: drop-tuning-riffs
lessonVersion: 1
locale: uk
title: Рифи в Drop-строї
summary: Збережіть відкритий низький педальний тон і пристосуйте квінтові форми до строю.
goal: Зіграти оригінальний риф на нижній струні й зрозуміти зміну квінтової форми у Drop.
body: 'У підтримуваних Drop-строях нижня струна на тон нижча, ніж у відповідному Standard, а решта п’ять не змінюються.
  Тому інтервал між струнами 6 і 5 інший. Форма з основного тону, квінти й октави на трьох нижніх струнах може опинитися
  на одному ладі; у відповідному Standard позиції на струнах 5 і 4 мають зсув.


  У цьому уроці тональний початок визначає ваша нижня відкрита струна. У Standard риф використовує звичайну квінтову
  форму зі зсувом, у Drop — вирівняну. Бас лишається відкритим в обох випадках, тому звучна тональність змінюється
  разом із ним. Це навмисне правило уроку, відмінне від уроків, які зберігають свою тональність при пониженні лише
  струни 6. Орієнтуйтеся на поточні маркери й назви нот.


  Почніть із чистого входу й помірної сили медіатора. Басова вправа оцінюється за окремими висотами й атаками. Повний
  риф додає одночасні квінтові звуки та є прикладом для слухання й самостійної практики. Ні оцінка, ні схема не
  визначають фактично використаний палець чи прийом медіатора.'
steps:
  prepare:
    title: Підтвердіть обраний стрій
    body: 'Перед грою скористайтеся тюнером і перевірте відповідність налаштувань гітарі. Урок можна пройти й у
      Standard: огляньте форму зі зсувом. Фізично переналаштовувати інструмент потрібно лише для порівняння з іншим
      пресетом на справжній гітарі.'
  open-shape:
    title: '{{root}} — відкритий основний тон, квінта й октава'
    body: Огляньте три нижні звучні струни. У Drop відкрита версія використовує всі три відкритими; у Standard дві
      верхні позиції затиснуті. Струни 1–3 мовчать. Перевірте кожну потрібну струну, потім прослухайте повний приклад.
      {{positions}}.
  moved-shape:
    title: '{{root}} — пересуньте квінтову форму'
    body: Основний тон тепер на три лади вище. Якщо всі три маркери на одному ладі, можна спробувати один палець
      поперек цих струн; якщо зі зсувом — використовуйте показану форму. Підказки пальців прибираються, якщо адаптація
      змінює геометрію. Це пропозиція для перевірки зручністю й слухом, а не розпізнаний прийом. {{positions}}.
  power-notes:
    title: Перевірте звуки акордів окремо
    body: Зіграйте звуки форми з відкритим основним тоном, потім пересунутої, потім поверніться до низької відкритої
      ноти. Є сім атак чвертями й одна доля паузи. Зупиняйте попередню ноту, щоб детектор отримував одну висоту.
      Почніть на 50 BPM. {{sequence}}.
  bass-riff:
    title: '{{root}} — налагодьте басовий риф'
    body: У такті дві відкриті восьмі, потім чверті на ладах 3, 5 і 0 нижньої струни. Рахуйте 1 і 2 3 4. Чотири
      такти повторюють цю комірку; повертайтеся до відкритого баса так само свідомо, як граєте затиснуті ноти. Зробіть
      три повні оцінювані спроби на 50 BPM до прискорення.
  full-riff:
    title: '{{root}} — додайте квінти'
    body: Збережіть басовий ритм і додайте квінту та октаву на затиснутих нотах долей 2 і 3. Повторені відкриті
      ноти залишаються одиночним басом. Використовуйте адаптовані форми на три струни, а верхні струни залиште тихими.
      Прослухайте обидві версії й зіграйте повну лише з метрономом. Одночасна версія не оцінюється.
  review:
    title: Порівняйте звук і контроль
    body: Перевірте рівність двох початкових восьмих, вчасний початок квінтових форм і небажаний дзвін між змінами.
      Басова оцінка дає виміряні помилки висоти й атак; чистоту цілих квінтових форм перевіряйте слухом. Якщо додані
      голоси ламають ритм, зменште темп.
activities:
  open-shape:
    title: '{{root}} — квінтова форма'
    body: Основний тон відповідає нижній відкритій струні; квінта й октава зберігають інтервали.
  moved-shape:
    title: '{{root}} — пересунута квінтова форма'
    body: Форма залежить від обраного строю. {{positions}}.
  power-notes:
    title: '{{root}} — окремі звуки акордів'
    body: Сім нот і пауза; в оцінюваній практиці струни не накладаються. {{sequence}}.
  bass-riff:
    title: '{{root}} — лише басовий риф'
    body: Чотири такти, 20 окремих атак. Рахуйте 1 і 2 3 4.
  full-riff:
    title: '{{root}} — повний квінтовий риф'
    body: Той самий бас із квінтами й октавами на долях 2 і 3. Лише слухання та самостійна практика.
learningTasks:
  review:
    title: Перевірте риф у Drop або Standard
    body: Басова оцінка вимірює окремі ноти; чистота акордів і вибір руки залишаються вашими спостереженнями.
    items:
      tuning: Обраний стрій відповідав гітарі й цілі відкритого баса.
      shape: Я використав вирівняну форму або форму зі зсувом, показану для цього строю.
      pulse: Додані голоси не порушили початкові восьмі та повернення до баса.
      quiet: У повному рифі звучали лише потрібні нижні струни.
