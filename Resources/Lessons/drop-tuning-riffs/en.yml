lessonID: drop-tuning-riffs
lessonVersion: 1
locale: en
title: Riffs in Drop tuning
summary: Keep an open low pedal and adapt root–fifth shapes to the selected tuning.
goal: Play an original low-string riff and understand why the power-chord shape changes in Drop.
body: 'In the supported Drop tunings, the lowest string is a whole tone below the corresponding Standard tuning
  while the other five stay put. That changes the interval between strings 6 and 5. A root–fifth–octave shape on
  the three lowest strings can therefore line up on one fret; the corresponding Standard shape uses an offset on
  strings 5 and 4.


  This lesson follows your lowest open string as its tonal starting point. In a Standard preset the riff uses the
  usual offset power shape; in a Drop preset it uses the aligned shape. The open bass remains open in both cases,
  so the sounding key changes with that bass. This is an intentional lesson rule, different from lessons that preserve
  their established key when only string 6 is dropped. Follow the current markers and sounding names.


  Begin with clean input and modest picking force. The bass-only exercise is scored as separate pitches and attacks.
  The full riff adds simultaneous power-chord tones and is a listening/self-practice reference. Neither score nor
  diagram can establish which finger or picking technique you actually used.'
steps:
  prepare:
    title: Confirm the selected tuning
    body: 'Use the tuner before playing, and check that the instrument settings match the guitar. You can complete
      the lesson in Standard as well: observe the offset shape. A physical tuning change is needed only if you choose
      to compare a different preset on the real instrument.'
  open-shape:
    title: '{{root}} — open root, fifth and octave'
    body: Inspect the three lowest sounding strings. In a Drop preset the open version uses all three open strings;
      in Standard, the upper two positions are fretted. Keep strings 1–3 silent. Pluck each required string once,
      then hear the complete reference. {{positions}}.
  moved-shape:
    title: '{{root}} — move the power shape'
    body: The root is now three frets higher. When all three marks share one fret, you may try one finger across
      those strings; when they are offset, use the shown shape instead. Suggested finger numbers are removed if
      adaptation changes their geometry. This is a suggestion you confirm by comfort and sound, not a detected technique.
      {{positions}}.
  power-notes:
    title: Check the chord tones separately
    body: Play the open-root chord tones, then the moved chord tones, then return to the low open note. There are
      seven quarter-note attacks and one resting beat. Stop each previous note before the next so the detector receives
      one pitch at a time. Begin at 50 BPM. {{sequence}}.
  bass-riff:
    title: '{{root}} — establish the pedal riff'
    body: Each bar contains two open eighth notes, then quarter notes at root-string frets 3, 5 and 0. Count 1 &
      2 3 4. The four-bar example repeats that cell; keep the return to the open bass as deliberate as the fretted
      notes. Try three complete scored attempts at 50 BPM before adding speed.
  full-riff:
    title: '{{root}} — add the fifths'
    body: Keep the same bass rhythm, adding the fifth and octave on the fretted notes of beats 2 and 3. The repeated
      open notes remain single bass notes. Use the currently adapted three-string shapes and keep the upper strings
      quiet. Preview both versions, then play the full riff with the metronome alone. This simultaneous version
      is not graded.
  review:
    title: Compare sound and control
    body: Check whether the two opening eighths are even, whether each power chord starts on time, and whether extra
      strings ring between changes. Use the bass score for measured pitch/attack feedback; use your own listening
      for power-chord clarity. Reduce the tempo if adding voices breaks the rhythm.
activities:
  open-shape:
    title: '{{root}} power chord'
    body: The root follows the lowest open string; the fifth and octave keep their intervals.
  moved-shape:
    title: '{{root}} power chord, moved'
    body: The shape depends on the selected tuning. {{positions}}.
  power-notes:
    title: '{{root}} — separated chord tones'
    body: Seven notes, one rest; no overlapping strings in scored practice. {{sequence}}.
  bass-riff:
    title: '{{root}} — bass-only riff'
    body: Four bars; 20 separate attacks. Count 1 & 2 3 4 in each bar.
  full-riff:
    title: '{{root}} — full power-chord riff'
    body: The same bass cell with fifths and octaves on beats 2 and 3. Listening/self-practice only.
learningTasks:
  review:
    title: Review the Drop/Standard riff
    body: Bass scores measure individual notes. Power-chord clarity and hand choices remain your observations.
    items:
      tuning: The selected tuning matched my guitar and the open bass target.
      shape: I used the aligned or offset shape actually shown for this tuning.
      pulse: The extra chord voices did not disturb the two opening eighth notes or the return to the bass.
      quiet: Only the intended lower strings sounded in the full riff.
