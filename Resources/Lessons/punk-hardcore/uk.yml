lessonID: punk-hardcore
lessonVersion: 1
locale: uk
title: 'Панк і хардкор: рух, простір і зупинки'
summary: Утримай прямий акордовий пульс і зроби межі тиші такими ж чіткими, як атаки.
goal: Зіграй компактну восьмитактову форму пауер-акордами з відтворюваною енергією й точними зупинками.
body: |-
  Цей етюд зосереджений на прямому повторному акордовому ритмі й свідомих зупинках. Енергія виникає з узгоджених атак і чіткої форми, а не з сильнішого тиску чи найбільшого темпу. Почни з чистого або злегка перевантаженого звуку, щоб чути кожне закінчення. Модель позначає удари вниз як один із підходів; якщо вони не повторюються надійно, зменш темп і скороти серію перед її подовженням.

  Вивчи такт восьмих пауер-акордів із цілим тактом тиші після нього. Продовжуй рахувати, поки рука відпочиває. Слухай одночасність атак на вказаних струнах і зайві струни між ними. Еталон синтезований і не перевіряє напрямок медіатора, баланс акорду чи приглушення. Вирівняй рух на повторному такті, потім порівняй кілька виконань в одному темпі.

  Вправа зупинок скорочує кожну серію: три долі, дві долі, одна доля та один акорд-чверть. Завершуй на записаній межі й залиш решту долей тихими. Не використовуй паузу для додаткового фінального удару. Підготуй наступну форму в проміжку й перевір першу атаку після нього: чітка зупинка корисна, коли наступний початок теж свідомий.

  Просторовий контраст зберігає той самий метроном, але ставить акорди на першу й третю долі. Він відчувається ширшим через рідші гітарні атаки; годинник не сповільнився. Порівняй це із суцільними восьмими перед поєднанням у формі. Залиш тихі долі достатньо порожніми, щоб почути зміну щільності, замість звичного заповнення.

  Восьмитактове аранжування поєднує суцільний рух, коротші серії й тонічну зупинку. Запам’ятай маршрут перед прискоренням. Якщо зміна акорду запізнюється, відокрем цю межу в нижчому темпі замість прискорення наступного такту навздогін. Це самопрактика оригінального стильового етюду: автоматична оцінка не вимірює агресивний тембр, жанрову автентичність чи фізичну витривалість. Запиши одне корисне спостереження про час, закінчення або баланс для наступного заняття.
steps:
  prepare:
    title: Обери невелику музичну ідею
    body: Прочитай план, обери зручний чистий звук і почни повільно.
  steady-eighths:
    title: Вісім атак і такт відпочинку
    body: 'Центр: {{root}}. Чергуй такт восьмих пауер-акордів із цілим тихим тактом. Рахуй обидва.'
  hard-stops:
    title: Скороти серію, збережи такт
    body: У чотирьох тактах звук займає відповідно три, дві, одну й одну долю. Відрахуй решту простору та підготуй
      новий початок.
  broad-pulse:
    title: Ширший гітарний пульс в одному темпі
    body: Атаки на долях 1 та 3 залишають долі 2 й 4 тихими. Метроном і чотиридольний такт не змінюються.
  eight-bar-form:
    title: Вісім тактів із фінальною тонічною зупинкою
    body: Перші чотири такти задають маршрут; останні чотири поступово відкривають простір і повертаються до тоніки.
      Залиш останні три долі тихими.
  stop-review:
    title: Повтори енергію без втрати зупинок
    body: Зіграй форму двічі у відтворюваному темпі та порівняй останню атаку перед кожною паузою з першою після
      неї.
