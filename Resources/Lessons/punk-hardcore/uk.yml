learningTasks:
  stop-review:
    title: Повтори енергію без втрати зупинок
    body: Зіграй форму двічі у відтворюваному темпі та порівняй останню атаку перед кожною паузою з першою після
      неї.
    items:
      pulse: Повторні акорди зберігали один темп під час змін.
      stop: Я зупинявся на кожній межі без додаткового удару.
      restart: Я готував наступну форму в паузі й починав вчасно.
      density: Я чув контраст суцільних восьмих і просторових долей.
      repeat: Обраний темп лишався контрольованим у повторних циклах.
