learningTasks:
  stop-review:
    title: Repeat the energy without losing the stops
    body: Play the form twice at a repeatable tempo and compare the last attack before each rest with the first
      attack after it.
    items:
      pulse: Repeated chords kept one tempo across changes.
      stop: I stopped at each boundary without an extra stroke.
      restart: I prepared the next shape during the rest and restarted on time.
      density: I heard the contrast between continuous eighths and spacious beats.
      repeat: The chosen tempo remained controlled over repeated cycles.
