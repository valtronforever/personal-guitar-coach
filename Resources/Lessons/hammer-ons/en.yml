learningTasks:
  question:
    title: Where does the second note come from?
    body: What does h ask you to do after picking the starting note?
    items:
      finger: Bring a fretting finger down at the target fret so the higher note sounds.
      pick: Pick both notes with alternate strokes.
      slide: Move the starting finger continuously along the neck.
    explanation: >-
      A hammer-on uses a landing fretting finger to produce the higher note. The lesson grades audible pitches and
      the first attack; observing whether you picked again remains your responsibility.
  review:
    title: Observe the physical technique yourself
    body: Mark only what you actually practiced; the pitch score does not confirm these gestures.
    items:
      pick: I picked only the first note of each pair.
      landing: I placed the higher finger close behind the target fret on beat 2.
      quiet: I kept neighboring strings quiet and rested on beat 4.
      compare: I listened to the target separately and compared its clarity with the hammer-on.
