lessonID: hammer-ons
lessonVersion: 1
locale: uk
title: 'Hammer-on: друга нота рукою на грифі'
summary: Почніть із відкритої струни, потім з’єднайте затиснуті пари й коротку фразу з одним початковим ударом на
  пару.
goal: Отримувати чисту вищу ноту в записаний час без другого удару медіатором.
body: |-
  Hammer-on отримує вищу затиснуту ноту опусканням пальця руки на грифі на струну, яка вже звучить. Один раз вдарте по першій ноті. Другу створює рука на грифі, а не ще один рух медіатора. У TAB літера h поєднує два номери ладів. Другий номер стоїть у власній ритмічній позиції; це не акорд із першою нотою.

  Почніть із вправи на відкритій струні. Дайте їй звучати долю 1, потім на долі 2 впевнено поставте палець безпосередньо за поріжком цільового ладу. Тримайте нову ноту на долях 2 і 3 та приглушіть на долі 4. Готуйте палець близько до струни, а не піднімайте високо заради сильнішого удару. Достатня швидкість і точність постановки важливіші за надмірну силу. Зберігайте тишу сусідніх струн і розслабляйте руку між спробами.

  Затиснута пара додає початковий палець. Тримайте нижчий лад вказівним, а ціль через два лади отримуйте зручним вищим пальцем; вказівний і безіменний — корисний початковий варіант. Залишайте нижчий палець на місці під час приземлення вищого. Не штовхайте струну вбік у ненавмисний бенд. Спершу окремо вдарте по цільовій ноті, щоб почути чисту висоту, потім порівняйте з нею hammer-on. Позиції можуть адаптуватися до строю або дозволеної ділянки грифа; вибір пальців перевіряйте самостійно.

  У чотиритактовій фразі читайте наступну пару під час тихої четвертої долі. Більшість пар рухається на два лади, але одна — на один. Підготуйте коротшу відстань замість механічного повторення розтягнення. Кожен такт усе ще починається новим ударом медіатора. Додаток не просить виконувати безперервний ланцюг hammer-on через усі такти.

  Окремо перегляньте початкову й цільову фази. Чиста перша нота зі слабкою ціллю може означати, що другий звук не відповідав потрібній висоті або не залишався чутним; перегляньте криву й послухайте перед зміною руху руки. Оцінка не діагностує силу пальців і не доводить відсутність повторного удару. Вона вимірює час першої атаки та чутне покриття висоти навколо заданої зміни, а не точний момент другої атаки.

  Для вимірювання використовуйте чистий тембр. Компресія чи дисторшн можуть зробити нерівний hammer-on на слух рівнішим, але погіршити розпізнавання висоти. Синтезований приклад пояснює висоти й ритм, а не моделює контакт пальця. Повільні розслаблені повторення з чіткою паузою тут корисніші за підвищення швидкості до стабільного звучання цілі.
steps:
  prepare:
    title: Готуйте ціль близько до струни
    body: >-
      Окремо послухайте дві показані висоти. Потім вдарте лише по першій і створіть вищу ноту рукою на грифі. Використовуйте
      чистий тембр та уникайте бокового руху струни.
  review:
    title: Порівняйте обидві звукові фази
    body: >-
      Перегляньте початкову й цільову фази, потім послухайте чистоту цілі. Повторний удар і зайвий рух пальця перевірте
      самостійно: аудіооцінка не підтверджує цих рухів.
  question:
    title: Звідки береться друга нота?
    body: Врахуйте заданий рух, а не лише кінцеву висоту.
  open-string:
    title: Відкрита струна до затиснутої ноти
    body: >-
      Вдарте на долі 1. Отримайте ціль рукою на грифі на долі 2, тримайте її до кінця долі 3 й залиште долю 4 тихою.
      Повторюйте з новим початковим ударом у кожному такті. Почніть із 60 BPM. Цілі у вашому строї: {{sequence}}.
      Позиції: {{positions}}. Збережіть підготовку на відкритій струні у вихідній позиції.
  fretted-pair:
    title: Hammer-on між двома ладами
    body: >-
      Вдарте на долі 1. Отримайте ціль рукою на грифі на долі 2, тримайте її до кінця долі 3 й залиште долю 4 тихою.
      Повторюйте з новим початковим ударом у кожному такті. Почніть із 60 BPM. Цілі у вашому строї: {{sequence}}.
      Позиції: {{positions}}.
  legato-phrase:
    title: Фраза зі змінами на тон і півтон
    body: >-
      Вдарте на долі 1. Отримайте ціль рукою на грифі на долі 2, тримайте її до кінця долі 3 й залиште долю 4 тихою.
      Повторюйте з новим початковим ударом у кожному такті. Почніть із 60 BPM. Цілі у вашому строї: {{sequence}}.
      Позиції: {{positions}}.
