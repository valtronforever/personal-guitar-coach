learningTasks:
  question:
    title: Звідки береться друга нота?
    body: Що літера h просить зробити після початкового удару?
    items:
      finger: Опустити палець на цільовий лад, щоб зазвучала вища нота.
      pick: Ударити по обох нотах змінним штрихом.
      slide: Безперервно пересунути початковий палець уздовж грифа.
    explanation: >-
      Hammer-on використовує приземлення пальця для отримання вищої ноти. Урок оцінює чутні висоти й першу атаку;
      спостерігати за відсутністю повторного удару потрібно самостійно.
  review:
    title: Самостійно перевірте фізичну техніку
    body: 'Позначте лише те, що справді попрактикували: оцінка висоти не підтверджує цих рухів.'
    items:
      pick: Я вдаряв лише по першій ноті кожної пари.
      landing: Я ставив вищий палець близько за цільовим поріжком на долі 2.
      quiet: Я тримав сусідні струни тихими й відпочивав на долі 4.
      compare: Я окремо слухав ціль і порівнював її чистоту з hammer-on.
