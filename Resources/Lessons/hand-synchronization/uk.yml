lessonID: hand-synchronization
lessonVersion: 1
locale: uk
title: Синхронізація обох рук
summary: Готуйте кожну затиснуту ціль до однієї свідомої атаки медіатора.
goal: Грати короткі узгоджені групи без зайвих атак, заблокованих нот і поспішних змін струн.
body: 'Контакт на грифі й атака медіатора мають зустрітися на початку потрібної ноти. Якщо медіатор приходить до
  готовності цілі, можна почути попередню висоту чи заблоковану атаку; сильне опускання або зняття пальця може додати
  небажану ноту. Спершу слухайте звук, а потім вирішуйте, який рух змінити. Додаток не визначає, яка рука спричинила
  помилку.


  Вправа фізичного малюнка використовує лади 5–8. Спробуйте вказівний, середній, безіменний і мізинець по черзі
  з тиском, потрібним для чистої ноти. Тримайте сусідні пальці готовими без жорсткого розтягування чи обов’язкового
  утримання всіх попередніх нот. Якщо розмах незручний, зупиніться й використайте коротші розслаблені спроби замість
  форсування швидкості.


  Перший етюд повільно проходить три струни й залишає цілий такт для відпускання. Другий містить чотири восьмі й
  дві тихі долі, тому коротка група щоразу має нову підготовку. Чергуйте медіатор за маркерами. Оцінюються отримані
  висоти й атаки; пальці, механіка узгодження та відсутність зайвого напруження — ваші спостереження.'
steps:
  prepare:
    title: Підготуйте контакт перед додаванням темпу
    body: Озвучте лад 5, зупиніть, підготуйте 6 й атакуйте один раз. Пройдіть до 8 без метронома. Знайдіть найменше
      зусилля для чистої цілі.
  one-note-at-a-time: &id001
    title: Дванадцять нот і такт відпускання
    body: 'На 50 BPM зіграйте лади 5–8 на струнах 6, 5 й 4, по чверті на клік. Четвертий такт повністю тихий: відпустіть
      зусилля й підготуйтеся. Перевіряйте першу ноту після зміни струни. {{sequence}}.'
  four-note-groups: &id002
    title: Узгодьте коротку групу
    body: Рахуйте 1 і 2 і 3 4. Зіграйте чотири позначені восьмі, потім залиште дві тихі розслаблені долі. Повторіть
      чотири такти; не заповнюйте паузи додатковими пробними нотами.
  review:
    title: Опрацюйте один перехід
    body: Оберіть пропущену чи зайву атаку з результату й повільно повторіть пару. Слухайте чистий початок і відпускання,
      потім поверніть цілу групу. Не змінюйте темп, доки три групи не стануть чистими й зручними.
activities:
  one-note-at-a-time: *id001
  four-note-groups: *id002
learningTasks:
  review:
    title: Перевірте цю спробу
    body: Позначте лише те, що перевірили слухом чи спостереженням за руками.
    items:
      targets: Кожна атака зустрічала готову ціль без небажаної проміжної ноти.
      rests: Я відпускав зусилля на записаних паузах, а не грав крізь них.
      specific: Я виділив проблемний перехід замість припущення про винну руку.
