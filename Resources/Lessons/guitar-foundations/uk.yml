lessonID: guitar-foundations
lessonVersion: 2
locale: uk
title: Перед першою нотою
summary: Знайдіть стійке положення сидячи, налаштуйте ремінь і перевірте досяжність струн.
goal: Підтримуйте інструмент сидячи й стоячи, залишаючи обидві руки вільними для гри.
body: >-
  Стійке положення гітари й розслаблені руки полегшують короткі заняття. У будь-якому шестиструнному строї струна
  1 — найтонша, а 6 — найтовща. Лад 0 означає відкриту струну.
steps:
  prepare:
    title: Підготуйтеся до гри
    body: >-
      Спирайте гітару на ногу або використовуйте ремінь, щоб рука на грифі не тримала її вагу. Приберіть зайвий
      тиск в обох руках. Почніть із тихого рівня підсилювача чи навушників і піднімайте його поступово.
  check-understanding:
    title: Перевірте розуміння
    body: >-
      Перехід зі стандартного строю на drop змінює висоту нот. А чи змінює він нумерацію струн? Виберіть опис першої
      струни.
  standing:
    title: Встаньте з ременем
    body: >-
      Надійно закріпіть ремінь, підтримайте гітару під час вставання й налаштуйте довжину так, щоб інструмент лишався
      близько до знайденого положення сидячи. На мить послабте хват руки на грифі: вагу має тримати ремінь, а не
      великий палець.
  reach:
    title: Перевірте обидві руки
    body: >-
      Дістаньтеся до струн 6 і 1 біля перших ладів, потім проведіть рукою з медіатором поперек струн. Змініть кут
      гітари чи висоту ременя, якщо для досягнення струни доводиться сутулитися або стискати гриф. Порівняйте положення
      сидячи й стоячи, не прискорюючи гру. Якщо положення незручне, зупиніться й відрегулюйте його.
activities: {}
learningTasks:
  setup:
    title: Готовність до заняття
    body: Позначте кожен пункт, коли він відповідає вашому стану.
    items:
      supported: Гітара тримається без стискання грифа.
      relaxed: Я можу послабити тиск обох рук.
      quiet: Я почав із комфортної тихої гучності.
  string-order:
    title: Яка струна має номер 1?
    body: Виберіть одну відповідь.
    items:
      thin: Найтонша струна
      thick: Найтовща струна
    explanation: Струна 1 — найтонша, а 6 — найтовща. Нумерація не залежить від строю.
