learningTasks:
  question:
    title: Гама чи поточний акорд?
    body: Коли арпеджіо переходить у наступний такт цієї послідовності, що визначає його цільові звуки акорду?
    items:
      current: Основний тон, терція та квінта чинного в цьому такті акорду в записаному порядку й регістрі.
      previous: Попередня акордна форма до завершення всієї фрази.
      any: Будь-які ноти гами взаємозамінні, оскільки тональність не змінилася.
    explanation: >-
      Тональність задає контекст, але арпеджіо окреслює поточний акорд. Деякі ноти гами не входять до цього тризвуку.
      Читайте також записаний порядок: арпеджіо може починатися терцією або квінтою, а октава є частиною цілі.
  review:
    title: Перевірте зміни гармонії
    body: Позначте те, що справді попрактикували.
    items:
      prepare: Я знаходив першу ціль наступного такту до зміни акорду.
      minor: Я відрізняв малу терцію vi від великих терцій I, IV та V.
      pulse: Я зберігав записаний пульс чвертей і восьмих та використовував паузи для читання наперед.
      finish: Я тримав фінальний основний тон дві долі й окремо розглянув хибні ноти та запізнілі атаки.
