lessonID: chord-change-arpeggios
lessonVersion: 1
locale: uk
title: Арпеджіо через зміни акордів
summary: Стежте за звуками I, vi, IV та V у чвертях, рівних восьмих і оригінальному восьмитактовому етюді.
goal: Готувати звуки наступного акорду до зміни такту та грати кожну ціль окремо й вчасно.
body: |-
  Арпеджіо озвучує звуки акорду один за одним. У послідовності цільові ноти мають відповідати поточному акорду, а не механічно продовжувати попередню форму. Урок використовує мажорний тональний центр із I, мінорним vi, IV та V. Читайте римську послідовність разом з адаптованими цільовими нотами. Нота може належати загальній гамі, але не входити до тризвуку, який зараз окреслюється.

  Перша фраза — I–IV–V–I. У кожному такті звучать основний тон, терція та квінта поточного акорду чвертями, після них — чвертна пауза. До завершення паузи знайдіть наступний основний тон і його струну. Основні тони лежать у зручних регістрах; вони не зобов’язані всі підніматися однією струною. Почніть із 60 BPM або знизьте темп, якщо перша нота після зміни запізнюється. Зупиняйте попередню ноту, щоб вхід залишався одноголосним.

  Друга фраза йде за I–vi–IV–V із вісьмома восьмими в такті. Для кожного акорду зіграйте: основний тон–терція–квінта–октава–квінта–терція–основний тон–терція. Терція vi мала, а інших тризвуків цього прикладу — велика. Зберігайте рівний пульс восьмих без пауз на зміні струни. Переглядайте наступний такт під час низхідної половини поточного малюнка. Приклад завершується на V, тому повторення повертає до початкового I; повтор практики може мати новий відлік.

  Завершальний восьмитактовий етюд має порядок I–vi–IV–V–I–IV–V–I. Такт 1 піднімається чвертями, такт 2 спускається. Такт 3 містить шість восьмих і чвертну паузу; такт 4 починається з терції V. Такт 5 використовує повний малюнок восьмих. Такт 6 повертає три чверті та паузу, такт 7 окреслює V чвертями, а такт 8 розв’язується через квінту й терцію в основний тон тоніки на дві долі. Не кожний такт має починатися основним тоном, щоб описати свій акорд.

  Попрацюйте над одним складним тактом і першою нотою наступного до проходження всього етюду. Використовуйте паузи для читання наперед і тримайте фінальний основний тон записані дві долі; ця нота має перевірку чутної тривалості. Решта цілей оцінюється як окремі ноти й атаки. Акценти позначають корисні атаки зразка, а не автоматичну перевірку сили медіатора.

  Після спроби відокремте неправильну ноту від запізнілої зміни акорду. Для помилок часу знижуйте темп; для помилок висоти перевірте основний тон, терцію та квінту наступного акорду. Бал не визначає, якою струною або пальцем отримано висоту. Самостійно зіставте запис з очікуваною аплікатурою й послухайте цілу фразу до підвищення швидкості.
steps:
  prepare:
    title: Прочитайте наступний акорд до його першої ноти
    body: >-
      Виберіть чистий звук і зручний темп. Називайте I, vi, IV або V на початку такту, потім знаходьте наступну
      ціль у TAB. Зупиняйте попередні ноти, щоб звуки акорду не накладалися.
  review:
    title: Відокремте помилки нот від запізнілих змін
    body: >-
      Окремо перегляньте відгук про висоти та час. Повільно повторіть межу тактів, якщо наступний акорд запізнюється;
      перевірте його основний тон, терцію та квінту, якщо ціль була хибною. Самостійно перевірте очікувані струни
      й тримайте фінальну ноту записану тривалість.
  hear-the-change:
    title: 'Чверті: I–IV–V–I'
    body: >-
      Тональний центр — {{root}}, мажор. Чотири такти: I–IV–V–I. Грайте основний тон, терцію й квінту на долях 1–3,
      потім залиште долю 4 тихою й підготуйте наступний акорд. Почніть із 60 BPM. {{sequence}}.
  four-chord-flow:
    title: 'Восьмі: I–vi–IV–V'
    body: >-
      Тональний центр — {{root}}, мажор. Чотири такти: I–vi–IV–V. Грайте по вісім рівних восьмих на акорд: основний
      тон, терція, квінта, октава, квінта, терція, основний тон, терція. Прочитайте наступний такт до першої атаки.
      {{sequence}}.
  changing-chord-study:
    title: Восьмитактовий етюд зі змінами акордів
    body: >-
      Тональний центр — {{root}}, мажор. Вісім тактів: I–vi–IV–V–I–IV–V–I. Стежте за зміною чвертей і восьмих та
      записаними паузами; такт 4 починається терцією. Тримайте фінальний основний тон дві долі. Почніть із 60 BPM
      і відпрацюйте складну зміну окремо до підвищення темпу. {{sequence}}.
  question:
    title: Гама чи поточний акорд?
    body: Врахуйте поточний акорд і записаний порядок.
