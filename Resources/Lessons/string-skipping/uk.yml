lessonID: string-skipping
lessonVersion: 1
locale: uk
title: Перестрибуй через проміжок між струнами
summary: Контролюй цільову струну й тримай невикористані струни тихими.
goal: Переходь між несусідніми струнами з чіткими нотами та рівним пульсом.
body: |-
  String skipping — це перехід на несусідню струну, коли струни між ними залишаються тихими. Складність полягає не лише у відстані руху медіатора. Треба підготувати цільову ноту, уникнути випадкового контакту на шляху й контролювати струну, яка продовжує звучати після потреби. Почни з невеликого повторюваного проміжку, щоб окремо спостерігати за цими діями.

  Спочатку зіграй контрольний рисунок на сусідніх струнах зі зручною гучністю. Чергуй удари вниз і вгору за позначками, зберігаючи рівний пульс на обох нотах. Поміть відстань руху руки з медіатором і момент припинення нижньої ноти, коли починається верхня. Це рисунок для порівняння, а не тест швидкості. Залиш той самий темп при додаванні пропущеної струни.

  У проміжку на одну струну переходь із четвертої на другу. Подивися на ціль до початку, потім зіграй кілька повільних повторів, дивлячись рідше. Проведи рух над проміжною струною, замість зачіпати її на шляху. Невеликий запас висоти корисний; великий круговий стрибок ускладнює вчасне повернення. Підготуй пальці на грифі й використовуй зручний контакт, щоб приглушувати непотрібні струни.

  Ширший проміжок веде з четвертої струни на першу. Порівняй його з меншим стрибком перед поєднанням фрази зі змінними проміжками. У ній верхня ціль змінюється, тож не дозволяй повторюваному руху руки автоматично обирати неправильну струну. Спочатку рахуй восьмі вголос. Якщо одна ціль постійно не вдається, повернися до відповідної пари нот, замість швидше починати всю фразу.

  Для вимірюваної практики використовуй чистий звук і припиняй попередню ноту з початком наступної. Оцінка висоти й таймінгу може показати неправильну чутну ціль або пізню атаку, але не доводить, яку струну ти використав і чи всі зайві струни були тихими. Окремо слухай фоновий дзвін і спостерігай за шляхом медіатора. Повтори повільну чисту версію, потім лише трохи підвищ темп. Тихіший контрольований стрибок корисніший за швидкий рисунок, зайві струни якого приховані дисторшном.
steps:
  prepare:
    title: Підготуй план струн і ударів
    body: Налаштуй інструмент, почни повільно з чистим входом і прочитай фізичні вказівки перед практикою.
  adjacent-control:
    title: Підготуй контроль на сусідніх струнах
    body: 'Чергуй дві сусідні струни ударами вниз/угору, по одній ноті на долю. Ноти звучання: {{sequence}}. Фіксований
      рисунок струн є частиною прийому; ця активність не пропонує перенесення. Практика перевіряє висоту й таймінг,
      а фізичну вказівку перевіряй самостійно.'
  skip-one:
    title: Залиш одну струну недоторканою
    body: 'Пропускай третю струну при русі між четвертою й другою. Зберігай її тихою в обох напрямках. Ноти звучання:
      {{sequence}}. Фіксований рисунок струн є частиною прийому; ця активність не пропонує перенесення. Практика
      перевіряє висоту й таймінг, а фізичну вказівку перевіряй самостійно.'
  skip-two:
    title: Контролюй ширший стрибок
    body: 'Переходь між четвертою й першою струнами, тримаючи дві проміжні струни тихими. Залиш темп меншого проміжку.
      Ноти звучання: {{sequence}}. Фіксований рисунок струн є частиною прийому; ця активність не пропонує перенесення.
      Практика перевіряє висоту й таймінг, а фізичну вказівку перевіряй самостійно.'
  alternating-gaps:
    title: Обирай ціль у фразі
    body: 'Рисунок восьмими чергує вузькі й широкі проміжки. Прочитай кожну верхню ціль перед початком; основний
      звук: {{root}}. Ноти звучання: {{sequence}}. Фіксований рисунок струн є частиною прийому; ця активність не
      пропонує перенесення. Практика перевіряє висоту й таймінг, а фізичну вказівку перевіряй самостійно.'
  check-skipping:
    title: Перевір шлях і тишу
    body: Доповни результат нот окремою перевіркою контакту зі струнами й дзвону.
