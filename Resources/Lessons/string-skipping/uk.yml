    body: Доповни результат нот окремою перевіркою контакту зі струнами й дзвону.
    items:
      path: Медіатор проходив над пропущеними струнами в обох напрямках.
      quiet: Я слухав і контролював небажаний дзвін.
      pulse: Ширший проміжок зберігав той самий пульс, що й сусідні струни.
      target: Я міг обирати змінну верхню ціль без поспіху.
