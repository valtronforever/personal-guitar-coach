lessonID: c-major
lessonVersion: 3
locale: uk
title: Мажорна гама
summary: Зіграйте мажорну гаму на одну октаву вгору й вниз.
goal: Вивчіть інтервали мажорної гами та поєднайте ноти на різних струнах.
body: |-
  Мажорна гама має сім різних ступенів. Октава повторює ступінь 1 вище; під час вправ її часто рахують як 8. Сусідні кроки: тон, тон, півтон, тон, тон, тон, півтон — 2–2–1–2–2–2–1 півтонів. Ці співвідношення визначають гаму в будь-якій тональності; поточна активність надає актуальні назви нот для вашого строю.

  Перед проходом знайдіть початкову тоніку й октаву. Зіграйте ступені 1–4, прислухаючись до малого кроку 3–4, потім 5–8 із малим кроком 7–8. Не змінюйте пульс на переходах між струнами. Зупиняйте попередню струну на початку наступної ноти, щоб одноголосний вхід мав одну потрібну висоту.

  На 60 BPM грайте по чверті на клік: такти 1–2 вгору, 3–4 вниз без повтору вершини. Остання доля тиха. Називайте ступені під час гри, а поточні назви нот — в окремому повільному проході. Ступені й пальці — різні числа: 3 означає третій ступінь гами, а не обов’язково палець 3.

  Для першої повної спроби залиште Оригінальну аплікатуру. Потім оберіть доступну ділянку грифа, прочитайте TAB і збережіть ті самі ноти й октави. Назва ділянки позначає її нижню межу, а не обіцяний початковий лад. Зміна Standard-строю транспонує урок; зміна позиції зберігає музику. Порівняйте оцінки висоти/атак, а аплікатуру підтвердьте самостійно. Додавайте 5 BPM після трьох рівних чистих повторів.
steps:
  root-c:
    title: Знайдіть основну ноту
    body: |-
      Перша й остання нота звучання: {{positions}}.

      Озвучте низьку тоніку й порівняйте її з октавою у верхній частині малюнка. Назви мають той самий клас висоти, але різні номери октав.
  lower-half:
    title: Зіграйте нижню половину
    body: |-
      Такт 1, одна нота на долю: {{positions}}.

      В окремому проході рахуйте 1–2–3–4 як ступені. Останній рух цієї групи — перший півтон.
  upper-half:
    title: Зіграйте верхню половину
    body: |-
      Такт 2 доходить до октави: {{positions}}.

      Рахуйте 5–6–7–8. Почуйте завершення останнього півтону у верхній тоніці; на спуску не повторюйте вершину двічі.
  descending:
    title: Спустіться до основної ноти
    body: 'Такти 3–4 проходять шлях назад без повтору верхньої ноти: {{positions}}.'
  finish:
    title: Завершіть паузою
    body: |-
      Зупиніть останню ноту на фінальній долі такту 4 та продовжуйте рахувати.

      Низька тоніка починається на долі 3 останнього такту; заглушіть на 4. Після перегляду повної спроби поза оцінюваною вправою складіть фразу 1–2–3–1.
  scale-question:
    title: Перевірте будову
    body: Дайте відповідь за інтервальною будовою, а не поточними назвами нот.
  practice-review:
    title: Перетворіть малюнок на фразу
    body: >-
      Після повної записаної вправи оберіть коротку фразу й свідомо закінчіть на тоніці. Окремо перевірте музичний
      результат і вибрану аплікатуру.
