learningTasks:
  scale-question:
    title: Будова гами
    body: Між якими сусідніми ступенями мажору є півтон?
    items:
      correct: 3–4 та 7–8
      early: 2–3 та 6–7
      all: Між кожною сусідньою парою
    explanation: Малюнок 2–2–1–2–2–2–1 ставить півтони після ступенів 3 й 7. Октава — повторена тоніка.
  practice-review:
    title: Перевірте повну спробу
    body: Позначте лише те, що перевірили під час гри та слухання.
    items:
      structure: Я знаходжу тоніку, октаву й обидва півтонові кроки.
      pulse: Я пройшов угору/вниз без подвоєння вершини й витримав фінальну паузу.
      position: Я окремо перевірив лади/струни, а не вважав звукову оцінку доказом аплікатури.
