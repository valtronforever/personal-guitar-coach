learningTasks:
  technique-review:
    title: Check the physical technique
    body: The pitch trace measures sound. Confirm these observations yourself.
    items:
      motion: I kept the finger down while reducing tension and did not turn the return into a pull-off.
      sound: I let the initial attack sustain through the bend and return without repicking.
      repeat: I compared the raised and returned pitches with the fretted reference and inspected both phases.
