learningTasks:
  technique-review:
    title: Перевірте фізичний прийом
    body: Траєкторія висоти вимірює звук. Ці спостереження підтвердьте самостійно.
    items:
      motion: Я залишав палець притиснутим при зменшенні натягу й не перетворював повернення на pull-off.
      sound: Початкова атака тривала крізь bend і повернення без повторного удару.
      repeat: Я порівняв підвищену й повернуту висоти із затиснутим еталоном та переглянув обидві фази.
