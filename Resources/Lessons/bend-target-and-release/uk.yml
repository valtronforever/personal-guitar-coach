lessonID: bend-target-and-release
lessonVersion: 1
locale: uk
title: Точність bend і повернення ноти
summary: Досягніть еталонної висоти, утримайте її та поверніться до початкової ноти.
goal: Контролювати обидві цілі bend без додаткової атаки медіатором під час повернення.
body: 'Bend із поверненням має дві цілі: підвищену висоту й початкову ноту. Досягнення верхньої цілі не завершує
  фразу. Контролюйте струну при зменшенні натягу, щоб висота поверталася свідомо, а не різко падала; зберігайте
  контакт, доки повернута нота не прозвучить.


  Спочатку освіжіть звичайний затиснутий тоновий еталон. У наступній вправі тридольна нота має п’ять фаз: початок,
  підйом, ціль, опускання й повернення. r після b2 означає повернення під час звучання. Це не відрив пальця й не
  pull-off. Глушіть лише на наступній паузі.


  Почніть на 60 BPM. За графіком розрізняйте завищену ціль, занижену ціль, раннє повернення й повернення, яке не
  доходить до початкової висоти. Графік залишається у збереженому результаті: порівнюйте спроби чи зробіть знімок
  для обговорення. Пунктир — авторська траєкторія; суцільна лінія — виміряна висота з прогалинами для тиші або невизначеного
  сигналу.


  Оцінка допускає смугу 35 центів навколо потрібної траєкторії. Вона пропускає короткі інтервали стабілізації детектора
  біля змін і надає фазам однакову вагу, тому довге правильне утримання не приховає відсутності повернення. Надійно
  визначена тиша — музичний пропуск; ненадійний сигнал не отримує оцінки траєкторії. Вимірювання не доводить рух
  пальця або відсутність другої атаки всередині bend: перевірте це окремо.'
steps:
  prepare:
    title: Розділіть опускання й відрив
    body: Озвучте початковий лад. Зробіть малий bend і зменште натяг, залишаючи палець притиснутим. Знову почуйте
      початкову ноту, потім заглушіть. Потрібне контрольоване зниження, а не відкрита струна.
  target-comparison:
    title: Освіжіть тонову ціль
    body: 'Зіграйте початкову ноту, ціль на два лади вище, початкову ноту й паузу. Послухайте обидві цілі: {{sequence}}.
      Збережіть звук у пам’яті для bend із поверненням; під час нього не переходьте на цільовий лад.'
  return-bend:
    title: П’ять фаз в одній тривалій ноті
    body: Атакуйте на 1; почніть підйом на і після 1; досягніть тонової цілі на 2. Тримайте до 3, плавно поверніться
      до і після 3 й тримайте початкову висоту до глушіння на 4. Повторіть два такти. Початкова атака має тривати
      крізь повернення; не рятуйте слабку ноту повторним ударом.
  half-step-return:
    title: Зменште відстань, збережіть контроль
    body: 'Той самий ритм для чотирьох півтонових bend. Підніміться лише на 100 центів і поверніться до нуля. Менший
      рух перевіряє точність: не використовуйте звичний тоновий розмах. Особливо слухайте повернуту ноту кожного
      такту.'
  review:
    title: Оберіть одну виміряну поправку
    body: Якщо Утримання цілі завищене чи занижене, змініть висоту bend. Якщо Повернута нота завищена, відновіть
      початковий натяг зі збереженням контакту. Якщо графік має прогалини, перевірте чистий сигнал і тривалість
      звучання перед тлумаченням оцінки. Повільно повторіть один такт, потім цілу фразу.
