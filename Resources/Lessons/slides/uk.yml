lessonID: slides
lessonVersion: 1
locale: uk
title: 'Слайди: рух до наступного ладу'
summary: >-
  Поєднайте дві затиснуті ноти контрольованими слайдами вгору й униз, а потім виконайте рух у чотиритактовій фразі.
goal: >-
  Зберігати чутну початкову ноту, рухатися однією струною та досягати записаної цілі без другого удару медіатором.
body: |-
  Слайд поєднує дві затиснуті ноти переміщенням пальця вздовж тієї самої струни, поки звук продовжується. Висота змінюється через зміну довжини частини струни, що звучить, на послідовних ладах. Це відрізняється від бенду, який підвищує висоту натягуванням струни на одному ладу. Слайд може містити невеликі висотні сходинки; він не зобов’язаний звучати як цілком плавний синтезаторний перехід.

  Почніть із чистого тембру й зручної відстані у два лади. Знайдіть обидві позначки до гри. Один раз вдарте по нижчій ноті, збережіть достатній контакт для чистого звуку й перемістіть палець до вищого ладу. Цільтеся безпосередньо за металевим поріжком, не посилюючи стискання під час руху. Глушіть сусідні струни вільними частинами обох рук. На паузі повертайтеся у вихідне положення. Якщо рука напружується, зупиніться й зменште відстань або тиск до наступної спроби.

  У висхідній вправі вдарте на долі 1 і тримайте початкову висоту всю цю долю. Почніть рух на долі 2, досягніть цілі на долі 3, залиште її звучати до кінця долі 3 й зупиніть звук на долі 4. Спочатку окремо зіграйте цільову ноту, а потім порівняйте з нею завершення слайду. Приклад відтворення задає час і висоту, але не є записом гітарного слайду.

  Для низхідної вправи починайте з вищого ладу й дотримуйтеся того самого розкладу. Зберігайте контакт під час руху до верхнього поріжка: повне підняття пальця може озвучити відкриту струну замість потрібної нижчої затиснутої ноти. Готуйте точку прибуття, не тягнучи сусідні струни. Коса риска й два номери ладів показують очікуваний рух; цільовий номер має власне положення в часі.

  Остання фраза двічі піднімається й двічі повертається. У кожному такті залишається одна початкова атака, один слайд і тиха четверта доля. Читайте наступний початковий лад на цій паузі, а не продовжуйте один слайд у наступний такт. Для цих затиснутих вправ можна вибрати іншу дозволену ділянку грифа. Обидва кінці переміщуються разом на одній струні, зберігаючи висоти в межах вибраного строю.

  Окремо перегляньте початкову висоту, рух і ціль. Хибний кінцевий лад відрізняється від прямого стрибка, який пропустив проміжну висоту у слайді через два лади. Додаток вимірює чутний шлях і час першої атаки. Він не визначає палець, не доводить фізичний слайд і не вважає саму внутрішню зміну спектра доказом повторного удару. Самостійно зіставте рух руки з інструкцією. Практика навмисно повільна, щоб можна було виміряти окремі фази.
steps:
  prepare:
    title: Спочатку почуйте обидві ноти
    body: >-
      Виберіть чистий тембр. Окремо зіграйте кожну показану кінцеву ноту, потім спробуйте один з’єднаний слайд.
      Тримайте сусідні струни тихими й відпускайте зайвий тиск на паузі.
  review:
    title: Перевірте шлях і прибуття
    body: >-
      Перегляньте початкову фазу, рух і ціль. Якщо кінцева нота хибна, окремо знайдіть її лад; якщо рух нечіткий,
      уповільніть його та слухайте проміжну висоту. Рух пальця й повторні удари оцініть самостійно.
  question:
    title: Слайд чи бенд?
    body: Врахуйте заданий рух, а не лише кінцеву висоту.
  upward:
    title: Слайд угору на тон
    body: >-
      Вдарте на долі 1. Почніть слайд на долі 2, досягніть цілі на долі 3 й залиште долю 4 тихою. Повторюйте з новим
      початковим ударом у кожному такті. Почніть із 60 BPM. Цілі у вашому строї: {{sequence}}. Позиції: {{positions}}.
  downward:
    title: Слайд униз на тон
    body: >-
      Вдарте на долі 1. Почніть слайд на долі 2, досягніть цілі на долі 3 й залиште долю 4 тихою. Повторюйте з новим
      початковим ударом у кожному такті. Почніть із 60 BPM. Цілі у вашому строї: {{sequence}}. Позиції: {{positions}}.
  connected-phrase:
    title: Чотиритактова фраза зі слайдами
    body: >-
      Вдарте на долі 1. Почніть слайд на долі 2, досягніть цілі на долі 3 й залиште долю 4 тихою. Повторюйте з новим
      початковим ударом у кожному такті. Почніть із 60 BPM. Цілі у вашому строї: {{sequence}}. Позиції: {{positions}}.
