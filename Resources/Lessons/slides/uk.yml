learningTasks:
  question:
    title: Слайд чи бенд?
    body: Як у цій вправі потрібно отримати вищу ноту?
    items:
      slide: Перемістити палець тією самою струною до показаного вищого ладу.
      bend: Залишитися на початковому ладу й натягнути струну для підвищення висоти.
      pick: Повністю підняти палець і вдарити по будь-якій вищій ноті на іншій струні.
    explanation: >-
      Вправа просить виконати слайд між двома ладами однієї струни. Бенд змінює натяг на одному ладу. Аудіо перевіряє
      шлях висоти, а власне спостереження — застосований рух.
  review:
    title: Самостійно перевірте фізичну техніку
    body: 'Позначте лише те, що справді попрактикували: оцінка висоти не підтверджує цих рухів.'
    items:
      contact: Я зберігав контакт із тією самою струною під час слайдів.
      arrival: Я починав рух на долі 2 й досягав цілі на долі 3.
      quiet: Я глушив сусідні струни й залишав долю 4 тихою.
      review: Я порівняв виміряний шлях з очікуваним рухом, не вважаючи аудіо доказом аплікатури.
