learningTasks:
  question:
    title: A slide or a bend?
    body: What is the intended way to reach the higher note in this exercise?
    items:
      slide: Move the fretting finger along the same string to the shown higher fret.
      bend: Stay on the original fret and stretch the string upward in pitch.
      pick: Lift completely and pick any higher note on another string.
    explanation: >-
      The exercise asks for a slide between two frets on one string. A bend changes tension at one fret. Audio checks
      the pitch path; your own observation confirms which motion you used.
  review:
    title: Observe the physical technique yourself
    body: Mark only what you actually practiced; the pitch score does not confirm these gestures.
    items:
      contact: I kept contact with the same string during each slide.
      arrival: I began moving on beat 2 and reached the destination on beat 3.
      quiet: I muted neighboring strings and left beat 4 quiet.
      review: I compared the measured path with the intended movement without treating audio as proof of my fingering.
