lessonID: performance-recording
lessonVersion: 1
locale: uk
title: Запиши виконання й склади корисний список виправлень
summary: Зафіксуй цілу мініатюру, відділи спостереження від судження й перевір одне виправлення.
goal: Збережи безперервний прохід і визнач конкретні виправлення за тактами перед порівняльним записом.
body: |-
  Контрольний запис відповідає на конкретне запитання: чи витримує підготовлений твір одне безперервне виконання? Використай восьмитактову мініатюру попереднього уроку з тією самою формою й реалістичним темпом. Заздалегідь виріши не зупинятись через малі помилки. Повторювані фрагменти залиш окремому виправному заняттю. Так набір відшліфованих початків не здаватиметься готовністю зіграти весь твір.

  Обери активність повного виконання й відкрий запис самопрактики. До початку перевір інструмент, вхідний канал, вихід і темп. Вікно надає один такт відліку й метроном із вимкненими еталонними гітарними нотами. Пам’ятай, що сам твір починається двома тихими долями. Записуй до фінального завершення та решти паузи. Свідома дострокова зупинка має відповідну позначку замість подання як повного виконання.

  Збережи WAV перед закриттям вікна або новим записом: незбережений прохід тимчасовий. Відкрий файл системним програвачем. Перший канал містить обраний гітарний вхід, другий — згенерований еталон кліків. Еталон відповідає запланованому годиннику й не є записом звуку біля навушників. Ця активність не застосовує автоматичної музичної оцінки й не просить AI-провайдера судити твоє виконання.

  Один раз послухай без інструмента, простежуючи карту форми. Під час другого слухання запиши короткий список: номер такту, чутне спостереження й наступну дію. Наприклад, відрізни пропущену ноту від ранньої атаки, небажаного продовження або втраченого вступу частини. Пиши те, що почув, замість діагнозу щодо пальців, якого запис не доводить. Почни з двох важливих виправлень замість однакової терміновості кожної деталі.

  Виправ одну обрану межу в повільнішому темпі, включи попередній такт, потім знову запиши весь твір у початковому темпі порівняння. Збережи окремий файл, залишивши попередній доказ. Порівняй той самий уривок обох проходів: чи поліпшилася задумана ознака та чи збереглася серед решти форми? Завершений запис підтверджує лише захоплення до кінця. Готовність, виразність і ансамблева доречність усе ще потребують чесного слухання й ширшого музичного контексту.
steps:
  prepare:
    title: Обери невелику музичну ідею
    body: Прочитай план, обери зручний чистий звук і почни повільно.
  complete-performance:
    title: Один повний восьмитактовий прохід
    body: 'Використай вивчену форму: вступ, A, змінене A, контрастна частина, завершення. Запиши самопрактику, збережи
      WAV і переглянь його до нового проходу. Показаний запис є еталоном для списку виправлень.'
  transition-repair:
    title: Виправ одну межу в контексті
    body: Це перехід із такту 5 до такту 6 повного проходу. Використай його лише за почутої тут проблеми; інакше
      обери справжній проблемний уривок у своїй практиці.
  ending-repair:
    title: Почуй останній підхід і завершення
    body: Це такти 7–8. Збережи паузу перед кінцевим центром і заверши після двох його долей. За своїм записом виріши,
      чи це виправлення доречне.
  review:
    title: Збережи малий список виправлень із доказами
    body: Запиши деталі на папері або у власних нотатках; позначки підтверджують самоперевірку, а не автоматичний
      результат.
