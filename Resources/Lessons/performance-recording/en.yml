learningTasks:
  review:
    title: Keep a small evidence-based repair list
    body: Write details on paper or in your own notes; the checkboxes confirm your review, not an automatic result.
    items:
      saved: I saved a complete take and listened before making another.
      locations: I named at most two priority issues with bar numbers and audible evidence.
      action: I chose a specific repair action rather than guessing a physical diagnosis.
      compare: I kept the first file and compared a second take at the same tempo.
      whole: I checked whether the repair survived a complete performance.
