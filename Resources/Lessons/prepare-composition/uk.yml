learningTasks:
  review:
    title: Перевір готовність усієї форми
    body: Використай докази цілого проходу, а не лише найлегшої фрази.
    items:
      map: Я можу назвати всі частини та номери тактів.
      start: Я відрахував початкову тишу й вступив свідомо.
      transition: Я поєднав змінене повернення з контрастною частиною в контексті.
      recovery: Я завершив прохід без перезапуску після малої помилки.
      ending: Я завершив на записаній долі й відрахував решту тиші.
