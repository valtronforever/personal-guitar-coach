lessonID: prepare-composition
lessonVersion: 1
locale: uk
title: Підготуй цілу мініатюру разом із тишею
summary: Склади карту восьмитактової форми, відпрацюй переходи й заверши без перезапуску.
goal: Виконай всю оригінальну мініатюру із запланованим вступом, переходами та фінальним завершенням.
body: |-
  Повне виконання потребує більше, ніж знання окремих фраз. До деталей склади карту форми: оригінальна мініатюра має один вступний такт, два такти ідеї A, два такти зміненого повернення, два контрастні такти переходу й один завершальний такт. Пронумеруй усі вісім. Відлік передує твору й не є вступним тактом. Промов назви частин у стійкому пульсі до розуміння порядку без гітари.

  Вивчи кожну частину достатньо повільно для планування наступного руху. Збережи початкові паузи: впевнений вступ починається, поки ти ще мовчиш. Наприкінці припини останню ноту в записаному місці й продовжуй рахувати решту паузи. Негайний вступ після відліку або безмежне звучання останньої ноти змінюють форму. Точна тиша робить початок і кінець навмисними, а не випадковими.

  Тренуй переходи перекривними вікнами. Зіграй кінець зміненого повернення в початок контрастної частини; не повторюй лише першу ноту складного розділу. Дивись наперед на новий регістр, зберігаючи рахунок попереднього такту. Коли межа стане стійкою, розшир вікно попередньою та наступною фразами. Так перевіриш, чи зберігається виправлення в контексті, який спочатку створював складність.

  Розділяй виправні проходи та виконання. Під час виправлення зупинись на відомій проблемі й внеси конкретну зміну. Під час виконання збережи рух форми після малої помилки та повернись у наступній надійній точці. Не тренуй відновлення лише перезапуском із першого такту: так початок отримує значно більше уваги, ніж кінець. Повільніший безперервний прохід корисніший за постійне покидання другої половини у швидкому темпі.

  Заверши записом одного повного проходу в темпі, де переходи лишаються запланованими. Скористайся записом цілого етюду; короткий перехід також має окрему одноголосну практику для вимірюваної підготовки. Не вважай оцінку фрагмента доказом готовності всього твору. Карту форми, відновлення та фінальне завершення послухай самостійно. Для довшого репертуарного твору застосуй ту саму карту частин і перекривні вікна з посильними репетиційними сегментами.
steps:
  prepare:
    title: Обери невелику музичну ідею
    body: Прочитай план, обери зручний чистий звук і почни повільно.
  entrance:
    title: Вступи всередині першого такту
    body: Відрахуй дві тихі долі після відліку, потім зіграй на долях 3 й 4. Це такт 1 композиції.
  main-idea:
    title: Два такти ідеї A
    body: 'Центр: {{root}} minor. Збережи кінцеві паузи обох тактів. Це такти 2–3 цілої форми.'
  varied-return:
    title: Змінене повернення
    body: Почуй густіший перший такт і знайому відповідь після нього. Це такти 4–5; збережи їхню тривалість.
  bridge:
    title: Контраст перед завершенням
    body: Утримуй дві початкові ноти по дві долі, потім спустись і залиш останню долю тихою. Це такти 6–7.
  join-into-bridge:
    title: Поєднай такт 5 із тактом 6
    body: Рахуй під час останньої паузи перед вищим вступом контрастної частини. Двотактовий фрагмент готує межу,
      але не оцінює весь твір.
  ending:
    title: Заверши й відрахуй тишу
    body: Утримай центр на долях 1–2, заверши на долі 3 й рахуй до кінця долі 4. Це цілий завершальний такт, а не
      обрив посеред форми.
  complete-miniature:
    title: Виконай усі вісім тактів
    body: 'Карта: 1 вступ; 2–3 A; 4–5 змінене A; 6–7 контрастна частина; 8 завершення. Запиши безперервний прохід
      і відрізни його від виправної спроби.'
  review:
    title: Перевір готовність усієї форми
    body: Використай докази цілого проходу, а не лише найлегшої фрази.
