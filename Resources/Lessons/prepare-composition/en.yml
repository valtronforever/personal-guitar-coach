learningTasks:
  review:
    title: Check readiness across the whole form
    body: Use evidence from a complete pass, not only your easiest phrase.
    items:
      map: I can name all sections and their bar numbers.
      start: I counted the opening silence and entered deliberately.
      transition: I connected the varied return to the bridge in context.
      recovery: I completed a pass without restarting after a small error.
      ending: I released on the written beat and counted the remaining silence.
