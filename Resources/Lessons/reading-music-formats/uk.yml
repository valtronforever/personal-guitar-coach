lessonID: reading-music-formats
lessonVersion: 1
locale: uk
title: Прочитай п’єсу через три способи запису
summary: Поєднай час і висоту звучання з TAB, нотним станом та акордовою формою.
goal: Зіграй незнайому коротку мелодію із запису, потім поясни, що визначає акордна схема, а що ні.
body: |-
  Читання переводить знаки в запланований звук. Перед грою знайди розмір, одиницю пульсу, першу позицію та загальну кількість тактів. Переглянь паузи, зміни струн і найдовшу ноту. Відрахуй один тихий такт в обраному темпі. Так перша спроба стає посильним читанням замість низки реакцій на кожний новий знак. Дивись трохи вперед від ноти, що звучить.

  TAB визначає струну й лад. Верхня лінія — перша, найтонша струна; нуль означає відкриту струну. Читай ритмічні позначення й розміщення разом із цифрами ладів. Дві однакові цифри на різних струнах можуть означати різні висоти. Обраний у додатку стрій змінює назви нот у позиціях, а уроки зі збереженням інтервалів утримують задуману музичну структуру. Перевір показаний інструмент перед застосуванням завченої форми.

  Нотний стан передусім задає висоту й тривалість, а не єдину гітарну аплікатуру. Гітарний нотний запис розташований на октаву вище звучання; назви нот на грифі й цільові назви позначають висоту звучання. Для першої мелодії перемкнися на нотний стан, визнач контур і відрахуй тривалості, потім повільно зіграй до прослуховування еталона. Після цього порівняй запропоновані позиції в TAB. Кілька фізичних аплікатур можуть давати ту саму мелодію; мікрофон не доводить обрану тобою.

  Акордна форма є просторовою вказівкою: які лади затиснути, які струни лишити відкритими, які заглушити. Сама по собі вона не задає момент удару або тривалість звучання. Обери компактну форму й оглянь її на грифі, потім використай окремий часовий приклад для атаки та завершення. Нарешті зіграй складники по одному в практиці арпеджіо; ця вимірювана підготовка не перевіряє одночасний акорд.

  Для другої короткої мелодії обери менш упевнений спосіб читання. Дай собі короткий перегляд і одну безперервну повільну спробу. Якщо загубиш місце, продовжуй рахувати й повернися з наступного такту замість постійного перезапуску. Після гри відрізни помилку читання, виконання та втраченого рахунку. Тренуй конкретну причину: проплескай ритм, назви наступні ноти або відпрацюй один перехід між струнами.
steps:
  prepare:
    title: Обери невелику музичну ідею
    body: Прочитай план, обери зручний чистий звук і почни повільно.
  first-reading:
    title: Прочитай перед слуханням
    body: 'Центр: {{root}} major. Обери нотний стан, відрахуй два такти й спробуй мелодію до еталона. Порівняй запропоновану
      TAB після першого читання.'
  compact-shape:
    title: Прочитай акордову форму
    body: Оглянь {{positions}} на грифі. Грай струни 3, 2 й 1; заглуши 6, 5 й 4. Сама форма не задає ритму бою.
  timed-chord:
    title: Додай формі ритм
    body: У такті 1 атакуй на долі 1 й заверши на долі 3. У такті 2 атакуй на долі 2 й заверши на долі 3. Читай
      паузи, а не лише захват.
  chord-tone-reading:
    title: Прочитай складники по одному
    body: Під час одноголосної перевірки припиняй попередню ноту перед наступною. Висоти відповідають показаному
      компактному мажорному акорду.
  second-reading:
    title: Незнайомий вступ після паузи
    body: Переглянь порожню першу долю й завершальну дводольну ноту, потім спробуй цілі два такти без перезапуску.
  review:
    title: Назви джерело помилки
    body: Порівняй перше читання з повільним виправленим проходом.
