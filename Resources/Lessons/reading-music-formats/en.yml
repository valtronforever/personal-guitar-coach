learningTasks:
  review:
    title: Name the source of the mistake
    body: Compare your first reading with a slow corrected pass.
    items:
      scan: I scanned meter, rests and string changes before starting.
      representations: I compared the same notes in Staff and TAB using the selected tuning.
      shape: I distinguished the chord shape from its timed attack/release pattern.
      continuity: I kept counting after an error and identified its specific cause.
