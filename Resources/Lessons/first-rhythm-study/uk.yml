lessonID: first-rhythm-study
lessonVersion: 1
locale: uk
title: Перший ритмічний етюд
summary: З’єднайте вісім оригінальних тактів у музичну фразу.
goal: Зіграти восьмитактовий етюд із чвертями, восьмими, паузами й довгим завершенням.
body: |-
  Цей оригінальний етюд поєднує ритми модуля. Мисліть двома чотиритактовими фразами: такти 1–4 ставлять запитання, 5–8 відповідають і завершуються довгою нотою. Використовуйте струни 3 та 2 й показані лади. Рахуйте протягом пауз і дайте позначеним довгим нотам звучати.

  Почніть на 50 BPM. Працюйте відрізками по два такти, з’єднайте чотири, потім зіграйте всі вісім без зупинки. Помилка — привід для розбору після гри, а не перезапуску посеред оцінюваної спроби. Приклад синтезовано як орієнтир висоти й ритму; знаки > роблять початки фраз голоснішими.
steps:
  first-pair:
    title: 'Такти 1–2: від чвертей до восьмих'
    body: >-
      Почніть із трьох чвертей і паузи. У такті 2 грайте восьмі на долях 1–2, чверть на 3, потім паузу на 4. Відлічіть
      всю паузу перед наступною фразою. {{positions}}.
  second-pair:
    title: 'Такти 3–4: простір і ритм із крапкою'
    body: >-
      У такті 3 доля 2 порожня. У такті 4 утримуйте першу ноту на «1 і 2», зіграйте коротку на «і» після 2, потім
      наступну утримуйте протягом 3–4. Виберіть ці два такти й повторіть повільно.
  third-pair:
    title: 'Такти 5–6: відповідь зі зміненим ритмом'
    body: >-
      Такт 5 починається двома восьмими, потім чверті на 2 та 3 і пауза на 4. У такті 6 чверть на 1, пауза на 2,
      дві восьмі на 3 й чверть на 4. Не дозволяйте тихій долі зсунути наступні восьмі пізніше.
  ending:
    title: 'Такти 7–8: завершіть фразу'
    body: >-
      У такті 7 утримуйте дві долі, зіграйте на 3, потім пауза на 4. Останню цілу ноту зіграйте один раз і відлічіть
      усі чотири долі, поки вона звучить. Не зупиняйтеся лише тому, що атака була правильною.
  perform:
    title: Зіграйте всі вісім тактів
    body: >-
      Поверніться до повного діапазону й зіграйте один раз без зупинки. Розберіть одну виміряну проблему таймінгу,
      висоти або утримання, повторіть її два такти й знову зіграйте весь етюд у тому самому темпі.
  review:
    title: Перевірте перед прискоренням
    body: >-
      Повне контрольоване виконання важливіше за швидкий фрагмент. Після трьох повних спроб із рівним рахунком і
      чіткими паузами спробуйте 55 BPM. Довга остання нота має звучати до кінця.
activities:
  study:
    title: Восьмитактова фраза від {{first}}
    body: >-
      Грайте двома фразами по чотири такти. {{sequence}}. Для позначених довгих нот оцінюється утримання; точність
      заглушення на паузах і контраст акцентів перевіряйте на слух.
learningTasks:
  review:
    title: Перевірте свою практику
    body: Позначайте лише перевірене; самооцінка не змінює аудіооцінку.
    items:
      count: Я проходжу всі вісім тактів, не втрачаючи рахунку.
      sound: Паузи тихі, а довга остання нота продовжує звучати.
      repeat: Я можу назвати й покращити один конкретний слабкий відрізок.
