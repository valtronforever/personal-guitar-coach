lessonID: drive-compression-gate
lessonVersion: 1
locale: uk
title: Дай drive, compressor і gate окремі завдання
summary: Перевір атаку, затухання й тишу, не приховуючи процесором помилки гри.
goal: Налаштуй кожен доступний процесор для однієї спостережуваної мети й розпізнай шкоду для фрази.
body: |-
  Drive змінює фактуру й реакцію через нелінійний етап. Компресор змінює рівень у часі, а gate послаблює достатньо тихий вхід. Ці інструменти взаємодіють, але спочатку вивчи їхні завдання окремо. Обійди всі три, зіграй фразу з повною паузою, потім увімкни один процесор у моніторингу. Для вимірюваної практики залиш чистий вхід аналізатора.

  Для drive порівняй помірне збільшення gain із проходом bypass зі схожою гучністю. Слухай атаку й фоновий шум між фразами. Розрізняй drive або gain і регулятор вихідного рівня. Якщо більший вихід сильніше навантажує наступний підсилювач, дисторшн може змінитися й там; запиши порядок і визнач етап, відповідальний за потрібний звук.

  Для компресії чергуй м’яку й упевненішу ноту. Threshold і ratio задають реакцію на рівень; attack і release формують її в часі. Почни помірно, порівняй збережену початкову деталь медіатора, потім слухай затухання відносно атаки. Вирівняй вихід перед оцінкою покращення. Надмірна обробка може сплощувати навмисні акценти або піднімати зайвий шум.

  Для gate зупини струни й підніми threshold лише настільки, щоб зменшити фоновий шум. Потім перевір найтихішу потрібну атаку й кінець довгої ноти. Налаштування, яке закриває паузу, але обрізає ноту, ще не корисне. За наявності зміни release або hold; зменш threshold, якщо м’які ноти не відкривають gate. Він не прибирає зайві струни, поки гучніша потрібна нота тримає його відкритим.
steps:
  prepare:
    title: Визнач тракт і початковий звук
    body: Використовуй наявне обладнання з комфортною гучністю. Додаток дає пояснення, часові орієнтири й самоперевірку;
      він не запускає ефекти цього уроку.
  control:
    title: Використовуй ту саму фразу для порівняння
    body: 'Вивчи цю суху двотактову фразу, потім повтори її через власний звуковий тракт зі зміною одного параметра.
      Зберігай зіставні темп, артикуляцію й гучність прослуховування. Еталон додатка не містить симуляції підсилювача
      чи ефектів. Ноти звучання: {{sequence}}. Показана аплікатура — орієнтир; звук не доводить використання струни
      чи пальця.'
  test-drive:
    title: Перевір drive і його вихід
    body: Порівняй drive з bypass, вирівнюючи гучність після зміни gain.
  test-compressor:
    title: Збережи навмисні атаки
    body: Порівняй м’які й сильніші атаки, довге затухання та bypass. Залиш завдання непозначеним без доступного
      компресора.
  test-gate:
    title: Перевір найтихішу ноту й затухання
    body: Налаштуй gate за тишею, м’якою атакою та довгим закінченням. Залиш непозначеним без gate.
activities:
  control:
    title: Використовуй ту саму фразу для порівняння
    body: 'Вивчи цю суху двотактову фразу, потім повтори її через власний звуковий тракт зі зміною одного параметра.
      Зберігай зіставні темп, артикуляцію й гучність прослуховування. Еталон додатка не містить симуляції підсилювача
      чи ефектів. Ноти звучання: {{sequence}}. Показана аплікатура — орієнтир; звук не доводить використання струни
      чи пальця.'
learningTasks:
  test-drive:
    title: Перевір drive і його вихід
    body: Порівняй drive з bypass, вирівнюючи гучність після зміни gain.
    items:
      texture: Я визначив зміну фактури окремо від гучності.
      order: Я знаю, чи вихід drive навантажує наступний підсилювач.
      noise: Я перевірив паузу на додатковий шум.
  test-compressor:
    title: Збережи навмисні атаки
    body: Порівняй м’які й сильніші атаки, довге затухання та bypass. Залиш завдання непозначеним без доступного
      компресора.
    items:
      attack: Я порівняв початкову деталь медіатора до й після компресії.
      tail: Я почув затухання й шум відносно атаки.
      intent: Я зберіг корисний контраст навмисних акцентів.
  test-gate:
    title: Перевір найтихішу ноту й затухання
    body: Налаштуй gate за тишею, м’якою атакою та довгим закінченням. Залиш непозначеним без gate.
    items:
      idle: Gate зменшив фоновий шум у потрібній паузі.
      quiet: Найтихіша потрібна нота все ще відкривала gate.
      tail: Gate не обрізав закінчення різко.
