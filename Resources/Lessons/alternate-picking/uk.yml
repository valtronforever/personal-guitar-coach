lessonID: alternate-picking
lessonVersion: 1
locale: uk
title: Змінний штрих — alternate picking
summary: Дотримуйтеся явних підказок вниз–вгору на повторених нотах і змінах струн.
goal: Зберігати чергування напрямку медіатора й рівність записаних атак.
body: 'Змінний штрих змінює напрямок медіатора на кожній потрібній атаці: вниз, угору, вниз, угору. Удар униз рухається
  до тонших струн, угору — до товстіших незалежно від орієнтації TAB на екрані. Стрілки показують потрібний рух,
  а не вимірювання руки. Синтетичний тон не змінює тембр для удару вгору.


  Почніть із повтореної ноти, щоб зміни висоти не відволікали від циклу медіатора. Використовуйте невеликий рух,
  достатній для проходу струни, і хват, який утримує медіатор без сильнішого стискання заради швидкості. Порівнюйте
  гучність напрямків слухом; удар угору не потребує надмірного розмаху, щоб бути чутним.


  Далі переходьте між двома струнами, не перериваючи чергування. Наприкінці почніть коротку групу ударом угору,
  щоб сильна доля не прив’язувалася назавжди до одного напрямку. Фізичний малюнок ладів зберігається між строями,
  а висоти переобчислюються. Оцінюються чутні ноти й атаки; напрямок, зусилля та баланс перевіряєте ви.'
steps:
  prepare:
    title: Перевірте значення стрілок
    body: Поза струною зробіть чотири малі пари вниз–угору. Поверніться до однієї затиснутої цілі й повільно озвучте
      пару. Решта струн мовчить.
  one-string: &id001
    title: Шістнадцять рівних атак
    body: 'На 50 BPM рахуйте 1 і 2 і 3 і 4 і у двох тактах. Дотримуйтеся стрілок: вниз на числа, вгору на і. Останній
      удар угору має бути так само чітким, як перший униз; зробіть три повні спроби.'
  cross-strings: &id002
    title: Продовжте цикл між струнами
    body: Зіграйте дві ноти на струні 6 й дві на струні 5, повторивши чотири рази. У цьому малюнку перша атака струни
      спрямована вниз. Не додавайте ще одного удару вниз лише для підготовки зміни струни. {{sequence}}.
  upstroke-start: &id003
    title: Свідомо почніть угору
    body: 'Один такт змінює початковий напрямок: угору на число й униз на і. Збережіть темп і висоту. Порівняйте
      відчуття й поверніться до початкових двох тактів.'
  review:
    title: Перевірте рух окремо від оцінки
    body: 'Перегляньте виміряні висоти й атаки. Потім поспостерігайте за повільним повтором: чи збігаються стрілки
      з рухами й чи рух лишається малим. Підвищуйте темп лише після трьох рівних повторів.'
activities:
  one-string: *id001
  cross-strings: *id002
  upstroke-start: *id003
learningTasks:
  review:
    title: Перевірте цю спробу
    body: Позначте лише те, що перевірили слухом чи спостереженням за руками.
    items:
      directions: Я дотримувався чергування, включно з початком угору.
      balance: Напрямки звучали досить збалансовано без більшого розмаху.
      crossing: Я зберігав безперервний цикл при змінах струн.
