lessonID: swing-shuffle
lessonVersion: 1
locale: uk
title: Рівні восьмі та shuffle
summary: Розмістіть коротку ноту на третьому місці тріолі для рівного руху довго-коротко.
goal: Почути й зіграти відмінність між рівними восьмими та початковим shuffle 2:1.
body: |-
  Рівні восьмі ділять долю навпіл. Простий тріольний shuffle використовує перше й третє місця тріолі: перша нота триває два місця, друга — одне. Рахуйте раз-і-та й грайте на раз і та. Співвідношення довгої та короткої тривалостей у цьому уроці точно 2:1; на 60 BPM друга атака настає через дві третини секунди після кліку.

  Нотація показує чверть і восьму під тріольною дужкою. Довга нота займає перші два місця без нового удару посередині. Восьма з крапкою та шістнадцята дали б 3:1 — гостріший ритм, який тут не є ціллю. Метроном і далі клацає чверті, довга нота починається на кожному кліку.

  Прослухайте двотактове порівняння: такт 1 рівний, такт 2 із shuffle. Збережіть висоту, гучність і частоту кліків, щоб чітко почути місце другої атаки. Спершу промовте або простукайте ритм, потім зіграйте чисту повторювану ноту. Не підганяйте коротку ноту до наступної долі й не робіть її такою ж довгою, як першу.

  Повторюваний shuffle має вісім пар довго-коротко у двох тактах. Дайте довгій ноті свій час, потім зіграйте коротку й поверніться до наступного кліку. Мелодична фраза використовує шість таких пар: повертається до тієї самої басової ноти, а нота-відповідь змінюється. Доля 3 другого такту — чвертна тоніка, доля 4 тиха. Завчасно читайте зміни струн і залишайте лише одну потрібну висоту одночасно.

  Свінг у реальному виконанні не обмежується одним універсальним співвідношенням: розміщення залежить від темпу, стилю й фразування. Тут вивчаємо один явний початковий shuffle. Додаток оцінює ці записані висоти й атаки, а не автентичність чи виразність усіх стилів свінгу. Після трьох контрольованих спроб знову порівняйте рівний варіант і shuffle слухом, не дивлячись на ноти.
steps:
  prepare:
    title: Пригадайте сітку з трьох місць
    body: >-
      Промовте три рівні склади на клік, потім озвучуйте або простукуйте лише перший і третій. Збережіть середнє
      місце у внутрішньому рахунку. Установіть 60 BPM і послухайте перед грою.
  straight-and-shuffle: &id001
    title: Порівняйте половину долі з третім місцем
    body: >-
      Такт 1 ділить кожну долю навпіл. У такті 2 друга атака переходить із середини долі на третє місце тріолі.
      Число долі лишається на тому самому кліку; помітьте довшу першу ноту.
  shuffle-pulse: &id002
    title: Повторіть вісім довго-коротких пар
    body: >-
      Зіграйте два такти з короткою нотою на двох третинах кожної долі. Не атакуйте середнє місце. Якщо коротка
      нота запізнюється, знову промовте всі три місця й поверніться до двох атак.
  shuffle-phrase: &id003
    title: Збережіть ритм у фразі з басовим поверненням
    body: >-
      Зіграйте шість пар довго-коротко, потім чвертну тоніку на долі 3 такту 2 й чверть паузи. Зміна ноти-відповіді
      не повинна змінювати відстані shuffle. {{sequence}}.
  review:
    title: Почуйте співвідношення без картинки
    body: >-
      Повторно прослухайте рівний варіант і shuffle, потім в окремому прослуховуванні заплющте очі. Перегляньте
      другі атаки в результатах часу. Збіг із 2:1 — ціль цієї вправи, а не правило для кожного стилю.
  question:
    title: Де починається коротка нота shuffle?
    body: Відрахуйте поділ долі перед відповіддю.
activities:
  straight-and-shuffle: *id001
  shuffle-pulse: *id002
  shuffle-phrase: *id003
learningTasks:
  question:
    title: Де починається коротка нота shuffle?
    body: У цьому shuffle 2:1 з якого із трьох рівних місць тріолі починається друга нота?
    items:
      third: 'Із третього: перша нота займає перші два.'
      second: Із другого, посередині долі.
      next: Із наступної долі, після трьох повних місць.
    explanation: >-
      Коротка нота починається на 2/3 долі. Рівні восьмі розміщують її на 1/2, восьма з крапкою та шістнадцята —
      на 3/4. Це різні цілі.
  review:
    title: Перевірте свій пульс
    body: Позначте лише власні спостереження.
    items:
      compare: Я почув відмінність між рівними восьмими та shuffle.
      spacing: Я зберіг довго-короткі проміжки без зайвої середньої атаки.
      phrase: Я зберіг пульс на змінах струн і фінальну паузу.
