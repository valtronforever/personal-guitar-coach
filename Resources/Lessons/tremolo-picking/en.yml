learningTasks:
  burst-review:
    title: Review control at a chosen tempo
    body: Choose a tempo you can repeat. Play three comparable cycles, then change only the burst length or tempo
      and compare.
    items:
      alternate: I checked alternating direction and a small, comfortable movement myself.
      even: The pairs of attacks sounded even enough to repeat consistently.
      boundaries: I started and stopped at the intended boundaries and counted the rests.
      change: I changed pitch at a group boundary without losing the pulse.
      record: I noted the tempo and one specific change for the next visit.
  subdivision-check:
    title: Count a sixteenth-note burst
    body: In 4/4 with a quarter-note click, how many attacks fill one beat of continuous sixteenths?
    items:
      two: Two
      four: Four
      sixteen: Sixteen
    explanation: Four sixteenths fill a quarter-note beat; sixteen fill the whole 4/4 bar.
