lessonID: tremolo-picking
lessonVersion: 1
locale: uk
title: 'Tremolo picking: серії, відпочинок і контроль'
summary: Побудуй рівні повторні атаки з коротких змінних серій, потім поєднай їх у фразу.
goal: Зіграй контрольовані серії повторних нот із чітким початком, паузами та зміною висот у відтворюваному темпі.
body: |-
  Tremolo picking швидко повторює висоту змінними ударами вниз і вгору. Це техніка медіатора, окрема від ефекту tremolo в підсилювачі чи важеля вібрато. Швидкість — лише одна риса: початок, завершення, рівність і відпочинок між серіями роблять звук корисним у фразі. Почни з однієї зручної затиснутої ноти й чистого звуку, щоб чути кожну атаку.

  Спочатку порівняй одну ноту на клік із двома рівномірними нотами на клік. Збережи темп кліків і слухай середину проміжку. Стрілки показують задуманий змінний напрямок; це інструкції, а не розпізнані рухи руки. Рухай медіатор настільки, щоб пройти струну. Якщо рух стає вимушеним або інтервали між атаками нерівні, скороти серію й повернися до зручного темпу перед новою спробою.

  Підготовча вправа з оцінкою використовує восьмі ноти й явні паузи. Зупиняйся на записаній межі, не додаючи зайву атаку в паузу. Рахуй тихі долі й починай свідомо. Прислухайся, чи не чергується гучний удар вниз зі слабким угору; спочатку вирівняй пару, потім подовжуй серію. Програма перевіряє висоту й час у помірному темпі, а напрямок, рух і комфорт лишаються самоперевіркою.

  Швидка практика змінює поділ на чотири шістнадцяті на клік. Почни з однієї долі гри й трьох долей тиші, потім спробуй дві долі гри та дві тихі. Використай метроном і показані атаки, щоб знайти межі; не наздоганяй курсор рукою. Підвищуй темп невеликими кроками лише після кількох подібних чистих серій і залиш повільніший варіант для виправлень.

  У фінальному етюді зберігай повторювану висоту в кожній серії й змінюй затиснуту ноту на початку наступної позначеної групи. Підготуй новий лад у паузі без випадкового звуку. Порівняй коротку серію з серією на цілий такт у тому самому темпі. Корисний результат — контрольована фраза, яку можна повторити, а не одна спроба на граничній швидкості. Чітко закінчи останню серію й відрахуй решту тиші.

  Швидші приклади із шістнадцятими використовують відтворення й самопрактику замість автоматичної оцінки. Найкоротші ноти можуть бути меншими за поточну межу аналізу 0,2 секунди; додаток не має показувати ці атаки як окремо перевірені. Залиш синтезований еталон достатньо тихим, щоб чути свою гру, або зменш його, зберігши метроном. До наступного заняття запиши обраний темп і одне конкретне спостереження у власні нотатки.
steps:
  prepare:
    title: Обери невелику музичну ідею
    body: Прочитай план, обери зручний чистий звук і почни повільно.
  subdivision:
    title: Одна, потім дві атаки на клік
    body: 'Спочатку залиш 60 BPM. Такт 1 використовує чверті, такт 2 — восьмі. Почуй зміну поділу без подвоєння
      метронома. Ноти звучання: {{sequence}}. Показана аплікатура — орієнтир; звук не доводить використання струни
      чи пальця.'
  measured-bursts:
    title: 'Підготовка з оцінкою: серія та пауза'
    body: 'Зіграй одну, дві, потім чотири долі восьмих; відрахуй кожну паузу відпочинку. Порівнюй таймінг лише з
      чинним калібруванням; ручне налаштування дає приблизний результат. Ноти звучання: {{sequence}}. Показана аплікатура
      — орієнтир; звук не доводить використання струни чи пальця.'
  fast-short:
    title: 'Швидкі серії: самопрактика'
    body: 'Чотири атаки на клік. Почни з 80 BPM; зменш еталон, залиш кліки й порівняй першу та останню атаку кожної
      серії. Автоматичної оцінки швидких нот немає. Ноти звучання: {{sequence}}. Показана аплікатура — орієнтир;
      звук не доводить використання струни чи пальця.'
  fast-long:
    title: Серія на цілий такт і повний відпочинок
    body: 'Збережи висоту протягом шістнадцяти змінних атак, потім залиш цілий такт тихим. Порівняй повторюваність
      перед зміною швидкості. Ноти звучання: {{sequence}}. Показана аплікатура — орієнтир; звук не доводить використання
      струни чи пальця.'
  burst-study:
    title: Чотиритактовий етюд повторних нот
    body: 'Переходь між трьома ладами однієї струни на межах груп. Такти 1–4 розвивають короткі серії до цілого
      такту й завершуються простором. Ноти звучання: {{sequence}}. Показана аплікатура — орієнтир; звук не доводить
      використання струни чи пальця.'
  burst-review:
    title: Перевір контроль в обраному темпі
    body: Обери темп, який можеш повторити. Зіграй три подібні цикли, потім зміни лише довжину серії або темп і
      порівняй.
  subdivision-check:
    title: Порахуй серію шістнадцятих
    body: У 4/4 з кліком чвертями скільки атак заповнює одну долю суцільних шістнадцятих?
