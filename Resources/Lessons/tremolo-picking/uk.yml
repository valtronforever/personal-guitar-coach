learningTasks:
  burst-review:
    title: Перевір контроль в обраному темпі
    body: Обери темп, який можеш повторити. Зіграй три подібні цикли, потім зміни лише довжину серії або темп і
      порівняй.
    items:
      alternate: Я сам перевірив змінний напрямок і невеликий зручний рух.
      even: Пари атак звучали достатньо рівно для послідовного повторення.
      boundaries: Я починав і зупинявся на задуманих межах та рахував паузи.
      change: Я змінював висоту на межі групи без втрати пульсу.
      record: Я записав темп і одну конкретну зміну для наступного заняття.
  subdivision-check:
    title: Порахуй серію шістнадцятих
    body: У 4/4 з кліком чвертями скільки атак заповнює одну долю суцільних шістнадцятих?
    items:
      two: Дві
      four: Чотири
      sixteen: Шістнадцять
    explanation: Чотири шістнадцяті заповнюють долю-чверть; шістнадцять — цілий такт 4/4.
