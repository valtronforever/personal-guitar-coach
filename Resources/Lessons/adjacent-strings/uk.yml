lessonID: adjacent-strings
lessonVersion: 1
locale: uk
title: Перехід між сусідніми струнами
summary: Переходьте між двома сусідніми струнами, не зачіпаючи третю.
goal: Переходьте між двома сусідніми струнами, не зачіпаючи третю.
body: >-
  Почніть із відкритих третьої та другої струн. Руці з медіатором потрібно змінювати не лише напрямок удару, а й
  розташування. Використовуйте чистий звук, щоб легко помітити випадково зачеплену сусідню струну.
steps:
  find:
    title: Знайдіть струну перед ударом
    body: >-
      Легко прикладіть медіатор до струни 3 без звуку, потім так само знайдіть струну 2. Чотири рази повторіть тихий
      перехід. Один раз подивіться на позицію, а потім спробуйте на дотик.
  pair:
    title: Зіграйте пару нот
    body: >-
      При 60 BPM зіграйте струну 3 на долю 1 і струну 2 на долю 2. Перед повтором пари зробіть паузу. Не проводьте
      медіатор через обидві струни як один акордовий удар. {{positions}}
  continuous:
    title: Поєднайте чотири пари
    body: >-
      Зіграйте повний двотактовий рисунок: 3–2–3–2, потім 3–2–3–2. Між струнами трохи змінюйте розташування руки
      й не припиняйте рахунок під час переходів. {{positions}}
  review:
    title: Виділіть складний перехід
    body: >-
      Якщо відгук показує повторювану помилку, повільно відпрацюйте лише пару навколо цього переходу, а потім поверніться
      до обох тактів. Прислухайтеся до дзвеніння третьої струни й навмисно зупиняйте його. Схема показує очікувану
      аплікатуру, а не доводить, на якій струні ви грали.
activities:
  example:
    title: Приклад для вашого інструменту
    body: >-
      Очікувана послідовність: {{sequence}}. Виберіть крок, щоб побачити його позиції. У прикладі звучать синтезовані
      еталонні ноти.
learningTasks:
  review:
    title: Перевірте свою практику
    body: Позначайте лише те, що перевірили самостійно. Поверніться до непозначеного пункту на наступному занятті.
    items:
      criterion-1: Я можу знайти обидві струни перед ударом.
      criterion-2: Під час переходів на кожну долю звучить одна потрібна нота.
      criterion-3: Я слухав і приглушував небажане дзвеніння сусідніх струн.
