lessonVersion: 1
locale: uk
title: Знайди почуту ноту без табулатури
summary: Порівняй запам’ятований звук із гітарою та знайди його перед оцінюваною відповіддю.
goal: Знайди й відтвори почутий звук у тій самій октаві без показаної аплікатури.
body: |-
  Звук можна впізнати на слух ще до того, як ти назвеш ноту чи знайдеш її лад. Тут еталон грає короткий рисунок на одній висоті. Екран практики приховує очікувані позиції грифа й табулатуру. Видимим лишається пульс метронома, щоб окремо попрацювати над пошуком звуку та вчасним початком.

  Почни з прикладу A. Прослухай його повністю, не граючи поверх еталона. За бажанням тихо наспівай звук, щоб його запам’ятати; спів не є обов’язковим і в цій вправі не оцінюється та не записується. Після відтворення спробуй зручну середню струну. Порівнюй по одній чистій ноті. Визнач, чи гітара звучить нижче, вище або близько до запам’ятованого звуку, потім трохи зміни позицію й порівняй знову.

  Не перебирай лади навмання й поспіхом. Пам’ятай останнє корисне порівняння. Якщо спочатку звук був нижчим за ціль, а потім став вищим, шукай між цими позиціями. Слухай еталон ще раз, коли він зникає з пам’яті. Це фіксовані вправи, а не випадкові тести абсолютного слуху. Повторення тренує порівняння; запам’ятовування одного ладу не доводить загальної навички слухового підбору.

  Коли знайдеш можливу відповідь, почни практику. Зіграй для перевірки входу, якщо додаток попросить, прослухай новий відлік і відтвори рисунок еталона. Під час відповіді еталон не звучить. Використовуй чистий сигнал без вібрато й бендів, приглушуй інші струни. Якщо назва ноти збігається, але вона звучить в іншій октаві, результат за висотою відрізнятиметься: тут потрібна саме та сама висота звучання.

  Перейди до B, C й D, щоразу починаючи порівняння заново, а не припускаючи попередню позицію. Читай результат після спроби. За потреби відкрий ноти та порівняй їхнє звучання зі своєю відповіддю; така спроба матиме позначку гри з підказками. Пізніше спробуй знову без нот. Змінюй стрій лише між спробами: еталон транспонується й потребує нового прослуховування. Звук дозволяє перевірити висоту, але не використану струну чи палець.
