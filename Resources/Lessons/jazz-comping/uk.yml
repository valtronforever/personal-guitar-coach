lessonID: jazz-comping
lessonVersion: 1
locale: uk
title: 'Джазовий акомпанемент: поєднай компактні ii–V–I'
summary: Почуй напрямні тони, залиш простір і підтримай чіткий гармонічний маршрут.
goal: Поєднай чотири такти компактної гармонії ii–V–I зі свідомими атаками й завершеннями.
body: |-
  Comping — ритмічна й гармонічна підтримка іншої музичної лінії. Почни з малого розташування замість щільного шестиструнного захвату. Тут використовуються основний звук, терція й септима: їх досить для основного характеру акорду, і лишається місце мелодії або партнеру. Квінту пропущено свідомо. Пройди чотири такти: один мінорного ii, один домінантового V і два мажорного I.

  Послухай напрямні тони всередині форм. Мала септима ii спускається на півтон до терції V; терція ii залишається септимою V, потім спускається до терції I. Ці малі зв’язки пояснюють цілісність послідовності, навіть коли основні звуки рухаються далі. Повільно зіграй лінію напрямних тонів, потім почуй ці самі ноти всередині компактних акордів.

  Почни з однієї акордової атаки на такт і тихої останньої долі. Завершуй увесь акорд разом, не залишаючи попередній голос у новій гармонії. Практика розділеного арпеджіо перевіряє чутні складники по одному. У цій вимірюваній підготовці припиняй попередню ноту перед наступною: це не тест одночасного розпізнавання акорду чи фактичної струни.

  Модель зі зміщеною атакою інакше розміщує ту саму гармонію. Відрахуй першу порожню восьму, зіграй короткий акорд на наступній слабкій позиції та рахуй у записаних проміжках. Друга атака приходить на третю долю. Не змінюй гармонію завчасно через зміщення першої атаки. Порівняй розріджену й зміщену версії в одному темпі та обери ту, що залишає більше місця уявній мелодії.

  Для самостійного акомпанементу повторюй чотири такти зі зменшеним еталонним тоном і збереженим метрономом. Зміни лише рисунок атак, утримуючи акордовий маршрут і повну тривалість кожного такту. Наприкінці проходу послухай два півтонові рухи напрямних тонів. Простір, баланс і зв’язність перевіряй самостійно; виміряні висота й час окремих нот не доводять доречність акомпанементу або джазове відчуття.
steps:
  prepare:
    title: Обери невелику музичну ідею
    body: Прочитай план, обери зручний чистий звук і почни повільно.
  shell-route:
    title: Основний звук, терція й септима
    body: 'Центр: {{root}} major. Грай ii7–V7–Imaj7–Imaj7. Кожне компактне розташування пропускає квінту й залишає
      четверту долю тихою.'
  guide-tone-line:
    title: Простеж два внутрішні голоси
    body: Грай два розділені напрямні тони на такт. Поміть верхній півтоновий спуск до V і нижній до I; у вимірюваній
      практиці припиняй кожну ноту перед наступною.
  separate-shell-tones:
    title: Перевір кожний складник окремо
    body: Грай основний звук, терцію й септиму, потім одну долю паузи в кожному такті. Це чиста одноголосна підготовка,
      а не автоматичний тест акордів.
  offbeat-comping:
    title: Дві атаки з простором між ними
    body: Атакуй на слабкій позиції після долі 1 та на долі 3. Збережи той самий маршрут ii–V–I й тиху останню долю.
  comping-review:
    title: Підтримай уявну мелодію
    body: Порівняй розріджену й зміщену моделі, потім створи малий ритмічний варіант без зміни гармонії.
