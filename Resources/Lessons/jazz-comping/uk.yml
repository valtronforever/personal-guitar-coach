    items:
      route: Я зберіг один такт ii, один V і два I.
      guides: Я почув два півтонові зв’язки напрямних тонів.
      space: Я залишив заплановані проміжки замість заповнення кожної долі.
      release: Кожний акорд завершувався перед наступною гармонією.
      choice: Мій варіант змінив розташування атак зі збереженням послідовності.
