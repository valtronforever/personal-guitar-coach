learningTasks:
  comping-review:
    title: Support an imagined melody
    body: Compare the sparse and offbeat models, then create one small rhythmic variation without changing harmony.
    items:
      route: I retained one bar of ii, one of V and two of I.
      guides: I heard the two semitone guide-tone connections.
      space: I left the planned spaces instead of filling every beat.
      release: Each chord ended before the following harmony.
      choice: My variation changed attack placement while preserving the progression.
