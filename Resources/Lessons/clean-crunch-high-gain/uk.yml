lessonID: clean-crunch-high-gain
lessonVersion: 1
locale: uk
title: Порівняй clean, crunch і high gain
summary: Почуй, як збільшення перевантаження змінює атаки, затухання й зайвий шум.
goal: Обери корисну кількість перевантаження, порівнявши ту саму фразу зі схожою гучністю прослуховування.
body: |-
  Clean, crunch і high gain описують корисні ділянки звуку, а не універсальні положення ручки. Clean зберігає відносно чітку атаку; crunch додає чутне перевантаження; high gain дає щільнішу спотворену фактуру. Межа залежить від виходу звукознімача, сили гри та процесора. Назва пресета не доводить, який звук потрапляє в навушники або на вхід додатка.

  Використовуй одну модель підсилювача або один канал, якщо його діапазон gain дозволяє всі три порівняння. Залиш незмінними кабінет, ефекти, звукознімач і фразу. Почни чисто, потім додавай перевантаження невеликими кроками. Компенсуй гучність виходом процесора або прослуховуванням, а не гучністю гітари, яку перевіряєш. Стеж, щоб гучніший пресет не перевантажував інтерфейс і не змушував грати тихіше.

  На кожному рівні gain зіграй фразу м’яко, потім упевненіше, але зі зручною атакою. Слухай, чи другий прохід стає гучнішим, більш перевантаженим або обома водночас. Дай довгій ноті затухнути й відрахуй тихі долі після її зупинки. High gain може робити шум струн і неповне приглушення чутнішими; довга нота сама по собі не доводить кращий контроль руки на грифі.

  Обери найменшу кількість перевантаження, що підтримує задум партії, потім перевір її в короткому ритмічному уривку та довгій фразі. Дисторшн може бути корисним для музики й водночас непридатним для автоматичної оцінки висоти. Для вимірюваних вправ залиш чистий шлях до аналізатора, а оброблений моніторинг використовуй для цього слухового завдання. Порівняння є самоспостереженням: оцінка якості тембру не створюється.
steps:
  prepare:
    title: Визнач тракт і початковий звук
    body: Використовуй наявне обладнання з комфортною гучністю. Додаток дає пояснення, часові орієнтири й самоперевірку;
      він не запускає ефекти цього уроку.
  control:
    title: Використовуй ту саму фразу для порівняння
    body: 'Вивчи цю суху двотактову фразу, потім повтори її через власний звуковий тракт зі зміною одного параметра.
      Зберігай зіставні темп, артикуляцію й гучність прослуховування. Еталон додатка не містить симуляції підсилювача
      чи ефектів. Ноти звучання: {{sequence}}. Показана аплікатура — орієнтир; звук не доводить використання струни
      чи пальця.'
  gain-comparison:
    title: Порівняй атаку, затухання й тишу
    body: Зроби три проходи з вирівняною гучністю прослуховування. Назви одну перевагу й один недолік кожної ділянки
      gain для своєї партії.
  route-quiz:
    title: Який вхід слід оцінювати?
    body: Тобі подобається моніторинг high gain, але ти хочеш перевіряти окремі ноти в додатку. Яка схема відповідає
      поточному оцінюванню?
activities:
  control:
    title: Використовуй ту саму фразу для порівняння
    body: 'Вивчи цю суху двотактову фразу, потім повтори її через власний звуковий тракт зі зміною одного параметра.
      Зберігай зіставні темп, артикуляцію й гучність прослуховування. Еталон додатка не містить симуляції підсилювача
      чи ефектів. Ноти звучання: {{sequence}}. Показана аплікатура — орієнтир; звук не доводить використання струни
      чи пальця.'
learningTasks:
  gain-comparison:
    title: Порівняй атаку, затухання й тишу
    body: Зроби три проходи з вирівняною гучністю прослуховування. Назви одну перевагу й один недолік кожної ділянки
      gain для своєї партії.
    items:
      levels: Я порівняв clean, crunch і high gain, не обираючи просто найгучніший.
      attack: Я порівняв м’які й упевненіші атаки в кожному налаштуванні.
      silence: Я слухав і затухання ноти, і заплановану тишу.
      choice: Я обрав кількість gain для визначеної музичної мети.
  route-quiz:
    title: Який вхід слід оцінювати?
    body: Тобі подобається моніторинг high gain, але ти хочеш перевіряти окремі ноти в додатку. Яка схема відповідає
      поточному оцінюванню?
    items:
      clean: Подай чисту гітару на обраний вхід, залишивши дисторшн в окремому шляху прослуховування.
      loud: Підніми дисторшн, доки шкала входу завжди повна.
      name: Будь-який вхід підходить, якщо пресет називається Lead.
    explanation: Оцінка очікує чисті послідовні ноти. Оброблений моніторинг може співіснувати з чистим входом, якщо
      це підтримує маршрутизація.
