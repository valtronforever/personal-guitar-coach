learningTasks:
  gain-comparison:
    title: Compare attack, tail and silence
    body: Make three passes at matched listening levels. Name one benefit and one cost of each gain region for your
      part.
    items:
      levels: I compared clean, crunch and high gain without simply choosing the loudest.
      attack: I compared soft and firmer attacks within every setting.
      silence: I listened to both the note tail and the intended silence.
      choice: I chose a gain amount for a stated musical purpose.
  route-quiz:
    title: Which input should be graded?
    body: You enjoy high-gain monitoring but want the app to check individual notes. Which setup matches the current
      assessment contract?
    items:
      clean: Send clean guitar to the selected input and keep distortion on a separate listening path.
      loud: Raise distortion until the input meter is always full.
      name: Any input is valid if the preset is named Lead.
    explanation: The score expects clean sequential notes. A processed listening path can coexist with clean input
      when your routing supports it.
