lessonID: tune-six-strings
lessonVersion: 1
locale: uk
title: Налаштування гітари тюнером
summary: Налаштуйте всі шість відкритих струн за профілем, вибраним у налаштуваннях.
goal: Налаштуйте всі шість відкритих струн за профілем, вибраним у налаштуваннях.
body: >-
  Вибір профілю строю не переналаштовує інструмент. Тюнер порівнює зіграний звук із ціллю для цієї струни. Приглушіть
  інші струни й дайте атаці стабілізуватися перед оцінкою показника.
steps:
  profile:
    title: Оберіть потрібний стрій
    body: >-
      Відкрийте налаштування інструменту та оберіть потрібний стрій. Прочитайте цілі відкритих струн у порядку 6
      → 1. Не користуйтеся завченими цілями E Standard, якщо гітара фізично налаштована в C Standard чи drop.
  one-string:
    title: Налаштовуйте по одній струні
    body: >-
      Відкрийте тюнер і спочатку вручну оберіть струну 6. Зачепіть її один раз, приглушіть інші й спостерігайте
      стабільну частину показника. Регулюйте відповідний кілок малими кроками, знову граючи між змінами.
  six-strings:
    title: Пройдіть усі шість струн
    body: >-
      Повторіть від струни 6 до струни 1, підтверджуючи і ноту, і октаву, а не лише літеру. Якщо показник нестабільний
      або ноти немає, припиніть крутити кілок і перевірте ізоляцію струни та вхідний сигнал.
  recheck:
    title: Зробіть другий прохід
    body: >-
      Після першого проходу перевірте кожну струну ще раз, особливо з плаваючим бриджем, де одна зміна може вплинути
      на інші. Позначайте завершення лише після перевірки фізичного інструменту. Чекліст — ваше підтвердження, а
      не автоматичний сертифікат строю.
activities: {}
learningTasks:
  review:
    title: Перевірте свою практику
    body: Позначайте лише те, що перевірили самостійно. Поверніться до непозначеного пункту на наступному занятті.
    items:
      criterion-1: Вибраний профіль відповідає строю, у якому я планую грати.
      criterion-2: Я перевірив ноту й октаву кожної струни.
      criterion-3: Після налаштування всіх шести струн я зробив другий прохід.
