    items:
      roles: I checked the intended pick and finger roles myself.
      balance: Lower and upper attacks had a useful, controlled balance.
      short: Short notes ended clearly without unwanted open strings.
      scratch: I distinguished a scratch from a pitched note and a rest.
      ending: The variation kept its bar boundary and the final silence.
