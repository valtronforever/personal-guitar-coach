lessonID: country-chicken-picking
lessonVersion: 1
locale: uk
title: 'Кантрі та chicken picking: медіатор, пальці й короткі ноти'
summary: Протистав нижню ноту медіатором верхнім відповідям пальцями й контрольованим приглушеним ударам.
goal: Зіграй короткий етюд hybrid picking із чіткими акцентами, короткими закінченнями та свідомим завершенням.
body: |-
  Цей вступ поєднує нижній голос медіатором із верхніми нотами вільним пальцем. Контраст може оживити коротку фразу без дуже швидкого пасажу. Стрілки медіатора й позначення m/a показують задумані ролі руки звуковидобування; вони не доводять, який палець створив звук. Почни зі зручного чистого звуку, щоб легко розрізняти атаку, висоту й закінчення кожної ноти.

  Повільно вивчи обмін медіатора й пальця. Дай нижній ноті її місце, відпусти її перед верхньою відповіддю та збережи рівний поділ. Перша фактура навмисно послідовна, а не утриманий бас під окремою мелодією. Зістав корисний баланс двох атак замість максимальної гучності ноти пальцем. Для потрібного контрасту достатньо невеликого контрольованого звуковидобування.

  Вправа коротких нот розділяє кожну верхню висоту рівною тихою позицією. Зупиняй звук рукою на грифі без дзвону іншої струни. Слухай чітке закінчення так само, як атаку. Якщо верхня нота завищена через надмірне відтягування струни вбік, зменш рух і порівняй її з тюнером або звичайною еталонною нотою. Тут контроль тембру й висоти важливіший за перебільшений різкий звук.

  Приглушений удар по нижчій струні може відповідати ноті з висотою на верхній, але такий удар не є пропущеною нотою. Хрестики вказують струну, яку слід приглушити й озвучити без визначеної висоти. Порівняй рисунок приглушених відповідей із повністю висотним обміном та справжньою паузою. Збережи ритмічні місця верхніх нот, щоб оцінювати лише зміну типу нижньої атаки.

  Чотиритактовий етюд проходить два висотні обміни, такт приглушених відповідей і коротке тонічне завершення. Нехай акценти прояснюють фразу без зміни темпу. Коли модель зручна, заміни одну верхню відповідь сусідньою нотою того самого набору й збережи час завершення. Тут діє самопрактика: синтезовані тони й шум показують час, а вибір пальця, артикуляція, баланс і стильовий характер не оцінюються автоматично.
steps:
  prepare:
    title: Обери невелику музичну ідею
    body: Прочитай план, обери зручний чистий звук і почни повільно.
  pick-finger-exchange:
    title: Нижній голос медіатором, відповідь пальцем
    body: 'Центр: {{root}} major. Нижні ноти граються медіатором; m/a позначають верхні відповіді. Відпускай кожну
      ноту перед наступною.'
  short-upper-notes:
    title: Коротка висота, рівна тиша
    body: Кожна верхня нота займає шістнадцяту з наступною шістнадцятою паузою. Зроби закінчення таким же свідомим,
      як щипок.
  scratch-response:
    title: Приглушений удар і відповідь із висотою
    body: Вдар по приглушеній третій струні на кожному хрестику, потім озвуч верхню відповідь пальцем. Порівняй
      із заміною хрестика справжньою паузою.
  country-study:
    title: Чотири такти й чітке завершення
    body: Перші два такти обмінюють ноти медіатором і пальцями; такт 3 додає хрестики; такт 4 повертається до тоніки
      й залишає останню долю тихою.
  country-review:
    title: Порівняй артикуляцію без поспіху
    body: Зіграй етюд двічі й порівняй одну верхню відповідь із варіантом сусідньої ноти. Збережи ритм та останню
      паузу.
