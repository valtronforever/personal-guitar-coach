    items:
      roles: Я сам перевірив задумані ролі медіатора й пальців.
      balance: Нижні й верхні атаки мали корисний контрольований баланс.
      short: Короткі ноти завершувалися чітко без зайвих відкритих струн.
      scratch: Я розрізняв приглушений удар, ноту з висотою та паузу.
      ending: Варіант зберіг межу такту й завершальну тишу.
