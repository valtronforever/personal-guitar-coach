lessonID: minor-barre-chords
lessonVersion: 1
locale: uk
title: 'Мінорне повне баре: змініть терцію'
summary: Порівняйте мажорні й мінорні форми з баре, а потім перенесіть мінорну форму, зберігаючи її інтервали.
goal: >-
  Змінювати лише відповідну терцію під час порівняння мажору й мінору та перевіряти перенесену мінорну форму по
  струнах.
body: |-
  Мінорний тризвук містить основний тон, малу терцію та чисту квінту. Порівняно з мажорним тризвуком від того самого основного тону його терція нижча на півтон. Акорд на шести струнах може повторювати ці звуки; йому не потрібні шість різних висот. У двох формах цього уроку змінювана терція припадає на одну струну. Показані мажорні форми слугують для порівняння, а практика окремих нот використовує мінорні форми.

  Порівняйте мажорну форму із шостою басовою струною та її мінорну пару. Струна 3 переходить на один лад нижче; решта п’ять висот залишаються. У вихідній аплікатурі піднімання середнього пальця відкриває ноту під баре вказівного. Переконайтеся, що вона звучить: легко почути глуху терцію й помилково посилити тиск усією рукою. Спочатку перевірте цю струну, потім бас і верхні ноти. Між спробами ненадовго забирайте руку з грифа.

  Тепер порівняйте форми з основним тоном на п’ятій струні. Тут терція розташована на струні 2, і саме вона переходить на один лад нижче. Інші ноти, включно з основним тоном на струні 5, залишаються; струна 6 мовчить. Переставте пальці відповідно до нової форми замість перетягування пальця мажорного акорду через сусідню струну. Тихо послухайте повний акорд поза оцінюваною практикою, а під час ритмічної перевірки окремих нот зупиняйте попередній звук.

  На завершення пересуньте мінорну форму із шостою басовою струною на два лади вище. Перенесення всіх нот змінює основний тон; зниження лише терції змінює ладовий характер акорду. Це різні операції. Називайте показаний основний тон до кожної спроби й порівнюйте інтервали замість запам’ятовування однієї назви акорду. Стандартні строї транспонують форму, а Drop може змінити позицію шостої струни. Користуйтеся адаптованими позначками: пряме баре вихідної форми не гарантує ті самі пальці в кожному строї.

  Повільно чергуйте мажорний зразок і його мінорну пару без таймера. Слухайте зміну середнього звуку при незмінному основному тоні. Додаток може перевірити окремі ноти та їхній час; чистота повного акорду, економність рухів і використання баре залишаються предметом власного спостереження.
steps:
  prepare:
    title: Відокремте основний тон від характеру акорду
    body: >-
      Відкрийте кожний мажорний зразок і мінорну пару. Спочатку знайдіть спільний основний тон, потім струну, що
      змінюється. Використовуйте чистий звук і короткі розслаблені спроби.
  review:
    title: Почуйте зміну терції
    body: >-
      Поза оцінюваною практикою чергуйте мажорний зразок і мінорну пару від того самого основного тону. Потім порівняйте
      дві мінорні позиції. Поясніть, яка дія змінила характер акорду, а яка — основний тон.
  major-sixth-reference-shape:
    title: 'Зразок: мажор із шостою басовою струною'
    body: >-
      Збережіть цю форму для порівняння. Основний тон — {{root}}. Терція розташована на струні 3; інші позиції залишаться
      незмінними в наступній мінорній формі. {{positions}}.
  minor-sixth-shape:
    title: Опустіть струну 3 на один лад
    body: >-
      Основний тон — {{root}}. Порівняно з попередньою мажорною формою опустіть лише струну 3 на один лад. У вихідній
      стандартній аплікатурі цю ноту тепер затискає вказівний. Перевірте її перед іншими струнами: {{positions}}.
  minor-sixth-notes:
    title: '{{root}} мінорний — перевірте кожну струну'
    body: >-
      Збережіть показану форму й грайте її струни від низької до високої по одній на клік на 50 BPM. Зупиняйте попередній
      звук перед наступною атакою. Потім відрахуйте записані тихі долі до завершення двох тактів. Бал перевіряє
      окремі висоти й час, а не повне баре чи одночасний акорд. {{positions}}.
  major-fifth-reference-shape:
    title: 'Зразок: мажор із п’ятою басовою струною'
    body: >-
      Основний тон — {{root}} на струні 5. Струна 6 мовчить. Знайдіть терцію на струні 2 й порівняйте її лад із
      наступною мінорною формою. {{positions}}.
  minor-fifth-shape:
    title: Опустіть струну 2 на один лад
    body: >-
      Основний тон — {{root}}. Опустіть терцію на струні 2 на один лад, зберігши решту висот. Зручно перебудуйте
      пальці, залиште струну 6 тихою й перевірте {{positions}}.
  minor-fifth-notes:
    title: '{{root}} мінорний — перевірте кожну струну'
    body: >-
      Збережіть показану форму й грайте її струни від низької до високої по одній на клік на 50 BPM. Зупиняйте попередній
      звук перед наступною атакою. Потім відрахуйте записані тихі долі до завершення двох тактів. Бал перевіряє
      окремі висоти й час, а не повне баре чи одночасний акорд. {{positions}}.
  minor-sixth-moved-shape:
    title: Пересуньте повну мінорну форму
    body: >-
      Новий основний тон — {{root}}. Кожна нота розташована на два лади вище, ніж у першій мінорній формі із шостою
      басовою струною. Основний тон змінився, мінорний характер залишився. Дотримуйтеся {{positions}}, потім порівняйте
      терцію й верхні ноти з початковою мінорною формою.
  minor-sixth-moved-notes:
    title: '{{root}} мінорний — перевірте кожну струну'
    body: >-
      Збережіть показану форму й грайте її струни від низької до високої по одній на клік на 50 BPM. Зупиняйте попередній
      звук перед наступною атакою. Потім відрахуйте записані тихі долі до завершення двох тактів. Бал перевіряє
      окремі висоти й час, а не повне баре чи одночасний акорд. {{positions}}.
  question:
    title: Зміна основного тону чи характеру акорду?
    body: Порівняйте ролі звуків акорду перед відповіддю.
