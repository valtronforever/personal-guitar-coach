learningTasks:
  question:
    title: Зміна основного тону чи характеру акорду?
    body: Яка дія перетворює мажорний акорд на мінорний від того самого основного тону?
    items:
      third: Опустити велику терцію на півтон, зберігши основний тон і квінту.
      whole: Пересунути всі ноти на два лади вище.
      bass: Опустити лише основний тон на півтон.
    explanation: >-
      Велика терція розташована на чотири півтони вище від основного тону, мала — на три. Зниження цього звуку на
      півтон змінює мажор на мінор від того самого основного тону. Перенесення повної форми натомість зберігає характер
      акорду й змінює його основний тон.
  review:
    title: Самостійно перевірте повний акорд
    body: Позначте лише те, що справді перевірили.
    items:
      sixth: Я знайшов і почув змінювану терцію на струні 3 у парі із шостою басовою струною.
      fifth: Я знайшов і почув змінювану терцію на струні 2 у парі з п’ятою басовою струною.
      move: Я розрізнив перенесення всієї мінорної форми та зміну її терції.
      relax: Я розслабляв руку між спробами й перевірив повні акорди поза оцінюваною практикою.
