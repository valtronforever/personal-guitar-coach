lessonID: personal-practice-plan
lessonVersion: 1
locale: uk
title: Побудуй цикл занять на реальних спостереженнях
summary: Збалансуй техніку, ритм, слух, репертуар і свідоме повторення.
goal: Склади й виконай повторюваний цикл занять з одним вимірюваним пріоритетом і запланованим порівнянням.
body: |-
  Особистий план починається з музичної мети й невеликої кількості доказів. Переглянь недавні результати практики та один збережений виступ перед вибором нового матеріалу. Відрізни надійні спостереження висоти або часу від самостійних оцінок техніки. Перервана спроба чи недостатній сигнал є проблемою умов, а не доказом поганої музикальності. Обери один пріоритет, важливий для бажаної музики: вступ після пауз або поєднання складної частини без втрати пульсу.

  Візьми короткий збалансований цикл як початковий експеримент. Наприклад, виділи п’ять хвилин контрольованій техніці, п’ять ритму, п’ять слуху, вісім репертуарному уривку й дві підсумку. Тривалості можна змінювати; збережи ролі блоків, не перетворюючи числа на правило. До початку запиши обраний урок або уривок кожного блоку, щоб пошук не поглинув заняття. Почни з темпу, де можеш чути й пояснювати помилки.

  Зразкові активності техніки й ритму є короткими перевірками, а не обов’язковими вправами назавжди. За виміряними результатами виріши, чи корисна обрана складність. Порівняння часу потребує зазначених додатком умов калібрування; ручне значення лишається наближенням. За сталої помилки зменш темп або виділи перехід і повтори з тим самим інструментом. За невалідного запису чи результату віднови умови перед музичними висновками.

  Збережи незалежність слухової роботи від зорового запам’ятовування. Почуй коротку приховану відповідь, наспівай її напрямок і знайди на гітарі. Відкрий цілі лише для свідомого порівняння. Після зосередженого завдання повернись до музики: репертуарна модель тут надає цілу чотиритактову фразу для запису без оцінки, але власний підготовлений твір може бути доречнішим. Поліпшення вправ без повернення до музики ще не перевіряє перенесення навички.

  Наприкінці запиши, що змінилося, що лишилось складним і що порівняєш наступного разу. Збережи одну сталу вправу й темп протягом кількох занять, змінюючи решту матеріалу. Під час наступного перегляду послухай нове виконання перед підвищенням складності. Додаток зберігає прогрес уроків і виміряні результати; розклад, письмові пріоритети та їх тлумачення лишаються твоїм рішенням. Позначки самопрактики підтверджують заявлені дії, а не автоматично засвідчену майстерність.
steps:
  prepare:
    title: Обери невелику музичну ідею
    body: Прочитай план, обери зручний чистий звук і почни повільно.
  technique-check:
    title: Одна контрольована технічна фраза
    body: Зіграй короткий хроматичний підйом і повернення рівними розділеними атаками. Обери повільніший темп, якщо
      потребують роботи безперервність або чисті зміни.
  rhythm-check:
    title: Повертайся після різних проміжків
    body: Збережи одну висоту й порівняй місця атак після коротких і довгих пауз. Порожня перша доля такту 2 все
      одно належить рахунку.
  ear-check:
    title: Нова відповідь на слух
    body: Дослухай двотактовий еталон перед пошуком на інструменті. Спершу спробуй приховану відповідь, а відкриття
      використай для порівняння з підказкою.
  musical-transfer:
    title: Повернись до цілої музичної фрази
    body: Запиши цю чотиритактову фразу або підготовлену варіацію тієї самої тривалості. Послухай обраний пріоритет
      у контексті; еталонним записом лишається надана фраза.
  review:
    title: Запиши наступне рішення для практики
    body: Для розкладу й спостережень використай власні нотатки; познач лише справді виконані дії.
