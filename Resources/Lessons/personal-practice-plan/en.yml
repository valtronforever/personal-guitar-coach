learningTasks:
  review:
    title: Write the next practice decision
    body: Use your own notes for the schedule and observation; check only actions you actually completed.
    items:
      priority: I selected one priority using a valid result or a specific audible observation.
      balance: My cycle included technique, rhythm, listening, repertoire and review.
      conditions: I kept the comparison tempo and instrument conditions explicit.
      transfer: I checked the chosen skill in a complete musical phrase.
      next: I wrote the next comparison and what evidence will guide a change.
