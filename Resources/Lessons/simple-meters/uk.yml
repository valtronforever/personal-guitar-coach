lessonID: simple-meters
lessonVersion: 1
locale: uk
title: Розміри 4/4 та 3/4
summary: Групуйте той самий пульс чвертями по чотири або три долі.
goal: Знаходити першу долю в обох простих розмірах.
body: |-
  У 4/4 такт містить чотири чвертні долі, у 3/4 — три. Нижня 4 вказує, що одиниця долі — чверть. Зміна розміру не змінює BPM автоматично: на 60 BPM чверть так само триває секунду. Змінюється місце початку наступного такту.

  Рахуйте 1–2–3–4 у першому прикладі й 1–2–3 у другому. Метроном виділяє початок кожного такту; знаки > підсилюють ці атаки в прикладі. Не додавайте уявну четверту долю до 3/4. Цей урок ще не вводить 6/8 з іншим групуванням.
steps:
  four:
    title: Відлічіть чотири перед повтором
    body: >-
      Прослухайте й зіграйте приклад 4/4. Рахуйте «РАЗ два три чотири, РАЗ два три чотири». Чергуйте два показані
      лади, зберігаючи рівність із кліком. {{positions}}.
  three:
    title: Почніть знову після трьох
    body: >-
      Оберіть вправу 3/4. Її відлік має три кліки. Рахуйте «РАЗ два три, РАЗ два три»; новий такт починається одразу
      після 3. Дві сусідні відкриті ноти через тактову риску потребують окремих атак.
  compare:
    title: Порівняйте тривалість, а не швидкість
    body: >-
      На 60 BPM два такти 4/4 тривають вісім секунд, а два такти 3/4 — шість, без відліку. Збережіть однакову швидкість
      кліків і відчуйте, що в 3/4 доля 1 повертається раніше.
  practice:
    title: Залишайтеся в обраному розмірі
    body: >-
      Повторіть тричі у 3/4, потім поверніться до 4/4 на тому самому BPM. Перед початком прочитайте розмір, щоб
      відлік підготував потрібне групування.
  review:
    title: Перевірте перед прискоренням
    body: >-
      Якщо в 3/4 з’являється зайва доля, зупиніться й промовте два такти. Потім грайте лише першу ноту кожного такту,
      перш ніж повернути всі ноти.
activities:
  four:
    title: Групи по чотири від {{first}}
    body: Два такти, вісім атак чвертями. {{sequence}}.
  three:
    title: Групи по три від {{first}}
    body: Два такти, шість атак чвертями. {{sequence}}.
learningTasks:
  review:
    title: Перевірте свою практику
    body: Позначайте лише перевірене; самооцінка не змінює аудіооцінку.
    items:
      count: Я починаю новий такт 3/4 після трьох долей, а 4/4 — після чотирьох.
      sound: Кожна записана нота має свою атаку, зокрема повторені висоти.
      repeat: Я можу змінити приклад, не змінюючи BPM.
