learningTasks:
  scale-question:
    title: Будова гами
    body: Який набір ступенів визначає мінорну пентатоніку?
    items:
      minor: 1–♭3–4–5–♭7
      major: 1–2–3–5–6
      scale: 1–2–♭3–4–5–♭6–♭7
    explanation: Мінорна пентатоніка пропускає 2 й понижену 6 натурального мінору. П’ять решти ступенів повторюються
      в октавах.
  practice-review:
    title: Перевірте повну спробу
    body: Позначте лише те, що перевірили під час гри та слухання.
    items:
      tonic: Я знаходжу всі три тоніки й відрізняю верхню малу терцію.
      clean: На кожній зміні звучала лише потрібна струна.
      phrase: Я склав коротку фразу з поверненням до тоніки й паузою.
