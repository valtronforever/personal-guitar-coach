lessonID: a-minor-pentatonic
lessonVersion: 3
locale: uk
title: Мінорна пентатоніка
summary: Вивчіть п’ятизвуковий малюнок і спокійні переходи між струнами.
goal: Вивчіть п’ятизвуковий малюнок та контрольовані переходи між струнами.
body: |-
  Мінорна пентатоніка використовує п’ять ступенів: 1, понижену 3, 4, 5 й понижену 7. У півтонах над тонікою це 0, 3, 5, 7 і 10. Вона пропускає другий і шостий ступені натурального мінору, тому не має сусіднього півтонового кроку. П’ять різних класів висоти не означають лише п’ять нот у багатооктавній аплікатурі.

  У цьому боксі по дві ноти на струну. Повний підйом має дванадцять атак від низької тоніки до малої терції над другою октавою. Отже, найвища нота не є тонікою. Перед грою знайдіть тоніки всередині боксу: нижня, середня й верхня — корисніші точки завершення, ніж просто останній лад.

  Грайте чверті на 50 BPM. Такти 1–3 вгору, 4–6 вниз без повтору вершини, з фінальною чвертю паузи. Зупиняйте попередню струну під час переходу. Сприймайте кожен чотиринотний такт як читабельний фрагмент, потім з’єднуйте сусідні такти без зайвої пробної ноти на межі.

  Після записаної вправи складіть коротку фразу з перших п’яти ступенів і закінчіть на 1. Залиште долю тиші й дайте відповідь іншим порядком. Це завдання зі створення фрази, а не нова автоматична оцінка імпровізації. Доступна ділянка змінює аплікатуру зі збереженням точної висоти/октави; Standard-стрій транспонує тоніку й увесь малюнок разом. Перевірте аплікатуру самостійно, а не за оцінкою висоти.
steps:
  low-strings:
    title: Почніть малюнок
    body: |-
      Такт 1: {{positions}}.

      Перша нота — 1. Почуйте стрибок на три півтони до пониженої 3 перед переходом до 4 й 5.
  middle-strings:
    title: Продовжуйте через струни
    body: |-
      Такт 2: {{positions}}.

      У цій групі є понижена 7 й наступна тоніка. Запам’ятайте тоніку як ціль фрази.
  high-strings:
    title: Дійдіть до вершини
    body: |-
      Такт 3: {{positions}}.

      Останні дві ноти підйому — верхня тоніка й мала терція над нею. Високе завершення не обов’язково є тонічним.
  return-high:
    title: Розверніться
    body: 'Такт 4 спускається без повтору найвищої ноти: {{positions}}.'
  return-home:
    title: Поверніться й залиште паузу
    body: |-
      Такти 5–6 повертаються до першої ноти, потім іде пауза на чверть: {{positions}}.

      Заглушіть на останній долі такту 6. В окремій короткій фразі використайте 1–понижену 3–4–1 і долю тиші після неї.
  scale-question:
    title: Перевірте будову
    body: Дайте відповідь за інтервальною будовою, а не поточними назвами нот.
  practice-review:
    title: Перетворіть малюнок на фразу
    body: >-
      Після повної записаної вправи оберіть коротку фразу й свідомо закінчіть на тоніці. Окремо перевірте музичний
      результат і вибрану аплікатуру.
