      Sequence: {{sequence}}.
learningTasks:
  scale-question:
    title: Scale structure
    body: Which degree set defines minor pentatonic?
    items:
      minor: 1–♭3–4–5–♭7
      major: 1–2–3–5–6
      scale: 1–2–♭3–4–5–♭6–♭7
    explanation: Minor pentatonic omits 2 and flat 6 from natural minor. The five remaining degrees repeat through
      the octaves.
  practice-review:
    title: Review one complete attempt
    body: Mark only what you checked while playing and listening.
    items:
      tonic: I can find all three tonic occurrences and distinguish the top minor third.
      clean: I kept only the intended string sounding at each change.
      phrase: I made a short phrase that returned to the tonic and left space.
