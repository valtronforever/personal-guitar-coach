lessonID: a-minor-pentatonic
lessonVersion: 3
locale: en
title: Minor pentatonic
summary: Explore the five-note pattern with deliberate string changes.
goal: Learn the five-note pattern and controlled string changes.
body: |-
  Minor pentatonic uses five degrees: 1, flat 3, 4, 5 and flat 7. In semitones above the tonic these are 0, 3, 5, 7 and 10. It leaves out the natural minor scale’s second and sixth, so it contains no neighboring semitone step. Five distinct pitch classes does not mean only five notes in a multi-octave fingering.

  This box has two notes per string. The complete ascent contains twelve attacks from the low tonic to a minor third above the second octave. Therefore the highest note is not the tonic. Locate the tonic occurrences inside the box before playing: the bottom, middle and upper tonic are more useful landing points than simply stopping at the last fret.

  Use quarters at 50 BPM. Bars 1–3 ascend, bars 4–6 descend without repeating the top, with a final quarter rest. Stop the previous string when changing strings. Treat each four-note bar as a readable fragment, then join adjacent bars without adding an extra test note at their boundary.

  After the written exercise, make a short phrase from the first five degrees and end on 1. Leave a beat of silence and answer it with a different order. This is a phrase-making task, not a new automatic improvisation grade. An available region changes the fingering while preserving exact pitch/octave; a Standard tuning change transposes the tonic and complete pattern together. Verify the chosen fingering yourself rather than inferring it from a pitch score.
steps:
  low-strings:
    title: Begin the pattern
    body: |-
      Bar 1: {{positions}}.

      The first note is 1. Hear the three-semitone jump to flat 3 before continuing to 4 and 5.
  middle-strings:
    title: Continue across the strings
    body: |-
      Bar 2: {{positions}}.

      This group includes flat 7 and the next tonic. Mark the tonic mentally as a phrase destination.
  high-strings:
    title: Reach the top
    body: |-
      Bar 3: {{positions}}.

      The final two ascending notes are the upper tonic and its minor third. A high ending is not automatically a tonic ending.
  return-high:
    title: Turn around
    body: 'Bar 4 descends without repeating the highest note: {{positions}}.'
  return-home:
    title: Return and leave space
    body: |-
      Bars 5–6 return to the first note, followed by a quarter rest: {{positions}}.

      Mute on the last beat of bar 6. For a separate short phrase, use 1–flat 3–4–1 with one quiet beat after it.
  scale-question:
    title: Check the structure
    body: Answer from the interval pattern, not the current note names.
  practice-review:
    title: Turn the pattern into a phrase
    body: >-
      After the complete written exercise, choose a short phrase and finish deliberately on the tonic. Check the
      musical result and your chosen fingering separately.
