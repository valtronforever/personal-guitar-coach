lessonID: transcribe-short-melody
lessonVersion: 1
locale: uk
title: Підбери коротку мелодію на слух
summary: Поєднай порівняння висот, напрямок інтервалів і ритм, щоб підібрати фразу без готової табулатури.
goal: Відтвори коротку почуту мелодію в початковому порядку, регістрі та ритмі.
body: |-
  Мелодія поєднує рух між висотами з ритмом. Спроба одночасно запам’ятати кожну деталь часто призводить до здогадок. У цьому уроці короткі оригінальні фрази залишаються без видимого нотного запису, доки ти сам не відкриєш підказку. Розділи роботу на слухання, пошук опори, визначення напрямків руху, запам’ятовування ритму та гру повної відповіді.

  Прослухай приклад A, не торкаючись гітари. Запам’ятай загальну форму: фраза відходить і повертається, продовжує рух чи повторює висоту? Наспівай або опиши її для себе. Потім прослухай знову, зосередившись на першій ноті. Знайди цю опору на інструменті перед пошуком решти. Збережи октаву: фраза в іншій октаві може повторювати контур, але не відповідатиме абсолютним цілям цієї вправи.

  Наступний звук шукай порівнянням з опорою. Після двох-трьох нот зіграй невелику групу та порівняй її з новим прослуховуванням. Не додавай швидкості, доки порядок не стане впевненим. Якщо сумніваєшся між сусідніми звуками, окремо уяви їхнє відношення й використай спосіб порівняння інтервалів. Обирай зручну аплікатуру, але пам’ятай: додаток вимірює ноти звучання, а не доводить використання певної струни чи пальця.

  Далі пригадай атаки й проміжки відносно метронома. Окремо простукай ритм, якщо висоти відволікають. Можеш записати власні ноти чи табулатуру поза додатком як допомогу для підбору, а після спроби порівняти запис. Ця вправа не містить редактора нот; оцінюваною відповіддю є твоя гра на гітарі. Починай, коли можеш утримати коротку фразу в пам’яті протягом відліку.

  Наступні приклади подовжують фразу або поєднують повторену ноту зі зміною напрямку й ритму. Репетируй малими групами, потім з’єднай їх без додаткової паузи. Якщо повна фраза складна, обери один такт і знову прослухай саме його. Після корисної часткової спроби поверни весь діапазон і ще раз послухай. Не сприймай результат як загальну оцінку слуху: він описує конкретний фіксований приклад і дані цієї спроби.

  Відкрий ціль, щоб знайти стійку помилку, потім поясни собі, чи проблема була у висоті, регістрі, порядку або часі. Спроби з відкритими нотами позначаються як гра з підказками. Згодом повернися до іншого прикладу без підказок або зміни стрій і заново підбери його звуки. Програмне завершення відтворення не доводить, що фразу було почуто, а повторені приклади стають знайомими. Мета — відтворюваний спосіб музичного порівняння, а не твердження, що одна оцінка вимірює весь слух.
