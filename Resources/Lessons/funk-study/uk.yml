lessonID: funk-study
lessonVersion: 1
locale: uk
title: 'Фанк: короткі акорди, приглушені удари й простір'
summary: Розділи короткі акорди з висотою, приглушені удари й свідомі паузи на сітці шістнадцятих.
goal: Зіграй синкопований чотиритактовий грув із контрольованими закінченнями акордів, приглушеними ударами й контрастом
  простору.
body: |-
  Характер фанкової гітарної партії часто визначають момент припинення звуку струн і простір навколо атак. Короткий акорд має впізнавані висоти; приглушений удар створює шумовий звук без визначеної висоти; у паузі атаки немає. Це три різні події. Навчися свідомо обирати між ними перед ущільненням ритму чи додаванням ефектів.

  Почни з тризвукової аплікатури домінантсептакорду. Вона містить терцію, квінту й малу септиму; основний звук у цій першій формі мається на увазі, але не грається. Вдар по вибраних верхніх струнах разом і послаб тиск після короткої записаної тривалості, зберігши легкий контакт для зупинки. Не відривай пальці так різко, щоб задзвеніла відкрита струна. Слухай записану тишу після акорду так само уважно, як сам акорд.

  Для приглушеного удару заглуши вказані струни без притискання до ладу та зроби невеликий рух медіатором. Хрестики позначають задіяні струни, а не номер ладу. Якщо виникає чіткий натуральний флажолет, трохи зміни місце приглушення та слухай короткий шумовий звук. Це відрізняється від palm muting затиснутої ноти, де визначена висота навмисно зберігається. Додаток показує інструкцію, але не визначає точний контакт руки.

  Рахуй чотири поділи на кожний клік-чверть. Підтримуй рівний рух вниз-угору, якщо це зручно, але проходь тихі позиції без контакту зі струнами. Рух руки не означає, що кожний поділ має звучати. Порівняй сітку приглушених ударів зі змішаним рисунком акордів і таких ударів. Поміть, що в одних проміжках є ударний звук, а в інших тиша; заміна кожної паузи приглушеним ударом змінює грув.

  Синкопований перехід розміщує акордові атаки між сильнішими долями, потім переходить до другої компактної домінантової форми. Вивчи кожний такт окремо перед поєднанням. Збережи пульс метронома, поки акордові атаки переміщуються навколо нього. У чотиритактовому етюді повтори початкову ідею, зменш її щільність, потім заверши одним акордом і простором. Порівнюй насичені й розріджені такти в однаковому темпі; додаткова швидкість заважала б порівнянню.

  Ці приклади використовують відтворення, метроном і самопрактику. Якість акорду, приглушення й шумові атаки не оцінюються автоматично монофонічним детектором нот. Еталон використовує прості синтезовані акорди й короткі шумові удари для показу часу, а не реалістичного гітарного тембру. Зменш його гучність, щоб чути власні зупинки звуку. Насамкінець створи такт, змінивши лише дві позиції, поясни, де тепер акорд, удар чи пауза, і з’єднай його з незміненим тактом моделі.
steps:
  prepare:
    title: Обери невелику музичну ідею
    body: Прочитай план, обери зручний чистий звук і почни повільно.
  chord-cutoff:
    title: Короткий акорд і справжня пауза
    body: 'Використай аплікатуру {{root}}7 на верхніх струнах. Кожний акорд триває одну шістнадцяту; зупини його
      перед відліком трьох тихих поділів. Акордові звуки: {{notes}}.'
  muted-grid:
    title: Хрестики звучать; паузи — ні
    body: 'Приглуши струни 1–3. Відрахуй шістнадцять позицій: чотири удари, чотири паузи, розділені удари, потім
      коротка пара. Читай хрестики без вигадування висоти.'
  chord-and-scratch:
    title: Перемикайся між акордом, ударом і тишею
    body: Тримай форму {{root}}7 напоготові, але свідомо змінюй тиск. Збережи кожну паузу замість заповнення всієї
      сітки.
  syncopated-change:
    title: Акорди між долями й компактний перехід
    body: Зіграй першу форму в такті 1, другу — в такті 2. Удари вгору на четвертому поділі випереджають наступну
      долю; рахуй крізь неї замість зміщення кліку.
  space-study:
    title: 'Чотири такти: повтори, розрідь, заверши'
    body: Такти 1–2 повторюють грув, такт 3 залишає більше простору на другій формі, а такт 4 завершується одним
      коротким акордом. Порівняй щільність в одному темпі.
  groove-review:
    title: Почуй три різні рішення
    body: Зіграй етюд двічі, потім зміни дві позиції у власному такті й з’єднай його з незміненою моделлю. Відзначай
      лише те, що справді почув або перевірив фізично.
  cross-check:
    title: Що означає хрестик?
    body: Що має відбутися на × у цих вправах?
