learningTasks:
  groove-review:
    title: Почуй три різні рішення
    body: Зіграй етюд двічі, потім зміни дві позиції у власному такті й з’єднай його з незміненою моделлю. Відзначай
      лише те, що справді почув або перевірив фізично.
    items:
      cutoffs: Я зупиняв акордові звуки на задуманих межах без випадкового звучання відкритих струн.
      scratch: Мої приглушені удари були короткими й відрізнялися від ноти з висотою та тиші.
      pulse: Я рахував крізь атаки між долями й зберіг записані паузи.
      contrast: Я чув насичені й розріджені такти як різні рішення в одному темпі.
      variation: Я змінив рівно дві позиції й пояснив акорд, удар чи паузу в кожній.
  cross-check:
    title: Що означає хрестик?
    body: Що має відбутися на × у цих вправах?
    items:
      scratch: Зробити удар без визначеної висоти по вказаних приглушених струнах.
      rest: Залишитися в тиші без атаки.
      palm: Зіграти визначену затиснуту висоту з palm muting.
    explanation: Хрестик позначає чутний удар без визначеної висоти. Пауза тиха; нота з palm muting зберігає задану
      висоту.
