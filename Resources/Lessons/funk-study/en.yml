learningTasks:
  groove-review:
    title: Hear three different choices
    body: Play the study twice, then change two slots in your own bar and connect it to an unchanged model bar.
      Review only what you actually heard or checked physically.
    items:
      cutoffs: I stopped chord tones at the intended boundaries without open-string spill.
      scratch: My scratches were brief and distinct from both a pitched note and silence.
      pulse: I counted through offbeat attacks and preserved the written rests.
      contrast: I could hear the dense and sparse bars as different choices at one tempo.
      variation: I changed exactly two slots and explained chord, scratch or rest in each.
  cross-check:
    title: What does the cross mean?
    body: What should happen at × in these exercises?
    items:
      scratch: Make an unpitched attack on the indicated damped strings.
      rest: Stay silent with no attack.
      palm: Play a definite fretted pitch with palm muting.
    explanation: A cross marks an audible unpitched attack. A rest is silent; a palm-muted note retains its authored
      pitch.
