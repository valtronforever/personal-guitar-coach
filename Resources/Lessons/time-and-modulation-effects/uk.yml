lessonID: time-and-modulation-effects
lessonVersion: 1
locale: uk
title: Розмісти повтори, простір і рух
summary: Узгодь delay з пульсом, контролюй хвости reverb і порівняй глибину modulation.
goal: Обери налаштування ефекту, яке підтримує фразу й зберігає її наступний вступ.
body: |-
  Delay дає окремі пізніші повтори; reverb створює відчуття звукового простору; modulation змінює риси звуку в часі. Це різні музичні рішення, навіть якщо пресет поєднує їх. Почни із сухого сигналу й розрідженої фрази. Її довгі проміжки — навмисний час слухати оброблене затухання. Еталон додатка лишається сухим; змінюй ефекти на власному процесорі чи в програмі.

  Для четвертного пульсу одна доля триває 60000, поділені на BPM, мілісекунд. При 60 BPM четвертний delay — 1000 мс, восьмий — 500 мс, восьмий із крапкою — 750 мс. Задай процесору темп фрази або введи час вручну. Це музичні часи повторів, а не значення калібрування затримки. Порівняй два поділи, залишивши початкові атаки на тих самих місцях.

  Спочатку залиш малий feedback delay, щоб повтори затухали, потім встанови wet-рівень зі впізнаваною зіграною нотою. Для reverb обійди delay й порівняй коротше та довше затухання з помірним mix. Слухай чіткість вступу наступної фрази. Зупинка сухої ноти не обов’язково зупиняє хвіст ефекту; він може бути навмисним, але має служити аранжуванню.

  Насамкінець обійди часові ефекти й порівняй помірний chorus або інший доступний modulation з повільнішою та швидшою частотою. Спочатку змінюй rate, потім depth, потім wet-рівень; не змінюй усе разом. Слухай, чи рух підтримує довгі ноти, чи ускладнює чітку лінію. Не подавай ефекти на вимірюваний вхід: повтори й модуляція висоти можуть сприйматися одноголосним аналізатором як додаткові ноти або нестабільна висота.
steps:
  prepare:
    title: Визнач тракт і початковий звук
    body: Використовуй наявне обладнання з комфортною гучністю. Додаток дає пояснення, часові орієнтири й самоперевірку;
      він не запускає ефекти цього уроку.
  control:
    title: Використовуй ту саму фразу для порівняння
    body: 'Вивчи цю суху двотактову фразу, потім повтори її через власний звуковий тракт зі зміною одного параметра.
      Зберігай зіставні темп, артикуляцію й гучність прослуховування. Еталон додатка не містить симуляції підсилювача
      чи ефектів. Ноти звучання: {{sequence}}. Показана аплікатура — орієнтир; звук не доводить використання струни
      чи пальця.'
  effect-test:
    title: Збережи чіткий наступний вступ
    body: Порівняй кожен доступний ефект окремо, потім збережи одне корисне налаштування. Залиш перевірки недоступних
      ефектів відкритими.
  delay-time:
    title: Обчисли відстань між повторами
    body: При 60 BPM із четвертним пульсом який час delay для восьмої з крапкою?
activities:
  control:
    title: Використовуй ту саму фразу для порівняння
    body: 'Вивчи цю суху двотактову фразу, потім повтори її через власний звуковий тракт зі зміною одного параметра.
      Зберігай зіставні темп, артикуляцію й гучність прослуховування. Еталон додатка не містить симуляції підсилювача
      чи ефектів. Ноти звучання: {{sequence}}. Показана аплікатура — орієнтир; звук не доводить використання струни
      чи пальця.'
learningTasks:
  effect-test:
    title: Збережи чіткий наступний вступ
    body: Порівняй кожен доступний ефект окремо, потім збережи одне корисне налаштування. Залиш перевірки недоступних
      ефектів відкритими.
    items:
      delay: Я почув два поділи delay проти незмінного пульсу.
      reverb: Я порівняв короткий і довгий хвости reverb перед наступним вступом.
      modulation: Я окремо змінив rate і depth модуляції.
      route: Я не подавав оброблені повтори й модуляцію на оцінюваний вхід.
  delay-time:
    title: Обчисли відстань між повторами
    body: При 60 BPM із четвертним пульсом який час delay для восьмої з крапкою?
    items:
      half: 500 мс
      dotted: 750 мс
      beat: 1000 мс
    explanation: Одна доля — 1000 мс; три чверті долі — 750 мс. Це час ефекту, а не компенсація затримки виходу.
