lessonID: displaced-accents
lessonVersion: 1
locale: uk
title: Зміщення ритмічного акценту
summary: Збережіть фігуру, змінюючи її початок відносно такту й долі.
goal: Рахувати 4/4 під групами з трьох восьмих і починати ту саму фразу з різних частин долі.
body: |-
  Ритмічна фігура може зберігати ноти й тривалості, але починатися в іншому місці такту. Це зміщення змінює її відношення до сильних і слабких долей. Метроном не рухається слідом за фігурою: ви зберігаєте пульс такту й чуєте малюнок на його тлі. Спочатку відокремте першу ноту фрази від долі 1 такту — вони не обов’язково збігаються.

  Перший приклад повторює три восьмі, виділяючи першу в кожній групі. Кожна нота й далі звичайна восьма, половина долі. Група триває півтори долі, а не одну тріольну долю. Під групами рахуйте 1-і-2-і-3-і-4-і. Вісім груп заповнюють три такти; після цього тритактового циклу початкове вирівнювання повертається. Не додавайте ноту чи паузу на тактовій рисці для перезапуску групи.

  Наступний приклад зміщує весь цикл на одну восьму. Почніть восьмою паузою, потім зіграйте ті самі двадцять чотири ноти й акценти. Остання нота тепер припадає на долю 1 такту 4; решта три з половиною долі тихі. Послухайте місця позначених початків груп відносно кліків. Змінюєте розташування фрази, а не гаму, швидкість чи внутрішні проміжки.

  Останнє порівняння дає коротшому мотиву з чотирьох восьмих чотири початки: доля 1 у такті 1, 1-і в такті 2, доля 2 в такті 3 та 2-і в такті 4. Кожний варіант зберігає чотири висоти й тривалість дві долі. Рахуйте початкові паузи до входу та кінцеві після завершення. Виділіть першу ноту мотиву, навіть якщо вона не припадає на число долі.

  Почніть на 60 BPM із чистим звуком. Синтетичний приклад озвучує записані акценти; додаток оцінює висоти й місце атак, а не силу удару. Якщо пульс пливе, поза оцінюваною спробою тимчасово приберіть зміни висоти та простукайте групу під метроном. Поверніть записані ноти, коли зможете назвати поточну долю такту незалежно від початку фрази.
steps:
  prepare:
    title: Збережіть два окремі рахунки
    body: >-
      Простукуйте чотири чверті й промовляйте восьмі. Потім голосом виділяйте кожну третю восьму. Не пересувайте
      1 наступного такту, навіть якщо акцентна група продовжується через неї.
  three-eighth-cycle:
    title: Вісім груп через три такти
    body: >-
      Зіграйте фігуру з трьох нот вісім разів, по восьмій на ноту. Перша нота кожної групи акцентована. Рахуйте
      всі три такти; на тактовій рисці немає додаткового удару чи паузи. {{sequence}}.
  shifted-cycle:
    title: Почніть той самий цикл на восьму пізніше
    body: >-
      Відрахуйте початкову восьму паузу, потім повторіть ті самі двадцять чотири ноти. Фінальна нота на долі 1 такту
      4, решта три з половиною долі тихі. Порівняйте нові місця акцентів із першою вправою.
  four-starting-points:
    title: Почніть на 1, 1-і, 2 та 2-і
    body: >-
      Один раз за такт грайте той самий чотиринотний мотив після записаної початкової паузи. Він завжди триває дві
      долі. Збережіть акцент першої ноти й відрахуйте решту тиші до наступного такту. {{positions}}.
  review:
    title: Знайдіть фігуру, не пересуваючи долю
    body: >-
      Виберіть початок, що спричинив вагання, й уголос відрахуйте його початкову паузу. Перегляньте ранні/пізні
      входи, потім окремо послухайте силу акценту. Назвіть і долю такту, і першу ноту фігури.
  question:
    title: Що змінює зміщення?
    body: Відрахуйте поділ долі перед відповіддю.
activities:
  three-eighth-cycle:
    title: Вісім груп через три такти
    body: >-
      Зіграйте фігуру з трьох нот вісім разів, по восьмій на ноту. Перша нота кожної групи акцентована. Рахуйте
      всі три такти; на тактовій рисці немає додаткового удару чи паузи. {{sequence}}.
