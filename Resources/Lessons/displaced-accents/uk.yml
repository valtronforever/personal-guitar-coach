      долі. Збережіть акцент першої ноти й відрахуйте решту тиші до наступного такту. {{positions}}.
learningTasks:
  question:
    title: Що змінює зміщення?
    body: Той самий мотив починається на восьму пізніше зі сталими тривалостями й темпом. Що змінилося?
    items:
      placement: Його розташування відносно долі й такту.
      tempo: Темп метронома став повільнішим.
      triplet: Звичайні восьмі автоматично стали тріолями.
    explanation: Зміна входу пересуває всю фігуру відносно метра. Внутрішні тривалості, темп та інтервали висоти
      не змінюються.
  review:
    title: Перевірте свій пульс
    body: Позначте лише власні спостереження.
    items:
      cycle: Я відрахував три такти, поки групи по три восьмі перетинали їхні межі.
      entry: Я зіграв чотири початки після правильних початкових пауз.
      accent: Я слухав акценти першої ноти окремо від оцінки висоти/атак.
