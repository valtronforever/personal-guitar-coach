    body: Виконай вісім тактів двічі. У другому проході спрости одну вставку, зберігши форму та завершення.
    items:
      roles: Я міг визначити риф, супровід і вставку на слух.
      changes: Зміни форм і регістрів не додавали пауз.
      space: Вставка закінчилася вчасно, а записані паузи лишилися тихими.
      tone: Я перевірив зайві струни й баланс акордів в обраному звуці.
      variation: Я порівняв простішу вставку без зміни довжини аранжування.
