lessonID: classic-rock
lessonVersion: 1
locale: uk
title: 'Класичний рок: риф, ритм-партія та вставка'
summary: Дай трьом гітарним ролям різний простір і поєднай їх без розриву пульсу.
goal: Зіграй восьмитактове аранжування з чіткими переходами між рифом, акордовою підтримкою та короткою вставкою.
body: |-
  Гітарна партія може змінювати роль у сталому темпі. Риф дає повторюваний характер, акордовий супровід залишає простір іншому провідному голосу, а вставка займає обраний проміжок. Вивчи ролі окремо перед поєднанням. Цей оригінальний етюд — невелике аранжування, а не цитата з пісні; його структура важливіша за конкретний звук підсилювача.

  Почни з низького одноголосного рифу. Він повторює тоніку перед рухом невеликим мінорним набором і поверненням. Рахуй короткі початкові атаки й довше завершення без прискорення повторних нот. Спочатку обери чіткі закінчення між нотами. Якщо пізніше додаси зовнішній перевантажений звук, перевір, чи він не сховав закінчення та не дозволив зайвим струнам дзвеніти.

  Акордова частина використовує пауер-акорди й довші проміжки. Вдар лише по вказаних струнах і підготуй наступну форму перед її долею. Залиш ритм-партію стриманішою за риф у музичній увазі: вона має підтримувати форму, а не ставати непов’язаним соло. Показана аплікатура Standard або Drop може відрізнятися на шостій струні, а задумані інтервали й гармонічний маршрут зберігаються.

  Вставка переходить у вищий регістр на один такт і потім звільняє місце. Відпрацюй її останню ноту одразу з наступною частиною, щоб вона не забирала зайву долю. Корисна вставка відповідає попередньому матеріалу й робить повернення зрозумілішим. Вона не мусить бути швидкою. Порівняй повну вставку з версією, де менше нот, але той самий час завершення.

  Повні вісім тактів: риф двічі, акордовий супровід двічі, риф двічі, вставка один раз і фінальний тонічний акорд із тишею. Назви ролі перед початком. Якщо перехід слабкий, повторюй його останній і перший такти замість постійного початку всієї п’єси. Тут діє самоперевірка: додаток дає ноти з часом і синтезовані приклади, а баланс, тембр, приглушення та влучність вставки лишаються музичними рішеннями.
steps:
  prepare:
    title: Обери невелику музичну ідею
    body: Прочитай план, обери зручний чистий звук і почни повільно.
  main-riff:
    title: Дай рифу чітке повернення
    body: 'Центр: {{root}} minor. Повтори низький риф без скорочення останньої ноти чи поспіху до наступної першої
      долі.'
  rhythm-part:
    title: Підтримай пауер-акордами й простором
    body: Тоніка, понижений шостий і понижений сьомий ступені підтримують мінорний центр. Збережи останню восьму
      паузу.
  one-bar-fill:
    title: Вставка з фіксованою межею
    body: Використай вищий регістр на один такт, залиш останню восьму тихою й підготуй наступну роль.
  eight-bar-arrangement:
    title: Вісім тактів із трьома ролями
    body: Такти 1–2 — риф, 3–4 — супровід, 5–6 — риф, 7 — вставка, 8 — завершення. Готуй кожну роль перед її межею.
  arrangement-review:
    title: Зроби кожну роль упізнаваною
    body: Виконай вісім тактів двічі. У другому проході спрости одну вставку, зберігши форму та завершення.
