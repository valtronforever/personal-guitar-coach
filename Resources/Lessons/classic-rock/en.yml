learningTasks:
  arrangement-review:
    title: Make every role recognizable
    body: Perform the eight bars twice. Simplify one fill on the second pass while retaining the same form and ending.
    items:
      roles: I could identify riff, support and fill by ear.
      changes: My shape and register changes did not add pauses.
      space: The fill ended on time and the written rests stayed quiet.
      tone: I checked unwanted strings and chord balance in my chosen sound.
      variation: I compared a simpler fill without changing the arrangement length.
