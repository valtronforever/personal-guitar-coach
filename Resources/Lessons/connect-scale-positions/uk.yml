lessonID: connect-scale-positions
lessonVersion: 1
locale: uk
title: Поєднання сусідніх позицій гами
summary: Вийдіть за межі одного боксу через спільну ноту й коротку пентатонічну фразу.
goal: Поєднати дві ділянки грифа, зберігаючи гаму й рівний пульс.
body: |-
  Позиція — зручна ділянка для руки, а не окрема гама. Сусідні форми мінорної пентатоніки мають спільні висоти. Знання їхнього перетину дозволяє продовжувати фразу, а не зупинятися на межі боксу. У цьому уроці кожна записана нота має окремий удар медіатором: сам перехід не є слайдом чи hammer-on.

  Почніть зі спільної висоти в тій самій октаві. Приклад чергує струну 2, лад 5 і струну 3, лад 9, залишаючи повну долю тиші після кожної ноти. Обидві позиції звучать однаково в усіх наявних Standard і Drop пресетах, бо вони зберігають інтервал між струнами 2 й 3. Порівняйте тембр і місце руки без зміни висоти. Приглушіть першу ноту, подивіться на ціль, послабте зайве притискання та поставте наступний палець близько до ладового поріжка.

  Фраза переходу починається ступенями ♭3–4–5–♭7–8–♭10 й повертається вниз до тоніки за TAB. Читайте реальні висоти, не підміняйте ступені номерами пальців. Перші три ноти лишаються на струні 3, а рука рухається до ладу 9; далі фраза переходить на тонші струни. Після вершини поверніться маршрутом і завершіть на тоніці струни 4. Плануйте рух під час попередньої ноти, а не лише після наступного кліку.

  Фінальний маршрут починається й завершується тонікою. Зіграйте дванадцять чвертних місць, включно з останньою паузою, на 50 BPM. Окремо повторіть складне з’єднання двох нот, потім поверніть повну тритактову фразу. Підвищуйте темп після трьох контрольованих повторів. Додаток зіставляє висоти й атаки, але не чує, якою струною чи пальцем зіграно унісон. Перевірте маршрут самостійно; за потреби скористайтеся дзеркалом або окремим відео.
steps:
  prepare:
    title: Знайдіть перетин
    body: >-
      Пригадайте мінорну пентатоніку: 1–♭3–4–5–♭7. Прочитайте обидві ділянки до гри й знайдіть два місця спільної
      ноти. Зберігайте зручне положення зап’ястка під час переходу.
  shared-note:
    title: Одна висота у двох місцях
    body: >-
      Окремо атакуйте кожну ноту, а наступну чверть паузи використайте для приглушення й руху. Чергуйте 2/5 та 3/9,
      разом чотири ноти. Висота та сама, тембр струни може відрізнятися. {{sequence}}.
  crossing-phrase:
    title: Перейдіть межу боксу
    body: >-
      Зіграйте три такти чвертей. Спочатку рухайтеся вздовж струни 3, потім перейдіть на 2 й 1. Після вершини поверніться
      й завершіть тонікою на струні 4. Якщо рух 3/7 → 3/9 запізнюється, повторіть його окремо без проміжного слайду.
  returning-route:
    title: Вийдіть із тоніки й поверніться
    body: >-
      Почніть із тоніки, дійдіть до верхньої тоніки й поверніться. У трьох тактах одинадцять атак і одна пауза.
      Перехід і фінальна пауза мають бути тихими. {{positions}}.
  review:
    title: Перевірте з’єднання, потім фразу
    body: >-
      Порівняйте час атаки на зміні позиції із сусідніми нотами. Висока оцінка підтверджує звук; окремо перевірте,
      що використали показаний маршрут без стискання грифа.
  knowledge-check:
    title: Перевірте музичне співвідношення
    body: Дайте відповідь за будовою, яку практикували.
activities:
  shared-note:
    title: Одна висота у двох місцях
    body: >-
      Окремо атакуйте кожну ноту, а наступну чверть паузи використайте для приглушення й руху. Чергуйте 2/5 та 3/9,
      разом чотири ноти. Висота та сама, тембр струни може відрізнятися. {{sequence}}.
  crossing-phrase:
    title: Перейдіть межу боксу
    body: >-
      Зіграйте три такти чвертей. Спочатку рухайтеся вздовж струни 3, потім перейдіть на 2 й 1. Після вершини поверніться
      й завершіть тонікою на струні 4. Якщо рух 3/7 → 3/9 запізнюється, повторіть його окремо без проміжного слайду.
  returning-route:
    title: Вийдіть із тоніки й поверніться
    body: >-
      Почніть із тоніки, дійдіть до верхньої тоніки й поверніться. У трьох тактах одинадцять атак і одна пауза.
      Перехід і фінальна пауза мають бути тихими. {{positions}}.
learningTasks:
  knowledge-check:
    title: Що змінюється на переході?
    body: Ви граєте ту саму висоту й октаву на іншій струні. Яке твердження правильне?
    items:
      same: Аплікатура й тембр можуть змінитися, а висота лишається тією самою.
      key: Тональність обов’язково зміниться через інший номер ладу.
      octave: Інша струна завжди означає іншу октаву.
    explanation: >-
      Унісон — однакова висота звучання. Її можуть давати різні пари струна/лад, тому сам рух руки не транспонує
      музику.
  review:
    title: Перевірте фразу
    body: Позначте лише власні спостереження.
    items:
      shared: Я порівняв спільну висоту в обох показаних місцях.
      junction: Я практикував перехід без небажаної проміжної ноти.
      returning: Я зіграв маршрут рівно й повернувся до тоніки.
