lessonID: slow-sixteenths
lessonVersion: 1
locale: uk
title: Повільні шістнадцяті
summary: Вмістіть чотири рівномірні атаки в кожну долю.
goal: Рахувати чотири поділи, зберігаючи незмінну долю.
body: |-
  Чотири шістнадцяті займають одну чвертну долю. Рахуйте «1 е і а, 2 е і а, 3 е і а, 4 е і а». Кожен склад триває однаково. На 50 BPM шістнадцята триває 0,3 секунди: є час почути й виправити нерівні проміжки.

  Чергуйте напрямки медіатора невеликим рухом; клік залишається на числах. Оцінка перевіряє окремі чутні атаки, а не рух руки. Працюйте в межах 40–70 BPM, щоб тривалість кожної ноти лишалася в перевіреному діапазоні аналізу атак.
steps:
  speak:
    title: Зробіть чотири рівні склади
    body: >-
      Промовте цілий такт без гри. Якщо «а» запізнюється, знизьте темп до 40 BPM і перевірте рівність «е», «і» та
      «а». Не стискайте останні два склади в поспішну пару.
  density:
    title: Змініть поділ
    body: >-
      Грайте чверті на долях 1–2, потім по дві атаки на 3–4. Внутрішньо продовжуйте рахувати всі чотири склади.
      {{positions}}.
  four:
    title: Шістнадцять атак, чотири кліки
    body: >-
      У такті 2 зіграйте кожен склад. Першу атаку кожної групи суміщайте з кліком, а три внутрішні проміжки робіть
      рівними. Якщо рука напружується, зупиніться й почніть повільніше.
  connect:
    title: Переходьте між тривалостями
    body: >-
      Практикуйте обидва такти на 50 BPM. Перехід від восьмих до шістнадцятих подвоює кількість атак, а не швидкість
      метронома. Перед додаванням 5 BPM зробіть три повтори.
  review:
    title: Перевірте перед прискоренням
    body: >-
      За результатом таймінгу знайдіть нерівну групу й повторіть один такт. Спочатку потрібен контроль у повільному
      темпі, потім швидкість.
activities:
  divide:
    title: Один, два, потім чотири на {{first}}
    body: У такті 1 чверті змінюються восьмими; у такті 2 на кожній долі — шістнадцяті. {{sequence}}.
learningTasks:
  review:
    title: Перевірте свою практику
    body: Позначайте лише перевірене; самооцінка не змінює аудіооцінку.
    items:
      count: Я можу рівномірно промовити чотири склади на долю.
      sound: Кожна шістнадцята має окрему чітку атаку.
      repeat: Перша нота кожної групи лишається на кліку.
