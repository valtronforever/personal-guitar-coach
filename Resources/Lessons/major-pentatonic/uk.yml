learningTasks:
  knowledge-check:
    title: П’ять нот із мажору
    body: Які ступені мажору пропускають для утворення мажорної пентатоніки?
    items:
      four-seven: 4 й 7
      two-six: 2 й 6
      three-five: 3 й 5
    explanation: Без 4 й 7 залишаються 1–2–3–5–6. Це п’ять різних класів висоти, повторених у кожній октаві.
  review:
    title: Перевірте фразу
    body: Позначте лише власні спостереження.
    items:
      degrees: Я називаю п’ять ступенів мажорної пентатоніки без підміни номерами пальців.
      contrast: Я почув порівняння терцій та сексти/септими зі спільною тонікою.
      phrase: Я завершив відповідь на тоніці й склав окрему коротку фразу.
