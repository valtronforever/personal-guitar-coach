lessonID: major-pentatonic
lessonVersion: 1
locale: uk
title: Мажорна пентатоніка
summary: Використовуйте ступені 1, 2, 3, 5 й 6 для виразних коротких мелодичних фраз.
goal: Зіграти мажорну пентатоніку й почути відмінність від мінорної з тією самою тонікою.
body: |-
  Мажорна пентатоніка залишає 1, 2, 3, 5 й 6 мажорної гами, пропускаючи 4 й 7. Відстані від тоніки в півтонах: 0, 2, 4, 7 і 9. Октава повторює тоніку. Як і мінорна пентатоніка, вона має п’ять класів висоти, але інший інтервальний малюнок.

  Спочатку вивчіть однооктавний маршрут без великого боксу. Підніміться через шість записаних нот включно з октавою й поверніться через п’ять без повтору вершини. Три такти мають одинадцять атак чвертями й фінальну чверть паузи. Стрибок 3–5 більший за сусідні тонові кроки; завчасно читайте зміну струни.

  Порівняння має спільну тоніку. Такти 1 й 2 зіставляють велику й малу терції; 3 й 4 — велику сексту й малу септиму. Тоніка й квінта лишаються спільними. Не називайте форму мажорною лише через її перенесення: звучання визначають інтервали відносно потрібної тоніки.

  Використайте останні два такти як малу мелодичну думку. Почніть 1–2–3–5, дайте відповідь 6–5–2–1. Наприкінці чітко озвучте тоніку. Ноти й тональність залежать від вибраного строю, а ступеневі співвідношення не змінюються. Автоматична практика перевіряє записані висоти й атаки, а не виразність імпровізації чи конкретну аплікатуру руки.
steps:
  prepare:
    title: Пригадайте ступені мажору
    body: >-
      Знайдіть тоніку й терцію в поточній TAB. Пригадайте повний мажор і подумки пропустіть 4 й 7. Прослухайте однооктавний
      приклад перед грою.
  major-pattern:
    title: П’ять ступенів і октава
    body: >-
      Грайте чверті на 50 BPM. Один підйом і повернення без дублювання вершини, остання доля такту 3 тиха. В окремому
      повільному підйомі називайте 1–2–3–5–6–8. {{sequence}}.
  same-tonic-contrast:
    title: Почуйте зміну барви від однієї тоніки
    body: >-
      У такті 1 велика терція, у 2 — мала. У такті 3 велика секста, у 4 — мала септима. Збережіть пульс і помітьте
      змінену внутрішню ноту, а не спільні тоніку/квінту. Це короткі порівняння, а не дві повні гами.
  melodic-answer:
    title: Питання й відповідь
    body: >-
      Зіграйте 1–2–3–5, потім 6–5–2–1, по чверті на клік. Пульс обох тактів однаковий, завершення — тоніка. Повторіть
      тричі; потім поза оцінюваною спробою складіть інший порядок цих п’яти ступенів.
  review:
    title: Тримайте тоніку в полі уваги
    body: >-
      Якщо терція нечітка, повільно порівняйте лише її з тонікою. Потім зіграйте фразу й назвіть завершення. Потрібно
      почути ціль, а не просто зупинитися на найвищому доступному ладі.
  knowledge-check:
    title: Перевірте музичне співвідношення
    body: Дайте відповідь за будовою, яку практикували.
