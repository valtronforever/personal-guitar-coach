learningTasks:
  knowledge-check:
    title: Five notes from major
    body: Which major-scale degrees are omitted to form major pentatonic?
    items:
      four-seven: 4 and 7
      two-six: 2 and 6
      three-five: 3 and 5
    explanation: Removing 4 and 7 leaves 1–2–3–5–6. These are five distinct pitch classes, repeated in each octave.
  review:
    title: Review the phrase
    body: Mark only observations you made yourself.
    items:
      degrees: I can name the five major-pentatonic degrees without using finger numbers.
      contrast: I heard the third/sixth versus minor-third/minor-seventh comparisons on one tonic.
      phrase: I completed the answer on the tonic and made a separate short phrase.
