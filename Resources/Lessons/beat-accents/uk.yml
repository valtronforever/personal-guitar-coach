lessonID: beat-accents
lessonVersion: 1
locale: uk
title: Сильні долі та акценти
summary: Виділяйте обрані атаки, не змінюючи їхній час.
goal: Переносити акцент, зберігаючи рівний пульс.
body: |-
  Акцент — виразніша атака, а не довша доля чи раніша нота. У 4/4 доля 1 починає такт; доля 3 часто є додатковою опорою. Музиканти також свідомо виділяють інші долі. Знак > позначає акцентовану атаку.

  У прикладі позначені ноти звучать голосніше, щоб було чутно групування. Під час оцінюваної практики грає лише метроном: оцінка перевіряє висоту й таймінг. Контраст гучності порівнюйте на слух; автоматичної оцінки динаміки тут немає. Залиште запас рівня на інтерфейсі, щоб найсильніша атака не кліпувала.
steps:
  listen:
    title: Почуйте групування
    body: >-
      Один раз прослухайте приклад чвертями. Почуйте голосніші 1 та 3. Відбивайте всі чотири долі з однією швидкістю;
      після акценту немає додаткової паузи.
  play:
    title: Створіть контраст невеликим рухом
    body: >-
      Зіграйте два такти на 60 BPM. Зробіть неакцентовані ноти трохи тихішими замість надмірно сильного удару по
      акцентованих. Кожна атака має лишатися на кліку. {{positions}}.
  shift:
    title: Перенесіть наголос
    body: >-
      Рахуйте «1 і ДВА і 3 і ЧОТИРИ і». Зіграйте всі вісім атак з рівними проміжками. Рух зап’ястка лишається регулярним,
      хоча гучність змінюється. Приклад демонструє нове групування.
  repeat:
    title: Перевірте акцент без поспіху
    body: >-
      Зіграйте обидва такти й прислухайтеся до себе разом із метрономом. Якщо акценти приходять рано, зменште різницю
      гучності й поступово поверніть її. Не трактуйте помилки таймінгу як оцінку динаміки.
  review:
    title: Перевірте перед прискоренням
    body: >-
      Спершу досягніть чутного контрасту в одному темпі. Прискорюйтеся лише тоді, коли можете перейти з 1/3 на 2/4,
      не зсуваючи пульс.
activities:
  strong:
    title: Акценти на 1 та 3 на {{first}}
    body: Знаки > позначають 1 та 3 кожного такту. Долі 2 та 4 тихіші, але чіткі. {{sequence}}.
  backbeat:
    title: Акценти на 2 та 4 на {{first}}
    body: Збережіть вісім рівних атак; виділіть числа 2 та 4, а не наступні «і». {{sequence}}.
learningTasks:
  review:
    title: Перевірте свою практику
    body: Позначайте лише перевірене; самооцінка не змінює аудіооцінку.
    items:
      count: Акцентовані ноти не приходять раніше й не подовжують долю.
      sound: Я чую контрольований контраст гучності без кліпінгу.
      repeat: Я можу виділити 1/3 або 2/4 в одному темпі.
