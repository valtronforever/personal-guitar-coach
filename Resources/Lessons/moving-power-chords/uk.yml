lessonID: moving-power-chords
lessonVersion: 1
locale: uk
title: Переміщення павер-акордів
summary: Відпустіть тиск, перенесіть форму й потрапте в наступну долю.
goal: Зіграти чотиритактовий маршрут без зупинки пульсу й перетягування затиснутої форми.
body: 'Рухома квінтова форма зберігає інтервал основний тон–квінта, коли змінюється основний тон. У цьому етюді
  вихідні ноти рухаються на два півтони, ще на два, потім на чотири назад. Поточна TAB уже адаптує нижні струни
  до строю; зберігайте показане співвідношення, а не обов’язковий зсув у два лади для Drop.


  Розділіть відпускання й переміщення. Зупиніть попередній акорд, зменште тиск, за потреби залишивши легкий контакт,
  рухайтеся до нових маркерів і натисніть перед атакою медіатора. Перетягування міцно затиснутої форми створює ковзання
  й тертя; повне відривання контактів може відкрити струни. Розрізняйте ці два шуми слухом.


  Почніть на 50 BPM. Перші чотири такти дають дві звучні долі й дві тихі для руху. У другому прикладі чотири удари
  вниз на такт. Синтетичний зразок показує цілі й час, але не відтворює шум пальців. Повні акорди — самостійна практика
  без автоматичної оцінки.'
steps:
  prepare:
    title: Огляньте маршрут
    body: Перед стартом знайдіть кожний основний тон і квінту в TAB. Зберіть пари без бою й перевірте дві струни
      окремо. Решта мовчить.
  release-move: &id001
    title: Дві долі звуку, дві для руху
    body: Атакуйте на 1, тримайте через 2, зупиніть на 3 і готуйтеся на 3–4. Нова форма готова до першої долі. Повторіть
      чотири такти двічі, рахуючи тихі долі.
  keep-pulse: &id002
    title: Чотири удари перед зміною
    body: Грайте чотири чверті на форму, змінюючи її на межі такту. Між четвертим ударом і наступною першою долею
      робіть лише необхідне відпускання. При запізненні продовжуйте рахувати й поверніться на наступному такті.
  review:
    title: Виділіть один шумний перехід
    body: Порівняйте рух угору й повернення. Шумніший перехід повторіть чотири рази з долями підготовки, потім зіграйте
      весь маршрут. Додайте 5 BPM лише після трьох рівних повторів.
activities:
  release-move: *id001
  keep-pulse: *id002
learningTasks:
  review:
    title: Перевірте цю спробу
    body: Позначте лише те, що перевірили слухом чи спостереженням за руками.
    items:
      pulse: Перший удар нової форми потрапляв на початок такту.
      release: Між формами не було випадкового ковзання чи спалаху відкритих струн.
      route: Я пройшов обидва напрямки без зупинки для повторного збирання форми.
