learningTasks:
  technique-review:
    title: Check the physical technique
    body: The pitch trace measures sound. Confirm these observations yourself.
    items:
      motion: I kept the fretting contact at the starting fret and used a bend rather than a slide.
      sound: I heard the intended destination and kept the neighboring strings quiet.
      repeat: I completed three controlled half-step attempts before trying the whole-step pair.
