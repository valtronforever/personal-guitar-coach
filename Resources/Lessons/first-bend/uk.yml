learningTasks:
  technique-review:
    title: Перевірте фізичний прийом
    body: Траєкторія висоти вимірює звук. Ці спостереження підтвердьте самостійно.
    items:
      motion: Я зберігав контакт на початковому ладі й виконував bend, а не slide.
      sound: Я чув потрібну ціль і зберігав тишу сусідніх струн.
      repeat: Я зробив три контрольовані півтонові спроби перед тоновою парою.
