lessonID: first-bend
lessonVersion: 1
locale: uk
title: Перший bend
summary: Досягніть затиснутого еталона, підвищуючи одну тривалу ноту.
goal: Досягти цілей у півтону й тон без ковзання до іншого ладу.
body: 'Bend підвищує висоту натягуванням струни, коли контакт пальця залишається на тому самому ладі. Півтоновий
  bend піднімає ноту на 100 центів; тоновий — на 200. Відстань руху поперек грифа не вимірює висоту: калібр струн,
  стрій і гітара змінюють потрібне зусилля. Спочатку послухайте ціль.


  Використовуйте чистий звук і зручну затиснуту ноту. Підтримайте робочий палець сусіднім, якщо це робить рух стабільнішим.
  Переміщуйте струну поперек грифа невеликим узгодженим рухом руки, зберігаючи контакт і не ковзаючи вздовж грифа
  на інший лад. Сусідні струни мовчать. Не досягайте незручної цілі силою; зробіть паузу й попрацюйте над меншим
  півтоновим рухом.


  TAB показує початковий лад і b1 або b2 — один чи два півтони над ним. Окрема вправа-еталон озвучує ту саму ціль
  звичайною затиснутою нотою. Пунктирна крива ділить тривалий bend на початкову висоту, контрольований підйом і
  утримання цілі. Preview синтетично відтворює цю траєкторію; електронний тембр не моделює гітарний bend.


  Спочатку пройдіть півтонову пару, потім тонову. Автоматичний результат вимірює чутну висоту й час початкової атаки.
  Він не доводить, що ви підтягнули струну замість переходу на вищий лад, і не визначає рух пальців. Це ваші спостереження.
  Зміна Standard-строю транспонує початкову ноту й ціль разом; Drop зберігає їхній інтервал.'
steps:
  prepare:
    title: Знайдіть підтримку й почуйте ціль
    body: Налаштуйте чистий звук. Затисніть показану початкову позицію, озвучте один раз і відпустіть зайве зусилля.
      Зберігайте контакт на ладі, обережно пробуючи невелике підвищення; поверніться й зупиніться. Перед повним
      bend прослухайте еталон.
  half-step-target:
    title: Почуйте один півтон
    body: 'На 60 BPM зіграйте звичайне затиснуте порівняння: початкова нота, наступний лад тієї самої струни, початкова
      нота й чверть паузи. Почуйте малу півтонову різницю. Актуальні ноти: {{sequence}}.'
  half-step-bend:
    title: Підніміться й утримайте півтону
    body: У кожному такті атакуйте на 1. Тримайте початкову висоту до і після 1, підніміться до цілі на 2 й утримуйте
      її до кінця долі 3. Заглушіть на 4 перед відпусканням струни. Повторіть два такти. На 60 BPM підйом займає
      пів секунди. Палець лишається на початковому ладі; b1 позначає висоту, а не додатковий лад.
  whole-step-target:
    title: Почуйте два півтони
    body: 'Порівняйте початкову ноту з нотою на два лади вище, поверніться й зробіть паузу. Це тонова ціль наступного
      bend. Актуальні ноти: {{sequence}}. Чітко почуйте її перед додаванням зусилля.'
  whole-step-bend:
    title: Досягніть тонової цілі
    body: 'Ті самі два такти: атака на 1, початок підйому на і після 1, ціль на 2, утримання до кінця 3 й глушіння
      на 4. b2 означає 200 центів над початковою висотою. При перевищенні цілі зменшіть рух у наступній спробі замість
      постійного хитання навколо неї.'
  review:
    title: Порівняйте фази
    body: Окремо перегляньте Початкову ноту, Підйом і Утримання цілі. Занижена ціль потребує більшої зміни висоти,
      завищена — меншої. Опрацюйте один півтоновий bend і знову зіграйте еталон. Повторіть пару тричі з контрольованим
      утриманням перед тоновою вправою.
