learningTasks:
  compare-strokes:
    title: Compare the motion honestly
    body: Play both plans at the same tempo and separate what you heard from what you observed.
    items:
      direction: I followed the intended directions at each string boundary.
      separate: The same-direction pair remained two separate, evenly timed notes.
      turn: I gave both highest-note attacks their written duration at the turn.
      compare: I identified a specific crossing that felt more or less controlled.
