lessonID: economy-picking
lessonVersion: 1
locale: uk
title: Поєднай змінні й економні удари
summary: Продовжуй один напрямок удару через межу сусідніх струн.
goal: Порівняй строгий змінний штрих із запланованим economy-рисунком, зберігаючи ритм.
body: |-
  Economy picking поєднує змінні удари на одній струні з продовженням напрямку при переході на сусідню. Це вибір руху, а не правило для кожної фрази. Корисно порівнювати, чи запланований шлях робить конкретний перехід зручнішим, зберігаючи таймінг та артикуляцію. Кожна нота все одно має звучати окремо.

  Прослухай лінію по три ноти на струні, потім зіграй її строгим змінним штрихом. Почни вниз і продовжуй чергування навіть на межах струн. Поміть, які переходи відчуваються інакше, ніж середина струни. Залиш цю версію чесним орієнтиром: використовуй ті самі висоти, тривалості й BPM при переході до economy, щоб зміна темпу не приховувала вплив руху.

  У висхідній economy-версії кожна група з трьох нот використовує вниз, угору, вниз. Останній удар униз продовжується до наступної тоншої струни, перша нота якої також грається вниз. Думай про дві послідовні ноти, розділені записаним часом, а не про одночасно проведений акорд. Зменшуй рух до контрольованого переходу й припиняй попередню затиснуту ноту з початком наступної в одноголосній практиці.

  Спуск змінює план на протилежний: угору, вниз, угору на кожній струні, із продовженням угору до наступної товстішої струни. Відпрацюй спуск окремо перед поєднанням напрямків. У вправі з розворотом найвища нота грається ще раз ударом угору, щоб почати спадний рисунок. Дай повтореній висоті окрему повну тривалість і атаку; не пропускай її лише тому, що палець на грифі вже стоїть.

  Стрілки — це авторський план ударів. Правильна оцінка висоти й ритму не відрізняє його від строгого змінного штриха чи іншого руху, тому перевіряй напрямок спостереженням. Слухай випадковий поспіх у кожній парі однакових напрямків і одночасне звучання двох нот. Якщо це виникає, сповільни лише межу перед поверненням до фрази. Наприкінці порівняй обидві версії в одному зручному темпі та назви покращений перехід, замість вважати economy автоматично швидшим чи кращим для будь-якої лінії.
steps:
  prepare:
    title: Підготуй план струн і ударів
    body: Налаштуй інструмент, почни повільно з чистим входом і прочитай фізичні вказівки перед практикою.
  alternate-control:
    title: Порівняй строгий змінний штрих
    body: 'Продовжуй чергування через кожний перехід між струнами; це контрольний рисунок. Ноти звучання: {{sequence}}.
      Фіксований рисунок струн є частиною прийому; ця активність не пропонує перенесення. Практика перевіряє висоту
      й таймінг, а фізичну вказівку перевіряй самостійно.'
  economy-up:
    title: Продовжуй униз через струни
    body: 'Використовуй вниз–угору–вниз на кожній струні. На межі є два удари вниз, кожен у свій записаний момент.
      Ноти звучання: {{sequence}}. Фіксований рисунок струн є частиною прийому; ця активність не пропонує перенесення.
      Практика перевіряє висоту й таймінг, а фізичну вказівку перевіряй самостійно.'
  economy-down:
    title: Продовжуй угору через струни
    body: 'Використовуй угору–вниз–угору на кожній струні, спускаючись до основного звуку. Ноти звучання: {{sequence}}.
      Фіксований рисунок струн є частиною прийому; ця активність не пропонує перенесення. Практика перевіряє висоту
      й таймінг, а фізичну вказівку перевіряй самостійно.'
  turnaround:
    title: Заплануй розворот угорі
    body: 'Повтори найвищу висоту ударом угору, потім дотримуйся спадного плану, не стискаючи дві атаки. Ноти звучання:
      {{sequence}}. Фіксований рисунок струн є частиною прийому; ця активність не пропонує перенесення. Практика
      перевіряє висоту й таймінг, а фізичну вказівку перевіряй самостійно.'
  compare-strokes:
    title: Чесно порівняй рух
    body: Зіграй обидва плани в одному темпі й відокрем те, що почув, від того, що спостерігав.
