learningTasks:
  question:
    title: Що переноситься в рухомому акорді з баре?
    body: Пересуньте повну мажорну форму із шостою басовою струною на два лади вище. Що залишиться незмінним?
    items:
      quality: Мажорні інтервали; основний тон підніметься на цілий тон.
      root: Висота основного тону залишиться, а акорд стане мінорним.
      index: Рухається лише вказівний, інші пальці залишаються.
    explanation: >-
      Перенесення кожної ноти на два лади вище транспонує весь акорд на цілий тон. Відстані між основним тоном,
      терцією та квінтою зберігаються, тому акорд залишається мажорним. Переміщення лише вказівного змінює ці відстані
      й не є тією самою дією.
  review:
    title: Самостійно перевірте повний акорд
    body: Позначте лише те, що справді перевірили.
    items:
      roots: Я знайшов основний тон на струні 6 і на струні 5 до гри.
      contact: Я перевірив звучні струни окремо й виправляв контакт без тривалого стискання.
      move: Я переніс кожну ноту форми із шостою басовою струною на два лади.
      chord: Я спробував повні акорди окремо від оцінюваних перевірок поодиноких нот.
