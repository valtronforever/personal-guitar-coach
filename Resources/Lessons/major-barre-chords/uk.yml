lessonID: major-barre-chords
lessonVersion: 1
locale: uk
title: 'Мажорне повне баре: дві рухомі форми'
summary: >-
  Побудуйте повне баре з основним тоном на шостій або п’ятій струні, перевірте кожну струну й перенесіть усю форму.
goal: >-
  Зручно озвучувати обидві мажорні форми й знаходити їхні рухомі основні тони, не сприймаючи аудіооцінку як доказ
  правильної техніки баре.
body: |-
  Повне баре дозволяє одним пальцем затиснути кілька струн на одному ладу. Воно замінює край знайомої акордової форми, який раніше утворювали відкриті струни, тому вся форма може рухатися. Назви «форма E» та «форма A» позначають вихідні аплікатури, а не обов’язкову висоту готового акорду. Поточний основний тон читайте в кожній активності. Стандартні строї транспонують форми разом; Drop змінює позицію шостої струни, тому дотримуйтеся адаптованих позначок, а не намагайтеся охопити всі ноти прямим баре.

  Почніть із форми з основним тоном на шостій струні біля п’ятого ладу. Спочатку поставте інші пальці, потім додайте вказівний на потрібні струни близько до ладового поріжка. Зберігайте зручне положення зап’ястка й тисніть лише настільки, наскільки потрібно для чистої ноти. Повільно переберіть струни, щоб знайти глухий звук. Спершу змініть контакт або положення пальця, а вже потім силу; розслабляйте руку між спробами. Тривале стискання не є метою вправи. Якщо положення болісне, зупиніться.

  Шість звуків знизу вгору мають ролі: основний тон–квінта–основний тон–терція–квінта–основний тон. Прислухайтеся до терції на струні 3: вона визначає мажорний характер. Спочатку перевірте повну форму без таймера, потім виконайте перевірку окремих нот. Високий бал підтверджує чутні висоти й атаки, але не доводить, що вказівний утримував баре або одночасний удар по акорду був чистим.

  Далі пересуньте кожну позицію форми із шостою басовою струною на два лади вище, включно з баре. Основний тон підніметься на цілий тон, а інтервали й мажорний характер залишаться. У формі з основним тоном на п’ятій струні найнижча звучна струна — 5, а струна 6 мовчить. Спочатку використовуйте показані окремі пальці для трьох внутрішніх нот. Не розпрямляйте палець настільки, щоб випадково заглушити найтоншу струну.

  На завершення повільно й тихо проведіть по кожному повному акорду поза оцінюваною практикою. Порівняйте чистоту з перевіркою окремих струн і відпустіть руку. Працюйте короткими спробами; якщо кілька струн залишаються глухими, поверніться до уроку малого баре.
steps:
  prepare:
    title: Знайдіть основний тон до натискання
    body: >-
      Виберіть чистий звук. Знайдіть найнижчу звучну струну й позначений основний тон. Складіть акорд без таймера,
      перевірте по одній струні й розслабляйте руку між спробами.
  review:
    title: Перевірте форму разом з результатом
    body: >-
      Тихо спробуйте кожну повну форму поза оцінюваною практикою. Порівняйте басовий основний тон, середню терцію
      й верхню ноту; визначте конкретну струну для виправлення замість повторного стискання всієї руки.
  sixth-root-shape:
    title: 'Основний тон на струні 6: форма E'
    body: >-
      Основний тон — {{root}}. У вихідній стандартній формі вказівний охоплює лад 5, пальці 3 і 4 затискають струни
      5 і 4 на ладу 7, а палець 2 — струну 3 на ладу 6. Перевірте поточні позначки для свого строю: {{positions}}.
      Озвучте всі шість струн окремо до тихого удару по повному акорду.
  sixth-root-notes:
    title: '{{root}} мажорний — перевірте кожну струну'
    body: >-
      Збережіть показану форму й грайте її струни від низької до високої по одній на клік на 50 BPM. Зупиняйте попередній
      звук перед наступною атакою. Потім відрахуйте записані тихі долі до завершення двох тактів. Бал перевіряє
      окремі висоти й час, а не повне баре чи одночасний акорд. {{positions}}.
  sixth-root-moved-shape:
    title: Пересуньте всю форму на два лади
    body: >-
      Новий основний тон — {{root}}. Пересуньте баре й усі інші точки контакту на два лади вище від попередньої
      форми; не залишайте внутрішній палець позаду. Мажорні інтервали не змінилися. {{positions}}. Відпустіть форму,
      побудуйте її знову й перевірте звучання терції.
  sixth-root-moved-notes:
    title: '{{root}} мажорний — перевірте кожну струну'
    body: >-
      Збережіть показану форму й грайте її струни від низької до високої по одній на клік на 50 BPM. Зупиняйте попередній
      звук перед наступною атакою. Потім відрахуйте записані тихі долі до завершення двох тактів. Бал перевіряє
      окремі висоти й час, а не повне баре чи одночасний акорд. {{positions}}.
  fifth-root-shape:
    title: 'Основний тон на струні 5: форма A'
    body: >-
      Основний тон — {{root}} на струні 5; струна 6 має мовчати. Вихідна форма використовує баре вказівним на ладу
      5 та окремі пальці на струнах 4, 3 і 2 на ладу 7. Дайте верхній ноті прозвучати, не завалюючи внутрішні пальці.
      Дотримуйтеся {{positions}} і перевірте всі п’ять цілей.
  fifth-root-notes:
    title: '{{root}} мажорний — перевірте кожну струну'
    body: >-
      Збережіть показану форму й грайте її струни від низької до високої по одній на клік на 50 BPM. Зупиняйте попередній
      звук перед наступною атакою. Потім відрахуйте записані тихі долі до завершення двох тактів. Бал перевіряє
      окремі висоти й час, а не повне баре чи одночасний акорд. {{positions}}.
  question:
    title: Що переноситься в рухомому акорді з баре?
    body: Порівняйте ролі звуків акорду перед відповіддю.
