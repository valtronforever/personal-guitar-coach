lessonID: reading-tab
lessonVersion: 1
locale: uk
title: Як читати TAB
summary: Прочитайте струну, лад, порядок і паузи короткого прикладу TAB.
goal: Прочитайте струну, лад, порядок і паузи короткого прикладу TAB.
body: >-
  У TAB додатка шість ліній: струна 1 зверху, струна 6 знизу. Число показує лад на відповідній лінії, а не номер
  пальця. Читайте події зліва направо, використовуючи відстані між долями й позначення тривалостей для ритму.
steps:
  zero:
    title: Прочитайте нуль відкритої струни
    body: >-
      Виберіть першу подію в TAB. Знайдіть ту саму очікувану позицію на грифі. 0 на лінії 2 означає відкриту струну
      2; не затискайте «лад 0» як металевий лад. {{positions}}
  numbers:
    title: Прочитайте затиснуті ноти
    body: >-
      Наступні числа — 1 і 3 на струні 2. Перед грою промовте «струна два, лад один; струна два, лад три». Зверніть
      увагу: зі зміною строю номер ладу лишається тим самим, а назва ноти може змінитися. {{positions}}
  read-bar:
    title: Пройдіть такт і паузу
    body: >-
      Прочитайте такт 1 як відкрита–1–3–пауза на струні 2. Такт 2 починається відкритою струною 1, повертається
      на струну 2 до ладу 3, потім 1 і закінчується паузою. Рахуйте всі чотири долі, навіть коли номера ладу немає.
      {{positions}}
  review:
    title: Читайте перед курсором
    body: >-
      Один раз послухайте приклад, а потім зіграйте повільно. Поки звучить поточна нота, дивіться на одну подію
      вперед. Якщо загубили місце, зупиніться на межі такту, назвіть наступну струну й лад та почніть цей такт знову
      замість вгадування.
activities:
  example:
    title: Приклад для вашого інструменту
    body: >-
      Очікувана послідовність: {{sequence}}. Виберіть крок, щоб побачити його позиції. У прикладі звучать синтезовані
      еталонні ноти.
learningTasks:
  review:
    title: Перевірте свою практику
    body: Позначайте лише те, що перевірили самостійно. Поверніться до непозначеного пункту на наступному занятті.
    items:
      criterion-1: Я розрізняю номери струн і ладів.
      criterion-2: Я рахував паузи, а не пропускав їх.
      criterion-3: Я можу назвати наступну струну й лад перед грою.
  knowledge:
    title: Що означає 3 на другій лінії TAB?
    body: Виберіть одну відповідь і порівняйте її з поясненням.
    items:
      answer-1: Використати палець 3 будь-де
      answer-2: Зіграти лад 3 на струні 2
      answer-3: Зіграти відкриту струну 3
    explanation: Лінія визначає струну, а число — лад. Рекомендації щодо пальців — окрема інформація.
