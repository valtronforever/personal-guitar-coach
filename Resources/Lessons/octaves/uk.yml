lessonID: octaves
lessonVersion: 1
locale: uk
title: 'Октави: одна назва, різна висота'
summary: Порівняйте унісон з октавою у дванадцять півтонів.
goal: Знаходити октавні пари на одній і різних струнах, не плутаючи їх з унісонами.
body: 'Унісон — однакова звучна висота, навіть якщо її грають у двох позиціях струн і ладів. Октава має ту саму
  назву класу висоти на дванадцять півтонів вище чи нижче; номер октави змінюється на один. Угору частота подвоюється,
  тому пара звучить споріднено, але не однаково.


  На одній струні для октави пройдіть дванадцять ладів. Між струнами використовуйте показаний зв’язок висот замість
  універсального геометричного малюнка. Інтервал між струнами 3 і 2 у Standard відрізняється від інших сусідніх
  пар, а Drop змінює нижню пару. Урок зберігає звучні інтервали й пристосовує нижні позиції до строю.


  Прослухайте кожну пару, потім зіграйте ноти окремо із зупинкою попередньої. Спершу порівняйте унісон; далі дві
  октавні вправи використовують різні маршрути. Оцінка може підтвердити висоти й порядок атак, але звук сам по собі
  не розрізняє позиції однакової висоти. Обрані струни й аплікатуру перевіряєте ви.'
steps:
  prepare:
    title: Читайте літеру й октаву разом
    body: Оберіть першу пару й порівняйте повні назви. Перед грою передбачте, друга нота однакова чи вища. Зберігайте
      цю відмінність у всьому уроці.
  same-pitch: &id001
    title: Спершу встановіть унісон
    body: Чотири чверті чергують дві позиції однієї висоти й октави. Свідомо атакуйте цілі на 50 BPM. Слухайте однакову
      висоту попри різний тембр струн; оцінка не підтверджує обрану позицію. {{sequence}}.
  cross-string-octave: &id002
    title: Низька–висока між струнами
    body: Зіграйте три пари основна–октава й дві тихі долі. Середня пара підіймається на два півтони перед поверненням.
      Зупиняйте нижню струну на початку вищої; порівнюйте номер октави, а не лише літеру. {{sequence}}.
  same-string-octave: &id003
    title: Дванадцять ладів на одній струні
    body: Грайте кожну пару на показаній струні, відпускаючи під час руху. У парі рівно дванадцять ладів, включно
      із затиснутою нижньою парою. Знайдіть далекий маркер перед оцінюваною спробою. {{sequence}}.
  review:
    title: Поясніть два зв’язки
    body: Повторіть унісон, потім октавну пару. Поясніть, чому один зберігає номер октави, а інша його змінює. Неточний
      далекий перехід спершу потренуйте вільно, потім поверніть пульс.
activities:
  same-pitch: *id001
  cross-string-octave: *id002
  same-string-octave: *id003
learningTasks:
  review:
    title: Перевірте цю спробу
    body: Позначте лише те, що перевірили слухом чи спостереженням за руками.
    items:
      difference: Я відрізнив унісон від октави за повними назвами й звуком.
      positions: Я дотримувався потрібних струн навіть там, де звук сам їх не доводить.
      move: Я відпускав тиск при русі на дванадцять ладів замість перетягування затиснутої ноти.
