lessonID: pick-grip
lessonVersion: 1
locale: uk
title: Як тримати медіатор
summary: Зіграйте вісім невеликих контрольованих ударів, не втрачаючи медіатор.
goal: Зіграйте вісім невеликих контрольованих ударів, не втрачаючи медіатор.
body: >-
  Хват має втримувати медіатор і залишати руці свободу руху. Почніть між великим пальцем і боком зігнутого вказівного,
  залишивши невеликий кінчик. Це початкова орієнтація, а не правило про один точний кут для будь-якої руки.
steps:
  grip:
    title: Знайдіть стійкий контакт
    body: >-
      Візьміть медіатор і послабте стискання, доки він майже не почне ковзати. Додайте лише стільки тиску, щоб утримати
      напрямок. На мить розкрийте інші пальці: ними не потрібно затискати медіатор.
  contact:
    title: Зачепіть одну струну
    body: >-
      Легко покладіть руку на грифі поперек струн, щоб приглушити їх. Чотири рази зачепіть струну 3 вниз. Якщо кінчик
      занурюється глибоко й застрягає, залиште меншу його частину або скоротіть рух.
  sound:
    title: Дайте зазвучати одній струні
    body: >-
      Відпустіть струну 3 і грайте одну відкриту ноту на клік при 60 BPM. Приклад задає лише висоту й пульс: він
      не показує напрямок медіатора чи хват. Після чотирьох нот зробіть паузу й поправте хват, якщо медіатор повернувся.
      {{positions}}
  review:
    title: Два короткі повтори
    body: >-
      Зіграйте дві групи по чотири удари з короткою перервою між ними. Оцініть стійкість хвата й те, чи медіатор
      проходить крізь струну. Не намагайтеся усунути ковзання сильнішим стисканням усієї руки.
activities:
  example:
    title: Приклад для вашого інструменту
    body: >-
      Очікувана послідовність: {{sequence}}. Виберіть крок, щоб побачити його позиції. У прикладі звучать синтезовані
      еталонні ноти.
learningTasks:
  review:
    title: Перевірте свою практику
    body: Позначайте лише те, що перевірили самостійно. Поверніться до непозначеного пункту на наступному занятті.
    items:
      criterion-1: Медіатор зберігає робочий напрямок упродовж чотирьох ударів.
      criterion-2: Кінчик проходить крізь струну без великого замаху.
      criterion-3: Між групами я можу послабити зайвий тиск хвата.
