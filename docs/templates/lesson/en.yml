lessonID: lesson-template
lessonVersion: 1
locale: en
title: Two notes and a rest
summary: Play a short phrase and count through the silence.
goal: Play three separate attacks and leave the last beat silent.
body: >-
  First practice open strings. Move up a whole tone and return. Play one quarter note per click at 60 BPM; the fourth
  beat is a rest. Stop the previous note before each new attack.
steps:
  hear-notes:
    title: 1. Hear the two notes
    body: 'Play the first two notes separately: {{positions}}.'
  play-bar:
    title: 2. Play the bar
    body: 'Play three attacks, then rest for one beat: {{positions}}.'
  reflect:
    title: 3. Listen before repeating
    body: Were the attacks separate and the rest quiet? Repeat at the same tempo before speeding up.
activities:
  lesson:
    title: '{{first}} to {{highest}}'
    body: 'Sequence: {{sequence}}.'
