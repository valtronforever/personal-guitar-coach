lessonID: lesson-template
lessonVersion: 1
locale: uk
title: Почути напрямок мелодії
summary: Визначте, чи друга нота вища, нижча або така сама.
goal: Розпізнати рух мелодії вгору на слух.
body: >-
  Висота описує, наскільки високо чи низько звучить нота. Гучність — інша властивість: гучніша нота не обов’язково
  вища. Послухайте приклад із двох нот перед відповіддю.
steps:
  listen:
    title: Послухайте дві ноти
    body: >-
      Натисніть «Прослухати приклад» унизу. Повторюйте скільки потрібно, а потім порівняйте висоту другої ноти з
      першою.
activities:
  example:
    title: Слуховий приклад
    body: Приклад із двох нот, який звучить через обраний аудіовихід.
learningTasks:
  direction:
    title: Куди рухається друга нота?
    body: Виберіть відповідь на слух. Гітарний вхід не потрібен.
    items:
      higher: Вище
      lower: Нижче
      same: Висота не змінюється
    explanation: >-
      Друга нота вища на два півтони (цілий тон). Інтервал зберігається після транспонування цього прикладу в інший
      стрій.
