lessonID: lesson-template
lessonVersion: 1
locale: uk
title: 'Павер-акорд: звук і тиша'
summary: Послухайте павер-акорд із двох нот та оцініть власне звучання.
goal: Зіграти дві потрібні ноти разом і навмисно зупинити їхнє звучання.
body: >-
  Павер-акорд поєднує основний тон і чисту квінту. Він не містить мажорної чи мінорної терції. Почніть із чистого
  звуку, щоб краще чути зайве дзвеніння. Приклад адаптується до вашого строю; у drop аплікатура може відрізнятися.
steps:
  play:
    title: Зіграйте, послухайте й зупиніть
    body: >-
      Використайте позначені позиції. Зачепіть лише дві потрібні струни одночасно, дайте їм звучати два удари та
      зупиніть звук на наступні два. Повторюйте повільно. Відтворення — орієнтир висоти й часу; синтезований звук
      не демонструє техніку удару чи глушіння.
activities:
  example:
    title: Ваш приклад павер-акорду
    body: >-
      Очікувані ноти й позиції: {{positions}}. У параметрах відтворення можна ввімкнути повтор, змінити темп або
      прибрати звук прикладу, залишивши метроном.
learningTasks:
  clean-chord:
    title: Оцініть свою спробу
    body: Послухайте власну гру, перш ніж позначати ці критерії.
    items:
      both-notes: Я чітко чую обидві потрібні ноти.
      unused-strings: Невикористані струни не дзвенять випадково.
      release: Я можу зупинити звук на паузі.
